<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32-S3 硬件保真屏幕模拟器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117;
    color: #c9d1d9;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    min-height: 100vh;
    gap: 32px;
    flex-wrap: wrap;
    padding: 24px;
  }

  /* ===== 设备区域 ===== */
  .device-side { display: flex; flex-direction: column; align-items: center; gap: 12px; }

  .device-frame {
    background: linear-gradient(145deg, #21262d, #161b22);
    border-radius: 16px;
    padding: 24px 24px 20px;
    box-shadow: 0 0 0 2px #30363d, 0 12px 40px rgba(0,0,0,0.7);
    position: relative;
  }
  .device-frame::before {
    content: 'ESP32-S3';
    position: absolute; top: 5px; left: 50%;
    transform: translateX(-50%);
    font-size: 9px; color: #484f58; letter-spacing: 2px;
  }

  .screen-bezel {
    background: #000;
    border-radius: 8px;
    padding: 8px;
    box-shadow: inset 0 0 12px rgba(0,0,0,0.9);
  }

  .screen-container {
    position: relative;
    border-radius: 4px;
    overflow: hidden;
    background: #0a0a1a;
  }

  #canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .screen-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 10;
  }
  .screen-overlay.scanlines {
    background: repeating-linear-gradient(0deg,
      transparent 0px, transparent 2px,
      rgba(0,0,0,0.12) 2px, rgba(0,0,0,0.12) 3px);
  }
  .screen-overlay.glare {
    background: linear-gradient(135deg,
      rgba(255,255,255,0.06) 0%, transparent 30%,
      transparent 70%, rgba(255,255,255,0.02) 100%);
  }

  .dialog-bubble {
    position: absolute;
    bottom: 6px; left: 6px; right: 6px;
    background: rgba(13,17,23,0.92);
    border: 1px solid #1f6feb;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 11px;
    color: #c9d1d9;
    min-height: 22px;
    z-index: 20;
    opacity: 0;
    transition: opacity 0.2s;
    backdrop-filter: blur(4px);
  }
  .dialog-bubble.show { opacity: 1; }
  .typing-cursor {
    display: inline-block; width: 2px; height: 11px;
    background: #1f6feb; margin-left: 1px;
    animation: blink-cursor 0.5s infinite;
  }
  @keyframes blink-cursor { 0%,100%{opacity:1} 50%{opacity:0} }

  .screen-info {
    font-size: 11px; color: #484f58; text-align: center;
    font-family: 'Consolas', monospace;
  }

  /* ===== 控制面板 ===== */
  .panel-side {
    background: #161b22;
    border-radius: 12px;
    padding: 20px;
    width: 360px;
    border: 1px solid #30363d;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .panel-title {
    font-size: 15px; font-weight: 600;
    color: #58a6ff;
    display: flex; align-items: center; gap: 8px;
    padding-bottom: 12px;
    border-bottom: 1px solid #21262d;
  }
  .panel-title::before {
    content: ''; width: 8px; height: 8px;
    background: #3fb950; border-radius: 50%;
    box-shadow: 0 0 8px #3fb950;
  }

  .section { display: flex; flex-direction: column; gap: 8px; }
  .section-label {
    font-size: 11px; color: #8b949e;
    text-transform: uppercase; letter-spacing: 1px;
  }

  /* 按钮组 */
  .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn {
    background: #21262d; border: 1px solid #30363d;
    color: #8b949e; padding: 7px 10px;
    border-radius: 6px; cursor: pointer;
    font-size: 12px; transition: all 0.15s;
    user-select: none; text-align: center;
  }
  .btn:hover { background: #30363d; color: #c9d1d9; }
  .btn.active {
    background: #1f6feb33; border-color: #1f6feb;
    color: #58a6ff;
  }

  /* 开关 */
  .toggle-row {
    display: flex; align-items: center;
    justify-content: space-between;
  }
  .toggle-row label { font-size: 13px; color: #c9d1d9; }
  .toggle {
    position: relative; width: 38px; height: 20px;
    background: #30363d; border-radius: 10px;
    cursor: pointer; transition: background 0.2s;
  }
  .toggle.on { background: #1f6feb; }
  .toggle::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; background: #fff;
    border-radius: 50%; transition: transform 0.2s;
  }
  .toggle.on::after { transform: translateX(18px); }

  /* 滑块 */
  .slider-row {
    display: flex; align-items: center; gap: 10px;
  }
  .slider-row label { font-size: 12px; color: #8b949e; min-width: 70px; }
  .slider-row input[type=range] {
    flex: 1; accent-color: #1f6feb; height: 4px;
  }
  .slider-val {
    font-size: 12px; color: #58a6ff;
    min-width: 45px; text-align: right;
    font-family: 'Consolas', monospace;
  }

  /* 输入框 */
  .input-row { display: flex; gap: 6px; }
  .input-row input {
    flex: 1; background: #0d1117; border: 1px solid #30363d;
    color: #c9d1d9; padding: 8px 10px; border-radius: 6px;
    font-size: 13px; outline: none;
  }
  .input-row input:focus { border-color: #1f6feb; }
  .input-row input::placeholder { color: #484f58; }

  .send-btn {
    background: #1f6feb; border: none; color: #fff;
    padding: 8px 16px; border-radius: 6px;
    cursor: pointer; font-size: 13px; font-weight: 500;
  }
  .send-btn:hover { background: #388bfd; }
  .send-btn:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }

  .auto-btn {
    width: 100%; background: #238636; border: none;
    color: #fff; padding: 10px; border-radius: 6px;
    cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .auto-btn:hover { background: #2ea043; }
  .auto-btn.running { background: #da3633; }

  /* 统计面板 */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .stat-item {
    background: #0d1117; border-radius: 6px;
    padding: 8px 10px;
  }
  .stat-label { font-size: 10px; color: #8b949e; }
  .stat-value {
    font-size: 14px; color: #58a6ff;
    font-family: 'Consolas', monospace; font-weight: 600;
  }
  .stat-value.warn { color: #d29922; }
  .stat-value.danger { color: #f85149; }

  /* 串口监视器 */
  .serial-monitor {
    background: #010409;
    border: 1px solid #21262d;
    border-radius: 6px;
    padding: 8px;
    height: 120px;
    overflow-y: auto;
    font-family: 'Consolas', monospace;
    font-size: 11px;
    line-height: 1.5;
  }
  .serial-monitor::-webkit-scrollbar { width: 4px; }
  .serial-monitor::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }
  .serial-line { color: #8b949e; }
  .serial-line .ts { color: #484f58; }
  .serial-line .tag { color: #d29922; }
  .serial-line .ok { color: #3fb950; }
  .serial-line .info { color: #58a6ff; }

  /* 状态指示 */
  .state-indicator {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: #0d1117;
    border-radius: 6px; font-size: 13px;
  }
  .state-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #3fb950;
    box-shadow: 0 0 8px currentColor;
  }
  .state-dot.idle { background: #3fb950; }
  .state-dot.listening { background: #d29922; }
  .state-dot.thinking { background: #a371f7; }
  .state-dot.speaking { background: #1f6feb; }
  .state-dot.happy { background: #f778ba; }

  .loading-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: #0a0a1a; display: flex;
    align-items: center; justify-content: center;
    color: #484f58; font-size: 14px; z-index: 30;
  }
</style>
</head>

<script>
// ============================================================
//  配置
// ============================================================
const config = {
  width: 240,
  height: 240,
  rgb565: true,
  dither: false,
  scanlines: true,
  fps: 20,
  spiClock: 40, // MHz
};

const SPRITE_NAMES = ['idle', 'listening', 'thinking', 'speaking', 'happy'];
const SPRITE_PATHS = {
  idle: 'esp32-assets/char-idle-v2.jpg',
  listening: 'esp32-assets/char-listening-v2.jpg',
  thinking: 'esp32-assets/char-thinking-v2.jpg',
  speaking: 'esp32-assets/char-speaking-v2.jpg',
  happy: 'esp32-assets/char-happy-v2.jpg',
};

// ============================================================
//  DOM
// ============================================================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const loadingOverlay = document.getElementById('loadingOverlay');
const dialogBubble = document.getElementById('dialogBubble');
const dialogText = document.getElementById('dialogText');
const typingCursor = document.getElementById('typingCursor');
const serialMonitor = document.getElementById('serialMonitor');
const stateDot = document.getElementById('stateDot');
const stateLabel = document.getElementById('stateLabel');
const screenInfo = document.getElementById('screenInfo');
const scanlineOverlay = document.getElementById('scanlineOverlay');

// ============================================================
//  精灵图加载与处理
// ============================================================
const sprites = {};       // 原始 Image
const processedCache = {}; // 处理后的 OffscreenCanvas/Canvas

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

async function loadAllSprites() {
  const entries = Object.entries(SPRITE_PATHS);
  const results = await Promise.all(
    entries.map(async ([name, path]) => {
      const img = await loadImage(path);
      return [name, img];
    })
  );
  for (const [name, img] of results) {
    sprites[name] = img;
  }
}

// RGB565 量化
function quantizeRGB565(data) {
  for (let i = 0; i < data.length; i += 4) {
    data[i]     = data[i]     & 0xF8; // R: 5 bits
    data[i + 1] = data[i + 1] & 0xFC; // G: 6 bits
    data[i + 2] = data[i + 2] & 0xF8; // B: 5 bits
  }
}

// Floyd-Steinberg 抖动 + RGB565 量化
function ditherFS(data, width, height) {
  // 使用 Float32Array 累积误差
  const r = new Float32Array(width * height);
  const g = new Float32Array(width * height);
  const b = new Float32Array(width * height);
  for (let i = 0, j = 0; i < data.length; i += 4, j++) {
    r[j] = data[i];
    g[j] = data[i + 1];
    b[j] = data[i + 2];
  }
  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const idx = y * width + x;
      const oldR = r[idx], oldG = g[idx], oldB = b[idx];
      const newR = Math.round(oldR) & 0xF8;
      const newG = Math.round(oldG) & 0xFC;
      const newB = Math.round(oldB) & 0xF8;
      r[idx] = newR; g[idx] = newG; b[idx] = newB;
      const errR = oldR - newR;
      const errG = oldG - newG;
      const errB = oldB - newB;
      if (x + 1 < width) {
        r[idx + 1] += errR * 7 / 16;
        g[idx + 1] += errG * 7 / 16;
        b[idx + 1] += errB * 7 / 16;
      }
      if (y + 1 < height) {
        if (x > 0) {
          r[idx + width - 1] += errR * 3 / 16;
          g[idx + width - 1] += errG * 3 / 16;
          b[idx + width - 1] += errB * 3 / 16;
        }
        r[idx + width] += errR * 5 / 16;
        g[idx + width] += errG * 5 / 16;
        b[idx + width] += errB * 5 / 16;
        if (x + 1 < width) {
          r[idx + width + 1] += errR * 1 / 16;
          g[idx + width + 1] += errG * 1 / 16;
          b[idx + width + 1] += errB * 1 / 16;
        }
      }
    }
  }
  for (let i = 0, j = 0; i < data.length; i += 4, j++) {
    data[i]     = Math.max(0, Math.min(255, r[j]));
    data[i + 1] = Math.max(0, Math.min(255, g[j]));
    data[i + 2] = Math.max(0, Math.min(255, b[j]));
  }
}

// 处理精灵图：缩放到目标分辨率 + 量化
// 半身立绘策略：保持原图比例，按宽度铺满画布，再按需垂直偏移。
// shiftRatio 为正值：人物向下移动；负值：人物向上移动。
const SPRITE_SHIFTS = {
  idle: 0.00,
  listening: 0.00,
  thinking: -0.10,
  speaking: 0.00,
  happy: -0.10,
};

function processSprite(name) {
  const img = sprites[name];
  const w = config.width;
  const h = config.height;
  const off = document.createElement('canvas');
  off.width = w;
  off.height = h;
  const octx = off.getContext('2d', { willReadFrequently: true });

  // 计算缩放：让图片宽度铺满画布，高度自适应
  const scale = w / img.width;
  const scaledH = img.height * scale;

  const shiftRatio = SPRITE_SHIFTS[name] || 0;
  const drawY = scaledH * shiftRatio;

  octx.drawImage(img, 0, drawY, w, scaledH);

  // 量化
  if (config.rgb565 || config.dither) {
    const imageData = octx.getImageData(0, 0, w, h);
    const data = imageData.data;
    if (config.dither) {
      ditherFS(data, w, h);
    } else {
      quantizeRGB565(data);
    }
    octx.putImageData(imageData, 0, 0);
  }
  processedCache[name] = off;
}

function processAllSprites() {
  for (const name of SPRITE_NAMES) {
    processSprite(name);
  }
  // 不再使用差异图块提取，改为直接在 base sprite 上绘制闭眼/张嘴
}

// ============================================================
//  动画效果
// ============================================================
let currentState = 'idle';
let stateStartTime = 0;
let lastBlinkTime = 0;
let nextBlinkInterval = 3000 + Math.random() * 2000;

// 面部特征参数（基于 240x240 画布的估算值，可通过滑块调整）
const face = {
  eyeY: 117,        // 眼睛中心 Y
  eyeLeftX: 100,    // 左眼中心 X（画面左侧）
  eyeRightX: 139,   // 右眼中心 X（画面右侧）
  eyeW: 18,         // 眼睛宽度
  eyeH: 16,         // 眼睛高度
  mouthX: 120,      // 嘴巴中心 X
  mouthY: 142,      // 嘴巴中心 Y
  mouthW: 10,       // 嘴巴宽度
  mouthH: 6,        // 张嘴高度
  skinR: 255,       // 肤色 R
  skinG: 228,       // 肤色 G
  skinB: 220,       // 肤色 B
  showCalibration: false, // 标定模式：显示眼睛/嘴巴区域
};


// 绘制效果
function drawEffects(t) {
  const w = config.width;
  const h = config.height;

  switch (currentState) {
    case 'idle': {
      // 待机状态不做程序化眨眼，避免黑块与立绘眼睛位置不匹配。
      // 如后续需要眨眼，建议额外生成闭眼/半闭眼精灵图进行帧切换。
      break;
    }

    case 'listening': {
      // 声波
      const cx = w * 0.5;
      const cy = h * 0.15;
      for (let i = 0; i < 3; i++) {
        const phase = ((t / 1500 + i / 3) % 1);
        const radius = 4 + phase * w * 0.08;
        const alpha = (1 - phase) * 0.5;
        ctx.strokeStyle = `rgba(31, 111, 235, ${alpha})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.stroke();
      }
      break;
    }

    case 'thinking': {
      // 思考气泡
      const bx = w * 0.72;
      const by = h * 0.15;
      for (let i = 0; i < 3; i++) {
        const phase = ((t / 1200 + i * 0.3) % 1);
        const r = 2 + i * 1.5;
        const offsetY = -phase * 8;
        const alpha = 1 - phase;
        ctx.fillStyle = `rgba(163, 113, 247, ${alpha * 0.8})`;
        ctx.beginPath();
        ctx.arc(bx + i * 8, by + offsetY, r, 0, Math.PI * 2);
        ctx.fill();
      }
      break;
    }

    case 'speaking': {
      // 说话状态不绘制额外效果，嘴巴动画由 drawOpenMouth 处理
      break;
    }

    case 'happy': {
      // 星星闪烁
      const stars = [
        { x: w * 0.20, y: h * 0.22, size: 3 },
        { x: w * 0.80, y: h * 0.18, size: 2.5 },
        { x: w * 0.85, y: h * 0.35, size: 2 },
        { x: w * 0.15, y: h * 0.38, size: 2.5 },
      ];
      for (let i = 0; i < stars.length; i++) {
        const phase = ((t / 800 + i * 0.25) % 1);
        const scale = Math.sin(phase * Math.PI);
        if (scale > 0.1) {
          const s = stars[i];
          ctx.fillStyle = i % 2 === 0 ? '#f778ba' : '#d29922';
          drawStar(s.x, s.y, s.size * scale);
        }
      }
      break;
    }
  }
}

function drawStar(cx, cy, r) {
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const angle = (i / 4) * Math.PI * 2 - Math.PI / 2;
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
    const ia = angle + Math.PI / 4;
    ctx.lineTo(cx + Math.cos(ia) * r * 0.4, cy + Math.sin(ia) * r * 0.4);
  }
  ctx.closePath();
  ctx.fill();
}

// ============================================================
//  面部动画绘制
// ============================================================

// 绘制闭眼：用肤色覆盖眼睛区域，再画一条弧线表示闭眼
function drawClosedEye(cx, cy, w, h, dx, dy) {
  const skinColor = `rgb(${face.skinR}, ${face.skinG}, ${face.skinB})`;
  // 用肤色椭圆覆盖眼睛
  ctx.fillStyle = skinColor;
  ctx.beginPath();
  ctx.ellipse(cx + dx, cy + dy, w / 2, h / 2, 0, 0, Math.PI * 2);
  ctx.fill();
  // 画闭眼弧线（向下弯的弧，像 ^_^ 的下半部分）
  ctx.strokeStyle = '#3a2a4a';
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(cx + dx, cy + dy - 1, w / 2 * 0.7, Math.PI * 0.15, Math.PI * 0.85);
  ctx.stroke();
}

// 绘制张嘴：在嘴巴位置画一个深色椭圆
function drawOpenMouth(cx, cy, w, h, dx, dy) {
  ctx.fillStyle = '#9a3a4a';
  ctx.beginPath();
  ctx.ellipse(cx + dx, cy + dy, w / 2, h / 2, 0, 0, Math.PI * 2);
  ctx.fill();
  // 嘴唇高光
  ctx.fillStyle = '#c95a6a';
  ctx.beginPath();
  ctx.ellipse(cx + dx, cy + dy - 1, w / 2 * 0.6, h / 2 * 0.3, 0, 0, Math.PI * 2);
  ctx.fill();
}

// 绘制标定框
function drawCalibration(dx, dy) {
  ctx.strokeStyle = '#ff0000';
  ctx.lineWidth = 1;
  // 左眼
  ctx.strokeRect(face.eyeLeftX - face.eyeW / 2 + dx, face.eyeY - face.eyeH / 2 + dy, face.eyeW, face.eyeH);
  // 右眼
  ctx.strokeRect(face.eyeRightX - face.eyeW / 2 + dx, face.eyeY - face.eyeH / 2 + dy, face.eyeW, face.eyeH);
  // 嘴巴
  ctx.strokeStyle = '#00ff00';
  ctx.strokeRect(face.mouthX - face.mouthW / 2 + dx, face.mouthY - face.mouthH / 2 + dy, face.mouthW, face.mouthH);
}

// ============================================================
//  渲染循环
// ============================================================
let lastFrameTime = 0;
let frameCount = 0;
let fpsUpdateTime = 0;
let currentFPS = 0;
let lastFrameRenderTime = 0;

function renderLoop(timestamp) {
  requestAnimationFrame(renderLoop);

  const frameInterval = 1000 / config.fps;
  if (timestamp - lastFrameTime < frameInterval) return;

  const frameStart = performance.now();
  lastFrameTime = timestamp;

  // 清屏
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, config.width, config.height);

  // 选择基础精灵图：idle 和 speaking 都用 idle 作为 base
  let spriteName = currentState;
  let showBlink = false;
  let showMouth = false;

  if (currentState === 'idle') {
    // 待机眨眼
    const blinkElapsed = timestamp - lastBlinkTime;
    if (blinkElapsed > nextBlinkInterval && blinkElapsed < nextBlinkInterval + 150) {
      showBlink = true;
    } else if (blinkElapsed >= nextBlinkInterval + 150) {
      lastBlinkTime = timestamp;
      nextBlinkInterval = 2500 + Math.random() * 2500;
    }
  } else if (currentState === 'speaking') {
    // 说话时用 idle 作为 base，周期性张嘴
    spriteName = 'idle';
    const mouthInterval = 200;
    showMouth = Math.floor(timestamp / mouthInterval) % 2 === 1;
  }

  // 绘制基础精灵图（带呼吸/摇摆偏移）
  const sprite = processedCache[spriteName];
  if (sprite) {
    let dx = 0, dy = 0;
    const t = timestamp;
    if (currentState === 'idle') {
      dy = Math.sin(t / 1500) * 1;
    } else if (currentState === 'thinking') {
      dx = Math.sin(t / 1000) * 1;
    } else if (currentState === 'happy') {
      dy = -Math.abs(Math.sin(t / 300)) * 3;
    } else if (currentState === 'listening') {
      dy = Math.sin(t / 800) * 0.5;
    }
    ctx.drawImage(sprite, dx, dy);

    // 叠加闭眼（仅眼睛区域）
    if (showBlink) {
      drawClosedEye(face.eyeLeftX, face.eyeY, face.eyeW, face.eyeH, dx, dy);
      drawClosedEye(face.eyeRightX, face.eyeY, face.eyeW, face.eyeH, dx, dy);
    }

    // 叠加张嘴（仅嘴巴区域）
    if (showMouth) {
      drawOpenMouth(face.mouthX, face.mouthY, face.mouthW, face.mouthH, dx, dy);
    }

    // 标定模式：显示眼睛和嘴巴的区域框
    if (face.showCalibration) {
      drawCalibration(dx, dy);
    }
  }

  // 绘制效果层
  drawEffects(timestamp);

  // 统计
  lastFrameRenderTime = performance.now() - frameStart;
  frameCount++;
  if (timestamp - fpsUpdateTime >= 500) {
    currentFPS = Math.round(frameCount / ((timestamp - fpsUpdateTime) / 1000));
    frameCount = 0;
    fpsUpdateTime = timestamp;
    updateStats();
  }
}

// ============================================================
//  统计
// ============================================================
function updateStats() {
  const w = config.width;
  const h = config.height;
  const bytesPerPixel = 2; // RGB565
  const framebufferBytes = w * h * bytesPerPixel;
  const spriteCount = SPRITE_NAMES.length;
  const flashBytes = spriteCount * w * h * bytesPerPixel;

  // SPI 带宽
  const spiBandwidth = config.spiClock * 1e6 / 8; // bytes/s
  const maxFPS = spiBandwidth / framebufferBytes;
  const spiUtil = (currentFPS / maxFPS) * 100;

  // PSRAM (ESP32-S3 典型 8MB)
  const psramBytes = 8 * 1024 * 1024;
  const ramUtil = (framebufferBytes / psramBytes) * 100;

  document.getElementById('statFPS').textContent = currentFPS + ' fps';
  document.getElementById('statFrameTime').textContent = lastFrameRenderTime.toFixed(1) + ' ms';

  const flashKB = flashBytes / 1024;
  document.getElementById('statFlash').textContent =
    flashKB > 1024 ? (flashKB / 1024).toFixed(1) + ' MB' : flashKB.toFixed(0) + ' KB';

  const ramKB = framebufferBytes / 1024;
  document.getElementById('statRAM').textContent =
    ramKB.toFixed(1) + ' KB (' + ramUtil.toFixed(1) + '%)';

  const spiEl = document.getElementById('statSPI');
  spiEl.textContent = spiUtil.toFixed(1) + '%';
  spiEl.className = 'stat-value' + (spiUtil > 80 ? ' danger' : spiUtil > 50 ? ' warn' : '');

  document.getElementById('statMaxFPS').textContent = maxFPS.toFixed(1) + ' fps';
}

function updateScreenInfo() {
  const w = config.width;
  const h = config.height;
  const sizeMap = { '128': '0.96"', '240': '1.3"', '320': '2.0"' };
  const size = sizeMap[String(w)] || '1.3"';
  const colorMode = config.rgb565 ? 'RGB565' : 'RGB888';
  screenInfo.textContent = `${w} × ${h} ${colorMode} | ${size} TFT | SPI ${config.spiClock}MHz`;
}

let typingTimer = null;

function showDialog(text, instant = false) {
  if (!text) {
    dialogBubble.classList.remove('show');
    if (typingTimer) clearInterval(typingTimer);
    return;
  }
  dialogBubble.classList.add('show');
  typingCursor.style.display = 'inline-block';
  dialogText.textContent = '';
  if (instant) {
    dialogText.textContent = text;
    typingCursor.style.display = 'none';
    return;
  }
  let i = 0;
  if (typingTimer) clearInterval(typingTimer);
  typingTimer = setInterval(() => {
    if (i < text.length) {
      dialogText.textContent += text[i];
      i++;
    } else {
      clearInterval(typingTimer);
      typingCursor.style.display = 'none';
    }
  }, 60);
}

const mockResponses = [
  { input: '你好', response: '你好呀！今天有什么我可以帮你的吗？', emotion: 'happy' },
  { input: '今天天气怎么样', response: '让我看看...今天天气晴朗，温度25度，很适合出门散步呢！', emotion: 'speaking' },
  { input: '给我讲个故事', response: '从前有一只小猫咪，它住在一个神奇的森林里，每天都会遇到新的朋友...', emotion: 'speaking' },
  { input: '你叫什么名字', response: '我叫小萌！是你的AI助手哦～', emotion: 'happy' },
  { input: '再见', response: '再见啦！下次再一起玩哦～', emotion: 'happy' },
  { input: '唱首歌', response: '啦啦啦~我是快乐的小萌娘~天天开心~天天歌唱~', emotion: 'speaking' },
];

let dialogueRunning = false;
let dialogueTimers = [];

function getDelays() {
  return {
    stt: parseInt(document.getElementById('sttSlider').value),
    llm: parseInt(document.getElementById('llmSlider').value),
    tts: parseInt(document.getElementById('ttsSlider').value),
  };
}

function startDialogue(userInput) {
  if (dialogueRunning) return;
  dialogueRunning = true;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('msgInput').disabled = true;

  const delays = getDelays();
  const input = userInput || mockResponses[Math.floor(Math.random() * mockResponses.length)].input;

  // 匹配响应
  const match = mockResponses.find(r => input.includes(r.input)) ||
    mockResponses[Math.floor(Math.random() * mockResponses.length)];

  // 1. listening (STT)
  setState('listening');
  showDialog('我在听...', true);
  log('STT', `录音中... (${delays.stt}ms)`, 'tag');

  const t1 = setTimeout(() => {
    log('STT', `识别结果: "${input}"`, 'ok');
    // 2. thinking (LLM)
    setState('thinking');
    showDialog('嗯，让我想想...', true);
    log('LLM', `请求中... (${delays.llm}ms)`, 'tag');

    const t2 = setTimeout(() => {
      log('LLM', `回复: "${match.response.substring(0, 30)}..."`, 'ok');
      // 3. speaking (TTS)
      setState('speaking');
      showDialog(match.response);
      log('TTS', `合成中... (${delays.tts}ms)`, 'tag');

      const t3 = setTimeout(() => {
        log('TTS', '播放开始', 'ok');
        // 估算说话时长（按字数）
        const speakDuration = Math.max(2000, match.response.length * 120);
        const t4 = setTimeout(() => {
          // 4. happy
          setState('happy');
          log('TTS', '播放完成', 'ok');

          const t5 = setTimeout(() => {
            // 5. idle
            setState('idle');
            showDialog('');
            dialogueRunning = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('msgInput').disabled = false;
            log('SYS', '对话完成，回到待机', 'info');
          }, 1500);
          dialogueTimers.push(t5);
        }, speakDuration);
        dialogueTimers.push(t4);
      }, delays.tts);
      dialogueTimers.push(t3);
    }, delays.llm);
    dialogueTimers.push(t2);
  }, delays.stt);
  dialogueTimers.push(t1);
}

function stopDialogue() {
  dialogueTimers.forEach(t => clearTimeout(t));
  dialogueTimers = [];
  dialogueRunning = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('msgInput').disabled = false;
}

function log(tag, msg, level = '') {
  const now = new Date();
  const ts = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}.${String(now.getMilliseconds()).padStart(3, '0')}`;
  const line = document.createElement('div');
  line.className = 'serial-line';
  line.innerHTML = `<span class="ts">[${ts}]</span> <span class="${level}">${tag}:</span> ${msg}`;
  serialMonitor.appendChild(line);
  serialMonitor.scrollTop = serialMonitor.scrollHeight;
  // 限制行数
  while (serialMonitor.children.length > 100) {
    serialMonitor.removeChild(serialMonitor.firstChild);
  }
}

    updateScreenInfo();
    updateStats();
    requestAnimationFrame(renderLoop);
    log('SYS', '渲染循环启动', 'ok');
    log('SYS', '就绪。点击状态按钮或输入消息开始测试。', 'info');
  } catch (e) {
    log('ERR', '精灵图加载失败: ' + e.message, 'tag');
    loadingOverlay.textContent = '加载失败: ' + e.message;
  }
}

init();
</script>

</body>
</html>
