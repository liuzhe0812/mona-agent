<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32-S3 屏幕动画模拟器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 40px;
    flex-wrap: wrap;
    padding: 20px;
  }

  /* ===== 屏幕外壳 ===== */
  .device-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .device-frame {
    background: linear-gradient(145deg, #2a2a3e, #1a1a2e);
    border-radius: 16px;
    padding: 20px;
    box-shadow:
      0 0 0 2px #3a3a4e,
      0 8px 32px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.05);
    position: relative;
  }

  .device-frame::before {
    content: 'ESP32-S3';
    position: absolute;
    top: 4px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    color: #555;
    letter-spacing: 1px;
  }

  .screen-bezel {
    background: #000;
    border-radius: 8px;
    padding: 6px;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.8);
  }

  .screen {
    position: relative;
    overflow: hidden;
    border-radius: 4px;
    background: #0a0a1a;
  }

  /* 屏幕反光效果 */
  .screen::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(135deg,
      rgba(255,255,255,0.06) 0%,
      transparent 30%,
      transparent 70%,
      rgba(255,255,255,0.02) 100%);
    pointer-events: none;
    z-index: 100;
  }

  /* 像素化效果 */
  .screen.pixelated svg {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  /* 扫描线效果 */
  .screen.scanlines::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 3px
    );
    pointer-events: none;
    z-index: 99;
  }

  .screen-content {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .screen-info {
    font-size: 11px;
    color: #666;
    text-align: center;
  }

  /* ===== 控制面板 ===== */
  .control-panel {
    background: #16213e;
    border-radius: 12px;
    padding: 24px;
    width: 320px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    border: 1px solid #1a1a3e;
  }

  .panel-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 20px;
    color: #7ec8e3;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .panel-title::before {
    content: '';
    width: 8px;
    height: 8px;
    background: #0fbcf9;
    border-radius: 50%;
    box-shadow: 0 0 8px #0fbcf9;
  }

  .section {
    margin-bottom: 20px;
  }

  .section-label {
    font-size: 12px;
    color: #888;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .state-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .state-btn {
    background: #1a1a3e;
    border: 1px solid #2a2a4e;
    color: #aaa;
    padding: 10px 4px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    transition: all 0.2s;
    text-align: center;
    user-select: none;
  }

  .state-btn:hover {
    background: #2a2a5e;
    border-color: #3a3a6e;
    color: #ddd;
  }

  .state-btn.active {
    background: #0f3460;
    border-color: #0fbcf9;
    color: #0fbcf9;
    box-shadow: 0 0 12px rgba(15,188,249,0.3);
  }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .toggle-row label {
    font-size: 13px;
    color: #bbb;
  }

  .toggle {
    position: relative;
    width: 40px;
    height: 22px;
    background: #2a2a3e;
    border-radius: 11px;
    cursor: pointer;
    transition: background 0.2s;
  }

  .toggle.on { background: #0fbcf9; }

  .toggle::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.2s;
  }

  .toggle.on::after { transform: translateX(18px); }

  .select-group {
    display: flex;
    gap: 6px;
  }

  .select-btn {
    flex: 1;
    background: #1a1a3e;
    border: 1px solid #2a2a4e;
    color: #888;
    padding: 6px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11px;
    transition: all 0.2s;
  }

  .select-btn.active {
    background: #0f3460;
    border-color: #0fbcf9;
    color: #0fbcf9;
  }

  .auto-flow-btn {
    width: 100%;
    background: linear-gradient(135deg, #e94560, #0f3460);
    border: none;
    color: #fff;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
    margin-top: 4px;
  }

  .auto-flow-btn:hover { opacity: 0.9; }

  .auto-flow-btn.running {
    background: linear-gradient(135deg, #2a2a4e, #1a1a3e);
  }

  .status-bar {
    margin-top: 16px;
    padding: 10px 12px;
    background: #0a0a1a;
    border-radius: 8px;
    font-size: 12px;
    font-family: 'Consolas', monospace;
    color: #0fbcf9;
    min-height: 40px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #0fbcf9;
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ===== 角色 SVG 动画 ===== */
  .character-svg {
    width: 100%;
    height: 100%;
  }

  /* 呼吸动画 */
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.015); }
  }

  /* 眨眼动画 */
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%, 97% { transform: scaleY(0.1); }
  }

  /* 说话嘴巴动画 */
  @keyframes mouth-talk {
    0%, 100% { transform: scaleY(0.3); }
    25% { transform: scaleY(1); }
    50% { transform: scaleY(0.5); }
    75% { transform: scaleY(0.8); }
  }

  /* 摇摆动画 */
  @keyframes sway {
    0%, 100% { transform: rotate(-1deg); }
    50% { transform: rotate(1deg); }
  }

  /* 前倾动画 */
  @keyframes lean-forward {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }

  /* 思考气泡 */
  @keyframes think-bounce {
    0%, 100% { transform: translateY(0); opacity: 0.6; }
    50% { transform: translateY(-4px); opacity: 1; }
  }

  @keyframes gear-rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* 声波动画 */
  @keyframes wave-expand {
    0% { transform: scale(0.8); opacity: 0.8; }
    100% { transform: scale(1.8); opacity: 0; }
  }

  /* 音符飘动 */
  @keyframes note-float {
    0% { transform: translate(0, 0) scale(0.8); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translate(20px, -30px) scale(1); opacity: 0; }
  }

  /* 星星闪烁 */
  @keyframes star-twinkle {
    0%, 100% { transform: scale(0) rotate(0deg); opacity: 0; }
    50% { transform: scale(1) rotate(180deg); opacity: 1; }
  }

  /* 开心跳跃 */
  @keyframes happy-bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  /* 状态应用 */
  .char-group { transition: transform 0.3s ease; }
  .state-idle .char-group { animation: breathe 3s ease-in-out infinite; transform-origin: center; }
  .state-listening .char-group { animation: lean-forward 1.5s ease-in-out infinite; transform-origin: center; }
  .state-thinking .char-group { animation: sway 2s ease-in-out infinite; transform-origin: center 80%; }
  .state-speaking .char-group { animation: sway 1.2s ease-in-out infinite; transform-origin: center 80%; }
  .state-happy .char-group { animation: happy-bounce 0.6s ease-in-out infinite; transform-origin: center; }

  /* 眼睛 */
  .eye-group { transform-origin: center; transform-box: fill-box; }
  .state-idle .eye-group { animation: blink 4s infinite; }
  .state-listening .eye-group { transform: scaleY(1.1); }
  .state-thinking .eye-group { transform: scaleY(0.6); }
  .state-happy .eye-group { display: none; }
  .happy-eyes { display: none; }
  .state-happy .happy-eyes { display: block; }

  /* 嘴巴 */
  .mouth { transform-origin: center; transform-box: fill-box; transition: all 0.3s; }
  .state-speaking .mouth { animation: mouth-talk 0.3s infinite; }

  /* 腮红 */
  .blush { transition: opacity 0.3s; opacity: 0.4; }
  .state-happy .blush { opacity: 0.9; }
  .state-speaking .blush { opacity: 0.6; }

  /* 效果层 */
  .effect-layer { pointer-events: none; }
  .effect { display: none; }
  .state-listening .effect-listening { display: block; }
  .state-thinking .effect-thinking { display: block; }
  .state-speaking .effect-speaking { display: block; }
  .state-happy .effect-happy { display: block; }

  /* 对话气泡 */
  .dialog-bubble {
    position: absolute;
    bottom: 8px;
    left: 8px;
    right: 8px;
    background: rgba(15,52,96,0.9);
    border: 1px solid #0fbcf9;
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 11px;
    color: #e0e0e0;
    min-height: 24px;
    display: flex;
    align-items: center;
    z-index: 50;
    opacity: 0;
    transition: opacity 0.3s;
    backdrop-filter: blur(4px);
  }

  .dialog-bubble.show { opacity: 1; }

  .typing-cursor {
    display: inline-block;
    width: 2px;
    height: 12px;
    background: #0fbcf9;
    margin-left: 2px;
    animation: cursor-blink 0.6s infinite;
  }

  @keyframes cursor-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
</style>
</head>
<body>

<!-- ===== 设备屏幕模拟 ===== -->
<div class="device-wrapper">
  <div class="device-frame">
    <div class="screen-bezel">
      <div class="screen scanlines" id="screen" style="width: 240px; height: 240px;">
        <div class="screen-content" id="screenContent">
          <svg class="character-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="bgGrad" cx="50%" cy="40%">
                <stop offset="0%" stop-color="#1a0a2e"/>
                <stop offset="100%" stop-color="#0a0a1a"/>
              </radialGradient>
              <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#ff6b9d"/>
                <stop offset="100%" stop-color="#c44569"/>
              </linearGradient>
              <linearGradient id="hairGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#feca57"/>
                <stop offset="100%" stop-color="#ff9f43"/>
              </linearGradient>
              <radialGradient id="faceGrad" cx="50%" cy="40%">
                <stop offset="0%" stop-color="#ffe0d0"/>
                <stop offset="100%" stop-color="#ffd0c0"/>
              </radialGradient>
            </defs>

            <!-- 背景 -->
            <rect width="200" height="200" fill="url(#bgGrad)"/>

            <!-- 背景星星 -->
            <g opacity="0.3">
              <circle cx="30" cy="30" r="1" fill="#fff"/>
              <circle cx="170" cy="25" r="1.5" fill="#fff"/>
              <circle cx="175" cy="60" r="1" fill="#fff"/>
              <circle cx="25" cy="70" r="1" fill="#fff"/>
              <circle cx="180" cy="120" r="1" fill="#fff"/>
              <circle cx="20" cy="140" r="1.5" fill="#fff"/>
              <circle cx="160" cy="170" r="1" fill="#fff"/>
              <circle cx="40" cy="175" r="1" fill="#fff"/>
            </g>

            <!-- 角色组 -->
            <g class="char-group">

              <!-- 后部头发 -->
              <path d="M 60 70 Q 50 50 60 35 Q 75 20 100 20 Q 125 20 140 35 Q 150 50 140 70 L 145 110 Q 148 130 140 140 L 135 100 Q 130 90 125 88 L 75 88 Q 70 90 65 100 L 60 140 Q 52 130 55 110 Z" fill="url(#hairGrad)"/>

              <!-- 双马尾 -->
              <ellipse cx="48" cy="95" rx="12" ry="35" fill="url(#hairGrad)" transform="rotate(-15 48 95)"/>
              <ellipse cx="152" cy="95" rx="12" ry="35" fill="url(#hairGrad)" transform="rotate(15 152 95)"/>

              <!-- 猫耳装饰 -->
              <path d="M 65 30 L 72 12 L 82 28 Z" fill="url(#hairGrad2)"/>
              <path d="M 135 30 L 128 12 L 118 28 Z" fill="url(#hairGrad2)"/>
              <path d="M 68 26 L 72 16 L 78 25 Z" fill="#ff6b9d" opacity="0.5"/>
              <path d="M 132 26 L 128 16 L 122 25 Z" fill="#ff6b9d" opacity="0.5"/>

              <!-- 脸部 -->
              <ellipse cx="100" cy="85" rx="32" ry="36" fill="url(#faceGrad)"/>

              <!-- 腮红 -->
              <ellipse class="blush" cx="78" cy="95" rx="7" ry="5" fill="#ff8fa3" opacity="0.4"/>
              <ellipse class="blush" cx="122" cy="95" rx="7" ry="5" fill="#ff8fa3" opacity="0.4"/>

              <!-- 眼睛 - 正常状态 -->
              <g class="eye-group">
                <!-- 左眼 -->
                <ellipse cx="86" cy="82" rx="6" ry="8" fill="#fff"/>
                <ellipse cx="86" cy="83" rx="4" ry="6" fill="#4a90d9"/>
                <ellipse cx="86" cy="84" rx="2.5" ry="4" fill="#2c3e50"/>
                <circle cx="87" cy="81" r="1.5" fill="#fff"/>
                <circle cx="85" cy="85" r="0.8" fill="#fff" opacity="0.6"/>

                <!-- 右眼 -->
                <ellipse cx="114" cy="82" rx="6" ry="8" fill="#fff"/>
                <ellipse cx="114" cy="83" rx="4" ry="6" fill="#4a90d9"/>
                <ellipse cx="114" cy="84" rx="2.5" ry="4" fill="#2c3e50"/>
                <circle cx="115" cy="81" r="1.5" fill="#fff"/>
                <circle cx="113" cy="85" r="0.8" fill="#fff" opacity="0.6"/>
              </g>

              <!-- 开心眯眼 -->
              <g class="happy-eyes">
                <path d="M 80 82 Q 86 76 92 82" stroke="#2c3e50" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                <path d="M 108 82 Q 114 76 120 82" stroke="#2c3e50" stroke-width="2.5" fill="none" stroke-linecap="round"/>
              </g>

              <!-- 鼻子 -->
              <ellipse cx="100" cy="93" rx="1.2" ry="1" fill="#ffb0a0" opacity="0.5"/>

              <!-- 嘴巴 -->
              <g class="mouth">
                <ellipse class="mouth-shape" cx="100" cy="103" rx="4" ry="2.5" fill="#ff6b6b" opacity="0.8"/>
              </g>

              <!-- 前部头发刘海 -->
              <path d="M 68 55 Q 72 40 85 38 Q 95 36 100 42 Q 105 36 115 38 Q 128 40 132 55 Q 128 48 120 46 Q 110 44 105 50 Q 100 44 95 50 Q 90 44 80 46 Q 72 48 68 55 Z" fill="url(#hairGrad)"/>

              <!-- 头发高光 -->
              <path d="M 75 45 Q 80 40 88 40" stroke="#ff8fb1" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
              <path d="M 115 40 Q 122 40 128 45" stroke="#ff8fb1" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>

              <!-- 衣领 -->
              <path d="M 75 120 Q 85 115 100 118 Q 115 115 125 120 L 130 140 L 70 140 Z" fill="#0f3460"/>
              <path d="M 95 118 L 100 125 L 105 118" stroke="#0fbcf9" stroke-width="1.5" fill="none"/>

            </g>
            <!-- /char-group -->

            <!-- ===== 效果层 ===== -->
            <g class="effect-layer">

              <!-- 倾听声波 -->
              <g class="effect effect-listening">
                <circle cx="100" cy="50" r="8" fill="none" stroke="#0fbcf9" stroke-width="1.5" opacity="0.6" style="animation: wave-expand 1.5s infinite;"/>
                <circle cx="100" cy="50" r="8" fill="none" stroke="#0fbcf9" stroke-width="1.5" opacity="0.4" style="animation: wave-expand 1.5s infinite 0.5s;"/>
                <circle cx="100" cy="50" r="8" fill="none" stroke="#0fbcf9" stroke-width="1.5" opacity="0.2" style="animation: wave-expand 1.5s infinite 1s;"/>
              </g>

              <!-- 思考气泡 -->
              <g class="effect effect-thinking">
                <circle cx="140" cy="40" r="3" fill="#0fbcf9" opacity="0.6" style="animation: think-bounce 1.5s infinite;"/>
                <circle cx="150" cy="32" r="4" fill="#0fbcf9" opacity="0.7" style="animation: think-bounce 1.5s infinite 0.2s;"/>
                <circle cx="162" cy="22" r="6" fill="#0fbcf9" opacity="0.8" style="animation: think-bounce 1.5s infinite 0.4s;"/>
                <!-- 齿轮 -->
                <g transform="translate(162,22)" style="animation: gear-rotate 3s linear infinite; transform-origin: 162px 22px;">
                  <g opacity="0.9">
                    <rect x="-1" y="-5" width="2" height="3" fill="#0fbcf9"/>
                    <rect x="-1" y="2" width="2" height="3" fill="#0fbcf9"/>
                    <rect x="-5" y="-1" width="3" height="2" fill="#0fbcf9"/>
                    <rect x="2" y="-1" width="3" height="2" fill="#0fbcf9"/>
                    <rect x="-4" y="-4" width="2" height="2" fill="#0fbcf9" transform="rotate(45)"/>
                    <rect x="2" y="2" width="2" height="2" fill="#0fbcf9" transform="rotate(45)"/>
                    <circle r="2.5" fill="none" stroke="#0fbcf9" stroke-width="1"/>
                  </g>
                </g>
              </g>

              <!-- 说话音符 -->
              <g class="effect effect-speaking">
                <text x="140" y="50" font-size="14" fill="#feca57" style="animation: note-float 1.5s infinite;">♪</text>
                <text x="145" y="55" font-size="10" fill="#ff6b9d" style="animation: note-float 1.5s infinite 0.5s;">♫</text>
                <text x="50" y="50" font-size="12" fill="#feca57" style="animation: note-float 1.5s infinite 1s; transform: scaleX(-1); transform-origin: 50px 50px;">♪</text>
              </g>

              <!-- 开心星星 -->
              <g class="effect effect-happy">
                <g transform="translate(50,40)" style="animation: star-twinkle 1s infinite;">
                  <path d="M 0,-5 L 1.5,-1.5 L 5,0 L 1.5,1.5 L 0,5 L -1.5,1.5 L -5,0 L -1.5,-1.5 Z" fill="#feca57"/>
                </g>
                <g transform="translate(155,35)" style="animation: star-twinkle 1s infinite 0.3s;">
                  <path d="M 0,-4 L 1.2,-1.2 L 4,0 L 1.2,1.2 L 0,4 L -1.2,1.2 L -4,0 L -1.2,-1.2 Z" fill="#ff6b9d"/>
                </g>
                <g transform="translate(165,65)" style="animation: star-twinkle 1s infinite 0.6s;">
                  <path d="M 0,-3 L 0.9,-0.9 L 3,0 L 0.9,0.9 L 0,3 L -0.9,0.9 L -3,0 L -0.9,-0.9 Z" fill="#0fbcf9"/>
                </g>
                <g transform="translate(35,70)" style="animation: star-twinkle 1s infinite 0.4s;">
                  <path d="M 0,-3.5 L 1,-1 L 3.5,0 L 1,1 L 0,3.5 L -1,1 L -3.5,0 L -1,-1 Z" fill="#feca57"/>
                </g>
              </g>

            </g>
          </svg>
        </div>

        <!-- 对话气泡 -->
        <div class="dialog-bubble" id="dialogBubble">
          <span id="dialogText"></span><span class="typing-cursor" id="typingCursor"></span>
        </div>
      </div>
    </div>
  </div>
  <div class="screen-info" id="screenInfo">240 × 240 | 1.3" TFT</div>
</div>

<!-- ===== 控制面板 ===== -->
<div class="control-panel">
  <div class="panel-title">ESP32-S3 屏幕模拟器</div>

  <!-- 状态控制 -->
  <div class="section">
    <div class="section-label">角色状态</div>
    <div class="state-buttons">
      <div class="state-btn active" data-state="idle">待机</div>
      <div class="state-btn" data-state="listening">倾听</div>
      <div class="state-btn" data-state="thinking">思考</div>
      <div class="state-btn" data-state="speaking">说话</div>
      <div class="state-btn" data-state="happy">开心</div>
    </div>
  </div>

  <!-- 屏幕分辨率 -->
  <div class="section">
    <div class="section-label">屏幕分辨率</div>
    <div class="select-group">
      <div class="select-btn" data-res="128">128×128</div>
      <div class="select-btn active" data-res="240">240×240</div>
      <div class="select-btn" data-res="320">320×240</div>
    </div>
  </div>

  <!-- 显示效果 -->
  <div class="section">
    <div class="section-label">显示效果</div>
    <div class="toggle-row">
      <label>扫描线</label>
      <div class="toggle on" id="toggleScanlines"></div>
    </div>
    <div class="toggle-row">
      <label>像素化</label>
      <div class="toggle" id="togglePixelated"></div>
    </div>
  </div>

  <!-- 自动对话流程 -->
  <div class="section">
    <div class="section-label">对话流程模拟</div>
    <button class="auto-flow-btn" id="autoFlowBtn">启动自动对话流程</button>
  </div>

  <!-- 状态显示 -->
  <div class="status-bar">
    <div class="status-dot"></div>
    <span id="statusText">状态: idle (待机)</span>
  </div>
</div>

<script>
  const screen = document.getElementById('screen');
  const screenContent = document.getElementById('screenContent');
  const screenInfo = document.getElementById('screenInfo');
  const statusText = document.getElementById('statusText');
  const dialogBubble = document.getElementById('dialogBubble');
  const dialogText = document.getElementById('dialogText');
  const typingCursor = document.getElementById('typingCursor');

  let currentState = 'idle';
  let autoFlowRunning = false;
  let autoFlowTimer = null;
  let typingTimer = null;

  const stateNames = {
    idle: '待机',
    listening: '倾听',
    thinking: '思考',
    speaking: '说话',
    happy: '开心'
  };

  const dialogScripts = {
    idle: '',
    listening: '我在听...',
    thinking: '嗯，让我想想...',
    speaking: '你好呀！今天天气真不错呢～',
    happy: '太棒啦！(*^▽^*)'
  };

  function setState(state) {
    currentState = state;
    // 移除所有状态类
    screen.className = 'screen';
    if (document.getElementById('toggleScanlines').classList.contains('on')) {
      screen.classList.add('scanlines');
    }
    if (document.getElementById('togglePixelated').classList.contains('on')) {
      screen.classList.add('pixelated');
    }
    screen.classList.add('state-' + state);

    // 更新按钮
    document.querySelectorAll('.state-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.state === state);
    });

    // 更新状态栏
    statusText.textContent = `状态: ${state} (${stateNames[state]})`;

    // 更新对话气泡
    updateDialog(state);
  }

  function updateDialog(state) {
    const script = dialogScripts[state];
    if (!script) {
      dialogBubble.classList.remove('show');
      if (typingTimer) clearInterval(typingTimer);
      return;
    }

    dialogBubble.classList.add('show');
    typingCursor.style.display = 'inline-block';
    dialogText.textContent = '';

    let i = 0;
    if (typingTimer) clearInterval(typingTimer);
    typingTimer = setInterval(() => {
      if (i < script.length) {
        dialogText.textContent += script[i];
        i++;
      } else {
        clearInterval(typingTimer);
        typingCursor.style.display = 'none';
      }
    }, 80);
  }

  // 状态按钮
  document.querySelectorAll('.state-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (autoFlowRunning) stopAutoFlow();
      setState(btn.dataset.state);
    });
  });

  // 分辨率切换
  document.querySelectorAll('.select-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.select-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const res = parseInt(btn.dataset.res);
      if (res === 128) {
        screen.style.width = '128px';
        screen.style.height = '128px';
        screenInfo.textContent = '128 × 128 | 0.96" TFT';
      } else if (res === 240) {
        screen.style.width = '240px';
        screen.style.height = '240px';
        screenInfo.textContent = '240 × 240 | 1.3" TFT';
      } else {
        screen.style.width = '320px';
        screen.style.height = '240px';
        screenInfo.textContent = '320 × 240 | 2.0" TFT';
      }
    });
  });

  // 扫描线开关
  document.getElementById('toggleScanlines').addEventListener('click', function() {
    this.classList.toggle('on');
    screen.classList.toggle('scanlines', this.classList.contains('on'));
  });

  // 像素化开关
  document.getElementById('togglePixelated').addEventListener('click', function() {
    this.classList.toggle('on');
    screen.classList.toggle('pixelated', this.classList.contains('on'));
  });

  // 自动对话流程
  const flowSteps = [
    { state: 'idle', duration: 2000 },
    { state: 'listening', duration: 2500 },
    { state: 'thinking', duration: 2500 },
    { state: 'speaking', duration: 5000 },
    { state: 'happy', duration: 2000 },
  ];

  function startAutoFlow() {
    autoFlowRunning = true;
    const btn = document.getElementById('autoFlowBtn');
    btn.textContent = '停止自动对话流程';
    btn.classList.add('running');

    let stepIndex = 0;
    function nextStep() {
      if (!autoFlowRunning) return;
      const step = flowSteps[stepIndex];
      setState(step.state);
      stepIndex = (stepIndex + 1) % flowSteps.length;
      autoFlowTimer = setTimeout(nextStep, step.duration);
    }
    nextStep();
  }

  function stopAutoFlow() {
    autoFlowRunning = false;
    if (autoFlowTimer) clearTimeout(autoFlowTimer);
    const btn = document.getElementById('autoFlowBtn');
    btn.textContent = '启动自动对话流程';
    btn.classList.remove('running');
  }

  document.getElementById('autoFlowBtn').addEventListener('click', function() {
    if (autoFlowRunning) {
      stopAutoFlow();
    } else {
      startAutoFlow();
    }
  });

  // 初始化
  setState('idle');
</script>

</body>
</html>
