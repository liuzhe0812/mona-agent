[project]
name = "mona-ai"
version = "1.4.0"
description = "A lightweight personal AI assistant framework"
readme = { file = "LICENSE", content-type = "text/plain" }
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "Liu Zhe"}
]
keywords = ["ai", "agent", "chatbot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
license-files = [
    "LICENSE",
]

dependencies = [
    "typer>=0.20.0,<1.0.0",
    "anthropic>=0.45.0,<1.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "websockets>=16.0,<17.0",
    "websocket-client>=1.9.0,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "ddgs>=9.5.5,<10.0.0",
    "oauth-cli-kit>=0.1.3,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
    "readability-lxml>=0.8.4,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "croniter>=6.0.0,<7.0.0",
    "dingtalk-stream>=0.24.0,<1.0.0",
    "lark-oapi>=1.5.0,<2.0.0",
    "python-socketio>=5.16.0,<6.0.0",
    "msgpack>=1.1.0,<2.0.0",
    "qq-botpy>=1.2.0,<2.0.0",
    "python-socks[asyncio]>=2.8.0,<3.0.0; sys_platform != 'win32'",
    "prompt-toolkit>=3.0.50,<4.0.0",
    "questionary>=2.0.0,<3.0.0",
    "mcp>=1.26.0,<2.0.0",
    "json-repair>=0.57.0,<1.0.0",
    "chardet>=3.0.2,<6.0.0",
    "openai>=2.8.0",
    "tiktoken>=0.12.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "dulwich>=0.22.0,<1.0.0",
    "pyyaml>=6.0,<7.0.0",
    "pypdf>=5.0.0,<6.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "python-pptx>=1.0.0,<2.0.0",
    "filelock>=3.25.2",
    "boto3>=1.43.0",
    "defusedxml>=0.7.1,<1.0.0",
]

[project.optional-dependencies]
api = [
    "aiohttp>=3.9.0,<4.0.0",
]
wecom = [
    "wecom-aibot-sdk-python>=0.1.5",
]
weixin = [
    "qrcode[pil]>=8.0",
    "pycryptodome>=3.20.0",
]
langsmith = [
    "langsmith>=0.1.0",
]
pdf = [
    "pymupdf>=1.25.0",
]
browser = [
    "playwright>=1.40.0,<2.0.0",
]
olostep = [
    "olostep>=0.1.0",
]
mona-ppt = [
    "python-pptx>=0.6.21",
    "svglib>=1.5.0",
    "reportlab>=4.0.0",
    "PyMuPDF>=1.23.0",
    "mammoth>=1.6.0",
    "markdownify>=0.11.6",
    "ebooklib>=0.18",
    "nbconvert>=7.0.0",
    "Pillow>=9.0.0",
    "numpy>=1.20.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "curl_cffi>=0.7.0",
    "google-genai>=1.0.0",
    "edge-tts>=7.2.8",
    "flask>=3.0.0",
]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "ruff>=0.1.0",
    "pymupdf>=1.25.0",
    "zstandard>=0.25.0",
]

[project.scripts]
mona = "mona.cli.commands:app"

# Third-party tool plugins register here.  Built-in tools are discovered
# automatically via pkgutil scanning in ToolLoader.discover().
# [project.entry-points."mona.tools"]
# my_plugin = "my_package.plugins:MyTool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.hooks.custom]
# Implementation lives in the conventional `hatch_build.py` at the repo root.

[tool.hatch.build]
include = [
    "mona/**/*.py",
    "mona/templates/**/*.md",
    "mona/skills/**/*.md",
    "mona/skills/**/*.sh",
    "mona/skills/**/*.ps1",
    "mona/skills/**/*.json",
    "mona/skills/**/*.csv",
    "mona/skills/**/*.svg",
    "mona/skills/**/*.png",
    "mona/skills/**/*.pptx",
    "mona/skills/**/*.html",
    "mona/skills/**/*.css",
    "mona/skills/**/*.js",
    "mona/skills/**/*.ttf",
    "mona/skills/**/*.txt",
    "mona/agents/**/*.json",
    "mona/agents/**/*.md",
    "mona/skills/**/*.xml",
    "mona/skills/**/*.xsd",
    "mona/web/dist/**/*",
]
# mona/web/dist/ is produced by `cd webui && bun run build` and is
# git-ignored. List it as an artifact so hatch ships it in both wheel and
# sdist even though VCS does not track it.
artifacts = [
    "mona/web/dist/**/*",
]

[tool.hatch.build.targets.wheel]
packages = ["mona"]

[tool.hatch.build.targets.wheel.sources]
"mona" = "mona"

[tool.hatch.build.targets.sdist]
include = [
    "mona/",
    "mona/web/dist/",
    "hatch_build.py",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "mona/skills/docx/scripts",
    "mona/skills/pdf/scripts",
    "mona/skills/html-report/diagrams",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["mona"]
omit = ["tests/*", "**/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

