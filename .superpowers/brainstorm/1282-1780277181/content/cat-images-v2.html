<h2>摩尔加纳风格黑猫 Logo 设计</h2>
<p class="subtitle">AI 生成的角色参考图 — 睡觉 vs 工作两种状态</p>

<div class="split">
  <div class="mockup">
    <div class="mockup-header">💤 睡觉状态</div>
    <div class="mockup-body" style="display:flex;align-items:center;justify-content:center;min-height:300px;background:#0f0f1a;border-radius:8px">
      <img src="https://aka.doubaocdn.com/s/PPP31wWP2z" alt="睡觉的黑猫" style="max-width:280px;max-height:280px;border-radius:12px" />
    </div>
  </div>
  <div class="mockup">
    <div class="mockup-header">⌨️ 工作状态</div>
    <div class="mockup-body" style="display:flex;align-items:center;justify-content:center;min-height:300px;background:#0f0f1a;border-radius:8px">
      <img src="https://aka.doubaocdn.com/s/fmuT1wWP2z" alt="敲键盘的黑猫" style="max-width:280px;max-height:280px;border-radius:12px" />
    </div>
  </div>
</div>

<div class="section" style="margin-top:28px">
  <h3>形象方向确认</h3>
  <p style="color:#888;font-size:14px;margin-bottom:16px">以上是 AI 生成的参考图，实际实现时需要美术师根据这个方向绘制矢量动画帧。请确认整体方向是否满意：</p>
  <div class="options">
    <div class="option" data-choice="direction-ok" onclick="toggleSelect(this)">
      <div class="letter">A</div>
      <div class="content">
        <h3>方向可以，继续细化</h3>
        <p>整体形象和双状态切换的方向没问题，继续讨论动画实现细节</p>
      </div>
    </div>
    <div class="option" data-choice="direction-adjust" onclick="toggleSelect(this)">
      <div class="letter">B</div>
      <div class="content">
        <h3>需要调整形象</h3>
        <p>大方向可以，但某些细节需要修改（请在终端告诉我具体调整）</p>
      </div>
    </div>
    <div class="option" data-choice="direction-retry" onclick="toggleSelect(this)">
      <div class="letter">C</div>
      <div class="content">
        <h3>重新生成</h3>
        <p>形象完全不对，需要换个方向重新生成参考图</p>
      </div>
    </div>
  </div>
</div>
