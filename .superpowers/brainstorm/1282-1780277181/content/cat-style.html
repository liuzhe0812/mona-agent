<h2>猫咪 Logo 形象方向确认</h2>
<p class="subtitle">黑猫 + 眼罩 + 白嘴 + 动漫画风格</p>

<div class="section">
  <h3>形象关键词</h3>
  <div style="display:flex;flex-wrap:wrap;gap:8px;margin:12px 0">
    <span style="background:#1a1a2e;color:#e0e0e0;padding:6px 14px;border-radius:20px;font-size:14px">全身黑色</span>
    <span style="background:#1a1a2e;color:#e0e0e0;padding:6px 14px;border-radius:20px;font-size:14px">白色嘴部</span>
    <span style="background:#1a1a2e;color:#e0e0e0;padding:6px 14px;border-radius:20px;font-size:14px">戴眼罩</span>
    <span style="background:#1a1a2e;color:#e0e0e0;padding:6px 14px;border-radius:20px;font-size:14px">动漫画风</span>
    <span style="background:#1a1a2e;color:#e0e0e0;padding:6px 14px;border-radius:20px;font-size:14px">非写实</span>
  </div>
</div>

<div class="split">
  <div class="mockup">
    <div class="mockup-header">状态 A：睡觉 💤</div>
    <div class="mockup-body" style="display:flex;align-items:center;justify-content:center;min-height:200px;background:#0f0f1a">
      <div style="text-align:center">
        <div style="font-size:80px;line-height:1;margin-bottom:8px">🐱</div>
        <div style="color:#888;font-size:13px">蜷缩睡觉 / 趴着打盹</div>
        <div style="color:#666;font-size:12px;margin-top:4px">Zzz 气泡飘出</div>
        <div style="color:#555;font-size:11px;margin-top:8px">眼罩拉到眼睛上</div>
      </div>
    </div>
  </div>
  <div class="mockup">
    <div class="mockup-header">状态 B：敲键盘 ⌨️</div>
    <div class="mockup-body" style="display:flex;align-items:center;justify-content:center;min-height:200px;background:#0f0f1a">
      <div style="text-align:center">
        <div style="font-size:80px;line-height:1;margin-bottom:8px">🐱</div>
        <div style="color:#888;font-size:13px">坐在电脑前敲键盘</div>
        <div style="color:#666;font-size:12px;margin-top:4px">眼罩推到额头上</div>
        <div style="color:#555;font-size:11px;margin-top:8px">爪子快速敲击的动画</div>
      </div>
    </div>
  </div>
</div>

<div class="section" style="margin-top:24px">
  <h3>关键细节确认</h3>
  <div class="options">
    <div class="option" data-choice="sleeping-pose" onclick="toggleSelect(this)">
      <div class="letter">A</div>
      <div class="content">
        <h3>睡觉姿势：蜷缩成球</h3>
        <p>像真猫一样蜷成一团，尾巴包住身体，更自然可爱</p>
      </div>
    </div>
    <div class="option" data-choice="sleeping-pose-2" onclick="toggleSelect(this)">
      <div class="letter">B</div>
      <div class="content">
        <h3>睡觉姿势：趴在桌上</h3>
        <p>趴在键盘旁边打盹，头枕着爪子，和"工作"状态呼应</p>
      </div>
    </div>
    <div class="option" data-choice="sleeping-pose-3" onclick="toggleSelect(this)">
      <div class="letter">C</div>
      <div class="content">
        <h3>睡觉姿势：侧躺</h3>
        <p>侧躺着睡，露出白色肚皮，更慵懒放松</p>
      </div>
    </div>
  </div>
</div>
