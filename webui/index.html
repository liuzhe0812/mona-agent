<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="mona web UI — chat with your mona workspace."
      data-i18n-meta="description"
    />
    <meta name="theme-color" content="#F2F2ED" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181818" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/mona_favicon_32.png" />
    <link rel="icon" type="image/png" sizes="73x75" href="/brand/mona_icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/mona_apple_touch.png" />
    <style>
      html,
      body,
      #root {
        height: 100%;
        overflow: hidden;
      }

      body {
        margin: 0;
        background: #F2F2ED;
        color: #1A1A1A;
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", "Noto Sans SC",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          sans-serif;
      }

      html.dark body {
        background: #181818;
        color: #D4D4D4;
      }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("mona-webui.theme");
          var dark =
            stored === "dark" ||
            (!stored &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch {}
      })();
    </script>
    <script>
      (function () {
        var localeKey = "mona.locale";
        var copy = {
          en: {
            description: "mona web UI — chat with your mona workspace."
          },
          "zh-CN": {
            description: "mona Web UI —— 与你的 mona 工作区对话。"
          },
          "zh-TW": {
            description: "mona Web UI —— 與你的 mona 工作區對話。"
          }
        };

        function normalizeLocale(input) {
          if (!input) return "en";
          var raw = String(input).trim();
          if (!raw) return "en";
          if (copy[raw]) return raw;
          var lower = raw.toLowerCase();
          if (lower === "zh" || lower.indexOf("zh-cn") === 0 || lower.indexOf("zh-sg") === 0) {
            return "zh-CN";
          }
          if (
            lower.indexOf("zh-tw") === 0 ||
            lower.indexOf("zh-hk") === 0 ||
            lower.indexOf("zh-mo") === 0 ||
            lower.indexOf("zh-hant") === 0
          ) {
            return "zh-TW";
          }
          var base = lower.split("-")[0];
          return copy[base] ? base : "en";
        }

        try {
          var stored = localStorage.getItem(localeKey);
          var detected =
            stored ||
            (navigator.languages && navigator.languages[0]) ||
            navigator.language ||
            "en";
          var locale = normalizeLocale(detected);
          var localized = copy[locale] || copy.en;
          document.documentElement.lang = locale;
          var description = document.querySelector('[data-i18n-meta=\"description\"]');
          if (description) description.setAttribute("content", localized.description);
        } catch {}
      })();
    </script>
    <title>mona</title>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
