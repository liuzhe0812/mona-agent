<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mona · 交互预览</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="terminal">
    <section class="stage" aria-label="Mona 角色">
      <header class="stage-header">
        <span class="brand">Mona</span>
        <span class="mode">模拟会话</span>
      </header>
      <img class="character" src="/mona-original.png" alt="Mona，黑红服装的猫耳女孩" draggable="false">
      <p class="stage-caption">正式原画预览 · 表情动画待接入</p>
    </section>
    <section class="conversation" aria-label="与 Mona 对话">
      <header class="conversation-header">
        <h1>陪你聊一会儿</h1>
        <p id="status" role="status">正在连接</p>
      </header>
      <div id="messages" class="messages" aria-live="polite" aria-relevant="additions text">
        <p class="welcome">这里可以验证文字输入和回应状态。当前使用模拟回复，尚未连接真实 Mona。</p>
      </div>
      <div class="reply-actions">
        <button id="read-reply" class="button secondary" type="button" disabled>朗读回复</button>
      </div>
      <form id="composer" class="composer">
        <label class="sr-only" for="text">发送内容</label>
        <textarea id="text" placeholder="想和 Mona 说些什么？" maxlength="8000" rows="3" required></textarea>
        <p id="field-error" class="field-error" role="alert"></p>
        <div class="composer-footer">
          <span>Enter 发送 · Shift + Enter 换行</span>
          <button id="send" class="button" type="submit" disabled>发送</button>
        </div>
      </form>
    </section>
  </main>
  <dialog id="notice">
    <h2 id="notice-title">暂时无法完成</h2>
    <p id="notice-body"></p>
    <form method="dialog"><button class="button">知道了</button></form>
  </dialog>
</body>
</html>
