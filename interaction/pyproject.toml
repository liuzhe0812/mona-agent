[project]
name = "mona-interaction"
version = "0.1.0"
description = "Independent Mona character interaction terminal"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mona_interaction"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
