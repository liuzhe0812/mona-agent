name: Package macOS

on:
  push:
    paths:
      - ".github/workflows/build-macos.yml"
      - ".github/scripts/upload_qiniu_artifact.py"
      - "src-tauri/build-macos-release.sh"
      - "mona-gateway.spec"
      - "src-tauri/**"
      - "webui/**"
      - "mona/**"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Notarize and publish both DMGs to Qiniu"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: macos-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            webui/package-lock.json
            webui/office-editor/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Install matching Tauri CLI
        run: cargo install tauri-cli --version 2.11.2 --locked

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        run: |
          npm ci --prefix webui
          npm ci --prefix webui/office-editor

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller ".[api,wecom,weixin,pdf]"

      - name: Import Apple signing certificate
        if: ${{ inputs.publish == true }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$KEYCHAIN_PASSWORD"
          keychain="$RUNNER_TEMP/mona-build.keychain-db"
          certificate="$RUNNER_TEMP/mona-certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D -o "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$keychain" login.keychain-db
          security default-keychain -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F -- "$APPLE_SIGNING_IDENTITY"

      - name: Build macOS package
        env:
          APPLE_SIGNING_IDENTITY: ${{ inputs.publish && secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID: ${{ inputs.publish && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ inputs.publish && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.publish && secrets.APPLE_TEAM_ID || '' }}
        run: |
          mkdir -p "dist/macos/${{ matrix.arch }}"
          log="dist/macos/${{ matrix.arch }}/build.log"
          set +e
          ./src-tauri/build-macos-release.sh 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            detail="$(tail -n 10 "$log" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error title=macOS package build failed::${detail}"
            exit "$status"
          fi

      - name: Verify notarization
        if: ${{ inputs.publish == true }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          dmg="dist/macos/${{ matrix.arch }}/Mona_${version}_${{ matrix.arch }}.dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature -vv "$dmg"

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mona-macOS-${{ matrix.arch }}
          path: dist/macos/${{ matrix.arch }}
          if-no-files-found: error

  publish:
    name: Publish notarized DMGs
    needs: build
    if: ${{ inputs.publish == true && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download DMG artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Mona-macOS-*
          path: artifacts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upload and verify Qiniu files
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
          QINIU_DOMAIN: ${{ secrets.QINIU_DOMAIN }}
        run: |
          test -n "$QINIU_DOMAIN"
          python -m pip install qiniu
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          found=0
          while IFS= read -r dmg; do
            found=1
            object_key="macos/${version}/$(basename "$dmg")"
            python .github/scripts/upload_qiniu_artifact.py --artifact "$dmg" --object-key "$object_key"
            public_url="${QINIU_DOMAIN%/}/${object_key}"
            downloaded="$RUNNER_TEMP/$(basename "$dmg")"
            curl --fail --location --retry 3 --retry-delay 5 --output "$downloaded" "$public_url"
            test "$(sha256sum "$dmg" | cut -d ' ' -f 1)" = "$(sha256sum "$downloaded" | cut -d ' ' -f 1)"
            echo "- ${public_url}" >> "$GITHUB_STEP_SUMMARY"
          done < <(find artifacts -type f -name '*.dmg' -print | sort)
          test "$found" = 1
