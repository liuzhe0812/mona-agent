name: Package macOS

on:
  push:
    paths:
      - ".github/workflows/build-macos.yml"
      - ".github/scripts/upload_qiniu_artifact.py"
      - "src-tauri/build-macos-release.sh"
      - "mona-gateway.spec"
      - "src-tauri/**"
      - "webui/**"
      - "mona/**"
      - "pyproject.toml"
  workflow_dispatch:
    inputs:
      publish:
        description: "none = 只出 artifact；ad-hoc = 免费签名上传（未公证）；notarized = 正式签名公证后上传"
        required: true
        default: none
        type: choice
        options:
          - none
          - ad-hoc
          - notarized

permissions:
  contents: read

concurrency:
  group: macos-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Apple Silicon
    runs-on: macos-15
    outputs:
      source_sha: ${{ steps.release_source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            webui/package-lock.json
            webui/office-editor/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Install matching Tauri CLI
        run: cargo install tauri-cli --version 2.11.2 --locked

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select release source
        id: release_source
        env:
          PUBLISH_MODE: ${{ inputs.publish || 'none' }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH_MODE" == "ad-hoc" || "$PUBLISH_MODE" == "notarized" ]]; then
            source_sha="$(python - <<'PY'
          import json, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          release = json.loads(Path("official-site/public/changelog.json").read_text(encoding="utf-8"))["releases"][0]
          sha = release.get("gitHash", "")
          if release.get("version") != version or not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("published changelog does not identify the current release source")
          print(sha)
          PY
            )"
            git fetch --no-tags --depth=1 origin "$source_sha"
            git checkout --detach "$source_sha"
          else
            source_sha="$(git rev-parse HEAD)"
          fi
          test "$(git rev-parse HEAD)" = "$source_sha"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Release source: $source_sha"

      - name: Install frontend dependencies
        run: |
          npm ci --prefix webui
          npm ci --prefix webui/office-editor

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller ".[api,wecom,weixin,pdf,development]"

      - name: Import Apple signing certificate
        if: ${{ inputs.publish == 'notarized' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$KEYCHAIN_PASSWORD"
          keychain="$RUNNER_TEMP/mona-build.keychain-db"
          certificate="$RUNNER_TEMP/mona-certificate.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D -o "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$keychain" login.keychain-db
          security default-keychain -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -F -- "$APPLE_SIGNING_IDENTITY"

      - name: Build macOS package
        env:
          APPLE_SIGNING_IDENTITY: ${{ inputs.publish == 'notarized' && secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_ID: ${{ inputs.publish == 'notarized' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ inputs.publish == 'notarized' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.publish == 'notarized' && secrets.APPLE_TEAM_ID || '' }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          log="$RUNNER_TEMP/mona-macos-arm64-build.log"
          set +e
          ./src-tauri/build-macos-release.sh 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            detail="$(tail -n 50 "$log" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error title=macOS package build failed::${detail}"
            exit "$status"
          fi

      - name: Verify Apple Silicon package and DMG
        run: |
          set -euo pipefail
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          app="dist/macos/arm64/Mona.app"
          dmg="dist/macos/arm64/Mona_${version}_arm64.dmg"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
          main="$app/Contents/MacOS/$executable"
          gateway="$(find "$app" -type f -path '*/mona-gateway/mona-gateway' -print -quit)"
          manifest="$(find "$app" -type f -path '*/desktop-resources/office-editor/manifest.json' -print -quit)"
          test -n "$gateway" && test -n "$manifest" && test -f "$dmg"
          sidecar="$(dirname "$manifest")/sheets/xlsx-sidecar"
          for binary in "$main" "$gateway" "$sidecar"; do
            test -f "$binary"
            test "$(lipo -archs "$binary")" = "arm64"
            codesign --verify --strict "$binary"
          done
          codesign --verify --deep --strict "$app"
          gateway_version="$("$gateway" --version)"
          [[ "$gateway_version" == *" v$version" ]]
          "$gateway" --help >/dev/null
          python - "$manifest" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          manifest_path = Path(sys.argv[1]).resolve()
          office = manifest_path.parent
          manifest = json.loads(manifest_path.read_text())
          entry = manifest.get("xlsxSidecar", {})
          sidecar = office / "sheets/xlsx-sidecar"
          if (manifest.get("schemaVersion") != 1 or manifest.get("platform") != "macos"
                  or manifest.get("arch") != "arm64" or entry.get("path") != "sheets/xlsx-sidecar"
                  or not sidecar.is_file() or entry.get("size") != sidecar.stat().st_size
                  or entry.get("sha256") != hashlib.sha256(sidecar.read_bytes()).hexdigest()):
              raise SystemExit("packaged Office sidecar does not match its manifest")
          if not all((office / "templates" / name).is_file() for name in ("blank.docx", "blank.xlsx", "blank.pptx")):
              raise SystemExit("packaged Office templates are incomplete")
          if not any(path.is_file() for path in (office / "licenses").iterdir()):
              raise SystemExit("packaged Office licenses are missing")
          PY
          mount="$(mktemp -d "$RUNNER_TEMP/mona-dmg.XXXXXX")"
          mounted=false
          cleanup() {
            if [[ "$mounted" == true ]]; then hdiutil detach "$mount" -quiet; fi
            if [[ -d "$mount" ]]; then rmdir "$mount"; fi
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount" -quiet
          mounted=true
          dmg_app="$mount/Mona.app"
          test -d "$dmg_app"
          codesign --verify --deep --strict "$dmg_app"
          dmg_gateway="$(find "$dmg_app" -type f -path '*/mona-gateway/mona-gateway' -print -quit)"
          dmg_manifest="$(find "$dmg_app" -type f -path '*/desktop-resources/office-editor/manifest.json' -print -quit)"
          test -n "$dmg_gateway" && test -n "$dmg_manifest"
          cmp "$app/Contents/Info.plist" "$dmg_app/Contents/Info.plist"
          cmp "$main" "$dmg_app/Contents/MacOS/$executable"
          cmp "$gateway" "$dmg_gateway"
          cmp "$manifest" "$dmg_manifest"
          cmp "$sidecar" "$(dirname "$dmg_manifest")/sheets/xlsx-sidecar"
          echo "Verified arm64 app, gateway, Office sidecar and DMG contents."

      - name: Verify notarization
        if: ${{ inputs.publish == 'notarized' }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          dmg="dist/macos/arm64/Mona_${version}_arm64.dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature -vv "$dmg"

      - name: Record release metadata
        env:
          SIGNING_MODE: ${{ inputs.publish == 'notarized' && 'notarized' || 'ad-hoc' }}
          SOURCE_GIT_HASH: ${{ steps.release_source.outputs.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          root = Path("dist/macos/arm64")
          dmg = root / f"Mona_{version}_arm64.dmg"
          source_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if source_sha != os.environ["SOURCE_GIT_HASH"]:
              raise SystemExit("release source changed during the build")
          metadata = {"version": version, "git_hash": source_sha, "platform": "macos", "arch": "arm64", "signing": os.environ["SIGNING_MODE"], "file": dmg.name, "size": dmg.stat().st_size, "sha256": hashlib.sha256(dmg.read_bytes()).hexdigest()}
          (root / "release-metadata.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mona-macOS-arm64
          path: dist/macos/arm64
          if-no-files-found: error

  publish:
    name: Publish DMG
    needs: build
    if: ${{ needs.build.result == 'success' && (inputs.publish == 'ad-hoc' || inputs.publish == 'notarized') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source_sha }}

      - name: Download DMG artifact
        uses: actions/download-artifact@v4
        with:
          name: Mona-macOS-arm64
          path: artifacts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upload and verify Qiniu files
        env:
          QINIU_AK: ${{ secrets.QINIU_AK }}
          QINIU_SK: ${{ secrets.QINIU_SK }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
          QINIU_DOMAIN: ${{ secrets.QINIU_DOMAIN }}
        run: |
          test -n "$QINIU_DOMAIN"
          domain="${QINIU_DOMAIN#https://}"
          domain="${domain#http://}"
          domain="${domain%/}"
          python -m pip install qiniu
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          found=0
          while IFS= read -r dmg; do
            found=1
            digest="$(sha256sum "$dmg" | cut -d ' ' -f 1)"
            # 版本化路径供归档，固定路径供官网下载按钮长期使用。
            for object_key in "macos/${version}/$(basename "$dmg")" "macos/Mona-latest.dmg"; do
              python .github/scripts/upload_qiniu_artifact.py --artifact "$dmg" --object-key "$object_key"
              public_url="https://${domain}/${object_key}"
              downloaded="$RUNNER_TEMP/verify-$(basename "$dmg")"
              curl --fail --location --retry 3 --retry-delay 5 --output "$downloaded" "$public_url"
              test "$digest" = "$(sha256sum "$downloaded" | cut -d ' ' -f 1)"
              echo "- ${public_url}" >> "$GITHUB_STEP_SUMMARY"
            done
          done < <(find artifacts -type f -name '*.dmg' -print | sort)
          test "$found" = 1
