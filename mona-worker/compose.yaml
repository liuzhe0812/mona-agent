name: mona-worker

services:
  mona-asr:
    build:
      context: ./asr
    container_name: mona-asr
    restart: unless-stopped
    runtime: nvidia
    environment:
      ASR_DEVICE: cuda:0
      MODELSCOPE_CACHE: /models/modelscope
      HF_HOME: /models/huggingface
      ASR_IDLE_SECONDS: "600"
      ASR_MAX_UPLOAD_BYTES: "104857600"
    volumes:
      - /home/mona-worker/mona-worker/models/asr:/models
      - /home/mona-worker/mona-worker/data/temporary:/data/temporary
    networks:
      - internal

  mona-ocr:
    build:
      context: ./ocr
    container_name: mona-ocr
    restart: unless-stopped
    environment:
      PADDLE_PDX_CACHE_HOME: /models/paddlex
      PADDLE_PDX_MODEL_SOURCE: BOS
      OCR_IDLE_SECONDS: "600"
      OCR_MAX_UPLOAD_BYTES: "52428800"
    volumes:
      - /home/mona-worker/mona-worker/models/ocr:/models
      - /home/mona-worker/mona-worker/data/temporary:/data/temporary
    networks:
      - internal

  mona-structure-ocr:
    build:
      context: ./structure-ocr
    container_name: mona-structure-ocr
    restart: unless-stopped
    environment:
      PADDLE_PDX_CACHE_HOME: /models/paddlex
      PADDLE_PDX_MODEL_SOURCE: BOS
      STRUCTURE_OCR_IDLE_SECONDS: "600"
      STRUCTURE_OCR_MAX_UPLOAD_BYTES: "104857600"
    volumes:
      - /home/mona-worker/mona-worker/models/structure-ocr:/models
      - /home/mona-worker/mona-worker/data/temporary:/data/temporary
    networks:
      - internal

  mona-worker-api:
    build:
      context: ./worker-api
    container_name: mona-worker-api
    restart: unless-stopped
    environment:
      VPS_WORKER_URL: ${VPS_WORKER_URL:-}
      VPS_WORKER_KEY: ${VPS_WORKER_KEY:-}
      VPS_WORKER_CA_FILE: ${VPS_WORKER_CA_FILE:-}
      WORKER_ID: ${WORKER_ID:-mona-notebook-01}
      WORKER_POLL_SECONDS: "5"
      WORKER_LEASE_SECONDS: "900"
    volumes:
      - /home/mona-worker/mona-worker/data/uploads:/data/uploads
      - /home/mona-worker/mona-worker/config:/config:ro
    depends_on:
      - mona-asr
      - mona-ocr
      - mona-structure-ocr
    networks:
      - internal

networks:
  internal:
    name: mona-worker-internal





