<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mona 管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
        .login-wrap { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); width: 360px; }
        .login-box h2 { text-align: center; margin-bottom: 24px; }
        .login-box input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
        .login-box button { width: 100%; padding: 10px; background: #4f46e5; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .login-box button:hover { background: #4338ca; }
        .login-box .error { color: #dc2626; font-size: 13px; margin-bottom: 8px; text-align: center; }
        .app { display: none; }
        .header { background: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
        .header h1 { font-size: 18px; }
        .header button { padding: 6px 16px; background: #f3f4f6; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 24px; }
        .stat-card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
        .stat-card .label { font-size: 13px; color: #666; margin-bottom: 4px; }
        .stat-card .value { font-size: 28px; font-weight: 700; }
        .users { padding: 0 24px 24px; }
        .users-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .users-header h2 { font-size: 16px; }
        .search-box { display: flex; gap: 8px; }
        .search-box input { padding: 6px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; width: 220px; }
        .search-box button { padding: 6px 14px; background: #4f46e5; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .search-box button:hover { background: #4338ca; }
        table { width: 100%; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.06); border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
        th { background: #f9fafb; font-weight: 600; color: #555; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        .badge-active { background: #dcfce7; color: #166534; }
        .badge-expired { background: #fee2e2; color: #991b1b; }
        .badge-trial { background: #dbeafe; color: #1e40af; }
        .badge-admin { background: #fef3c7; color: #92400e; }
        .actions button { padding: 4px 10px; margin-right: 4px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; font-size: 12px; background: #fff; }
        .actions button:hover { background: #f3f4f6; }
        .actions .btn-danger { color: #dc2626; border-color: #fca5a5; }
        .actions .btn-danger:hover { background: #fee2e2; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.3); justify-content: center; align-items: center; }
        .modal { background: #fff; padding: 24px; border-radius: 12px; width: 400px; }
        .modal h3 { margin-bottom: 16px; }
        .modal label { display: block; font-size: 13px; margin-bottom: 4px; color: #555; }
        .modal input { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
        .modal select { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 8px; }
        .modal-btns button { padding: 8px 20px; border-radius: 6px; cursor: pointer; border: 1px solid #ddd; }
        .modal-btns .primary { background: #4f46e5; color: #fff; border-color: #4f46e5; }
        .modal-btns .danger { background: #dc2626; color: #fff; border-color: #dc2626; }
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 16px; }
        .pagination button { padding: 6px 14px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; background: #fff; }
        .pagination button.active { background: #4f46e5; color: #fff; border-color: #4f46e5; }
        .pagination button:disabled { opacity: .5; cursor: default; }
        .confirm-text { font-size: 14px; line-height: 1.6; margin-bottom: 16px; }
        .confirm-text strong { color: #dc2626; }
    </style>
</head>
<body>
    <div id="login" class="login-wrap">
        <div class="login-box">
            <h2>Mona 管理后台</h2>
            <div id="loginError" class="error" style="display:none"></div>
            <input type="email" id="loginEmail" placeholder="邮箱">
            <input type="password" id="loginPassword" placeholder="密码">
            <button onclick="doLogin()">登录</button>
        </div>
    </div>

    <div id="app" class="app">
        <div class="header">
            <h1>Mona 管理后台</h1>
            <button onclick="doLogout()">退出</button>
        </div>
        <div class="stats" id="stats"></div>
        <div class="users">
            <div class="users-header">
                <h2>用户列表</h2>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="搜索邮箱..." onkeydown="if(event.key==='Enter')doSearch()">
                    <button onclick="doSearch()">搜索</button>
                </div>
            </div>
            <table>
                <thead>
                    <tr><th>ID</th><th>邮箱</th><th>角色</th><th>试用</th><th>订阅</th><th>注册时间</th><th>操作</th></tr>
                </thead>
                <tbody id="userTable"></tbody>
            </table>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <div id="trialModal" class="modal-overlay">
        <div class="modal">
            <h3>修改试用</h3>
            <label>试用到期时间</label>
            <input type="datetime-local" id="trialExpires">
            <div class="modal-btns">
                <button onclick="closeTrialModal()">取消</button>
                <button class="primary" onclick="saveTrial()">保存</button>
            </div>
        </div>
    </div>

    <div id="subModal" class="modal-overlay">
        <div class="modal">
            <h3>修改订阅</h3>
            <label>状态</label>
            <select id="subStatus"><option value="active">有效</option><option value="expired">过期</option></select>
            <label>到期时间（可选）</label>
            <input type="datetime-local" id="subEnd">
            <div class="modal-btns">
                <button onclick="closeSubModal()">取消</button>
                <button class="primary" onclick="saveSub()">保存</button>
            </div>
        </div>
    </div>

    <div id="deleteModal" class="modal-overlay">
        <div class="modal">
            <h3>确认删除</h3>
            <div class="confirm-text">确定要删除用户 <strong id="deleteEmail"></strong> 吗？此操作不可撤销。</div>
            <div class="modal-btns">
                <button onclick="closeDeleteModal()">取消</button>
                <button class="danger" onclick="confirmDelete()">删除</button>
            </div>
        </div>
    </div>

    <script>
        const API = '';
        let token = localStorage.getItem('admin_token') || '';
        let currentPage = 1;
        let editingUserId = null;
        let deletingUserId = null;
        let searchKeyword = '';

        function headers() {
            return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
        }

        async function doLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errEl = document.getElementById('loginError');
            try {
                const res = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.access_token) {
                    token = data.access_token;
                    const me = await fetch(`${API}/admin/stats`, { headers: headers() });
                    if (me.status === 403) {
                        token = '';
                        errEl.textContent = '非管理员账号';
                        errEl.style.display = 'block';
                        return;
                    }
                    localStorage.setItem('admin_token', token);
                    showApp();
                } else {
                    errEl.textContent = data.detail || data.error || '登录失败';
                    errEl.style.display = 'block';
                }
            } catch (e) {
                errEl.textContent = '网络错误';
                errEl.style.display = 'block';
            }
        }

        function doLogout() {
            token = '';
            localStorage.removeItem('admin_token');
            document.getElementById('app').style.display = 'none';
            document.getElementById('login').style.display = 'flex';
        }

        function showApp() {
            document.getElementById('login').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            loadStats();
            loadUsers();
        }

        async function loadStats() {
            try {
                const res = await fetch(`${API}/admin/stats`, { headers: headers() });
                const data = await res.json();
                document.getElementById('stats').innerHTML = `
                    <div class="stat-card"><div class="label">总用户数</div><div class="value">${data.total_users}</div></div>
                    <div class="stat-card"><div class="label">有效订阅</div><div class="value">${data.active_subscriptions}</div></div>
                    <div class="stat-card"><div class="label">试用中</div><div class="value">${data.active_trials}</div></div>
                    <div class="stat-card"><div class="label">试用过期</div><div class="value">${data.expired_trials}</div></div>
                `;
            } catch {}
        }

        function doSearch() {
            searchKeyword = document.getElementById('searchInput').value.trim();
            loadUsers(1);
        }

        async function loadUsers(page = 1) {
            currentPage = page;
            try {
                let url = `${API}/admin/users?page=${page}&page_size=20`;
                if (searchKeyword) url += `&search=${encodeURIComponent(searchKeyword)}`;
                const res = await fetch(url, { headers: headers() });
                const data = await res.json();
                const tbody = document.getElementById('userTable');
                if (data.users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:#999;padding:32px">暂无数据</td></tr>';
                } else {
                    tbody.innerHTML = data.users.map(u => {
                        const roleBadge = u.is_admin
                            ? '<span class="badge badge-admin">管理员</span>'
                            : '<span class="badge" style="background:#f3f4f6;color:#555">用户</span>';
                        const trialBadge = u.trial_expires_at
                            ? (new Date(u.trial_expires_at) > new Date()
                                ? `<span class="badge badge-trial">试用中 - ${u.trial_expires_at.slice(0,10)}</span>`
                                : `<span class="badge badge-expired">已过期 - ${u.trial_expires_at.slice(0,10)}</span>`)
                            : '<span class="badge" style="background:#f3f4f6;color:#999">无试用</span>';
                        const subBadge = u.subscription_status === 'active'
                            ? `<span class="badge badge-active">有效 - ${(u.subscription_end||'').slice(0,10)}</span>`
                            : '<span class="badge" style="background:#f3f4f6;color:#999">无</span>';
                        const deleteBtn = u.is_admin ? '' : `<button class="btn-danger" onclick="openDeleteModal(${u.id},'${u.email}')">删除</button>`;
                        return `<tr>
                            <td>${u.id}</td><td>${u.email}</td><td>${roleBadge}</td><td>${trialBadge}</td><td>${subBadge}</td>
                            <td>${u.created_at.slice(0,10)}</td>
                            <td class="actions">
                                <button onclick="openTrialModal(${u.id},'${u.trial_expires_at||''}')">试用</button>
                                <button onclick="openSubModal(${u.id},'${u.subscription_status||'expired'}','${u.subscription_end||''}')">订阅</button>
                                ${deleteBtn}
                            </td>
                        </tr>`;
                    }).join('');
                }

                const totalPages = Math.ceil(data.total / 20);
                const pag = document.getElementById('pagination');
                let pagHtml = `<button ${page<=1?'disabled':''} onclick="loadUsers(${page-1})">上一页</button>`;
                for (let i = 1; i <= totalPages && i <= 10; i++) {
                    pagHtml += `<button class="${i===page?'active':''}" onclick="loadUsers(${i})">${i}</button>`;
                }
                pagHtml += `<button ${page>=totalPages?'disabled':''} onclick="loadUsers(${page+1})">下一页</button>`;
                pag.innerHTML = pagHtml;
            } catch {}
        }

        function openTrialModal(userId, expiresAt) {
            editingUserId = userId;
            const input = document.getElementById('trialExpires');
            if (expiresAt) input.value = expiresAt.slice(0,16);
            else input.value = '';
            document.getElementById('trialModal').style.display = 'flex';
        }
        function closeTrialModal() { document.getElementById('trialModal').style.display = 'none'; }

        async function saveTrial() {
            const val = document.getElementById('trialExpires').value;
            if (!val) return;
            await fetch(`${API}/admin/users/${editingUserId}/trial`, {
                method: 'PUT',
                headers: headers(),
                body: JSON.stringify({ trial_expires_at: new Date(val).toISOString() })
            });
            closeTrialModal();
            loadUsers(currentPage);
            loadStats();
        }

        function openSubModal(userId, status, end) {
            editingUserId = userId;
            document.getElementById('subStatus').value = status || 'expired';
            const input = document.getElementById('subEnd');
            if (end) input.value = end.slice(0,16);
            else input.value = '';
            document.getElementById('subModal').style.display = 'flex';
        }
        function closeSubModal() { document.getElementById('subModal').style.display = 'none'; }

        async function saveSub() {
            const status = document.getElementById('subStatus').value;
            const end = document.getElementById('subEnd').value;
            const params = new URLSearchParams({ status });
            if (end) params.set('period_end', new Date(end).toISOString());
            await fetch(`${API}/admin/users/${editingUserId}/subscription?${params}`, {
                method: 'PUT',
                headers: headers()
            });
            closeSubModal();
            loadUsers(currentPage);
            loadStats();
        }

        function openDeleteModal(userId, email) {
            deletingUserId = userId;
            document.getElementById('deleteEmail').textContent = email;
            document.getElementById('deleteModal').style.display = 'flex';
        }
        function closeDeleteModal() { document.getElementById('deleteModal').style.display = 'none'; }

        async function confirmDelete() {
            await fetch(`${API}/admin/users/${deletingUserId}`, {
                method: 'DELETE',
                headers: headers()
            });
            closeDeleteModal();
            loadUsers(currentPage);
            loadStats();
        }

        // Auto-login if token exists
        if (token) {
            fetch(`${API}/admin/stats`, { headers: headers() }).then(r => {
                if (r.ok) showApp();
                else doLogout();
            }).catch(() => doLogout());
        }
    </script>
</body>
</html>
