<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mona 管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }
        .login-wrap { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); width: 360px; }
        .login-box h2 { text-align: center; margin-bottom: 24px; }
        .login-box input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
        .login-box button { width: 100%; padding: 10px; background: #4f46e5; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .login-box button:hover { background: #4338ca; }
        .login-box .error { color: #dc2626; font-size: 13px; margin-bottom: 8px; text-align: center; }
        .app { display: none; }
        .header { background: #fff; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
        .header h1 { font-size: 18px; }
        .header button { padding: 6px 16px; background: #f3f4f6; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 24px; }
        .stat-card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
        .stat-card .label { font-size: 13px; color: #666; margin-bottom: 4px; }
        .stat-card .value { font-size: 28px; font-weight: 700; }
        .users { padding: 0 24px 24px; }
        .users-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .users-header h2 { font-size: 16px; }
        .search-box { display: flex; gap: 8px; }
        .search-box input { padding: 6px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; width: 220px; }
        .search-box button { padding: 6px 14px; background: #4f46e5; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .search-box button:hover { background: #4338ca; }
        table { width: 100%; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.06); border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
        th { background: #f9fafb; font-weight: 600; color: #555; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        .badge-active { background: #dcfce7; color: #166534; }
        .badge-expired { background: #fee2e2; color: #991b1b; }
        .badge-trial { background: #dbeafe; color: #1e40af; }
        .badge-admin { background: #fef3c7; color: #92400e; }
        .actions button { padding: 4px 10px; margin-right: 4px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; font-size: 12px; background: #fff; }
        .actions button:hover { background: #f3f4f6; }
        .actions .btn-danger { color: #dc2626; border-color: #fca5a5; }
        .actions .btn-danger:hover { background: #fee2e2; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.3); justify-content: center; align-items: center; }
        .modal { background: #fff; padding: 24px; border-radius: 12px; width: 400px; }
        .modal h3 { margin-bottom: 16px; }
        .modal label { display: block; font-size: 13px; margin-bottom: 4px; color: #555; }
        .modal input { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
        .modal select { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 8px; }
        .modal-btns button { padding: 8px 20px; border-radius: 6px; cursor: pointer; border: 1px solid #ddd; }
        .modal-btns .primary { background: #4f46e5; color: #fff; border-color: #4f46e5; }
        .modal-btns .danger { background: #dc2626; color: #fff; border-color: #dc2626; }
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 16px; }
        .pagination button { padding: 6px 14px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; background: #fff; }
        .pagination button.active { background: #4f46e5; color: #fff; border-color: #4f46e5; }
        .pagination button:disabled { opacity: .5; cursor: default; }
        .confirm-text { font-size: 14px; line-height: 1.6; margin-bottom: 16px; }
        .confirm-text strong { color: #dc2626; }
        .tab-btn { padding: 6px 14px; border: 1px solid #ddd; border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; }
        .tab-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
        .tab-section { display: none; }
        .tab-section.active { display: block; }
        .card { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); border: 1px solid #f0f0f0; overflow: hidden; }
        .card-header { padding: 16px 20px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
        .card-header h3 { font-size: 15px; font-weight: 600; color: #111827; }
        .card-body { padding: 20px; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid transparent; transition: all .15s; }
        .btn-primary { background: #3b82f6; color: #fff; }
        .btn-primary:hover { background: #2563eb; }
        .btn-outline { background: #fff; border-color: #e5e7eb; color: #374151; }
        .btn-outline:hover { background: #f9fafb; }
        .btn-danger { color: #dc2626; border-color: #fca5a5; background: #fff; }
        .btn-danger:hover { background: #fef2f2; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
        .form-field { display: flex; flex-direction: column; gap: 6px; }
        .form-field label { font-size: 12px; font-weight: 500; color: #374151; }
        .form-field input, .form-field select { padding: 8px 10px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 13px; background: #fff; color: #111827; outline: none; }
        .form-field input:focus, .form-field select:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.12); }
        .form-field input::placeholder { color: #9ca3af; }
        .pricing-table { width: 100%; border-collapse: collapse; }
        .pricing-table th { text-align: left; padding: 12px 16px; font-size: 12px; font-weight: 600; color: #6b7280; background: #f9fafb; border-bottom: 1px solid #f0f0f0; white-space: nowrap; }
        .pricing-table td { padding: 12px 16px; border-bottom: 1px solid #f3f4f6; font-size: 13px; vertical-align: middle; }
        .pricing-table tr:last-child td { border-bottom: none; }
        .pricing-table input, .pricing-table select { width: 100%; padding: 6px 8px; border: 1px solid #e5e7eb; border-radius: 6px; font-size: 13px; outline: none; background: #fff; }
        .pricing-table input:focus, .pricing-table select:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,.12); }
        .pricing-table input[type="checkbox"] { width: auto; accent-color: #3b82f6; }
        .pricing-table .col-id { width: 120px; }
        .pricing-table .col-number { width: 90px; }
        .pricing-table .col-badge { width: 100px; }
        .pricing-table .col-enabled { width: 60px; text-align: center; }
        .pricing-table .col-action { width: 70px; }
        .empty-tip { text-align: center; padding: 40px; color: #9ca3af; font-size: 13px; }
        .toast { position: fixed; top: 20px; right: 20px; padding: 12px 18px; background: #111827; color: #fff; border-radius: 8px; font-size: 13px; box-shadow: 0 10px 25px rgba(0,0,0,.15); opacity: 0; transform: translateY(-10px); transition: all .2s; pointer-events: none; z-index: 100; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { background: #dc2626; }
    </style>
</head>
<body>
    <div id="login" class="login-wrap">
        <div class="login-box">
            <h2>Mona 管理后台</h2>
            <div id="loginError" class="error" style="display:none"></div>
            <input type="email" id="loginEmail" placeholder="邮箱">
            <input type="password" id="loginPassword" placeholder="密码">
            <button onclick="doLogin()">登录</button>
        </div>
    </div>

    <div id="app" class="app">
        <div class="header">
            <h1>Mona 管理后台</h1>
            <div style="display:flex;gap:8px;align-items:center">
                <button onclick="switchTab('users')" id="tab-users" class="tab-btn active">用户</button>
                <button onclick="switchTab('pricing')" id="tab-pricing" class="tab-btn">价格配置</button>
                <button onclick="switchTab('promo')" id="tab-promo" class="tab-btn">注册活动</button>
                <button onclick="switchTab('notifications')" id="tab-notifications" class="tab-btn">通知管理</button>
                <button onclick="doLogout()">退出</button>
            </div>
        </div>
        <div id="section-users" class="tab-section active">
            <div class="stats" id="stats"></div>
            <div class="users">
                <div class="users-header">
                    <h2>用户列表</h2>
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="搜索邮箱..." onkeydown="if(event.key==='Enter')doSearch()">
                        <button onclick="doSearch()">搜索</button>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr><th>ID</th><th>账号</th><th>邮箱</th><th>角色</th><th>试用到期</th><th>订阅状态</th><th>订阅到期</th><th>注册时间</th><th>操作</th></tr>
                    </thead>
                    <tbody id="userTable"></tbody>
                </table>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>

        <div id="section-pricing" class="tab-section">
            <div class="users">
                <div class="card">
                    <div class="card-header">
                        <h3>订阅方案</h3>
                        <button class="btn btn-outline btn-sm" onclick="addPlanRow()">+ 新增方案</button>
                    </div>
                    <div class="card-body" style="padding:0">
                        <table class="pricing-table" id="pricingTable">
                            <thead><tr>
                                <th class="col-id">ID</th>
                                <th>名称</th>
                                <th class="col-number">价格</th>
                                <th class="col-number">原价</th>
                                <th class="col-number">时长(月)</th>
                                <th class="col-badge">角标</th>
                                <th class="col-number">排序</th>
                                <th class="col-enabled">启用</th>
                                <th class="col-action">操作</th>
                            </tr></thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>

                <div class="card" style="margin-top:20px">
                    <div class="card-header"><h3>全局配置</h3></div>
                    <div class="card-body">
                        <div class="form-grid">
                            <div class="form-field">
                                <label>联系邮箱</label>
                                <input type="email" id="cfgEmail" placeholder="support@example.com">
                            </div>
                            <div class="form-field">
                                <label>微信号</label>
                                <input type="text" id="cfgWechat" placeholder="mona_support">
                            </div>
                            <div class="form-field" style="grid-column:1/-1">
                                <label>促销横幅（留空不显示）</label>
                                <input type="text" id="cfgBanner" placeholder="限时优惠：年度订阅立减 60 元">
                            </div>
                        </div>
                    </div>
                </div>

                <div style="margin-top:20px;display:flex;justify-content:flex-end">
                    <button class="btn btn-primary" onclick="savePricing()">保存配置</button>
                </div>
            </div>
        </div>

        <div id="section-promo" class="tab-section">
            <div class="users">
                <div class="card">
                    <div class="card-header"><h3>注册赠试用活动</h3></div>
                    <div class="card-body">
                        <p style="color:#6b7280;font-size:13px;margin-bottom:16px">活动开启后，新注册用户（设备首次注册）将获得活动设定的试用天数。活动时间外或未开启时，使用默认 31 天试用。</p>
                        <div class="form-grid">
                            <div class="form-field">
                                <label>启用活动</label>
                                <select id="promoEnabled">
                                    <option value="false">关闭</option>
                                    <option value="true">开启</option>
                                </select>
                            </div>
                            <div class="form-field">
                                <label>试用天数</label>
                                <input type="number" id="promoDays" min="1" max="365" placeholder="183">
                            </div>
                            <div class="form-field">
                                <label>活动开始时间（可选）</label>
                                <input type="datetime-local" id="promoStart">
                            </div>
                            <div class="form-field">
                                <label>活动结束时间（可选）</label>
                                <input type="datetime-local" id="promoEnd">
                            </div>
                        </div>
                    </div>
                </div>
                <div style="margin-top:20px;display:flex;justify-content:flex-end">
                    <button class="btn btn-primary" onclick="savePromoTrial()">保存活动配置</button>
                </div>
            </div>
        </div>

        <div id="section-notifications" class="tab-section">
            <div class="users">
                <div class="users-header"><h2>通知管理</h2><button onclick="openNotifModal()">+ 新建通知</button></div>
                <table id="notifTable"><thead><tr><th>ID</th><th>标题</th><th>类型</th><th>状态</th><th>过期时间</th><th>已读</th><th>操作</th></tr></thead><tbody></tbody></table>
            </div>
        </div>
    </div>

    <div id="trialModal" class="modal-overlay">
        <div class="modal">
            <h3>修改试用</h3>
            <label>试用到期时间</label>
            <input type="datetime-local" id="trialExpires">
            <div class="modal-btns">
                <button onclick="closeTrialModal()">取消</button>
                <button class="primary" onclick="saveTrial()">保存</button>
            </div>
        </div>
    </div>

    <div id="subModal" class="modal-overlay">
        <div class="modal">
            <h3>修改订阅</h3>
            <label>状态</label>
            <select id="subStatus"><option value="active">有效</option><option value="expired">过期</option></select>
            <label>到期时间（可选）</label>
            <input type="datetime-local" id="subEnd">
            <div class="modal-btns">
                <button onclick="closeSubModal()">取消</button>
                <button class="primary" onclick="saveSub()">保存</button>
            </div>
        </div>
    </div>

    <div id="deleteModal" class="modal-overlay">
        <div class="modal">
            <h3>确认删除</h3>
            <div class="confirm-text">确定要删除用户 <strong id="deleteEmail"></strong> 吗？此操作不可撤销。</div>
            <div class="modal-btns">
                <button onclick="closeDeleteModal()">取消</button>
                <button class="danger" onclick="confirmDelete()">删除</button>
            </div>
        </div>
    </div>

    <div id="accountModal" class="modal-overlay">
        <div class="modal">
            <h3>修改账号</h3>
            <label>账号（支持中文、字母、数字、下划线，2-32字符）</label>
            <input type="text" id="accountInput" maxlength="32">
            <div class="modal-btns">
                <button onclick="closeAccountModal()">取消</button>
                <button class="primary" onclick="saveAccount()">保存</button>
            </div>
        </div>
    </div>

    <div id="notifModal" class="modal-overlay">
        <div class="modal" style="width:500px">
            <h3>新建通知</h3>
            <label>标题</label><input type="text" id="notifTitle">
            <label>正文</label><textarea id="notifBody" rows="3"></textarea>
            <label>类型</label>
            <select id="notifType"><option value="promotion">促销</option><option value="system">系统</option><option value="subscription">订阅</option></select>
            <label>跳转地址（subscribe 或其他 URL）</label><input type="text" id="notifAction">
            <label>过期时间</label><input type="datetime-local" id="notifExpires">
            <div class="modal-btns">
                <button onclick="closeNotifModal()">取消</button>
                <button class="primary" onclick="saveNotif()">保存并发布</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const API = '';
        let token = localStorage.getItem('admin_token') || '';
        let currentPage = 1;
        let editingUserId = null;
        let deletingUserId = null;
        let searchKeyword = '';

        function headers() {
            return { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
        }

        async function doLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errEl = document.getElementById('loginError');
            try {
                const res = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.access_token) {
                    token = data.access_token;
                    const me = await fetch(`${API}/admin/stats`, { headers: headers() });
                    if (me.status === 403) {
                        token = '';
                        errEl.textContent = '非管理员账号';
                        errEl.style.display = 'block';
                        return;
                    }
                    localStorage.setItem('admin_token', token);
                    showApp();
                } else {
                    errEl.textContent = data.detail || data.error || '登录失败';
                    errEl.style.display = 'block';
                }
            } catch (e) {
                errEl.textContent = '网络错误';
                errEl.style.display = 'block';
            }
        }

        function doLogout() {
            token = '';
            localStorage.removeItem('admin_token');
            document.getElementById('app').style.display = 'none';
            document.getElementById('login').style.display = 'flex';
        }

        function showApp() {
            document.getElementById('login').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            loadStats();
            loadUsers();
        }

        async function loadStats() {
            try {
                const res = await fetch(`${API}/admin/stats`, { headers: headers() });
                const data = await res.json();
                document.getElementById('stats').innerHTML = `
                    <div class="stat-card"><div class="label">总用户数</div><div class="value">${data.total_users}</div></div>
                    <div class="stat-card"><div class="label">有效订阅</div><div class="value">${data.active_subscriptions}</div></div>
                    <div class="stat-card"><div class="label">试用中</div><div class="value">${data.active_trials}</div></div>
                    <div class="stat-card"><div class="label">试用过期</div><div class="value">${data.expired_trials}</div></div>
                `;
            } catch {}
        }

        function doSearch() {
            searchKeyword = document.getElementById('searchInput').value.trim();
            loadUsers(1);
        }

        async function loadUsers(page = 1) {
            currentPage = page;
            try {
                let url = `${API}/admin/users?page=${page}&page_size=20`;
                if (searchKeyword) url += `&search=${encodeURIComponent(searchKeyword)}`;
                const res = await fetch(url, { headers: headers() });
                const data = await res.json();
                const tbody = document.getElementById('userTable');
                if (data.users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#999;padding:32px">暂无数据</td></tr>';
                } else {
                    tbody.innerHTML = data.users.map(u => {
                        const roleBadge = u.is_admin
                            ? '<span class="badge badge-admin">管理员</span>'
                            : '<span class="badge" style="background:#f3f4f6;color:#555">用户</span>';
                        const accountCell = u.account
                            ? `<span style="cursor:pointer;color:#4f46e5" onclick="openAccountModal(${u.id},'${(u.account||'').replace(/'/g,"\\'")}')">${u.account}</span>`
                            : '<span style="color:#9ca3af" onclick="openAccountModal(' + u.id + ',\'\')">-</span>';
                        const trialBadge = u.trial_expires_at
                            ? (new Date(u.trial_expires_at) > new Date()
                                ? `<span class="badge badge-trial">试用中 - ${u.trial_expires_at.slice(0,10)}</span>`
                                : `<span class="badge badge-expired">已过期 - ${u.trial_expires_at.slice(0,10)}</span>`)
                            : '<span class="badge" style="background:#f3f4f6;color:#999">无</span>';
                        const subStatusBadge = u.subscription_status === 'active'
                            ? '<span class="badge badge-active">有效</span>'
                            : (u.subscription_status ? '<span class="badge badge-expired">过期</span>' : '<span class="badge" style="background:#f3f4f6;color:#999">无</span>');
                        const subEndBadge = u.subscription_end
                            ? (new Date(u.subscription_end) > new Date()
                                ? `<span class="badge badge-active">${u.subscription_end.slice(0,10)}</span>`
                                : `<span class="badge badge-expired">${u.subscription_end.slice(0,10)}</span>`)
                            : '<span class="badge" style="background:#f3f4f6;color:#999">-</span>';
                        const deleteBtn = u.is_admin ? '' : `<button class="btn-danger" onclick="openDeleteModal(${u.id},'${u.email}')">删除</button>`;
                        return `<tr>
                            <td>${u.id}</td><td>${accountCell}</td><td>${u.email}</td><td>${roleBadge}</td><td>${trialBadge}</td><td>${subStatusBadge}</td><td>${subEndBadge}</td>
                            <td>${u.created_at.slice(0,10)}</td>
                            <td class="actions">
                                <button onclick="openAccountModal(${u.id},'${(u.account||'').replace(/'/g,"\\'")}')">账号</button>
                                <button onclick="openTrialModal(${u.id},'${u.trial_expires_at||''}')">试用</button>
                                <button onclick="openSubModal(${u.id},'${u.subscription_status||'expired'}','${u.subscription_end||''}')">订阅</button>
                                ${deleteBtn}
                            </td>
                        </tr>`;
                    }).join('');
                }

                const totalPages = Math.ceil(data.total / 20);
                const pag = document.getElementById('pagination');
                let pagHtml = `<button ${page<=1?'disabled':''} onclick="loadUsers(${page-1})">上一页</button>`;
                for (let i = 1; i <= totalPages && i <= 10; i++) {
                    pagHtml += `<button class="${i===page?'active':''}" onclick="loadUsers(${i})">${i}</button>`;
                }
                pagHtml += `<button ${page>=totalPages?'disabled':''} onclick="loadUsers(${page+1})">下一页</button>`;
                pag.innerHTML = pagHtml;
            } catch {}
        }

        function openTrialModal(userId, expiresAt) {
            editingUserId = userId;
            const input = document.getElementById('trialExpires');
            if (expiresAt) input.value = expiresAt.slice(0,16);
            else input.value = '';
            document.getElementById('trialModal').style.display = 'flex';
        }
        function closeTrialModal() { document.getElementById('trialModal').style.display = 'none'; }

        async function saveTrial() {
            const val = document.getElementById('trialExpires').value;
            if (!val) return;
            await fetch(`${API}/admin/users/${editingUserId}/trial`, {
                method: 'PUT',
                headers: headers(),
                body: JSON.stringify({ trial_expires_at: new Date(val).toISOString() })
            });
            closeTrialModal();
            loadUsers(currentPage);
            loadStats();
        }

        function openSubModal(userId, status, end) {
            editingUserId = userId;
            document.getElementById('subStatus').value = status || 'expired';
            const input = document.getElementById('subEnd');
            if (end) input.value = end.slice(0,16);
            else input.value = '';
            document.getElementById('subModal').style.display = 'flex';
        }
        function closeSubModal() { document.getElementById('subModal').style.display = 'none'; }

        async function saveSub() {
            const status = document.getElementById('subStatus').value;
            const end = document.getElementById('subEnd').value;
            const params = new URLSearchParams({ status });
            if (end) params.set('period_end', new Date(end).toISOString());
            await fetch(`${API}/admin/users/${editingUserId}/subscription?${params}`, {
                method: 'PUT',
                headers: headers()
            });
            closeSubModal();
            loadUsers(currentPage);
            loadStats();
        }

        function openDeleteModal(userId, email) {
            deletingUserId = userId;
            document.getElementById('deleteEmail').textContent = email;
            document.getElementById('deleteModal').style.display = 'flex';
        }
        function closeDeleteModal() { document.getElementById('deleteModal').style.display = 'none'; }

        async function confirmDelete() {
            await fetch(`${API}/admin/users/${deletingUserId}`, {
                method: 'DELETE',
                headers: headers()
            });
            closeDeleteModal();
            loadUsers(currentPage);
            loadStats();
        }

        let editingAccountId = null;
        function openAccountModal(userId, account) {
            editingAccountId = userId;
            document.getElementById('accountInput').value = account || '';
            document.getElementById('accountModal').style.display = 'flex';
        }
        function closeAccountModal() { document.getElementById('accountModal').style.display = 'none'; }

        async function saveAccount() {
            const account = document.getElementById('accountInput').value.trim();
            if (account.length < 2) { showToast('账号至少 2 个字符'); return; }
            try {
                const res = await fetch(`${API}/admin/users/${editingAccountId}/account`, {
                    method: 'PUT',
                    headers: { ...headers(), 'Content-Type': 'application/json' },
                    body: JSON.stringify({ account })
                });
                const data = await res.json();
                if (!res.ok) { showToast(data.detail || data.error || '保存失败'); return; }
                closeAccountModal();
                loadUsers(currentPage);
                showToast('账号已更新');
            } catch (e) { showToast('保存失败'); }
        }

        let currentTab = 'users';

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('section-' + tab).classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
            if (tab === 'pricing') loadPricing();
            if (tab === 'promo') loadPromoTrial();
            if (tab === 'notifications') loadNotifications();
        }

        function showToast(msg, error = false) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast' + (error ? ' error' : '');
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2500);
        }

        async function loadPricing() {
            try {
                const res = await fetch(`${API}/admin/pricing`, { headers: headers() });
                if (!res.ok) throw new Error('加载失败');
                const data = await res.json();
                document.getElementById('cfgEmail').value = data.contact.email || '';
                document.getElementById('cfgWechat').value = data.contact.wechat || '';
                document.getElementById('cfgBanner').value = data.promotional_banner || '';
                const tbody = document.querySelector('#pricingTable tbody');
                if (!data.plans || data.plans.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9" class="empty-tip">暂无方案，点击右上角新增</td></tr>';
                    return;
                }
                tbody.innerHTML = data.plans.map(p => `<tr data-id="${p.id}">
                    <td><input value="${p.id}" placeholder="monthly"></td>
                    <td><input value="${p.name || ''}" placeholder="月度订阅"></td>
                    <td><input type="number" step="0.01" value="${p.price ?? ''}" placeholder="29"></td>
                    <td><input type="number" step="0.01" value="${p.original_price ?? ''}" placeholder="39"></td>
                    <td><input type="number" value="${p.duration_months ?? ''}" placeholder="1"></td>
                    <td><input value="${p.badge || ''}" placeholder="推荐"></td>
                    <td><input type="number" value="${p.sort_order ?? 0}"></td>
                    <td style="text-align:center"><input type="checkbox" ${p.enabled ? 'checked' : ''}></td>
                    <td><button class="btn btn-danger btn-sm" onclick="deletePlan('${p.id}')">删除</button></td>
                </tr>`).join('');
            } catch (e) {
                showToast('价格配置加载失败', true);
            }
        }

        function addPlanRow() {
            const tbody = document.querySelector('#pricingTable tbody');
            const emptyTip = tbody.querySelector('.empty-tip');
            if (emptyTip) emptyTip.closest('tr').remove();
            const id = 'plan_' + Date.now();
            const tr = document.createElement('tr');
            tr.dataset.id = id;
            tr.dataset.new = 'true';
            tr.innerHTML = `<td><input value="${id}" placeholder="plan_id"></td>
                <td><input placeholder="方案名称"></td>
                <td><input type="number" step="0.01" placeholder="29"></td>
                <td><input type="number" step="0.01" placeholder="39"></td>
                <td><input type="number" placeholder="1"></td>
                <td><input placeholder="推荐"></td>
                <td><input type="number" value="0"></td>
                <td style="text-align:center"><input type="checkbox" checked></td>
                <td><button class="btn btn-danger btn-sm" onclick="this.closest('tr').remove()">删除</button></td>`;
            tbody.appendChild(tr);
        }

        async function savePricing() {
            const rows = document.querySelectorAll('#pricingTable tbody tr');
            const plans = [];
            for (const row of rows) {
                const inputs = row.querySelectorAll('input');
                const id = inputs[0].value.trim();
                const name = inputs[1].value.trim();
                const price = parseFloat(inputs[2].value);
                const duration = parseInt(inputs[4].value);
                if (!id || !name || Number.isNaN(price) || Number.isNaN(duration)) {
                    showToast('请填写完整的方案信息（ID、名称、价格、时长）', true);
                    return;
                }
                plans.push({
                    id,
                    name,
                    price,
                    original_price: inputs[3].value ? parseFloat(inputs[3].value) : null,
                    duration_months: duration,
                    badge: inputs[5].value.trim() || null,
                    sort_order: parseInt(inputs[6].value) || 0,
                    enabled: inputs[7].checked,
                });
            }
            try {
                const res = await fetch(`${API}/admin/pricing`, {
                    method: 'PUT',
                    headers: headers(),
                    body: JSON.stringify({
                        plans,
                        contact: {
                            email: document.getElementById('cfgEmail').value.trim(),
                            wechat: document.getElementById('cfgWechat').value.trim(),
                        },
                        promotional_banner: document.getElementById('cfgBanner').value.trim() || null,
                    }),
                });
                if (!res.ok) throw new Error('保存失败');
                showToast('保存成功');
                loadPricing();
            } catch (e) {
                showToast('保存失败', true);
            }
        }

        async function deletePlan(id) {
            if (!confirm('确定删除该方案？')) return;
            try {
                const res = await fetch(`${API}/admin/pricing/${id}`, { method: 'DELETE', headers: headers() });
                if (!res.ok) throw new Error('删除失败');
                showToast('已删除');
                loadPricing();
            } catch (e) {
                showToast('删除失败', true);
            }
        }

        async function loadPromoTrial() {
            try {
                const res = await fetch(`${API}/admin/promo-trial`, { headers: headers() });
                if (!res.ok) throw new Error('加载失败');
                const data = await res.json();
                document.getElementById('promoEnabled').value = data.enabled ? 'true' : 'false';
                document.getElementById('promoDays').value = data.days || '';
                document.getElementById('promoStart').value = data.start_at ? data.start_at.slice(0, 16) : '';
                document.getElementById('promoEnd').value = data.end_at ? data.end_at.slice(0, 16) : '';
            } catch (e) {
                showToast('活动配置加载失败', true);
            }
        }

        async function savePromoTrial() {
            const payload = {
                enabled: document.getElementById('promoEnabled').value === 'true',
                days: parseInt(document.getElementById('promoDays').value) || 0,
                start_at: document.getElementById('promoStart').value || null,
                end_at: document.getElementById('promoEnd').value || null,
            };
            try {
                const res = await fetch(`${API}/admin/promo-trial`, {
                    method: 'PUT',
                    headers: headers(),
                    body: JSON.stringify(payload),
                });
                if (!res.ok) throw new Error('保存失败');
                showToast('活动配置已保存');
            } catch (e) {
                showToast('保存失败', true);
            }
        }

        async function loadNotifications() {
            const res = await fetch(`${API}/admin/notifications`, { headers: headers() });
            const data = await res.json();
            const tbody = document.querySelector('#notifTable tbody');
            tbody.innerHTML = data.notifications.map(n => `<tr>
                <td>${n.id}</td><td>${n.title}</td><td>${n.type}</td>
                <td>${n.published ? '已发布' : '未发布'}</td>
                <td>${n.expires_at ? n.expires_at.slice(0,16) : '-'}</td>
                <td>${n.read_count}</td>
                <td class="actions">
                    <button onclick="toggleNotif(${n.id}, ${!n.published})">${n.published ? '取消发布' : '发布'}</button>
                    <button class="btn-danger" onclick="deleteNotif(${n.id})">删除</button>
                </td>
            </tr>`).join('');
        }

        function openNotifModal() { document.getElementById('notifModal').style.display = 'flex'; }
        function closeNotifModal() { document.getElementById('notifModal').style.display = 'none'; }

        async function saveNotif() {
            const body = {
                title: document.getElementById('notifTitle').value,
                body: document.getElementById('notifBody').value,
                type: document.getElementById('notifType').value,
                action_url: document.getElementById('notifAction').value || null,
                expires_at: document.getElementById('notifExpires').value ? new Date(document.getElementById('notifExpires').value).toISOString() : null,
            };
            await fetch(`${API}/admin/notifications`, { method: 'POST', headers: headers(), body: JSON.stringify(body) });
            closeNotifModal();
            loadNotifications();
        }

        async function toggleNotif(id, publish) {
            await fetch(`${API}/admin/notifications/${id}/${publish ? 'publish' : 'unpublish'}`, { method: 'POST', headers: headers() });
            loadNotifications();
        }

        async function deleteNotif(id) {
            if (!confirm('确定删除？')) return;
            await fetch(`${API}/admin/notifications/${id}`, { method: 'DELETE', headers: headers() });
            loadNotifications();
        }

        // Auto-login if token exists
        if (token) {
            fetch(`${API}/admin/stats`, { headers: headers() }).then(r => {
                if (r.ok) showApp();
                else doLogout();
            }).catch(() => doLogout());
        }
    </script>
</body>
</html>
