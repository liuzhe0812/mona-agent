[package]
name = "mona-desktop"
version = "1.0.2"
description = "Mona Desktop Client"
authors = ["Mona Team"]
edition = "2021"

[lib]
name = "mona_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "tray-icon", "devtools", "unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "tls-rustls"] }
hex = "0.4"
urlencoding = "2"
url = "2"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
log = "0.4"
tauri-plugin-log = "2"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
russh = { version = "0.61", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "2.3"
portable-pty = "0.9"
encoding_rs = "0.8"
ring = "0.17"
sha2 = "0.10"
data-encoding = "2"
dashmap = "6"
file_icon_provider = "1"
png = "0.17"
base64 = "0.22"
flate2 = "1"
tar = "0.4"
jsonwebtoken = "9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
] }

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"
