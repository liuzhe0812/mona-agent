<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mona License</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center">
<div id="app" class="w-full max-w-md mx-auto px-4">
  <div class="bg-gray-800 rounded-2xl shadow-2xl p-8">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-white">🐈 Mona</h1>
      <p class="text-gray-400 mt-2 text-sm">License 授权服务</p>
    </div>

    <div class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1.5">机器码</label>
        <input v-model="machineId" type="text" placeholder="在 Mona 设置 → 关于 中复制机器码"
          class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-white placeholder-gray-500 font-mono text-sm focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1.5">授权时长</label>
        <div class="grid grid-cols-2 gap-3">
          <button @click="duration='monthly'" :class="duration==='monthly' ? 'border-blue-500 bg-blue-500/10' : 'border-gray-600 bg-gray-700'" class="border rounded-lg p-3 text-center transition-colors">
            <p class="font-medium text-white">月付</p>
            <p class="text-sm text-gray-400">31 天</p>
          </button>
          <button @click="duration='yearly'" :class="duration==='yearly' ? 'border-blue-500 bg-blue-500/10' : 'border-gray-600 bg-gray-700'" class="border rounded-lg p-3 text-center transition-colors">
            <p class="font-medium text-white">年付</p>
            <p class="text-sm text-gray-400">366 天</p>
          </button>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1.5">管理密码</label>
        <input v-model="password" type="password" placeholder="输入管理密码"
          class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none" />
      </div>

      <button @click="download" :disabled="!machineId || !password || loading"
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-600 disabled:cursor-not-allowed text-white font-medium py-3 rounded-lg transition-colors">
        {{ loading ? '生成中...' : '下载 License 文件' }}
      </button>
    </div>

    <div v-if="error" class="mt-4 bg-red-900/50 text-red-300 text-sm rounded-lg p-3">{{ error }}</div>
    <div v-if="success" class="mt-4 bg-green-900/50 text-green-300 text-sm rounded-lg p-3">{{ success }}</div>

    <div class="mt-6 pt-5 border-t border-gray-700">
      <p class="text-xs text-gray-500 text-center">使用方法：复制机器码 → 输入密码 → 下载 .jwt 文件 → 在 Mona 设置 → 关于 → 导入 License</p>
    </div>
  </div>
</div>

<script>
const { createApp, ref } = Vue;
createApp({
  setup() {
    const machineId = ref('');
    const password = ref('');
    const duration = ref('yearly');
    const loading = ref(false);
    const error = ref('');
    const success = ref('');

    async function download() {
      error.value = '';
      success.value = '';
      loading.value = true;
      try {
        const apiBase = window.location.pathname.replace(/\/$/, '');
        const resp = await fetch(apiBase + '/api/issue', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            machine_id: machineId.value.trim(),
            password: password.value,
            duration: duration.value
          })
        });
        if (!resp.ok) {
          const data = await resp.json();
          error.value = data.detail || '请求失败';
          return;
        }
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'mona-license.jwt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        success.value = 'License 文件已下载！请在 Mona 中导入';
      } catch (e) {
        error.value = '网络错误：' + e.message;
      } finally {
        loading.value = false;
      }
    }

    return { machineId, password, duration, loading, error, success, download };
  }
}).mount('#app');
</script>
</body>
</html>
