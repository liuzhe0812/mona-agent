# ESP-SR 组件配置
# 乐鑫官方语音识别库，提供离线唤醒词检测功能
# 文档: https://github.com/espressif/esp-sr
#
# 依赖通过 ESP Component Manager 自动下载:
#   idf.py reconfigure
#
# 唤醒词模型配置在 sdkconfig.defaults 中:
#   CONFIG_USE_WAKENET=y
#   CONFIG_SR_WN_WN9_HILEGIN=y  (唤醒词: "Hi Mona")
#
# 使用方式 (main.c 中):
#   #include "esp_sr.h"
#   model_iface_data_t *model = esp_sr_init(...);
#   while (1) {
#       int r = esp_sr_detect(model, audio_data, len);
#       if (r > 0) { /* 唤醒词检测到 */ }
#   }

dependencies:
  espressif/esp_sr:
    version: "~2.0"
