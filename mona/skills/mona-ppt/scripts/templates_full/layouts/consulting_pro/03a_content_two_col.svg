<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- Action Title 区 -->
  <text x="64" y="60" fill="#005587" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" letter-spacing="2">{{KICKER}}</text>
  <rect x="64" y="68" width="28" height="3" fill="#005587"/>
  <text x="64" y="106" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" font-weight="bold">{{PAGE_TITLE}}</text>
  <text x="1216" y="60" text-anchor="end" fill="#5B6770" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold">Exhibit {{EXHIBIT_NUM}}</text>
  <line x1="64" y1="126" x2="1216" y2="126" stroke="#C8CDD2" stroke-width="1"/>

  <!-- 栏间竖向发丝线 -->
  <line x1="640" y1="170" x2="640" y2="600" stroke="#C8CDD2" stroke-width="1"/>

  <!-- 左栏标题与要点 -->
  <text x="64" y="196" fill="#005587" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="bold">{{COL_LEFT_TITLE}}</text>
  <rect x="64" y="253" width="6" height="6" fill="#005587"/>
  <text x="82" y="260" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14">{{LEFT_POINT_1}}</text>
  <rect x="64" y="329" width="6" height="6" fill="#005587"/>
  <text x="82" y="336" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14">{{LEFT_POINT_2}}</text>
  <rect x="64" y="405" width="6" height="6" fill="#005587"/>
  <text x="82" y="412" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14">{{LEFT_POINT_3}}</text>
  <rect x="64" y="481" width="6" height="6" fill="#005587"/>
  <text x="82" y="488" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14">{{LEFT_POINT_4}}</text>

  <!-- 右栏标题与要点 -->
  <text x="680" y="196" fill="#005587" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="bold">{{COL_RIGHT_TITLE}}</text>
  <rect x="680" y="253" width="6" height="6" fill="#005587"/>
  <text x="698" y="260" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14">{{RIGHT_POINT_1}}</text>
  <rect x="680" y="329" width="6" height="6" fill="#005587"/>
  <text x="698" y="336" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14">{{RIGHT_POINT_2}}</text>
  <rect x="680" y="405" width="6" height="6" fill="#005587"/>
  <text x="698" y="412" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14">{{RIGHT_POINT_3}}</text>
  <rect x="680" y="481" width="6" height="6" fill="#005587"/>
  <text x="698" y="488" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14">{{RIGHT_POINT_4}}</text>

  <!-- 页脚三件套 -->
  <line x1="64" y1="664" x2="1216" y2="664" stroke="#C8CDD2" stroke-width="0.75"/>
  <text x="64" y="686" fill="#5B6770" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11"><tspan>{{FOOTNOTE}}</tspan><tspan dx="16">来源：{{SOURCE}}</tspan></text>
  <text x="1216" y="686" text-anchor="end" fill="#5B6770" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11">{{PAGE_NUM}}</text>
</svg>
