<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- Action Title 区 -->
  <text x="64" y="60" fill="#005587" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" letter-spacing="2">{{KICKER}}</text>
  <rect x="64" y="68" width="28" height="3" fill="#005587"/>
  <text x="64" y="106" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" font-weight="bold">{{PAGE_TITLE}}</text>
  <text x="1216" y="60" text-anchor="end" fill="#5B6770" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold">Exhibit {{EXHIBIT_NUM}}</text>
  <line x1="64" y1="126" x2="1216" y2="126" stroke="#C8CDD2" stroke-width="1"/>

  <!-- 中栏推荐标记（琥珀小标签） -->
  <rect x="600" y="152" width="80" height="20" fill="#F2A900"/>
  <text x="640" y="166" text-anchor="middle" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="10" font-weight="bold">{{OPTION_2_TAG}}</text>

  <!-- 三栏深蓝表头条（高 44px） -->
  <rect x="64" y="184" width="352" height="44" fill="#005587"/>
  <rect x="464" y="184" width="352" height="44" fill="#005587"/>
  <rect x="864" y="184" width="352" height="44" fill="#005587"/>
  <text x="240" y="212" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="bold">{{OPTION_1_NAME}}</text>
  <text x="640" y="212" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="bold">{{OPTION_2_NAME}}</text>
  <text x="1040" y="212" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="bold">{{OPTION_3_NAME}}</text>

  <!-- 栏间竖向发丝线 -->
  <line x1="440" y1="184" x2="440" y2="528" stroke="#C8CDD2" stroke-width="1"/>
  <line x1="840" y1="184" x2="840" y2="528" stroke="#C8CDD2" stroke-width="1"/>

  <!-- 特性行间发丝线 -->
  <line x1="64" y1="240" x2="1216" y2="240" stroke="#C8CDD2" stroke-width="1"/>
  <line x1="64" y1="312" x2="1216" y2="312" stroke="#C8CDD2" stroke-width="1"/>
  <line x1="64" y1="384" x2="1216" y2="384" stroke="#C8CDD2" stroke-width="1"/>
  <line x1="64" y1="456" x2="1216" y2="456" stroke="#C8CDD2" stroke-width="1"/>
  <line x1="64" y1="528" x2="1216" y2="528" stroke="#C8CDD2" stroke-width="1"/>

  <!-- 栏 1 特性 -->
  <text x="240" y="280" text-anchor="middle" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{OPTION_1_FEAT_1}}</text>
  <text x="240" y="352" text-anchor="middle" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{OPTION_1_FEAT_2}}</text>
  <text x="240" y="424" text-anchor="middle" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{OPTION_1_FEAT_3}}</text>
  <text x="240" y="496" text-anchor="middle" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{OPTION_1_FEAT_4}}</text>

  <!-- 栏 2 特性 -->
  <text x="640" y="280" text-anchor="middle" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{OPTION_2_FEAT_1}}</text>
  <text x="640" y="352" text-anchor="middle" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{OPTION_2_FEAT_2}}</text>
  <text x="640" y="424" text-anchor="middle" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{OPTION_2_FEAT_3}}</text>
  <text x="640" y="496" text-anchor="middle" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{OPTION_2_FEAT_4}}</text>

  <!-- 栏 3 特性 -->
  <text x="1040" y="280" text-anchor="middle" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{OPTION_3_FEAT_1}}</text>
  <text x="1040" y="352" text-anchor="middle" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{OPTION_3_FEAT_2}}</text>
  <text x="1040" y="424" text-anchor="middle" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{OPTION_3_FEAT_3}}</text>
  <text x="1040" y="496" text-anchor="middle" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{OPTION_3_FEAT_4}}</text>

  <!-- 页脚三件套 -->
  <line x1="64" y1="664" x2="1216" y2="664" stroke="#C8CDD2" stroke-width="0.75"/>
  <text x="64" y="686" fill="#5B6770" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11"><tspan>{{FOOTNOTE}}</tspan><tspan dx="16">来源：{{SOURCE}}</tspan></text>
  <text x="1216" y="686" text-anchor="end" fill="#5B6770" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11">{{PAGE_NUM}}</text>
</svg>
