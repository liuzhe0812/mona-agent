<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- Action Title 区 -->
  <text x="64" y="60" fill="#005587" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" letter-spacing="2">{{KICKER}}</text>
  <rect x="64" y="68" width="28" height="3" fill="#005587"/>
  <text x="64" y="106" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" font-weight="bold">{{PAGE_TITLE}}</text>
  <text x="1216" y="60" text-anchor="end" fill="#5B6770" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold">Exhibit {{EXHIBIT_NUM}}</text>
  <line x1="64" y1="126" x2="1216" y2="126" stroke="#C8CDD2" stroke-width="1"/>

  <!-- KPI 区间竖向发丝线 -->
  <line x1="352" y1="200" x2="352" y2="540" stroke="#C8CDD2" stroke-width="1"/>
  <line x1="640" y1="200" x2="640" y2="540" stroke="#C8CDD2" stroke-width="1"/>
  <line x1="928" y1="200" x2="928" y2="540" stroke="#C8CDD2" stroke-width="1"/>

  <!-- 指标 1（当前最重要：琥珀 2px 下划线） -->
  <text x="208" y="322" text-anchor="middle" fill="#005587" font-family="Arial, Microsoft YaHei, sans-serif" font-size="46" font-weight="bold">{{METRIC_1_VALUE}}</text>
  <rect x="180" y="340" width="56" height="2" fill="#F2A900"/>
  <text x="208" y="374" text-anchor="middle" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14">{{METRIC_1_LABEL}}</text>
  <text x="208" y="398" text-anchor="middle" fill="#5B6770" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12">{{METRIC_1_DESC}}</text>

  <!-- 指标 2 -->
  <text x="496" y="322" text-anchor="middle" fill="#005587" font-family="Arial, Microsoft YaHei, sans-serif" font-size="46" font-weight="bold">{{METRIC_2_VALUE}}</text>
  <text x="496" y="374" text-anchor="middle" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14">{{METRIC_2_LABEL}}</text>
  <text x="496" y="398" text-anchor="middle" fill="#5B6770" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12">{{METRIC_2_DESC}}</text>

  <!-- 指标 3 -->
  <text x="784" y="322" text-anchor="middle" fill="#005587" font-family="Arial, Microsoft YaHei, sans-serif" font-size="46" font-weight="bold">{{METRIC_3_VALUE}}</text>
  <text x="784" y="374" text-anchor="middle" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14">{{METRIC_3_LABEL}}</text>
  <text x="784" y="398" text-anchor="middle" fill="#5B6770" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12">{{METRIC_3_DESC}}</text>

  <!-- 指标 4 -->
  <text x="1072" y="322" text-anchor="middle" fill="#005587" font-family="Arial, Microsoft YaHei, sans-serif" font-size="46" font-weight="bold">{{METRIC_4_VALUE}}</text>
  <text x="1072" y="374" text-anchor="middle" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14">{{METRIC_4_LABEL}}</text>
  <text x="1072" y="398" text-anchor="middle" fill="#5B6770" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12">{{METRIC_4_DESC}}</text>

  <!-- 页脚三件套（含来源行） -->
  <line x1="64" y1="664" x2="1216" y2="664" stroke="#C8CDD2" stroke-width="0.75"/>
  <text x="64" y="686" fill="#5B6770" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11"><tspan>{{FOOTNOTE}}</tspan><tspan dx="16">来源：{{SOURCE}}</tspan></text>
  <text x="1216" y="686" text-anchor="end" fill="#5B6770" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11">{{PAGE_NUM}}</text>
</svg>
