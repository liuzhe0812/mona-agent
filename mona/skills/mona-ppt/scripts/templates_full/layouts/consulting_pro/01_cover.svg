<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- 顶部 4px 深蓝通栏条 -->
  <rect x="0" y="0" width="1280" height="4" fill="#005587"/>

  <!-- 左上 kicker + 28px 短粗线 -->
  <text x="64" y="118" fill="#005587" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" letter-spacing="3">{{KICKER}}</text>
  <rect x="64" y="128" width="28" height="3" fill="#005587"/>

  <!-- 主标题（48px bold 深蓝，支持两行） -->
  <text x="64" y="216" fill="#005587" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="48" font-weight="bold">
    <tspan x="64">{{TITLE}}</tspan>
  </text>

  <!-- 副标题 -->
  <text x="64" y="318" fill="#5B6770" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18">{{SUBTITLE}}</text>

  <!-- 标题区下方 3px 深蓝短线（80px 宽） -->
  <rect x="64" y="344" width="80" height="3" fill="#005587"/>

  <!-- 左列汇报人信息：标签弱化色 + 值正文色 -->
  <text x="64" y="460" fill="#5B6770" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11">汇报人</text>
  <text x="64" y="482" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{PRESENTER}}</text>
  <text x="64" y="526" fill="#5B6770" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11">机构</text>
  <text x="64" y="548" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{ORGANIZATION}}</text>
  <text x="64" y="592" fill="#5B6770" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11">日期</text>
  <text x="64" y="614" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{DATE}}</text>

  <!-- 右侧极浅放大纲网格装饰（克制） -->
  <rect x="880" y="442" width="90" height="90" fill="#F4F6F8"/>
  <rect x="982" y="442" width="90" height="90" fill="#F4F6F8"/>
  <rect x="1084" y="442" width="90" height="90" fill="#F4F6F8"/>
  <rect x="880" y="544" width="90" height="90" fill="#F4F6F8"/>
  <rect x="982" y="544" width="90" height="90" fill="#F4F6F8"/>
  <rect x="1084" y="544" width="90" height="90" fill="#F4F6F8"/>

  <!-- 底部 1px 发丝线 + 页脚组织名 -->
  <line x1="64" y1="664" x2="1216" y2="664" stroke="#C8CDD2" stroke-width="1"/>
  <text x="64" y="686" fill="#5B6770" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11">{{ORGANIZATION}}</text>
</svg>
