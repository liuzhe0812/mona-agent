<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- 左侧深蓝竖条（220px 通高） -->
  <rect x="0" y="0" width="220" height="720" fill="#005587"/>

  <!-- 竖条内白色 kicker 与大号章节号 -->
  <text x="48" y="300" fill="#FFFFFF" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" letter-spacing="4">CHAPTER</text>
  <text x="44" y="404" fill="#FFFFFF" font-family="Arial, Microsoft YaHei, sans-serif" font-size="96" font-weight="bold">{{CHAPTER_NUM}}</text>

  <!-- 右侧章节标题区 -->
  <text x="288" y="352" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="36" font-weight="bold">{{CHAPTER_TITLE}}</text>
  <text x="288" y="396" fill="#5B6770" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15">{{CHAPTER_SUB}}</text>
  <rect x="288" y="424" width="80" height="3" fill="#005587"/>
</svg>
