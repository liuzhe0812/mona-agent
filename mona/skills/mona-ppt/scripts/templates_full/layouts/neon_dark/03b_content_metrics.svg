<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#131C2E"/>
    </linearGradient>
    <pattern id="dotGrid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse" data-pptx-pattern="dotGrid" data-pptx-fg="#1C2942" data-pptx-bg="#101828">
      <rect width="48" height="48" fill="#101828"/>
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1C2942" stroke-width="0.5"/>
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="1280" height="720" fill="url(#dotGrid)"/>
  </g>

  <g id="page-header">
    <rect x="56" y="50" width="16" height="16" rx="3" fill="#22D3EE" fill-opacity="0.15"/>
    <rect x="60" y="54" width="8" height="8" rx="1.5" fill="#22D3EE"/>
    <text x="78" y="62" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="3" fill="#22D3EE">{{KICKER}}</text>
    <text x="60" y="108" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" font-weight="bold" fill="#E6EDF7">{{PAGE_TITLE}}</text>
    <line x1="62" y1="128" x2="222" y2="128" stroke="#22D3EE" stroke-width="6" stroke-opacity="0.15" stroke-linecap="round"/>
    <line x1="62" y1="128" x2="222" y2="128" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <g id="metric-card-1">
    <rect x="60" y="190" width="272" height="240" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#22D3EE" stroke-opacity="0.18"/>
    <line x1="88" y1="212" x2="168" y2="212" stroke="#22D3EE" stroke-width="6" stroke-opacity="0.15" stroke-linecap="round"/>
    <line x1="88" y1="212" x2="168" y2="212" stroke="#22D3EE" stroke-width="2" stroke-linecap="round"/>
    <text x="196" y="300" font-family="Arial, Microsoft YaHei, sans-serif" font-size="42" font-weight="bold" fill="#22D3EE" text-anchor="middle">{{METRIC_1_VALUE}}</text>
    <text x="196" y="340" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#E6EDF7" text-anchor="middle">{{METRIC_1_LABEL}}</text>
    <text x="196" y="368" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#7A8BA8" text-anchor="middle">{{METRIC_1_DESC}}</text>
  </g>

  <g id="metric-card-2">
    <rect x="356" y="190" width="272" height="240" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#22D3EE" stroke-opacity="0.18"/>
    <line x1="384" y1="212" x2="464" y2="212" stroke="#8B5CF6" stroke-width="6" stroke-opacity="0.15" stroke-linecap="round"/>
    <line x1="384" y1="212" x2="464" y2="212" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
    <text x="492" y="300" font-family="Arial, Microsoft YaHei, sans-serif" font-size="42" font-weight="bold" fill="#8B5CF6" text-anchor="middle">{{METRIC_2_VALUE}}</text>
    <text x="492" y="340" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#E6EDF7" text-anchor="middle">{{METRIC_2_LABEL}}</text>
    <text x="492" y="368" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#7A8BA8" text-anchor="middle">{{METRIC_2_DESC}}</text>
  </g>

  <g id="metric-card-3">
    <rect x="652" y="190" width="272" height="240" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#22D3EE" stroke-opacity="0.18"/>
    <line x1="680" y1="212" x2="760" y2="212" stroke="#22D3EE" stroke-width="6" stroke-opacity="0.15" stroke-linecap="round"/>
    <line x1="680" y1="212" x2="760" y2="212" stroke="#22D3EE" stroke-width="2" stroke-linecap="round"/>
    <text x="788" y="300" font-family="Arial, Microsoft YaHei, sans-serif" font-size="42" font-weight="bold" fill="#22D3EE" text-anchor="middle">{{METRIC_3_VALUE}}</text>
    <text x="788" y="340" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#E6EDF7" text-anchor="middle">{{METRIC_3_LABEL}}</text>
    <text x="788" y="368" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#7A8BA8" text-anchor="middle">{{METRIC_3_DESC}}</text>
  </g>

  <g id="metric-card-4">
    <rect x="948" y="190" width="272" height="240" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#22D3EE" stroke-opacity="0.18"/>
    <line x1="976" y1="212" x2="1056" y2="212" stroke="#8B5CF6" stroke-width="6" stroke-opacity="0.15" stroke-linecap="round"/>
    <line x1="976" y1="212" x2="1056" y2="212" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
    <text x="1084" y="300" font-family="Arial, Microsoft YaHei, sans-serif" font-size="42" font-weight="bold" fill="#8B5CF6" text-anchor="middle">{{METRIC_4_VALUE}}</text>
    <text x="1084" y="340" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#E6EDF7" text-anchor="middle">{{METRIC_4_LABEL}}</text>
    <text x="1084" y="368" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#7A8BA8" text-anchor="middle">{{METRIC_4_DESC}}</text>
  </g>

  <g id="footnote">
    <text x="60" y="486" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11" fill="#7A8BA8">{{FOOTNOTE}}</text>
  </g>

  <g id="page-footer">
    <circle cx="60" cy="700" r="5" fill="#22D3EE" fill-opacity="0.25"/>
    <circle cx="60" cy="700" r="2.2" fill="#22D3EE"/>
    <circle cx="78" cy="700" r="5" fill="#8B5CF6" fill-opacity="0.25"/>
    <circle cx="78" cy="700" r="2.2" fill="#8B5CF6"/>
    <circle cx="96" cy="700" r="5" fill="#22D3EE" fill-opacity="0.25"/>
    <circle cx="96" cy="700" r="2.2" fill="#22D3EE"/>
    <text x="1220" y="704" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#7A8BA8" text-anchor="end">{{PAGE_NUM}}</text>
  </g>
</svg>
