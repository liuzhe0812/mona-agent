<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#131C2E"/>
    </linearGradient>
    <pattern id="dotGrid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse" data-pptx-pattern="dotGrid" data-pptx-fg="#1C2942" data-pptx-bg="#101828">
      <rect width="48" height="48" fill="#101828"/>
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1C2942" stroke-width="0.5"/>
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="1280" height="720" fill="url(#dotGrid)"/>
  </g>

  <g id="page-header">
    <rect x="56" y="50" width="16" height="16" rx="3" fill="#22D3EE" fill-opacity="0.15"/>
    <rect x="60" y="54" width="8" height="8" rx="1.5" fill="#22D3EE"/>
    <text x="78" y="62" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="3" fill="#22D3EE">{{KICKER}}</text>
    <text x="60" y="108" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" font-weight="bold" fill="#E6EDF7">{{PAGE_TITLE}}</text>
    <line x1="62" y1="128" x2="222" y2="128" stroke="#22D3EE" stroke-width="6" stroke-opacity="0.15" stroke-linecap="round"/>
    <line x1="62" y1="128" x2="222" y2="128" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <g id="timeline-track">
    <line x1="100" y1="330" x2="1180" y2="330" stroke="#22D3EE" stroke-width="6" stroke-opacity="0.15" stroke-linecap="round"/>
    <line x1="100" y1="330" x2="1180" y2="330" stroke="#22D3EE" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g id="tl-node-1">
    <line x1="170" y1="262" x2="170" y2="330" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.12"/>
    <circle cx="170" cy="330" r="10" fill="#22D3EE" fill-opacity="0.2"/>
    <circle cx="170" cy="330" r="4.5" fill="#22D3EE"/>
    <text x="170" y="206" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#22D3EE" text-anchor="middle">{{TL_1_YEAR}}</text>
    <text x="170" y="230" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="bold" fill="#E6EDF7" text-anchor="middle">{{TL_1_TITLE}}</text>
    <text x="170" y="250" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#7A8BA8" text-anchor="middle">{{TL_1_DESC}}</text>
  </g>

  <g id="tl-node-2">
    <line x1="405" y1="330" x2="405" y2="398" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.12"/>
    <circle cx="405" cy="330" r="10" fill="#8B5CF6" fill-opacity="0.2"/>
    <circle cx="405" cy="330" r="4.5" fill="#8B5CF6"/>
    <text x="405" y="432" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#22D3EE" text-anchor="middle">{{TL_2_YEAR}}</text>
    <text x="405" y="456" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="bold" fill="#E6EDF7" text-anchor="middle">{{TL_2_TITLE}}</text>
    <text x="405" y="476" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#7A8BA8" text-anchor="middle">{{TL_2_DESC}}</text>
  </g>

  <g id="tl-node-3">
    <line x1="640" y1="262" x2="640" y2="330" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.12"/>
    <circle cx="640" cy="330" r="10" fill="#22D3EE" fill-opacity="0.2"/>
    <circle cx="640" cy="330" r="4.5" fill="#22D3EE"/>
    <text x="640" y="206" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#22D3EE" text-anchor="middle">{{TL_3_YEAR}}</text>
    <text x="640" y="230" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="bold" fill="#E6EDF7" text-anchor="middle">{{TL_3_TITLE}}</text>
    <text x="640" y="250" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#7A8BA8" text-anchor="middle">{{TL_3_DESC}}</text>
  </g>

  <g id="tl-node-4">
    <line x1="875" y1="330" x2="875" y2="398" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.12"/>
    <circle cx="875" cy="330" r="10" fill="#8B5CF6" fill-opacity="0.2"/>
    <circle cx="875" cy="330" r="4.5" fill="#8B5CF6"/>
    <text x="875" y="432" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#22D3EE" text-anchor="middle">{{TL_4_YEAR}}</text>
    <text x="875" y="456" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="bold" fill="#E6EDF7" text-anchor="middle">{{TL_4_TITLE}}</text>
    <text x="875" y="476" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#7A8BA8" text-anchor="middle">{{TL_4_DESC}}</text>
  </g>

  <g id="tl-node-5">
    <line x1="1110" y1="262" x2="1110" y2="330" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.12"/>
    <circle cx="1110" cy="330" r="10" fill="#22D3EE" fill-opacity="0.2"/>
    <circle cx="1110" cy="330" r="4.5" fill="#22D3EE"/>
    <text x="1110" y="206" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#22D3EE" text-anchor="middle">{{TL_5_YEAR}}</text>
    <text x="1110" y="230" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="bold" fill="#E6EDF7" text-anchor="middle">{{TL_5_TITLE}}</text>
    <text x="1110" y="250" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#7A8BA8" text-anchor="middle">{{TL_5_DESC}}</text>
  </g>

  <g id="page-footer">
    <circle cx="60" cy="700" r="5" fill="#22D3EE" fill-opacity="0.25"/>
    <circle cx="60" cy="700" r="2.2" fill="#22D3EE"/>
    <circle cx="78" cy="700" r="5" fill="#8B5CF6" fill-opacity="0.25"/>
    <circle cx="78" cy="700" r="2.2" fill="#8B5CF6"/>
    <circle cx="96" cy="700" r="5" fill="#22D3EE" fill-opacity="0.25"/>
    <circle cx="96" cy="700" r="2.2" fill="#22D3EE"/>
    <text x="1220" y="704" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#7A8BA8" text-anchor="end">{{PAGE_NUM}}</text>
  </g>
</svg>
