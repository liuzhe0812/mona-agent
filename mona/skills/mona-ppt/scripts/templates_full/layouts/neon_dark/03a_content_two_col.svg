<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#131C2E"/>
    </linearGradient>
    <pattern id="dotGrid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse" data-pptx-pattern="dotGrid" data-pptx-fg="#1C2942" data-pptx-bg="#101828">
      <rect width="48" height="48" fill="#101828"/>
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1C2942" stroke-width="0.5"/>
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="1280" height="720" fill="url(#dotGrid)"/>
  </g>

  <g id="page-header">
    <rect x="56" y="50" width="16" height="16" rx="3" fill="#22D3EE" fill-opacity="0.15"/>
    <rect x="60" y="54" width="8" height="8" rx="1.5" fill="#22D3EE"/>
    <text x="78" y="62" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="3" fill="#22D3EE">{{KICKER}}</text>
    <text x="60" y="108" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" font-weight="bold" fill="#E6EDF7">{{PAGE_TITLE}}</text>
    <line x1="62" y1="128" x2="222" y2="128" stroke="#22D3EE" stroke-width="6" stroke-opacity="0.15" stroke-linecap="round"/>
    <line x1="62" y1="128" x2="222" y2="128" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <g id="col-left-card">
    <rect x="60" y="170" width="566" height="440" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#22D3EE" stroke-opacity="0.18"/>
    <text x="96" y="216" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="bold" fill="#22D3EE">{{COL_LEFT_TITLE}}</text>
    <line x1="96" y1="232" x2="176" y2="232" stroke="#22D3EE" stroke-width="6" stroke-opacity="0.15" stroke-linecap="round"/>
    <line x1="96" y1="232" x2="176" y2="232" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="102" cy="267" r="6" fill="#22D3EE" fill-opacity="0.2"/>
    <circle cx="102" cy="267" r="2.5" fill="#22D3EE"/>
    <text x="122" y="272" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#C9D4E5">{{LEFT_POINT_1}}</text>
    <circle cx="102" cy="315" r="6" fill="#22D3EE" fill-opacity="0.2"/>
    <circle cx="102" cy="315" r="2.5" fill="#22D3EE"/>
    <text x="122" y="320" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#C9D4E5">{{LEFT_POINT_2}}</text>
    <circle cx="102" cy="363" r="6" fill="#22D3EE" fill-opacity="0.2"/>
    <circle cx="102" cy="363" r="2.5" fill="#22D3EE"/>
    <text x="122" y="368" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#C9D4E5">{{LEFT_POINT_3}}</text>
    <circle cx="102" cy="411" r="6" fill="#22D3EE" fill-opacity="0.2"/>
    <circle cx="102" cy="411" r="2.5" fill="#22D3EE"/>
    <text x="122" y="416" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#C9D4E5">{{LEFT_POINT_4}}</text>
  </g>

  <g id="col-right-card">
    <rect x="654" y="170" width="566" height="440" rx="14" fill="#FFFFFF" fill-opacity="0.04" stroke="#22D3EE" stroke-opacity="0.18"/>
    <text x="690" y="216" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="17" font-weight="bold" fill="#22D3EE">{{COL_RIGHT_TITLE}}</text>
    <line x1="690" y1="232" x2="770" y2="232" stroke="#22D3EE" stroke-width="6" stroke-opacity="0.15" stroke-linecap="round"/>
    <line x1="690" y1="232" x2="770" y2="232" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="696" cy="267" r="6" fill="#8B5CF6" fill-opacity="0.2"/>
    <circle cx="696" cy="267" r="2.5" fill="#8B5CF6"/>
    <text x="716" y="272" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#C9D4E5">{{RIGHT_POINT_1}}</text>
    <circle cx="696" cy="315" r="6" fill="#8B5CF6" fill-opacity="0.2"/>
    <circle cx="696" cy="315" r="2.5" fill="#8B5CF6"/>
    <text x="716" y="320" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#C9D4E5">{{RIGHT_POINT_2}}</text>
    <circle cx="696" cy="363" r="6" fill="#8B5CF6" fill-opacity="0.2"/>
    <circle cx="696" cy="363" r="2.5" fill="#8B5CF6"/>
    <text x="716" y="368" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#C9D4E5">{{RIGHT_POINT_3}}</text>
    <circle cx="696" cy="411" r="6" fill="#8B5CF6" fill-opacity="0.2"/>
    <circle cx="696" cy="411" r="2.5" fill="#8B5CF6"/>
    <text x="716" y="416" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" fill="#C9D4E5">{{RIGHT_POINT_4}}</text>
  </g>

  <g id="page-footer">
    <circle cx="60" cy="700" r="5" fill="#22D3EE" fill-opacity="0.25"/>
    <circle cx="60" cy="700" r="2.2" fill="#22D3EE"/>
    <circle cx="78" cy="700" r="5" fill="#8B5CF6" fill-opacity="0.25"/>
    <circle cx="78" cy="700" r="2.2" fill="#8B5CF6"/>
    <circle cx="96" cy="700" r="5" fill="#22D3EE" fill-opacity="0.25"/>
    <circle cx="96" cy="700" r="2.2" fill="#22D3EE"/>
    <text x="1220" y="704" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#7A8BA8" text-anchor="end">{{PAGE_NUM}}</text>
  </g>
</svg>
