<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#131C2E"/>
    </linearGradient>
    <pattern id="dotGrid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse" data-pptx-pattern="dotGrid" data-pptx-fg="#1C2942" data-pptx-bg="#101828">
      <rect width="48" height="48" fill="#101828"/>
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1C2942" stroke-width="0.5"/>
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
    <radialGradient id="violetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="60%" stop-color="#3B2F6B"/>
      <stop offset="100%" stop-color="#131C2E"/>
    </radialGradient>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="1280" height="720" fill="url(#dotGrid)"/>
    <circle cx="1180" cy="620" r="360" fill="url(#violetGlow)" fill-opacity="0.45"/>
  </g>

  <g id="chapter-decor">
    <text x="50" y="560" font-family="Arial, Microsoft YaHei, sans-serif" font-size="280" font-weight="bold" fill="#22D3EE" fill-opacity="0.06">{{CHAPTER_NUM}}</text>
  </g>

  <g id="chapter-title-block">
    <rect x="546" y="270" width="16" height="16" rx="3" fill="#22D3EE" fill-opacity="0.15"/>
    <rect x="550" y="274" width="8" height="8" rx="1.5" fill="#22D3EE"/>
    <text x="568" y="282" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" letter-spacing="3" fill="#22D3EE">{{KICKER}}</text>
    <text x="540" y="352" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="42" font-weight="bold" fill="#E6EDF7">{{CHAPTER_TITLE}}</text>
    <line x1="542" y1="384" x2="722" y2="384" stroke="#22D3EE" stroke-width="6" stroke-opacity="0.15" stroke-linecap="round"/>
    <line x1="542" y1="384" x2="722" y2="384" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round"/>
    <text x="540" y="424" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" fill="#7A8BA8">{{CHAPTER_SUB}}</text>
  </g>

  <g id="chapter-circuit-decor">
    <polyline points="540,520 640,520 670,550 790,550" fill="none" stroke="#22D3EE" stroke-width="6" stroke-opacity="0.04" stroke-linejoin="round"/>
    <polyline points="540,520 640,520 670,550 790,550" fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.2" stroke-linejoin="round"/>
    <circle cx="790" cy="550" r="8" fill="#22D3EE" fill-opacity="0.2"/>
    <circle cx="790" cy="550" r="3.5" fill="#22D3EE"/>
  </g>
</svg>
