<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#131C2E"/>
    </linearGradient>
    <pattern id="dotGrid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse" data-pptx-pattern="dotGrid" data-pptx-fg="#1C2942" data-pptx-bg="#101828">
      <rect width="48" height="48" fill="#101828"/>
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1C2942" stroke-width="0.5"/>
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
    <radialGradient id="violetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="60%" stop-color="#3B2F6B"/>
      <stop offset="100%" stop-color="#131C2E"/>
    </radialGradient>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="1280" height="720" fill="url(#dotGrid)"/>
    <circle cx="120" cy="640" r="320" fill="url(#violetGlow)" fill-opacity="0.4"/>
  </g>

  <g id="quote-mark-decor">
    <text x="90" y="300" font-family="Arial, Microsoft YaHei, sans-serif" font-size="220" font-weight="bold" fill="#8B5CF6" fill-opacity="0.15">&#8220;</text>
  </g>

  <g id="quote-body">
    <text x="640" y="300" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="28" fill="#E6EDF7" text-anchor="middle">
      <tspan x="640" dy="0">{{QUOTE_TEXT}}</tspan>
      <tspan x="640" dy="48">{{QUOTE_TEXT_2}}</tspan>
      <tspan x="640" dy="48">{{QUOTE_TEXT_3}}</tspan>
    </text>
    <line x1="560" y1="440" x2="720" y2="440" stroke="#22D3EE" stroke-width="6" stroke-opacity="0.15" stroke-linecap="round"/>
    <line x1="560" y1="440" x2="720" y2="440" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round"/>
    <text x="640" y="490" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#22D3EE" text-anchor="middle">{{QUOTE_AUTHOR}}</text>
    <text x="640" y="516" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12" fill="#7A8BA8" text-anchor="middle">{{QUOTE_ROLE}}</text>
  </g>

  <g id="page-footer">
    <circle cx="60" cy="700" r="5" fill="#22D3EE" fill-opacity="0.25"/>
    <circle cx="60" cy="700" r="2.2" fill="#22D3EE"/>
    <circle cx="78" cy="700" r="5" fill="#8B5CF6" fill-opacity="0.25"/>
    <circle cx="78" cy="700" r="2.2" fill="#8B5CF6"/>
    <circle cx="96" cy="700" r="5" fill="#22D3EE" fill-opacity="0.25"/>
    <circle cx="96" cy="700" r="2.2" fill="#22D3EE"/>
    <text x="1220" y="704" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#7A8BA8" text-anchor="end">{{PAGE_NUM}}</text>
  </g>
</svg>
