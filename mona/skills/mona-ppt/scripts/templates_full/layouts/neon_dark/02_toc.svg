    <text x="102" y="219" font-family="Arial, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#22D3EE">01</text>
    <text x="170" y="200" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="bold" fill="#E6EDF7">{{TOC_ITEM_1_TITLE}}</text>
    <text x="170" y="228" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" fill="#7A8BA8">{{TOC_ITEM_1_DESC}}</text>
    <circle cx="1174" cy="206" r="10" fill="#22D3EE" fill-opacity="0.12"/>
    <text x="1174" y="214" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" fill="#22D3EE" text-anchor="middle">&#8250;</text>
  </g>

