<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- 暖纸白背景 -->
  <rect width="1280" height="720" fill="#FAF7F2"/>

  <!-- 页眉：kicker + 页面标题 + 发丝线 -->
  <rect x="80" y="88" width="36" height="2" fill="#C9A227"/>
  <text x="128" y="94" fill="#C9A227" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" letter-spacing="3">{{KICKER}}</text>
  <text x="80" y="150" fill="#16264C" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="30" font-weight="bold">{{PAGE_TITLE}}</text>
  <line x1="80" y1="182" x2="1200" y2="182" stroke="#D8D2C4" stroke-width="1"/>

  <!-- 中缝竖向发丝线 -->
  <line x1="640" y1="220" x2="640" y2="600" stroke="#D8D2C4" stroke-width="1"/>

  <!-- 左栏标题与要点 -->
  <text x="80" y="248" fill="#16264C" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="bold">{{COL_LEFT_TITLE}}</text>
  <rect x="80" y="294" width="6" height="6" fill="#C9A227"/>
  <text x="100" y="301" fill="#3C4657" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15">{{LEFT_POINT_1}}</text>
  <rect x="80" y="344" width="6" height="6" fill="#C9A227"/>
  <text x="100" y="351" fill="#3C4657" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15">{{LEFT_POINT_2}}</text>
  <rect x="80" y="394" width="6" height="6" fill="#C9A227"/>
  <text x="100" y="401" fill="#3C4657" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15">{{LEFT_POINT_3}}</text>
  <rect x="80" y="444" width="6" height="6" fill="#C9A227"/>
  <text x="100" y="451" fill="#3C4657" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15">{{LEFT_POINT_4}}</text>

  <!-- 右栏标题与要点 -->
  <text x="672" y="248" fill="#16264C" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="bold">{{COL_RIGHT_TITLE}}</text>
  <rect x="672" y="294" width="6" height="6" fill="#C9A227"/>
  <text x="692" y="301" fill="#3C4657" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15">{{RIGHT_POINT_1}}</text>
  <rect x="672" y="344" width="6" height="6" fill="#C9A227"/>
  <text x="692" y="351" fill="#3C4657" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15">{{RIGHT_POINT_2}}</text>
  <rect x="672" y="394" width="6" height="6" fill="#C9A227"/>
  <text x="692" y="401" fill="#3C4657" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15">{{RIGHT_POINT_3}}</text>
  <rect x="672" y="444" width="6" height="6" fill="#C9A227"/>
  <text x="692" y="451" fill="#3C4657" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15">{{RIGHT_POINT_4}}</text>

  <!-- 页脚 -->
  <line x1="80" y1="664" x2="1200" y2="664" stroke="#D8D2C4" stroke-width="1"/>
  <rect x="80" y="686" width="8" height="8" fill="#C9A227"/>
  <text x="98" y="694" fill="#8A94A6" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11">{{SECTION_NAME}}</text>
  <text x="1200" y="694" text-anchor="end" fill="#8A94A6" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12">{{PAGE_NUM}}</text>
</svg>
