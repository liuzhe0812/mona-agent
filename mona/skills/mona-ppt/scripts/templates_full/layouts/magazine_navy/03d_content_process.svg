<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- 暖纸白背景 -->
  <rect width="1280" height="720" fill="#FAF7F2"/>

  <!-- 页眉：kicker + 页面标题 + 发丝线 -->
  <rect x="80" y="88" width="36" height="2" fill="#C9A227"/>
  <text x="128" y="94" fill="#C9A227" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" letter-spacing="3">{{KICKER}}</text>
  <text x="80" y="150" fill="#16264C" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="30" font-weight="bold">{{PAGE_TITLE}}</text>
  <line x1="80" y1="182" x2="1200" y2="182" stroke="#D8D2C4" stroke-width="1"/>

  <!-- 圆间发丝连接线段 -->
  <line x1="216" y1="330" x2="392" y2="330" stroke="#D8D2C4" stroke-width="1"/>
  <line x1="440" y1="330" x2="616" y2="330" stroke="#D8D2C4" stroke-width="1"/>
  <line x1="664" y1="330" x2="840" y2="330" stroke="#D8D2C4" stroke-width="1"/>
  <line x1="888" y1="330" x2="1064" y2="330" stroke="#D8D2C4" stroke-width="1"/>

  <!-- 步骤 1 -->
  <circle cx="192" cy="330" r="24" fill="#FAF7F2" stroke="#16264C" stroke-width="1.5"/>
  <text x="192" y="336" text-anchor="middle" fill="#C9A227" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold">1</text>
  <text x="192" y="404" text-anchor="middle" fill="#16264C" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="bold">{{STEP_1_TITLE}}</text>
  <text x="192" y="430" text-anchor="middle" fill="#8A94A6" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12">
    <tspan x="192" dy="0">{{STEP_1_DESC}}</tspan>
    <tspan x="192" dy="18"></tspan>
  </text>

  <!-- 步骤 2 -->
  <circle cx="416" cy="330" r="24" fill="#FAF7F2" stroke="#16264C" stroke-width="1.5"/>
  <text x="416" y="336" text-anchor="middle" fill="#C9A227" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold">2</text>
  <text x="416" y="404" text-anchor="middle" fill="#16264C" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="bold">{{STEP_2_TITLE}}</text>
  <text x="416" y="430" text-anchor="middle" fill="#8A94A6" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12">
    <tspan x="416" dy="0">{{STEP_2_DESC}}</tspan>
    <tspan x="416" dy="18"></tspan>
  </text>

  <!-- 步骤 3 -->
  <circle cx="640" cy="330" r="24" fill="#FAF7F2" stroke="#16264C" stroke-width="1.5"/>
  <text x="640" y="336" text-anchor="middle" fill="#C9A227" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold">3</text>
  <text x="640" y="404" text-anchor="middle" fill="#16264C" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="bold">{{STEP_3_TITLE}}</text>
  <text x="640" y="430" text-anchor="middle" fill="#8A94A6" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12">
    <tspan x="640" dy="0">{{STEP_3_DESC}}</tspan>
    <tspan x="640" dy="18"></tspan>
  </text>

  <!-- 步骤 4 -->
  <circle cx="864" cy="330" r="24" fill="#FAF7F2" stroke="#16264C" stroke-width="1.5"/>
  <text x="864" y="336" text-anchor="middle" fill="#C9A227" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold">4</text>
  <text x="864" y="404" text-anchor="middle" fill="#16264C" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="bold">{{STEP_4_TITLE}}</text>
  <text x="864" y="430" text-anchor="middle" fill="#8A94A6" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12">
    <tspan x="864" dy="0">{{STEP_4_DESC}}</tspan>
    <tspan x="864" dy="18"></tspan>
  </text>

  <!-- 步骤 5 -->
  <circle cx="1088" cy="330" r="24" fill="#FAF7F2" stroke="#16264C" stroke-width="1.5"/>
  <text x="1088" y="336" text-anchor="middle" fill="#C9A227" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold">5</text>
  <text x="1088" y="404" text-anchor="middle" fill="#16264C" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="bold">{{STEP_5_TITLE}}</text>
  <text x="1088" y="430" text-anchor="middle" fill="#8A94A6" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12">
    <tspan x="1088" dy="0">{{STEP_5_DESC}}</tspan>
    <tspan x="1088" dy="18"></tspan>
  </text>

  <!-- 页脚 -->
  <line x1="80" y1="664" x2="1200" y2="664" stroke="#D8D2C4" stroke-width="1"/>
  <rect x="80" y="686" width="8" height="8" fill="#C9A227"/>
  <text x="98" y="694" fill="#8A94A6" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11">{{SECTION_NAME}}</text>
  <text x="1200" y="694" text-anchor="end" fill="#8A94A6" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12">{{PAGE_NUM}}</text>
</svg>
