<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- 深蓝整页背景 -->
  <rect width="1280" height="720" fill="#16264C"/>

  <!-- 巨大装饰引号（金色低透明） -->
  <text x="90" y="330" fill="#C9A227" fill-opacity="0.2" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="240" font-weight="bold">“</text>

  <!-- 引用正文：2-3 行 tspan 预分行，单行引用时后续 tspan 留空 -->
  <text x="200" y="380" fill="#FAF7F2" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="30">
    <tspan x="200" dy="0">{{QUOTE_TEXT}}</tspan>
    <tspan x="200" dy="48"></tspan>
    <tspan x="200" dy="48"></tspan>
  </text>

  <!-- 金色短线 -->
  <rect x="200" y="540" width="48" height="3" fill="#C9A227"/>

  <!-- 署名 -->
  <text x="200" y="578" fill="#FAF7F2" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="16" font-weight="bold">{{QUOTE_AUTHOR}}</text>
  <text x="200" y="604" fill="#FAF7F2" fill-opacity="0.55" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{QUOTE_ROLE}}</text>
</svg>
