<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- 暖纸白背景 -->
  <rect width="1280" height="720" fill="#FAF7F2"/>

  <!-- 页眉：kicker + 页面标题 + 发丝线 -->
  <rect x="80" y="88" width="36" height="2" fill="#C9A227"/>
  <text x="128" y="94" fill="#C9A227" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" letter-spacing="3">{{KICKER}}</text>
  <text x="80" y="150" fill="#16264C" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="30" font-weight="bold">{{PAGE_TITLE}}</text>
  <line x1="80" y1="182" x2="1200" y2="182" stroke="#D8D2C4" stroke-width="1"/>

  <!-- KPI 卡 1 -->
  <rect x="80" y="230" width="262" height="240" fill="#F4F1EA" stroke="#D8D2C4" stroke-width="1"/>
  <rect x="104" y="258" width="32" height="2" fill="#C9A227"/>
  <text x="104" y="340" fill="#16264C" font-family="Arial, Microsoft YaHei, sans-serif" font-size="44" font-weight="bold">{{METRIC_1_VALUE}}</text>
  <text x="104" y="380" fill="#3C4657" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15">{{METRIC_1_LABEL}}</text>
  <text x="104" y="408" fill="#8A94A6" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12">{{METRIC_1_DESC}}</text>

  <!-- KPI 卡 2 -->
  <rect x="366" y="230" width="262" height="240" fill="#F4F1EA" stroke="#D8D2C4" stroke-width="1"/>
  <rect x="390" y="258" width="32" height="2" fill="#C9A227"/>
  <text x="390" y="340" fill="#16264C" font-family="Arial, Microsoft YaHei, sans-serif" font-size="44" font-weight="bold">{{METRIC_2_VALUE}}</text>
  <text x="390" y="380" fill="#3C4657" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15">{{METRIC_2_LABEL}}</text>
  <text x="390" y="408" fill="#8A94A6" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12">{{METRIC_2_DESC}}</text>

  <!-- KPI 卡 3 -->
  <rect x="652" y="230" width="262" height="240" fill="#F4F1EA" stroke="#D8D2C4" stroke-width="1"/>
  <rect x="676" y="258" width="32" height="2" fill="#C9A227"/>
  <text x="676" y="340" fill="#16264C" font-family="Arial, Microsoft YaHei, sans-serif" font-size="44" font-weight="bold">{{METRIC_3_VALUE}}</text>
  <text x="676" y="380" fill="#3C4657" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15">{{METRIC_3_LABEL}}</text>
  <text x="676" y="408" fill="#8A94A6" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12">{{METRIC_3_DESC}}</text>

  <!-- KPI 卡 4 -->
  <rect x="938" y="230" width="262" height="240" fill="#F4F1EA" stroke="#D8D2C4" stroke-width="1"/>
  <rect x="962" y="258" width="32" height="2" fill="#C9A227"/>
  <text x="962" y="340" fill="#16264C" font-family="Arial, Microsoft YaHei, sans-serif" font-size="44" font-weight="bold">{{METRIC_4_VALUE}}</text>
  <text x="962" y="380" fill="#3C4657" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15">{{METRIC_4_LABEL}}</text>
  <text x="962" y="408" fill="#8A94A6" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12">{{METRIC_4_DESC}}</text>

  <!-- 来源行 -->
  <text x="80" y="630" fill="#8A94A6" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11">{{FOOTNOTE}}</text>

  <!-- 页脚 -->
  <line x1="80" y1="664" x2="1200" y2="664" stroke="#D8D2C4" stroke-width="1"/>
  <rect x="80" y="686" width="8" height="8" fill="#C9A227"/>
  <text x="98" y="694" fill="#8A94A6" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11">{{SECTION_NAME}}</text>
  <text x="1200" y="694" text-anchor="end" fill="#8A94A6" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12">{{PAGE_NUM}}</text>
</svg>
