<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- 暖纸白背景 -->
  <rect width="1280" height="720" fill="#FAF7F2"/>

  <!-- 页眉：kicker + 页面标题 + 发丝线 -->
  <rect x="80" y="88" width="36" height="2" fill="#C9A227"/>
  <text x="128" y="94" fill="#C9A227" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" letter-spacing="3">{{KICKER}}</text>
  <text x="80" y="150" fill="#16264C" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="30" font-weight="bold">{{PAGE_TITLE}}</text>
  <line x1="80" y1="182" x2="1200" y2="182" stroke="#D8D2C4" stroke-width="1"/>

  <!-- 左栏卡片 -->
  <rect x="80" y="214" width="357" height="300" fill="#FFFFFF" stroke="#D8D2C4" stroke-width="1"/>
  <rect x="80" y="214" width="357" height="6" fill="#D8D2C4"/>
  <text x="108" y="266" fill="#16264C" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="bold">{{OPTION_1_NAME}}</text>
  <circle cx="112" cy="306" r="3" fill="#C9A227"/>
  <text x="128" y="310" fill="#3C4657" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{OPTION_1_FEAT_1}}</text>
  <circle cx="112" cy="342" r="3" fill="#C9A227"/>
  <text x="128" y="346" fill="#3C4657" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{OPTION_1_FEAT_2}}</text>
  <circle cx="112" cy="378" r="3" fill="#C9A227"/>
  <text x="128" y="382" fill="#3C4657" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{OPTION_1_FEAT_3}}</text>
  <circle cx="112" cy="414" r="3" fill="#C9A227"/>
  <text x="128" y="418" fill="#3C4657" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{OPTION_1_FEAT_4}}</text>

  <!-- 中栏卡片（推荐：深蓝实心顶条 + 深蓝描边突出） -->
  <rect x="461" y="214" width="357" height="300" fill="#FFFFFF" stroke="#16264C" stroke-width="1.5"/>
  <rect x="461" y="214" width="357" height="44" fill="#16264C"/>
  <text x="489" y="243" fill="#FAF7F2" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="bold">{{OPTION_2_NAME}}</text>
  <circle cx="493" cy="306" r="3" fill="#C9A227"/>
  <text x="509" y="310" fill="#3C4657" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{OPTION_2_FEAT_1}}</text>
  <circle cx="493" cy="342" r="3" fill="#C9A227"/>
  <text x="509" y="346" fill="#3C4657" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{OPTION_2_FEAT_2}}</text>
  <circle cx="493" cy="378" r="3" fill="#C9A227"/>
  <text x="509" y="382" fill="#3C4657" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{OPTION_2_FEAT_3}}</text>
  <circle cx="493" cy="414" r="3" fill="#C9A227"/>
  <text x="509" y="418" fill="#3C4657" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{OPTION_2_FEAT_4}}</text>

  <!-- 右栏卡片 -->
  <rect x="842" y="214" width="357" height="300" fill="#FFFFFF" stroke="#D8D2C4" stroke-width="1"/>
  <rect x="842" y="214" width="357" height="6" fill="#D8D2C4"/>
  <text x="870" y="266" fill="#16264C" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="bold">{{OPTION_3_NAME}}</text>
  <circle cx="874" cy="306" r="3" fill="#C9A227"/>
  <text x="890" y="310" fill="#3C4657" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{OPTION_3_FEAT_1}}</text>
  <circle cx="874" cy="342" r="3" fill="#C9A227"/>
  <text x="890" y="346" fill="#3C4657" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{OPTION_3_FEAT_2}}</text>
  <circle cx="874" cy="378" r="3" fill="#C9A227"/>
  <text x="890" y="382" fill="#3C4657" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{OPTION_3_FEAT_3}}</text>
  <circle cx="874" cy="414" r="3" fill="#C9A227"/>
  <text x="890" y="418" fill="#3C4657" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{OPTION_3_FEAT_4}}</text>

  <!-- 页脚 -->
  <line x1="80" y1="664" x2="1200" y2="664" stroke="#D8D2C4" stroke-width="1"/>
  <rect x="80" y="686" width="8" height="8" fill="#C9A227"/>
  <text x="98" y="694" fill="#8A94A6" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11">{{SECTION_NAME}}</text>
  <text x="1200" y="694" text-anchor="end" fill="#8A94A6" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12">{{PAGE_NUM}}</text>
</svg>
