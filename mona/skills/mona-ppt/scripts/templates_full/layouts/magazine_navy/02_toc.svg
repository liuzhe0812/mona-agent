<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- 暖纸白背景 -->
  <rect width="1280" height="720" fill="#FAF7F2"/>

  <!-- 左侧 1/3 深蓝色块 -->
  <rect x="0" y="0" width="420" height="720" fill="#16264C"/>

  <!-- 色块内：kicker + 页面标题 + 大号低透明 CONTENTS 装饰 -->
  <rect x="64" y="128" width="36" height="2" fill="#C9A227"/>
  <text x="128" y="134" fill="#C9A227" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" letter-spacing="3">CONTENTS</text>
  <text x="64" y="212" fill="#FAF7F2" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="44" font-weight="bold">{{PAGE_TITLE}}</text>
  <text x="56" y="660" fill="#FAF7F2" fill-opacity="0.07" font-family="Arial, Microsoft YaHei, sans-serif" font-size="64" font-weight="bold">CONTENTS</text>

  <!-- 右侧 5 个章节条目 -->
  <!-- 条目 1 -->
  <text x="500" y="168" fill="#C9A227" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold">01</text>
  <text x="566" y="168" fill="#16264C" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="bold">{{TOC_ITEM_1_TITLE}}</text>
  <text x="566" y="196" fill="#8A94A6" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{TOC_ITEM_1_DESC}}</text>
  <line x1="500" y1="216" x2="1200" y2="216" stroke="#D8D2C4" stroke-width="1"/>

  <!-- 条目 2 -->
  <text x="500" y="264" fill="#C9A227" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold">02</text>
  <text x="566" y="264" fill="#16264C" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="bold">{{TOC_ITEM_2_TITLE}}</text>
  <text x="566" y="292" fill="#8A94A6" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{TOC_ITEM_2_DESC}}</text>
  <line x1="500" y1="312" x2="1200" y2="312" stroke="#D8D2C4" stroke-width="1"/>

  <!-- 条目 3 -->
  <text x="500" y="360" fill="#C9A227" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold">03</text>
  <text x="566" y="360" fill="#16264C" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="bold">{{TOC_ITEM_3_TITLE}}</text>
  <text x="566" y="388" fill="#8A94A6" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{TOC_ITEM_3_DESC}}</text>
  <line x1="500" y1="408" x2="1200" y2="408" stroke="#D8D2C4" stroke-width="1"/>

  <!-- 条目 4 -->
  <text x="500" y="456" fill="#C9A227" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold">04</text>
  <text x="566" y="456" fill="#16264C" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="bold">{{TOC_ITEM_4_TITLE}}</text>
  <text x="566" y="484" fill="#8A94A6" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{TOC_ITEM_4_DESC}}</text>
  <line x1="500" y1="504" x2="1200" y2="504" stroke="#D8D2C4" stroke-width="1"/>

  <!-- 条目 5 -->
  <text x="500" y="552" fill="#C9A227" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="bold">05</text>
  <text x="566" y="552" fill="#16264C" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="18" font-weight="bold">{{TOC_ITEM_5_TITLE}}</text>
  <text x="566" y="580" fill="#8A94A6" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{TOC_ITEM_5_DESC}}</text>
  <line x1="500" y1="600" x2="1200" y2="600" stroke="#D8D2C4" stroke-width="1"/>
</svg>
