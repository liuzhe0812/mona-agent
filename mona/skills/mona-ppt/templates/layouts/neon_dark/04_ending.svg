<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#131C2E"/>
    </linearGradient>
    <pattern id="dotGrid" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse" data-pptx-pattern="dotGrid" data-pptx-fg="#1C2942" data-pptx-bg="#101828">
      <rect width="48" height="48" fill="#101828"/>
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1C2942" stroke-width="0.5"/>
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="55%" stop-color="#1A4A5E"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </radialGradient>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="url(#bgGrad)"/>
    <rect x="0" y="0" width="1280" height="720" fill="url(#dotGrid)"/>
    <circle cx="640" cy="300" r="420" fill="url(#cyanGlow)" fill-opacity="0.3"/>
  </g>

  <g id="thanks-block">
    <text x="640" y="310" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="46" font-weight="bold" fill="#E6EDF7" text-anchor="middle">{{THANKS_TITLE}}</text>
    <text x="640" y="354" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" fill="#22D3EE" text-anchor="middle">{{THANKS_SUB}}</text>
    <line x1="560" y1="392" x2="720" y2="392" stroke="#22D3EE" stroke-width="6" stroke-opacity="0.15" stroke-linecap="round"/>
    <line x1="560" y1="392" x2="720" y2="392" stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round"/>
    <text x="640" y="438" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" fill="#7A8BA8" text-anchor="middle">{{CONTACT_INFO}}</text>
    <text x="640" y="462" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" fill="#7A8BA8" text-anchor="middle">{{ORGANIZATION}}</text>
  </g>

  <g id="ending-decor">
    <polyline points="60,648 200,648 240,608 340,608" fill="none" stroke="#22D3EE" stroke-width="6" stroke-opacity="0.04" stroke-linejoin="round"/>
    <polyline points="60,648 200,648 240,608 340,608" fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.2" stroke-linejoin="round"/>
    <circle cx="340" cy="608" r="8" fill="#22D3EE" fill-opacity="0.2"/>
    <circle cx="340" cy="608" r="3.5" fill="#22D3EE"/>
    <polyline points="1220,648 1080,648 1040,608 940,608" fill="none" stroke="#8B5CF6" stroke-width="6" stroke-opacity="0.04" stroke-linejoin="round"/>
    <polyline points="1220,648 1080,648 1040,608 940,608" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.2" stroke-linejoin="round"/>
    <circle cx="940" cy="608" r="8" fill="#8B5CF6" fill-opacity="0.2"/>
    <circle cx="940" cy="608" r="3.5" fill="#8B5CF6"/>
  </g>

  <g id="page-footer">
    <circle cx="60" cy="700" r="5" fill="#22D3EE" fill-opacity="0.25"/>
    <circle cx="60" cy="700" r="2.2" fill="#22D3EE"/>
    <circle cx="78" cy="700" r="5" fill="#8B5CF6" fill-opacity="0.25"/>
    <circle cx="78" cy="700" r="2.2" fill="#8B5CF6"/>
    <circle cx="96" cy="700" r="5" fill="#22D3EE" fill-opacity="0.25"/>
    <circle cx="96" cy="700" r="2.2" fill="#22D3EE"/>
    <text x="1220" y="704" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" fill="#7A8BA8" text-anchor="end">{{PAGE_NUM}}</text>
  </g>
</svg>
