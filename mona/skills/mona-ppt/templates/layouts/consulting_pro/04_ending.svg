<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- 顶部 4px 深蓝通栏条 -->
  <rect x="0" y="0" width="1280" height="4" fill="#005587"/>

  <!-- 居中致谢区 -->
  <text x="640" y="300" text-anchor="middle" fill="#005587" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="40" font-weight="bold">{{THANKS_TITLE}}</text>
  <text x="640" y="346" text-anchor="middle" fill="#5B6770" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15">{{THANKS_SUB}}</text>
  <rect x="600" y="372" width="80" height="3" fill="#005587"/>
  <text x="640" y="424" text-anchor="middle" fill="#5B6770" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{CONTACT_INFO}}</text>
  <text x="640" y="452" text-anchor="middle" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13" font-weight="bold">{{ORGANIZATION}}</text>

  <!-- 底部发丝线 + 页脚 -->
  <line x1="64" y1="664" x2="1216" y2="664" stroke="#C8CDD2" stroke-width="1"/>
  <text x="64" y="686" fill="#5B6770" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11">{{ORGANIZATION}}</text>
  <text x="1216" y="686" text-anchor="end" fill="#5B6770" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11">{{PAGE_NUM}}</text>
</svg>
