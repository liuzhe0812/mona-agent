<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- Action Title 区：kicker + 短粗线 + 论断式标题 + 全宽发丝线 -->
  <text x="64" y="60" fill="#005587" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" letter-spacing="2">{{KICKER}}</text>
  <rect x="64" y="68" width="28" height="3" fill="#005587"/>
  <text x="64" y="106" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" font-weight="bold">{{PAGE_TITLE}}</text>
  <text x="1216" y="60" text-anchor="end" fill="#5B6770" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold">Exhibit {{EXHIBIT_NUM}}</text>
  <line x1="64" y1="126" x2="1216" y2="126" stroke="#C8CDD2" stroke-width="1"/>

  <!-- 自由内容区（虚线框占位） -->
  <rect x="64" y="160" width="1152" height="440" fill="none" stroke="#C8CDD2" stroke-width="1" stroke-dasharray="8 6"/>
  <text x="640" y="384" text-anchor="middle" fill="#5B6770" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14">{{CONTENT_AREA}}</text>

  <!-- 页脚三件套 -->
  <line x1="64" y1="664" x2="1216" y2="664" stroke="#C8CDD2" stroke-width="0.75"/>
  <text x="64" y="686" fill="#5B6770" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11"><tspan>{{FOOTNOTE}}</tspan><tspan dx="16">来源：{{SOURCE}}</tspan></text>
  <text x="1216" y="686" text-anchor="end" fill="#5B6770" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11">{{PAGE_NUM}}</text>
</svg>
