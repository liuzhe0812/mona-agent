<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- 背景 -->
  <rect width="1280" height="720" fill="#FFFFFF"/>

  <!-- Action Title 区 -->
  <text x="64" y="60" fill="#005587" font-family="Arial, Microsoft YaHei, sans-serif" font-size="12" font-weight="bold" letter-spacing="2">{{KICKER}}</text>
  <rect x="64" y="68" width="28" height="3" fill="#005587"/>
  <text x="64" y="106" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="24" font-weight="bold">{{PAGE_TITLE}}</text>
  <text x="1216" y="60" text-anchor="end" fill="#5B6770" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11" font-weight="bold">Exhibit {{EXHIBIT_NUM}}</text>
  <line x1="64" y1="126" x2="1216" y2="126" stroke="#C8CDD2" stroke-width="1"/>

  <!-- 五步箭头流程（chevron 闭合多边形） -->
  <!-- 步骤 1 -->
  <polygon points="64,250 272,250 288,282 272,314 64,314" fill="#F4F6F8" stroke="#005587" stroke-width="1"/>
  <text x="176" y="287" text-anchor="middle" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="bold">{{STEP_1_TITLE}}</text>
  <text x="176" y="348" text-anchor="middle" fill="#5B6770" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12">{{STEP_1_DESC}}</text>

  <!-- 步骤 2 -->
  <polygon points="288,250 496,250 512,282 496,314 288,314 304,282" fill="#F4F6F8" stroke="#005587" stroke-width="1"/>
  <text x="400" y="287" text-anchor="middle" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="bold">{{STEP_2_TITLE}}</text>
  <text x="400" y="348" text-anchor="middle" fill="#5B6770" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12">{{STEP_2_DESC}}</text>

  <!-- 步骤 3（当前步：深蓝实心白字） -->
  <polygon points="512,250 720,250 736,282 720,314 512,314 528,282" fill="#005587" stroke="#005587" stroke-width="1"/>
  <text x="624" y="287" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="bold">{{STEP_3_TITLE}}</text>
  <text x="624" y="348" text-anchor="middle" fill="#5B6770" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12">{{STEP_3_DESC}}</text>

  <!-- 步骤 4 -->
  <polygon points="736,250 944,250 960,282 944,314 736,314 752,282" fill="#F4F6F8" stroke="#005587" stroke-width="1"/>
  <text x="848" y="287" text-anchor="middle" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="bold">{{STEP_4_TITLE}}</text>
  <text x="848" y="348" text-anchor="middle" fill="#5B6770" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12">{{STEP_4_DESC}}</text>

  <!-- 步骤 5 -->
  <polygon points="960,250 1168,250 1184,282 1168,314 960,314 976,282" fill="#F4F6F8" stroke="#005587" stroke-width="1"/>
  <text x="1072" y="287" text-anchor="middle" fill="#1A1A1A" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="14" font-weight="bold">{{STEP_5_TITLE}}</text>
  <text x="1072" y="348" text-anchor="middle" fill="#5B6770" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="12">{{STEP_5_DESC}}</text>

  <!-- 页脚三件套 -->
  <line x1="64" y1="664" x2="1216" y2="664" stroke="#C8CDD2" stroke-width="0.75"/>
  <text x="64" y="686" fill="#5B6770" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="11"><tspan>{{FOOTNOTE}}</tspan><tspan dx="16">来源：{{SOURCE}}</tspan></text>
  <text x="1216" y="686" text-anchor="end" fill="#5B6770" font-family="Arial, Microsoft YaHei, sans-serif" font-size="11">{{PAGE_NUM}}</text>
</svg>
