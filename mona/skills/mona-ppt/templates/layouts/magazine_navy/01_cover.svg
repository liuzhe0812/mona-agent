<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <pattern id="cover_grid" width="60" height="60" patternUnits="userSpaceOnUse" data-pptx-pattern="lgGrid">
      <rect width="60" height="60" fill="#FAF7F2"/>
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#16264C" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- 暖纸白背景 + 细微网格纹理 -->
  <rect width="1280" height="720" fill="#FAF7F2"/>
  <rect width="1280" height="720" fill="url(#cover_grid)"/>

  <!-- 顶部 kicker：金色短线 + 刊头标签（建议全大写英文） -->
  <rect x="80" y="118" width="36" height="2" fill="#C9A227"/>
  <text x="128" y="124" fill="#C9A227" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" letter-spacing="3">{{KICKER}}</text>

  <!-- 主标题 60px bold，两行：第二行 tspan 为预分行示例，单行标题时留空 -->
  <text x="80" y="250" fill="#16264C" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="60" font-weight="bold">
    <tspan x="80" dy="0">{{TITLE}}</tspan>
    <tspan x="80" dy="76"></tspan>
  </text>

  <!-- 副标题 -->
  <text x="80" y="396" fill="#8A94A6" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="20">{{SUBTITLE}}</text>

  <!-- 右下角金色矩形色块 + 深蓝描边错位框 -->
  <rect x="990" y="420" width="200" height="140" fill="none" stroke="#16264C" stroke-width="1"/>
  <rect x="1000" y="430" width="200" height="140" fill="#C9A227"/>

  <!-- 中部偏下发丝线 -->
  <line x1="80" y1="600" x2="1200" y2="600" stroke="#D8D2C4" stroke-width="1"/>

  <!-- 线下左侧：汇报人 / 机构 -->
  <text x="80" y="640" fill="#3C4657" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15" font-weight="bold">{{PRESENTER}}</text>
  <text x="80" y="666" fill="#8A94A6" font-family="Microsoft YaHei, SimHei, sans-serif" font-size="13">{{ORGANIZATION}}</text>

  <!-- 线下右侧：日期 -->
  <text x="1200" y="640" text-anchor="end" fill="#8A94A6" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14">{{DATE}}</text>
</svg>
