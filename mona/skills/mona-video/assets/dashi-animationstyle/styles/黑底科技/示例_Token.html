<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>黑底科技 · Token 例子（v1.3）</title>
<!--
  黑底科技（11）的 Token 例子完整页面（v1.3：按 knowledge/动效和画面变化.md 重做得更丰富，风格不变）。
  参考的是一条黑金风格的知识短视频（看帧也看了动法）：深藏青近黑的底 + 一团暖金光晕 + 胶片颗粒和虚化光点；
  衬线字（思源宋体 / 宋体-简 / Baskerville），标题金色渐变带辉光；金色细线一笔笔画出来（圆环、分叉线、括号、竖线）；
  左上角大号金色编号换段时像里程表一样滚动；底部米白衬线字幕逐字虚化浮现，「成都」印章红、「旅行」金块。
  画面只由时间 t 计算：window.seek(t)；render 开头把画布状态整套复位，同一个 t 永远画出同一帧（v1.3 修：以前和 seek 先后有关）。
  内容和时间全部来自 timeline.js（window.TL）：镜头起止用 TL.shots，动作卡在 TL.mark('关键词') 上，例句和切分用 TL.example，
  数据用 TL.data，字幕用 TL.cueAt(t)。转场和粒子用 动效部件.js（window.动效）。
  背景层（v1.3，一直在动）：远景星尘（0.15 倍视差，几颗星慢慢闪）、金线轨道（3 道大椭圆 + 走动的金珠，0.25 倍）、
  细线网格（坐标纸，慢慢斜着流，0.35 倍）、暖金光晕（跟着主体走、呼吸）、虚化光点和近景金粉（往上飘）。
  转场（v1.3）：开头 CRT 开机 → 镜头 2 由虚到实（窗口退后变虚、消息浮到眼前）→ 镜头 3 光速推移 → 镜头 4 推进圆环 + 暖白闪光（全片唯一一次闪光）
  → 镜头 5 扫描线扫过 → 镜头 6 金线描出数据区 → 镜头 7 轻故障撕裂 → 镜头 8 CRT 关机再开机。
  两个场景：A（镜头 1–3）立体小方块 → 聊天窗口 → 金线圆环「AI」；B（镜头 4–8）分词器 → Token → 海量数据 → 推断出「旅行需求」。
-->
<style>
  html, body { margin: 0; padding: 0; background: #06080c; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  #stage canvas { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<script src="timeline.js"></script>
<script src="动效部件.js"></script>
<script>
'use strict';
const W = 1920, H = 1080, TAU = Math.PI * 2;
const TL = window.TL;
const M = (k) => TL.mark(k), ME = (k) => TL.markEnd(k);
const SH = (k) => TL.shots[k - 1];

// ---------- 字体 ----------
// 中文：思源宋体（用户装在 ~/Library/Fonts，开源）→ 没有时换成系统自带的宋体-简（Light/Regular/Bold/Black 四档）
// 西文和数字：Baskerville（macOS 自带）；斜体也用它
const F_CN = '"Source Han Serif SC", "Songti SC", "STSong", serif';
const F_LAT = '"Baskerville", "Source Han Serif SC", "Songti SC", serif';
const fcn = (w, s) => `${w} ${s}px ${F_CN}`;
const flat = (w, s, it) => `${it ? 'italic ' : ''}${w} ${s}px ${F_LAT}`;

// ---------- 配色（取自参考视频的画面，用途见 风格卡.md「配色」） ----------
const C = {
  bg0: '#05070b', bg1: '#0b0f15', bg2: '#090d13',          // 深藏青近黑（引语那场 #06080d / #090d13）
  glow: [62, 50, 32],                                        // 暖金光晕（标题后面 #2e281e、#403726）
  gold: '#e5cf95',                                           // 年份数字、金色关键词（最亮处 #e5cf95）
  goldHi: '#faefcc', goldLt: '#f2e3b8', goldMid: '#ddc994', goldDeep: '#ae915c', goldDk: '#5e4f32',   // 标题金色渐变
  coin1: '#f7e9bc', coin2: '#e5ca89', coin3: '#cdac6a', coin4: '#b28e4f', coin5: '#8c6330',          // 金币
  line: '#c1bea8', line2: '#a19c85', line3: '#746f61', rule: '#554e39',                             // 细线：分叉树 / 钉板框 / 命运之轮 / 年份下的横线
  cream: '#e2dfd3', white: '#f1efe4', gray: '#8c877b', gray2: '#625b52',                            // 字幕米白 / 引语白 / 说明灰 / 小字灰
  card: '#1a1713', cardLine: '#373334',                                                             // 数据卡片底和边
  red: '#b1312a', redDk: '#962621', redTx: '#fee5d5', redLn: '#fcd0c0',                             // 印章红（成都）
  ivoryHi: '#f5ebd5', ivory: '#ede5ca', ivoryMid: '#d9cca9', ivoryDk: '#6a5c3c',                    // 象牙色骰子
  dot: '#7b7a76', ball: '#fcfbe4', ink: '#1a130a',                                                  // 点阵粒子 / 钉板珠子 / 金底上的深字
};
// 例句切出的 8 个 Token：成都 = 印章红、旅行 = 金（全片固定），其余 6 块是深色玻璃块
const TOK = TL.example.tokens.map((t) => ({ t, kind: t === '成都' ? 'red' : t === '旅行' ? 'gold' : 'dark' }));
const NT = TOK.length;
const I_CD = TOK.findIndex((k) => k.t === '成都'), I_LX = TOK.findIndex((k) => k.t === '旅行');

// ---------- 小工具 ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const P = (t, a, d) => clamp((t - a) / d);
const outC = (p) => 1 - Math.pow(1 - p, 3);
const outQ = (p) => 1 - Math.pow(1 - p, 5);
const inQ = (p) => p * p;
const inOutC = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const outBack = (p, k = 1.4) => 1 + (k + 1) * Math.pow(p - 1, 3) + k * Math.pow(p - 1, 2);
const sine = (p) => 0.5 - 0.5 * Math.cos(Math.PI * p);
const bump = (t, a, d) => Math.sin(Math.PI * P(t, a, d));      // 0 → 1 → 0
const qb = (a, c, b, u) => (1 - u) * (1 - u) * a + 2 * (1 - u) * u * c + u * u * b;
const cb = (a, c1, c2, b, u) => { const v = 1 - u; return v * v * v * a + 3 * v * v * u * c1 + 3 * v * u * u * c2 + u * u * u * b; };
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgba(h, a) { const [r, gg, b] = Array.isArray(h) ? h : hex(h); return `rgba(${r},${gg},${b},${a})`; }
function mix(a, b, p) { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * p)).join(',')})`; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const cv = document.getElementById('c');
let g = cv.getContext('2d');          // let：镜头 2 的「变虚」要把窗口画进半分辨率的离屏画布，临时换 g
const wCache = new Map();
function tw(s, f) { const k = f + '|' + s; let v = wCache.get(k); if (v === undefined) { g.save(); g.font = f; v = g.measureText(s).width; g.restore(); wCache.set(k, v); } return v; }
function text(s, x, y, f, col, align = 'center', base = 'middle') { g.font = f; g.fillStyle = col; g.textAlign = align; g.textBaseline = base; g.fillText(s, x, y); }
function rrect(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
// 按长度画出一条路径的前 p（用虚线技巧）：细线「一笔画出来」全靠它
function strokeP(pathFn, len, p, width, col, cap = 'round') {
  if (p <= 0) return;
  g.save(); g.lineWidth = width; g.strokeStyle = col; g.lineCap = cap; g.lineJoin = 'round';
  if (p < 1) g.setLineDash([len * p, len + 10]);
  pathFn(); g.stroke(); g.restore();
}
// 金色渐变填充（上亮下深，像原片的标题字）
function goldGrad(y0, y1) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, C.goldHi); gr.addColorStop(0.42, C.goldMid); gr.addColorStop(0.78, C.goldDeep); gr.addColorStop(1, C.coin5);
  return gr;
}
function coinGrad(y0, y1) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, C.coin1); gr.addColorStop(0.35, C.coin2); gr.addColorStop(0.75, C.coin3); gr.addColorStop(1, C.coin4);
  return gr;
}

// ---------- 逐字虚化浮现（原片字幕、引语、标题都是这样一个字一个字出来的） ----------
// 每个字：透明度 0→1、模糊 b→0、往上浮 dy→0；stag 是字与字的间隔
function revealText(str, x, y, f, fill, t, t0, opts = {}) {
  const { align = 'center', dur = 0.22, stag = 0.035, blur = 7, dy = 10, glow = 0, glowCol = null, alpha = 1 } = opts;
  if (alpha <= 0 || t < t0) return;
  const total = tw(str, f);
  const x0 = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
  g.save(); g.font = f; g.textAlign = 'left'; g.textBaseline = 'middle';
  const done = t >= t0 + stag * (str.length - 1) + dur;
  if (glow > 0) { g.shadowColor = glowCol || rgba(C.gold, 0.5); g.shadowBlur = glow; }
  g.fillStyle = typeof fill === 'function' ? fill() : fill;
  if (done) { g.globalAlpha = alpha; g.fillText(str, x0, y); g.restore(); return; }
  let xx = x0;
  for (let i = 0; i < str.length; i++) {
    const ch = str[i], cw = tw(ch, f);
    const p = P(t, t0 + i * stag, dur);
    if (p > 0) {
      const q = outC(p);
      g.globalAlpha = alpha * q;
      if (q < 0.98) g.filter = `blur(${((1 - q) * blur).toFixed(2)}px)`;
      g.fillText(ch, xx, y + (1 - q) * dy);
      g.filter = 'none';
    }
    xx += cw;
  }
  g.restore();
}

// ---------- 背景：深藏青近黑 + 颗粒（只生成一次） ----------
const BG = canvas(W, H);
(() => {
  const b = BG.getContext('2d');
  const lg = b.createLinearGradient(0, 0, W * 0.4, H);
  lg.addColorStop(0, C.bg1); lg.addColorStop(0.55, C.bg2); lg.addColorStop(1, C.bg0);
  b.fillStyle = lg; b.fillRect(0, 0, W, H);
  // 颗粒：半分辨率随机灰点，放大两倍铺上去（原片有很细的胶片颗粒）
  const gw = W / 2, gh = H / 2, gc = canvas(gw, gh), gx = gc.getContext('2d'), id = gx.createImageData(gw, gh), rnd = mulberry32(7);
  for (let i = 0; i < gw * gh; i++) { const v = rnd() * 255; id.data[i * 4] = v; id.data[i * 4 + 1] = v; id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 13; }
  gx.putImageData(id, 0, 0);
  b.imageSmoothingEnabled = false; b.drawImage(gc, 0, 0, W, H);
})();
// 暗角（四周压暗），盖在画面内容上面
const VIG = canvas(W, H);
(() => {
  const v = VIG.getContext('2d');
  const rg = v.createRadialGradient(W / 2, H * 0.45, H * 0.35, W / 2, H * 0.45, H * 1.05);
  rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(0.7, 'rgba(1,2,4,0.35)'); rg.addColorStop(1, 'rgba(1,2,4,0.72)');
  v.fillStyle = rg; v.fillRect(0, 0, W, H);
})();
// 暖金光晕精灵图（缓存，逐帧只缩放贴上去）
const GLOW = canvas(512, 512);
(() => {
  const x = GLOW.getContext('2d'), rg = x.createRadialGradient(256, 256, 0, 256, 256, 256);
  rg.addColorStop(0, rgba(C.glow, 0.62)); rg.addColorStop(0.35, rgba(C.glow, 0.34)); rg.addColorStop(0.7, rgba(C.glow, 0.1)); rg.addColorStop(1, rgba(C.glow, 0));
  x.fillStyle = rg; x.fillRect(0, 0, 512, 512);
})();
// 亮点精灵（虚化光点、金粉、辉光）
const SPOT = canvas(128, 128);
(() => {
  const x = SPOT.getContext('2d'), rg = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  rg.addColorStop(0, 'rgba(255,246,222,1)'); rg.addColorStop(0.18, 'rgba(250,236,200,0.75)'); rg.addColorStop(0.5, 'rgba(229,207,149,0.22)'); rg.addColorStop(1, 'rgba(229,207,149,0)');
  x.fillStyle = rg; x.fillRect(0, 0, 128, 128);
})();
const BOKEH = canvas(64, 64);
(() => {
  const x = BOKEH.getContext('2d'), rg = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  rg.addColorStop(0, 'rgba(214,200,170,0.9)'); rg.addColorStop(0.55, 'rgba(214,200,170,0.5)'); rg.addColorStop(1, 'rgba(214,200,170,0)');
  x.fillStyle = rg; x.fillRect(0, 0, 64, 64);
})();
// 字幕区底下一层很淡的暗带，保证字幕对比
const SUBBAND = canvas(W, 240);
(() => {
  const x = SUBBAND.getContext('2d'), lg = x.createLinearGradient(0, 0, 0, 240);
  lg.addColorStop(0, 'rgba(2,3,5,0)'); lg.addColorStop(0.45, 'rgba(2,3,5,0.45)'); lg.addColorStop(1, 'rgba(2,3,5,0.7)');
  x.fillStyle = lg; x.fillRect(0, 0, W, 240);
})();
function glowAt(x, y, rx, ry, a) { if (a <= 0) return; g.save(); g.globalAlpha = a; g.drawImage(GLOW, x - rx, y - ry, rx * 2, ry * 2); g.restore(); }
function spot(x, y, r, a) { if (a <= 0 || r <= 0) return; g.save(); g.globalAlpha = Math.min(1, a); g.drawImage(SPOT, x - r, y - r, r * 2, r * 2); g.restore(); }

// 虚化光点：原片画面里总飘着几颗大小不一的虚光点，很慢地漂
const BOK = (() => { const r = mulberry32(11), a = []; for (let i = 0; i < 34; i++) a.push({ x: r() * W, y: r() * H, s: 3 + Math.pow(r(), 2.2) * 26, a: 0.05 + r() * 0.16, vx: (r() - 0.5) * 14, vy: -3 - r() * 9, ph: r() * TAU, par: 0.04 + r() * 0.16 }); return a; })();
function drawBokeh(t, cam) {
  for (const b of BOK) {
    let x = (b.x + b.vx * t - (cam.x - 960) * b.par) % (W + 80), y = (b.y + b.vy * t) % (H + 80);
    if (x < -40) x += W + 80; if (y < -40) y += H + 80;
    const a = b.a * (0.75 + 0.25 * Math.sin(t * 0.9 + b.ph));
    g.globalAlpha = a; g.drawImage(BOKEH, x - b.s, y - b.s, b.s * 2, b.s * 2);
  }
  g.globalAlpha = 1;
}

// ---------- v1.3 背景层：一直在动，层和层速度不一样（视差）；全部只画到字幕带上沿 ----------
const BG_BOTTOM = 905;
// 远景星尘（0.15 倍视差 + 每秒往左漂 5 像素）：300 颗小星一次画好，每帧整张平移；另有 16 颗慢慢闪
const STARS = canvas(W + 240, H + 160);
(() => {
  const s = STARS.getContext('2d'), r = mulberry32(31);
  for (let i = 0; i < 300; i++) {
    const big = r() < 0.08, a = big ? 0.32 + r() * 0.3 : 0.07 + r() * 0.2;
    s.fillStyle = `rgba(236,226,200,${a.toFixed(3)})`; s.beginPath(); s.arc(r() * STARS.width, r() * STARS.height, big ? 1.3 + r() * 0.9 : 0.6 + r() * 0.7, 0, TAU); s.fill();
  }
})();
const TWINK = (() => { const r = mulberry32(37), a = []; for (let i = 0; i < 16; i++) a.push({ x: r() * W, y: 40 + r() * 820, ph: r() * TAU, f: 0.7 + r() * 1.2, s: 9 + r() * 12 }); return a; })();
function drawStars(t, cam) {
  const ox = -((t * 5 + (cam.x - 960) * 0.15) % 240 + 240) % 240, oy = -((((cam.y - 470) * 0.15) % 160) + 160) % 160;
  g.save(); g.beginPath(); g.rect(0, 0, W, BG_BOTTOM); g.clip();
  g.drawImage(STARS, ox, oy);
  for (const s of TWINK) {
    const a = 0.5 + 0.5 * Math.sin(t * s.f * 2 + s.ph);
    spot((s.x - t * 5 - (cam.x - 960) * 0.15 + 4 * W) % W, s.y - (cam.y - 470) * 0.15, s.s * (0.7 + 0.3 * a), 0.12 + 0.3 * a * a);
  }
  g.restore();
}
// 细线网格（坐标纸：96 像素一格，交点一个小十字；中间清楚、四周和下面淡掉），每秒斜着流 9 / −5 像素，0.35 倍视差
const GRID = 96, GRIDC = canvas(W + GRID * 2, H + GRID * 2);
(() => {
  const x = GRIDC.getContext('2d'), w = GRIDC.width, h = GRIDC.height;
  x.strokeStyle = 'rgb(229,207,149)'; x.lineWidth = 1; x.globalAlpha = 0.055; x.beginPath();
  for (let gx = 0.5; gx <= w; gx += GRID) { x.moveTo(gx, 0); x.lineTo(gx, h); }
  for (let gy = 0.5; gy <= h; gy += GRID) { x.moveTo(0, gy); x.lineTo(w, gy); }
  x.stroke();
  x.globalAlpha = 0.28; x.beginPath();
  for (let gx = 0.5; gx <= w; gx += GRID) for (let gy = 0.5; gy <= h; gy += GRID) { x.moveTo(gx - 4, gy); x.lineTo(gx + 4, gy); x.moveTo(gx, gy - 4); x.lineTo(gx, gy + 4); }
  x.stroke();
  x.globalAlpha = 1; x.globalCompositeOperation = 'destination-in';
  const rg = x.createRadialGradient(w / 2, h * 0.43, 160, w / 2, h * 0.43, w * 0.52);
  rg.addColorStop(0, 'rgba(0,0,0,1)'); rg.addColorStop(0.55, 'rgba(0,0,0,0.6)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = rg; x.fillRect(0, 0, w, h);
  const lg = x.createLinearGradient(0, h * 0.62, 0, h * 0.86); lg.addColorStop(0, 'rgba(0,0,0,1)'); lg.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = lg; x.fillRect(0, 0, w, h);
})();
function drawGrid(t, cam, a = 1) {
  if (a <= 0) return;
  const zs = 1 + (cam.z - 1) * 0.35;
  const ox = ((t * 9 - (cam.x - 960) * 0.35) % GRID + GRID) % GRID, oy = ((-t * 5 - (cam.y - 470) * 0.35) % GRID + GRID) % GRID;
  g.save(); g.beginPath(); g.rect(0, 0, W, BG_BOTTOM); g.clip(); g.globalAlpha = a;
  g.translate(FX, FY); g.scale(zs, zs); g.translate(-FX, -FY);
  g.drawImage(GRIDC, ox - GRID * 1.5, oy - GRID * 1.5);
  g.restore();
}
// 金线轨道（参考里藏青星空那一场的大椭圆）：3 道很淡的椭圆慢慢转，各有一颗金珠沿着走；0.25 倍视差
const ORB = [{ rx: 1040, ry: 300, a: 0.11, sp: 0.06, ph: 0.4 }, { rx: 790, ry: 226, a: 0.09, sp: -0.085, ph: 2.3 }, { rx: 560, ry: 158, a: 0.075, sp: 0.11, ph: 4.4 }];
function drawOrbits(t, cam, a = 1) {
  if (a <= 0) return;
  const cx = 960 - (cam.x - 960) * 0.25, cy = 520 - (cam.y - 470) * 0.25, zs = 1 + (cam.z - 1) * 0.25, rot = -0.2 + t * 0.008;
  const cr = Math.cos(rot), sr = Math.sin(rot);
  g.save(); g.beginPath(); g.rect(0, 0, W, BG_BOTTOM); g.clip(); g.globalAlpha = a;
  g.lineWidth = 1.1;
  for (const o of ORB) { g.strokeStyle = rgba(C.gold, o.a); g.beginPath(); g.ellipse(cx, cy, o.rx * zs, o.ry * zs, rot, 0, TAU); g.stroke(); }
  for (const o of ORB) {
    const an = o.ph + t * o.sp, ex = Math.cos(an) * o.rx * zs, ey = Math.sin(an) * o.ry * zs;
    const x = cx + ex * cr - ey * sr, y = cy + ex * sr + ey * cr;
    spot(x, y, 26, 0.55 * a); g.fillStyle = rgba(C.goldHi, 0.9 * a); g.beginPath(); g.arc(x, y, 2.6, 0, TAU); g.fill();
  }
  g.restore();
}

// ---- AI：金线画的大圆环（对应原片的「命运之轮」），慢慢转 ----
const RING_TXT = 'INTELLIGENTIA · ARTIFICIALIS · LINGUA · SIGNA · VERBA · ';
function circleP(x, y, r, p, w, col, a0 = -Math.PI / 2) {

}
function drawWheel(t) {
  const t0 = M('AI') - 0.06; if (t < t0) return;
  const { x, y, R } = WHEEL;
  const rot = (t - t0) * 0.24;
  const p1 = outC(P(t, t0, 0.6)), p2 = outC(P(t, t0 + 0.14, 0.55)), p3 = P(t, t0 + 0.3, 0.45);
  const arrive = P(t, PEL_T1 - 0.02, 0.3);                    // Prompt 到了：圆环亮一下
  glowAt(x, y, R * 2.1, R * 2.1, 0.55 * p1 + 0.35 * bump(t, PEL_T1 - 0.05, 0.5));
  circleP(x, y, R, p1, 1.8, C.line2, rot - Math.PI / 2);
  circleP(x, y, R - 18, p1, 1, C.line3, -rot - Math.PI / 2);
  circleP(x, y, R - 62, p2, 1.5, C.line2, rot);

    const rr = R - 40; let ang = rot * 0.6 - Math.PI / 2;
    for (const ch of RING_TXT) {
      const cw = (tw(ch, g.font) + 5) / rr;
      ang += cw / 2;
      g.save(); g.translate(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr); g.rotate(ang + Math.PI / 2); g.fillText(ch, 0, 0); g.restore();
      ang += cw / 2;
      if (ang > rot * 0.6 - Math.PI / 2 + TAU - 0.05) break;
    }
    g.restore();
  }
  // 8 根辐条 + 节点；外圈 8 个小圆
  for (let k = 0; k < 8; k++) {
    const an = rot + k * TAU / 8, c = Math.cos(an), s = Math.sin(an);
    const r0 = 66, r1 = R - 62, re = lerp(r0, r1, p2);
    if (p2 > 0) { g.strokeStyle = rgba(C.line3, 1); g.lineWidth = 1.3; g.beginPath(); g.moveTo(x + c * r0, y + s * r0); g.lineTo(x + c * re, y + s * re); g.stroke(); }
    const nm = lerp(r0, r1, 0.55);

  }
  // 中心：双圈 + 金色 AI
  circleP(x, y, 66, p1, 1.8, C.line, 0);
  circleP(x, y, 50, p2, 1, C.line3, 0);
  if (p3 > 0) {
    g.save(); g.globalAlpha = p3; g.shadowColor = rgba(C.gold, 0.6); g.shadowBlur = 24 + 30 * bump(t, PEL_T1 - 0.05, 0.5);
    g.font = flat(600, 64); g.fillStyle = goldGrad(y - 30, y + 30); g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('AI', x, y + 3); g.restore();
  }

  // 标签：AI · 模型（圆环下面）

// ---- Prompt 飞向 AI：消息里的字收成一粒光，拖着金线飞进圆环中心 ----

// ---- 句子和 8 块的位置 ----
const ST = { x: 960, y: 470, f: fcn(700, 72) };

const QBX = TWD.map((w, i) => 960 + 40 - QBW / 2 + TWD.slice(0, i).reduce((a, b) => a + b * QB.s, 0) + QB.gap * i + w * QB.s / 2);
const PAIR = { x: 520, ya: 398, yb: 542, s: 0.86 };          // 镜头 8：成都、旅行两块停在左边

// ---- Token 块：深色玻璃（6 块）/ 印章红（成都）/ 金（旅行） ----
function tileShape(x, y, w, h, kind, a, opts = {}) {

    g.fillStyle = lg; rrect(x - w / 2, y - h / 2, w, h, r); g.fill();

    g.fillStyle = 'rgba(255,248,230,0.07)'; g.fillRect(x - w / 2 + r, y - h / 2 + 1.5, w - 2 * r, 1.5);

    g.fillStyle = lg; rrect(x - w / 2, y - h / 2, w, h, r); g.fill();
    g.strokeStyle = rgba(C.redLn, 0.55); g.lineWidth = 1.5; rrect(x - w / 2 + 6 * (h / TILE.h), y - h / 2 + 6 * (h / TILE.h), w - 12 * (h / TILE.h), h - 12 * (h / TILE.h), r * 0.55); g.stroke();
    if (opts.rim) { g.strokeStyle = rgba(C.goldLt, opts.rim); g.lineWidth = 2.5; rrect(x - w / 2 - 5, y - h / 2 - 5, w + 10, h + 10, r + 4); g.stroke(); }
  } else {

    g.fillStyle = C.coin5; rrect(x - w / 2, y - h / 2 + 5 * (h / TILE.h), w, h, r); g.fill();

    g.strokeStyle = rgba(C.ink, 0.3); g.lineWidth = 1.5; rrect(x - w / 2 + 6 * (h / TILE.h), y - h / 2 + 6 * (h / TILE.h), w - 12 * (h / TILE.h), h - 12 * (h / TILE.h), r * 0.55); g.stroke();
    if (opts.rim) { g.strokeStyle = rgba(C.goldLt, opts.rim); g.lineWidth = 2.5; rrect(x - w / 2 - 5, y - h / 2 - 5, w + 10, h + 10, r + 4); g.stroke(); }
  }

    const bx = x - w / 2 - 60 + (w + 120) * opts.glint;

    g.fillStyle = lg; g.beginPath(); g.moveTo(bx - 40, y - h / 2); g.lineTo(bx + 60, y - h / 2); g.lineTo(bx + 40, y + h / 2); g.lineTo(bx - 60, y + h / 2); g.closePath(); g.fill();
    g.restore();
  }

}
const tileTextCol = (kind) => (kind === 'red' ? C.redTx : kind === 'gold' ? C.ink : C.white);
function drawTile(i, x, y, s, a, opts = {}) {

// ---- 每块在某一时刻的位置：句子 → 切开 → 变成块 → 排成一排 → 飞到检索条 → （成都、旅行）飞去推断 ----
function tokState(t, i) {
  const sep = outC(P(t, SPLIT + 0.02, 0.38));

  const fly = inOutC(P(t, SH(6).start + 0.2 + i * 0.03, 0.55));       // 镜头 6：等镜头拉开了再飞到顶上检索条（不碰左上编号）
  y += 2.5 * Math.sin(2.2 * t + i * 0.9) * P(t, TILEUP + 0.45, 0.4) * (1 - fly);   // 排好后轻轻浮动（次要动作）

    const f2 = inOutC(P(t, SH(8).start + 0.02, 0.46));                // 镜头 8：飞到左边，上下排好
    if (f2 > 0) { const ty = i === I_CD ? PAIR.ya : PAIR.yb; x = qb(QBX[i], (QBX[i] + PAIR.x) / 2 + 60, PAIR.x, f2); y = qb(QB.y, QB.y + 40, ty, f2); s = lerp(QB.s, PAIR.s, f2); }
  } else {
    a = (1 - P(t, SH(8).start - 0.04, 0.04));                          // 镜头 8 是 CRT 关机再开机：切点前一刻收掉，开机后画面是干净的
  }
  return { x, y, s, a, tp, sep };
}
function drawTokens(t) {
  if (t < CUTB) return;

    const glint = P(t, M('最小的语言碎片') + i * 0.11, 0.34);
    tileShape(st.x, st.y, w, h, k.kind, st.a * st.tp, { rim, glint });
    g.save(); g.globalAlpha = st.a;
    text(k.t, st.x, st.y + 3 * st.s, fcn(700, 72 * st.s), st.tp < 1 ? mix(C.white, tileTextCol(k.kind), st.tp) : tileTextCol(k.kind));

}
// ---- 分词器：金线框 + 7 根竖线（像原片钉板下面的格子），说到「拆分」时一根根亮起、句子裂开 ----
function drawTokenizer(t) {
  const t0 = M('分词器') - 0.1; if (t < t0) return;

  for (let k = 0; k < 4; k++) { const an = k * Math.PI / 2; g.beginPath(); g.moveTo(x + Math.cos(an) * (r - 14), y + Math.sin(an) * (r - 14)); g.lineTo(x + Math.cos(an) * (r + 16), y + Math.sin(an) * (r + 16)); g.stroke(); }
  g.fillStyle = C.goldHi; g.beginPath(); g.arc(x, y, 3, 0, TAU); g.fill();
  g.restore();
}
// ---- 顶上的检索条：细线框 + 金色小放大镜，8 块缩小排在里面 ----
function drawQueryBar(t) {
  const p = outC(P(t, SH(6).start + 0.45, 0.5)), fade = (1 - P(t, SH(8).start - 0.04, 0.04));
  if (p <= 0 || fade <= 0) return;
  const L = QBX[0] - TWD[0] * QB.s / 2 - 74, R = QBX[NT - 1] + TWD[NT - 1] * QB.s / 2 + 22, T = QB.y - 40, Hh = 80;
  g.save(); g.globalAlpha = fade;
  g.fillStyle = rgba('#0e0f13', 0.7 * p); rrect(L, T, R - L, Hh, 40); g.fill();
  strokeP(() => rrect(L, T, R - L, Hh, 40), 2 * (R - L) + 2 * Hh, p, 1.5, rgba(C.line2, 0.75), 'butt');
  const ia = P(t, SH(6).start + 0.7, 0.3);
  if (ia > 0) { g.globalAlpha = fade * ia; g.strokeStyle = C.gold; g.lineWidth = 2.5; g.beginPath(); g.arc(L + 38, QB.y - 3, 12, 0, TAU); g.stroke(); g.beginPath(); g.moveTo(L + 47, QB.y + 6); g.lineTo(L + 56, QB.y + 15); g.stroke(); }
  g.restore();
}
// ---- 字签：「海量数据 Training Data」（左上）、「常常一起出现」（右上），底下垫一层暗光保证看得清 ----
function labelBacking(x, y, w, h, a) { if (a <= 0) return; g.save(); g.globalAlpha = a; g.fillStyle = 'rgba(5,7,10,0.82)'; g.filter = 'blur(14px)'; rrect(x - 20, y - h / 2 - 8, w + 40, h + 16, 30); g.fill(); g.restore(); }
function drawFieldLabels(t) {
  const fade = (1 - P(t, SH(8).start - 0.04, 0.04)); if (fade <= 0) return;
  const y = 330;
  const t1 = M('海量数据') - 0.06;
  if (t >= t1 - 0.05) {
    const f1 = fcn(900, 56), w1 = tw('海量数据', f1), x = 214;
    labelBacking(x, y, w1 + 260, 70, fade * P(t, t1 - 0.05, 0.2));
    g.save(); g.globalAlpha = fade;
    revealText('海量数据', x, y, f1, () => goldGrad(y - 28, y + 28), t, t1, { align: 'left', stag: 0.06, dur: 0.26, glow: 20 });
    revealText('Training Data', x + w1 + 20, y + 5, flat(400, 36, true), C.gray, t, t1 + 0.18, { align: 'left', stag: 0.02 });
    g.restore();
  }
  const t2 = CO + 0.05;
  if (t >= t2 - 0.05) {
    const f2 = fcn(900, 52), w2 = tw('常常一起出现', f2), xr = 1706;
    labelBacking(xr - w2 - 96, y, w2 + 96, 66, fade * P(t, t2 - 0.05, 0.2));
    g.save(); g.globalAlpha = fade;
    // 小图标：红点、金点之间一道金弧
    const ip = outC(P(t, t2, 0.3)), ix = xr - w2 - 70;
    if (ip > 0) {
      g.globalAlpha = fade * ip;
      g.fillStyle = C.red; g.beginPath(); g.arc(ix - 22, y + 8, 7, 0, TAU); g.fill();
      g.fillStyle = C.coin3; g.beginPath(); g.arc(ix + 22, y + 8, 7, 0, TAU); g.fill();
      g.strokeStyle = C.goldLt; g.lineWidth = 2; g.beginPath(); g.moveTo(ix - 22, y - 2); g.quadraticCurveTo(ix, y - 26, ix + 22, y - 2); g.stroke();
      g.globalAlpha = fade;
    }
    revealText('常常一起出现', xr, y, f2, () => goldGrad(y - 26, y + 26), t, t2 + 0.05, { align: 'right', stag: 0.05, dur: 0.26, glow: 18 });
    g.restore();
  }
}

// =====================================================================
// 镜头 8：成都、旅行两块上下排好，两条金线像原片的分叉树倒过来汇成一点「推断」，一根线引出结论；
// 结论做成原片片头那样的标题卡：金色渐变大字 + 背后放射细光 + 上方字距拉开的西文 + 下方钟形曲线，扫一道光「点亮」
// =====================================================================
const INF = M('推断'), CONC_T = M('旅行的需求') - 0.04;
const CONC_W = tw('旅行需求', CONC.f);
const RAYS = (() => { const r = mulberry32(77), a = []; for (let i = 0; i < 60; i++) a.push({ an: i * TAU / 60 + (r() - 0.5) * 0.05, l: 260 + r() * 200, a: 0.05 + r() * 0.1 }); return a; })();
const SPARK = (() => { const r = mulberry32(91), a = []; for (let i = 0; i < 26; i++) a.push({ x: CONC.x + (r() - 0.5) * 820, y: CONC.y + 40 + (r() - 0.5) * 260, v: 18 + r() * 40, s: 1 + r() * 2.2, ph: r() * TAU, d: r() * 0.6 }); return a; })();
function branchPath(fromY) {
  const x0 = PAIR.x + TWD[I_CD] * PAIR.s / 2 + 12;
  g.beginPath(); g.moveTo(x0, fromY); g.bezierCurveTo(x0 + 90, fromY, NODE.x - 66, NODE.y, NODE.x, NODE.y);
}
function drawInference(t) {
  if (t < SH(8).start) return;
  // 两条分叉线（从两块的右边汇到一点）
  const bp = outC(P(t, INF + 0.16, 0.34));
  if (bp > 0) for (const yy of [PAIR.ya, PAIR.yb]) strokeP(() => branchPath(yy), 260, bp, 2, C.line);
  // 汇合点：金色实心小圆 + 外圈
  const np = outBack(P(t, INF + 0.44, 0.3));
  if (np > 0) {
    spot(NODE.x, NODE.y, 90 * np, 0.5);
    g.fillStyle = C.goldLt; g.beginPath(); g.arc(NODE.x, NODE.y, 8 * np, 0, TAU); g.fill();
    g.strokeStyle = rgba(C.gold, 0.8); g.lineWidth = 1.5; g.beginPath(); g.arc(NODE.x, NODE.y, 18 * np, 0, TAU); g.stroke();
  }
  // 「推断」（上）+ 斜体 Inference（下）
  revealText('推断', NODE.x, NODE.y - 68, fcn(900, 50), () => goldGrad(NODE.y - 92, NODE.y - 44), t, INF - 0.04, { stag: 0.08, dur: 0.26, glow: 16 });
  revealText('Inference', NODE.x, NODE.y + 64, flat(400, 32, true), C.gray, t, INF + 0.1, { stag: 0.02 });
  // 一根线引向结论，末端小箭头；画完后有光点顺着线流过去
  const x0 = NODE.x + 26, x1 = CONC.x - CONC_W / 2 - 40;
  const lp = outC(P(t, INF + 0.5, 0.48));
  if (lp > 0) {
    const xe = lerp(x0, x1, lp);
    const lg = g.createLinearGradient(x0, 0, x1, 0); lg.addColorStop(0, rgba(C.line, 0.9)); lg.addColorStop(1, C.goldLt);
    g.strokeStyle = lg; g.lineWidth = 2; g.beginPath(); g.moveTo(x0, NODE.y); g.lineTo(xe, NODE.y); g.stroke();
    g.strokeStyle = C.goldLt; g.lineWidth = 2; g.lineCap = 'round'; g.beginPath(); g.moveTo(xe - 12, NODE.y - 9); g.lineTo(xe, NODE.y); g.lineTo(xe - 12, NODE.y + 9); g.stroke();
    if (lp >= 1) for (let k = 0; k < 3; k++) { const u = ((t - INF - 0.98) * 0.9 + k / 3) % 1; spot(lerp(x0, x1, u), NODE.y, 26, 0.7 * Math.sin(Math.PI * u)); }
  }
}
function drawConclusion(t) {
  if (t < CONC_T - 0.1) return;
  const { x, y } = CONC;
  const p = P(t, CONC_T, 0.5);
  // 背后：一大团暖光 + 放射细光（慢慢转）
  glowAt(x, y, 760, 520, 0.9 * outC(p));
  spot(x, y, 420, (0.22 + 0.25 * bump(t, CONC_T + 0.3, 0.7)) * outC(p));
  if (p > 0) {
    g.save(); g.lineCap = 'round';
    const rot = (t - CONC_T) * 0.03;
    for (const r of RAYS) {
      const c = Math.cos(r.an + rot), s = Math.sin(r.an + rot), r0 = 120, r1 = r0 + r.l * outC(p);
      const lg = g.createLinearGradient(x + c * r0, y + s * r0, x + c * r1, y + s * r1);
      lg.addColorStop(0, rgba(C.gold, r.a * 1.6)); lg.addColorStop(1, rgba(C.gold, 0));
      g.strokeStyle = lg; g.lineWidth = 1.2; g.beginPath(); g.moveTo(x + c * r0, y + s * r0); g.lineTo(x + c * r1, y + s * r1); g.stroke();
    }
    g.restore();
  }
  // 上：字距拉开的西文
  const cap = 'TRAVEL  ·  INTENT', cf = flat(400, 30);
  const capP = P(t, CONC_T + 0.22, 0.5);
  if (capP > 0) {
    g.save(); g.globalAlpha = outC(capP); g.font = cf; g.textBaseline = 'middle'; g.textAlign = 'left'; g.fillStyle = mix(C.gold, C.gray, 0.35);
    const sp = 11, wsum = [...cap].reduce((s, ch) => s + tw(ch, cf) + sp, -sp); let xx = x - wsum / 2;
    for (const ch of cap) { g.fillText(ch, xx, y - 116); xx += tw(ch, cf) + sp; }
    g.restore();
  }
  // 主标题：金色渐变大字，逐字由虚变实
  revealText('旅行需求', x, y, CONC.f, () => goldGrad(y - 70, y + 66), t, CONC_T, { stag: 0.07, dur: 0.32, glow: 34, blur: 12, dy: 16 });
  // 「点亮」：一道亮光从左扫到右（只落在字上）
  const gp = P(t, CONC_T + 0.42, 0.55);
  if (gp > 0 && gp < 1) {
    const bx = x - CONC_W / 2 - 120 + (CONC_W + 240) * gp;
    const lg = g.createLinearGradient(bx - 90, 0, bx + 90, 0);
    lg.addColorStop(0, 'rgba(255,252,240,0)'); lg.addColorStop(0.5, 'rgba(255,252,240,0.9)'); lg.addColorStop(1, 'rgba(255,252,240,0)');
    text('旅行需求', x, y, CONC.f, lg);
  }
  // 下：钟形曲线（从左往右画出来）+ 底线刻度
  const bp = outC(P(t, CONC_T + 0.15, 0.7));
  if (bp > 0) {
    const L = x - 340, R = x + 340, base = y + 152, Hc = 44, sg = 120;
    g.strokeStyle = rgba(C.line, 0.85); g.lineWidth = 1.5; g.beginPath(); g.moveTo(L, base); g.lineTo(lerp(L, R, bp), base); g.stroke();
    g.strokeStyle = rgba(C.line3, 1); g.lineWidth = 1; g.beginPath();
    for (let xx = L + 20; xx < lerp(L, R, bp); xx += 20) { const k = Math.round((xx - L) / 20); g.moveTo(xx, base); g.lineTo(xx, base + (k === 17 ? 12 : 6)); }
    g.stroke();
    g.strokeStyle = C.goldLt; g.lineWidth = 2; g.beginPath();
    for (let xx = L; xx <= lerp(L, R, bp); xx += 4) { const yy = base - Hc * Math.exp(-0.5 * ((xx - x) / sg) ** 2); xx === L ? g.moveTo(xx, yy) : g.lineTo(xx, yy); }
    g.stroke();
  }
  // 金粉：慢慢往上飘、一闪一闪
  for (const s of SPARK) {
    const a = P(t, CONC_T + 0.2 + s.d, 0.4); if (a <= 0) continue;
    const yy = s.y - (t - CONC_T) * s.v, tw2 = 0.5 + 0.5 * Math.sin(t * 5 + s.ph);
    g.globalAlpha = a * (0.35 + 0.65 * tw2); g.fillStyle = C.goldHi; g.beginPath(); g.arc(s.x, yy, s.s, 0, TAU); g.fill();
    if (s.s > 2.6) spot(s.x, yy, 14, a * tw2 * 0.6);
  }
  g.globalAlpha = 1;
}

function drawSceneB(t, cam) {
  drawInnerRings(t);
  drawConclusion(t);
  drawInference(t);
  drawFieldRules(t);
  drawField(t);
  drawCards(t);
  drawReticle(t);
  drawFieldLabels(t);
  drawQueryBar(t);
  drawTokenizer(t);
  drawTokenLabels(t);
  drawTokens(t);
}

// =====================================================================
// v1.3 转场（都在屏幕坐标里，fxAfter 调）：CRT 开机 / 关机、光速推移的速度线、扫描线扫过；故障撕裂用 动效部件.js
// =====================================================================
const TMP = canvas(W, H);
function grabFrame() { const x = TMP.getContext('2d'); resetCtx(x); x.clearRect(0, 0, W, H); x.drawImage(cv, 0, 0); return TMP; }
// CRT 开机：t0 起先一条暖白细线从中间横着拉开（0.1 秒），再上下撑开成整屏（0.22 秒）；t0 那一帧是黑屏
function crtOpen(t, t0, cy = FY) {
  if (t < t0) return;
  const ph = outC(P(t, t0, 0.1)), pv = outC(P(t, t0 + 0.1, 0.22)); if (pv >= 1) return;
  const F = pv > 0 ? grabFrame() : null;
  g.save(); g.fillStyle = '#020305'; g.fillRect(0, 0, W, H);
  if (F) { g.drawImage(F, 0, cy - cy * pv, W, H * pv); g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.45 * (1 - pv); g.drawImage(F, 0, cy - cy * pv, W, H * pv); }
  const lw = W * ph, la = 1 - pv;
  if (lw > 0) {
    g.globalCompositeOperation = 'lighter'; g.globalAlpha = la;
    g.fillStyle = 'rgba(255,243,214,0.95)'; g.fillRect(W / 2 - lw / 2, cy - 1.5, lw, 3);
    g.globalAlpha = 0.5 * la; g.drawImage(GLOW, W / 2 - lw / 2 - 60, cy - 46, lw + 120, 92);
  }
  g.restore();
}
// CRT 关机：c 前 0.26 秒整屏上下压扁、变亮，压成一条线后再往中间缩成一点；c 之后接 crtOpen 开机露出新画面
function crtClose(t, c, cy = FY) {
  if (t < c - 0.26 || t >= c) return;
  const q = P(t, c - 0.26, 0.2), qh = outC(P(t, c - 0.06, 0.06));
  const sy = Math.max(0.003, 1 - inQ(q)), sx = 1 - 0.985 * qh, x0 = W / 2 - W * sx / 2, F = grabFrame();
  g.save(); g.fillStyle = '#020305'; g.fillRect(0, 0, W, H);
  g.drawImage(F, x0, cy - cy * sy, W * sx, H * sy);
  g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.6 * q; g.drawImage(F, x0, cy - cy * sy, W * sx, H * sy);
  if (q > 0.65) { g.globalAlpha = (q - 0.65) / 0.35; g.fillStyle = 'rgba(255,243,214,0.95)'; g.fillRect(x0, cy - 1.5, W * sx, 3); g.globalAlpha *= 0.5; g.drawImage(GLOW, x0 - 60, cy - 46, W * sx + 120, 92); }
  g.restore();
}
// 光速推移：镜头横着甩过去时，一排金色速度线往左掠过（头亮尾淡），速度先快后慢
function speedLines(t, c, d) {
  const p = P(t, c, d); if (p <= 0 || p >= 1) return;
  const v = Math.sin(Math.PI * p);
  g.save(); g.beginPath(); g.rect(0, 0, W, BG_BOTTOM); g.clip(); g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
  for (let i = 0; i < 30; i++) {
    const h1 = 动效.hash(i * 3.17 + 1), h2 = 动效.hash(i * 7.31 + 2), h3 = 动效.hash(i * 1.91 + 3);
    const y = 70 + 820 * h1, len = (180 + 620 * h2) * v, span = W + 1400;
    const x = ((h3 * span - p * 3600) % span + span) % span - 500;
    const lg = g.createLinearGradient(x, 0, x + len, 0); lg.addColorStop(0, rgba(C.goldHi, (0.16 + 0.32 * h2) * v)); lg.addColorStop(1, rgba(C.goldHi, 0));
    g.strokeStyle = lg; g.lineWidth = 0.8 + 1.8 * h1 * h1; g.beginPath(); g.moveTo(x, y); g.lineTo(x + len, y); g.stroke();
  }
  g.restore();
}
// 扫描线扫过：一道暖金亮线从上往下扫（0.55 秒），身后拖一段淡淡的横纹
const SCANPAT = canvas(W, 180);
(() => { const x = SCANPAT.getContext('2d'); for (let y = 0; y < 180; y += 4) { x.fillStyle = `rgba(229,207,149,${(0.015 + 0.11 * (y / 180) ** 2).toFixed(3)})`; x.fillRect(0, y, W, 2); } })();
function scanSweep(t, c) {
  const p = P(t, c - 0.05, 0.55); if (p <= 0 || p >= 1) return;
  const y = lerp(40, BG_BOTTOM, inOutC(p)), a = Math.sqrt(Math.sin(Math.PI * p));
  g.save(); g.beginPath(); g.rect(0, 0, W, BG_BOTTOM); g.clip(); g.globalCompositeOperation = 'lighter';
  g.globalAlpha = a; g.drawImage(SCANPAT, 0, y - 180);
  g.globalAlpha = a * 0.7; g.drawImage(GLOW, -300, y - 70, W + 600, 140);
  g.globalAlpha = a; g.fillStyle = 'rgba(255,240,205,0.6)'; g.fillRect(0, y - 1, W, 2);
  g.restore();
}

// ---------- 动效入口（v1.3）：fxBefore 在画场景前（镜头已设好）；fxAfter 在场景画完、页眉字幕之前（屏幕坐标） ----------
const CUT3 = SH(3).start, CUT5 = SH(5).start, CUT7 = SH(7).start, CUT8 = SH(8).start;
function fxBefore(t) { }
function fxAfter(t) {
  动效.particles(g, t, { kind: '光点', n: 26, color: '#e5cf95', alpha: 0.4, area: [0, 0, W, BG_BOTTOM], seed: 7 });   // 近景金粉往上飘（1.3 倍速）
  speedLines(t, CUT3, 0.44);                                                                   // 镜头 3：光速推移
  scanSweep(t, CUT5);                                                                          // 镜头 5：扫描线扫过
  动效.glitch(g, t, [CUT7], { d: 0.1, dx: 44, bands: 7, colors: ['#e5cf95', '#b1312a'] });    // 镜头 7：轻故障撕裂（只这一次）
  crtClose(t, CUT8); crtOpen(t, CUT8);                                                         // 镜头 8：CRT 关机再开机
  crtOpen(t, 0);                                                                               // 开头：CRT 开机
}

// ---------- 一帧 ----------
function render(t) {
  resetCtx(g); g.save();                                   // 整帧复位 + save/restore：画面只由 t 决定，和 seek 先后无关
  g.drawImage(BG, 0, 0);
  const inA = t < CUTB, cam = inA ? camA(t) : camB(t);
  const busy = inA ? 0 : fieldA(t);                        // 数据区满屏小字时，网格和轨道退淡
  drawStars(t, cam);
  drawOrbits(t, cam, 1 - 0.6 * busy);
  drawGrid(t, cam, 1 - 0.7 * busy);
  // 暖金光晕：跟着画面主体走，3.6 秒呼吸一次
  const [gx, gy] = toScreen(cam, ...(inA ? glowWorldA(t) : glowWorldB(t))), br = Math.sin(t * TAU / 3.6);
  glowAt(gx, gy - 20, 1000 * (1 + 0.04 * br), 720 * (1 + 0.04 * br), 0.88 + 0.12 * br);
  glowAt(gx, gy - 20, 560, 400, 0.32 + 0.08 * br);                      // 主体背后再叠一层小一点的暖光，光晕有个「芯」
  drawBokeh(t, cam);
  applyCam(cam);
  fxBefore(t);
  if (inA) drawSceneA(t, cam); else drawSceneB(t, cam);
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
  g.save(); fxAfter(t); g.restore();
  g.drawImage(VIG, 0, 0);
  if (!NOSUB) g.drawImage(SUBBAND, 0, H - 240);            // 不要字幕时，字幕底带也整块不画
  drawStepLabel(t);
  drawCorner(t);
  drawSubtitle(t);
  drawFlash(t, CUTB);                                       // 全片唯一一次暖白闪光：推进 AI 圆环、换大段落
  g.restore();
}

window.DURATION = TL.duration;
window.ready = false;
window.seek = (t) => render(t);
// 等本机字体加载好再开始（不然第一帧可能用了替代字体）
Promise.all([fcn(900, 64), fcn(700, 64), fcn(500, 32), flat(600, 96), flat(400, 33, true)].map((f) => document.fonts.load(f, '帮我Token01'))).then(() => { render(0); window.ready = true; });
</script>
