<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>立体卡通 · Token 示例页（v1.3）</title>
<!--
  立体卡通（S35）· Token 例子的完整页面（v1.3：背景一直在动、每个镜头慢推、7 处换场轮换 4 种转场）。
  炭黑底 + 右侧点彩钴蓝光晕 + 全画面颗粒；物件是带颗粒渐变的立体卡通：橡胶手套、绿色 DNA 管、银色小球、修枝剪、放大镜、草叶；
  外面套一层杂志版式：细白线分栏、左栏白方框编号 + 竖排细体大字母、左边缘黑圆页码、页眉小字。
  画面只由时间 t 计算：window.seek(t)。内容和时间全部来自 timeline.js（window.TL，和本页放在同一个文件夹）：
  镜头起止用 TL.shots，动作卡在 TL.mark('关键词') 上，例句和切分用 TL.example，数据用 TL.data，字幕用 TL.cueAt(t)。
  只用 Canvas 2D 代码绘制；不引外部资源；随机数都用带种子的 mulberry32 或 动效.hash。
  v1.3 改了什么：见「背景动效」「转场」两段注释和 render()；每帧开头 g.reset()，画面和 seek 的先后无关。
-->
<style>
  html, body { margin: 0; padding: 0; background: #2f2e2f; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  #stage canvas { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<script src="timeline.js"></script>
<script src="动效部件.js"></script>
<script>
'use strict';
window.ready = false;
const W = 1920, H = 1080, TAU = Math.PI * 2;
const TL = window.TL;
const NOSUB = /[?&]nosub=1/.test(location.search);
const M = (k) => TL.mark(k), ME = (k) => TL.markEnd(k);
const SH = (k) => TL.shots[k - 1];

// ---------- 字体（全部是 macOS 自带字体） ----------
// 特粗标题：兰亭黑-简 Heavy；物件上的字：圆体-简 Bold；界面小字和字幕：苹方；英文细体大字母：Helvetica Neue Light / Bold
const F_HEAVY = '"Lantinghei SC", "PingFang SC", sans-serif';
const F_ROUND = '"Yuanti SC", "PingFang SC", sans-serif';
const F_UI = '"PingFang SC", sans-serif';
const F_LAT = '"Helvetica Neue", "PingFang SC", sans-serif';
const fH = (s) => `900 ${s}px ${F_HEAVY}`;
const fR = (s, w = 700) => `${w} ${s}px ${F_ROUND}`;
const fU = (s, w = 400) => `${w} ${s}px ${F_UI}`;
const fL = (s, w = 300) => `${w} ${s}px ${F_LAT}`;

// ---------- 小工具 ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const P = (t, a, d) => clamp((t - a) / d);
const outC = (p) => 1 - Math.pow(1 - p, 3);
const inOutC = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const outBack = (p) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const inQ = (p) => p * p;
const sine = (p) => 0.5 - 0.5 * Math.cos(Math.PI * p);
const qb = (a, c, b, u) => (1 - u) * (1 - u) * a + 2 * (1 - u) * u * c + u * u * b;
const hx = (h) => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const toHex = (c) => '#' + c.map((v) => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('');
const mixc = (a, b, p) => { const A = hx(a), B = hx(b); return toHex(A.map((v, i) => v + (B[i] - v) * p)); };
const rgba = (h, a) => { const [r, gg, b] = hx(h); return `rgba(${r},${gg},${b},${a})`; };
const mixMat = (a, b, p) => (p <= 0 ? a : p >= 1 ? b : Object.fromEntries(Object.keys(a).map((k) => [k, mixc(a[k], b[k], p)])));
const popS = (t, t0, d = 0.38) => outBack(P(t, t0, d));
const popA = (t, t0, d = 0.38) => P(t, t0, d * 0.4);

// ---------- 配色（取自参考图，见风格说明） ----------
const C = {
  bg: '#2f2e2f', band: '#262527', white: '#f3f4f8', ink: '#1d1c1d',
  cd: '#d41928',   // 成都：参考图没有红，用默认红
  lx: '#569bd0',   // 旅行：参考图自己的手套蓝
  circle: '#0a1219', placeholder: '#93a4b6',
};
// 材质：亮 / 本色 / 暗 / 最暗 / 轮廓反光（光从左上来）
const MAT = {
  green:  { hi: '#6fd47a', base: '#1c934f', lo: '#11703d', deep: '#0a4a29', rim: '#3dbb68' },
  leafG:  { hi: '#9be06e', base: '#2fa35c', lo: '#167a42', deep: '#0d5232', rim: '#5fc77a' },
  lime:   { hi: '#d6f28e', base: '#8fcd55', lo: '#5f9e37', deep: '#3f7425', rim: '#b9e57e' },
  silver: { hi: '#f4f8fc', base: '#b8cde2', lo: '#86a1bb', deep: '#5b7690', rim: '#dce8f3' },
  navy:   { hi: '#7d97ae', base: '#374858', lo: '#253341', deep: '#141e27', rim: '#6a86a0' },
  glove:  { hi: '#a6dbf2', base: '#569bd0', lo: '#3f7fb6', deep: '#2b5d8e', rim: '#a8ccdc' },
  mint:   { hi: '#a8e8e6', base: '#49b8af', lo: '#33978f', deep: '#226f69', rim: '#90d3d9' },
  sleeve: { hi: '#eceaf4', base: '#b8bfde', lo: '#9198c0', deep: '#6d739c', rim: '#d3daea' },
  red:    { hi: '#ff8f80', base: '#d41928', lo: '#a8101d', deep: '#700a13', rim: '#ff6a5c' },
  blue:   { hi: '#a6dbf2', base: '#569bd0', lo: '#3f7fb6', deep: '#2b5d8e', rim: '#a8ccdc' },
  panel:  { hi: '#ffffff', base: '#e4ebf3', lo: '#c7d4e2', deep: '#9fb3c8', rim: '#f4f8fc' },
};
const LX = -0.55, LY = -0.83;   // 光的方向（左上）

// ---------- 画布 ----------
const cv = document.getElementById('c');
let g = cv.getContext('2d');
const MAIN = g;
function withCtx(ctx, fn) { const old = g; g = ctx; try { fn(); } finally { g = old; } }
const wCache = new Map();
function tw(s, f) { const k = f + '|' + s; let v = wCache.get(k); if (v === undefined) { MAIN.save(); MAIN.font = f; v = MAIN.measureText(s).width; MAIN.restore(); wCache.set(k, v); } return v; }
function text(s, x, y, f, col, align = 'center', base = 'middle') { g.font = f; g.fillStyle = col; g.textAlign = align; g.textBaseline = base; g.fillText(s, x, y); }
const fsize = (f) => parseFloat(f.match(/(\d+(?:\.\d+)?)px/)[1]);

// ---------- 立体卡通的基本形 ----------
function capsulePath(x0, y0, x1, y1, r) {
  const a = Math.atan2(y1 - y0, x1 - x0), p = new Path2D();
  p.arc(x1, y1, r, a - Math.PI / 2, a + Math.PI / 2);
  p.arc(x0, y0, r, a + Math.PI / 2, a + Math.PI * 1.5);
  p.closePath(); return p;
}
// 闭合形状上光：沿 (ax,ay)→(bx,by) 从亮到暗，暗面一侧描一道反光
function shade(path, m, ax, ay, bx, by, o = {}) {
  const gr = g.createLinearGradient(ax, ay, bx, by);
  gr.addColorStop(0, m.hi); gr.addColorStop(o.hiStop ?? 0.22, m.base); gr.addColorStop(0.7, m.lo); gr.addColorStop(1, m.deep);
  g.fillStyle = gr; g.fill(path);
  g.save(); g.clip(path);
  const L = Math.hypot(bx - ax, by - ay) || 1, ux = (bx - ax) / L, uy = (by - ay) / L, rs = o.rim ?? L * 0.07;
  g.translate(-ux * rs, -uy * rs);
  g.strokeStyle = rgba(m.rim, o.rimA ?? 0.5); g.lineWidth = rs * 1.3; g.stroke(path);
  g.restore();
}
// 横放的光面圆角条（Token 块、例句长条、气泡、数据条）：左上角 (x0,y0)，rad 可以是数组 [左上,右上,右下,左下]
function pill(x0, y0, w, h, m, rad, o = {}) {
  const p = new Path2D(); p.roundRect(x0, y0, w, h, rad);
  if (o.shadow !== false) { g.save(); g.fillStyle = 'rgba(6,8,12,0.4)'; g.translate(h * 0.07, h * 0.14); g.fill(p); g.restore(); }
  const gr = g.createLinearGradient(0, y0, 0, y0 + h);
  gr.addColorStop(0, m.hi); gr.addColorStop(0.26, m.base); gr.addColorStop(0.68, m.lo); gr.addColorStop(1, m.deep);
  g.fillStyle = gr; g.fill(p);
  g.save(); g.clip(p);
  if (o.ends !== false) {   // 两端压暗，像圆柱
    const r = Math.min(h / 2, w / 2), eg = g.createLinearGradient(x0, 0, x0 + w, 0), e = Math.min(0.5, r / w * 1.1);
    eg.addColorStop(0, rgba(m.deep, 0.42)); eg.addColorStop(e, rgba(m.deep, 0)); eg.addColorStop(1 - e, rgba(m.deep, 0)); eg.addColorStop(1, rgba(m.deep, 0.52));
    g.fillStyle = eg; g.fill(p);
  }
  g.translate(0, -h * 0.08); g.strokeStyle = rgba(m.rim, 0.6); g.lineWidth = h * 0.09; g.stroke(p);   // 底边反光
  g.restore();
  const hw = w - Math.min(h, w) * 0.65, hh = h * 0.16;   // 顶部高光条
  if (hw > 4) {
    const hg = g.createLinearGradient(x0 + (w - hw) / 2, 0, x0 + (w + hw) / 2, 0);
    hg.addColorStop(0, 'rgba(255,255,255,0)'); hg.addColorStop(0.18, 'rgba(255,255,255,0.55)'); hg.addColorStop(0.7, 'rgba(255,255,255,0.32)'); hg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = hg; g.beginPath(); g.roundRect(x0 + (w - hw) / 2, y0 + h * 0.13, hw, hh, hh / 2); g.fill();
  }
  return p;
}
const capsule = (x, y, w, h, m, o) => pill(x - w / 2, y - h / 2, w, h, m, Math.min(h, w) / 2, o);
function sphere(x, y, r, m, o = {}) {
  if (o.shadow) { g.fillStyle = 'rgba(6,8,12,0.38)'; g.beginPath(); g.arc(x + r * 0.12, y + r * 0.22, r, 0, TAU); g.fill(); }
  const gr = g.createRadialGradient(x - r * 0.38, y - r * 0.42, r * 0.04, x - r * 0.12, y - r * 0.12, r * 1.18);
  gr.addColorStop(0, m.hi); gr.addColorStop(0.32, m.base); gr.addColorStop(0.78, m.lo); gr.addColorStop(1, m.deep);
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  g.save(); g.beginPath(); g.arc(x, y, r, 0, TAU); g.clip();
  g.strokeStyle = rgba(m.rim, 0.55); g.lineWidth = r * 0.16; g.beginPath(); g.arc(x - r * 0.1, y - r * 0.12, r, 0, TAU); g.stroke();
  g.restore();
  g.fillStyle = 'rgba(255,255,255,0.75)'; g.beginPath(); g.ellipse(x - r * 0.36, y - r * 0.42, r * 0.2, r * 0.13, -0.6, 0, TAU); g.fill();
}
function strokePoly(pts, w, col) { g.strokeStyle = col; g.lineWidth = w; g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.stroke(); }
// 沿折线的立体管子（DNA 主链、箭头、把手、字幕下划线）：高光偏向光源一侧，暗面一侧一道反光
function tube(pts, r, m, o = {}) {
  if (pts.length < 2) return;
  const n = pts.length, N = [];
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1]; const L = Math.hypot(tx, ty) || 1; tx /= L; ty /= L;
    const nx = -ty, ny = tx, d = nx * LX + ny * LY; N.push([nx * d, ny * d]);
  }
  const off = (k) => pts.map((p, i) => [p[0] + N[i][0] * k, p[1] + N[i][1] * k]);
  g.lineCap = o.cap || 'round'; g.lineJoin = 'round';
  strokePoly(pts, r * 2, m.deep);
  strokePoly(off(r * 0.16), r * 1.66, m.lo);
  strokePoly(off(r * 0.3), r * 1.28, m.base);
  strokePoly(off(r * 0.52), r * 0.58, mixc(m.base, m.hi, 0.6));
  strokePoly(off(r * 0.62), r * 0.2, 'rgba(255,255,255,0.45)');
  strokePoly(off(-r * 0.8), r * 0.16, rgba(m.rim, 0.5));
}
// 立体字：同一个字往右下叠十几层当厚度，正面竖向渐变
function text3d(s, x, y, f, faceTop, faceBot, side, depth = 10, align = 'center') {
  g.font = f; g.textAlign = align; g.textBaseline = 'middle';
  const size = fsize(f);
  g.fillStyle = 'rgba(6,8,12,0.45)'; g.fillText(s, x + depth * 0.7 + 6, y + depth * 1.05 + 10);
  for (let k = depth; k >= 1; k--) { g.fillStyle = k > depth * 0.6 ? mixc(side, '#000000', 0.3) : side; g.fillText(s, x + k * 0.55, y + k * 0.9); }
  const gr = g.createLinearGradient(0, y - size * 0.5, 0, y + size * 0.5); gr.addColorStop(0, faceTop); gr.addColorStop(1, faceBot);
  g.fillStyle = gr; g.fillText(s, x, y);
}
// 从左往右擦出来的字（杂志标注用）
function wipeText(s, x, y, f, col, p, align = 'left') {
  if (p <= 0) return;
  const w = tw(s, f), h = fsize(f), x0 = align === 'left' ? x : align === 'center' ? x - w / 2 : x - w;
  g.save(); g.beginPath(); g.rect(x0 - 12, y - h, (w + 24) * outC(p), h * 2); g.clip();
  g.globalAlpha *= clamp(p * 2.5);
  text(s, x, y + (1 - outC(p)) * 10, f, col, align);
  g.restore();
}
function bullet(x, y, a = 1) { if (a <= 0) return; g.save(); g.globalAlpha *= a; g.fillStyle = C.white; g.beginPath(); g.arc(x, y, 10, 0, TAU); g.fill(); g.restore(); }

// ---------- 离屏贴图（只画一次，之后每帧贴上去） ----------
function makeSprite(w, h, ox, oy, s, fn) {
  const c = document.createElement('canvas'); c.width = Math.ceil(w * s); c.height = Math.ceil(h * s);
  const ctx = c.getContext('2d'); ctx.scale(s, s); ctx.translate(ox, oy);
  withCtx(ctx, fn);
  return { c, ox, oy, s, w, h };
}
function sprite(sp, x, y, rot = 0, sc = 1, a = 1) {
  if (!sp || a <= 0 || sc <= 0) return;
  g.save(); g.globalAlpha *= a; g.translate(x, y); if (rot) g.rotate(rot); g.scale(sc / sp.s, sc / sp.s);
  g.drawImage(sp.c, -sp.ox * sp.s, -sp.oy * sp.s); g.restore();
}
function softShadow(path, dx, dy, blur, a) {
  g.save(); g.filter = `blur(${blur}px)`; g.fillStyle = `rgba(6,10,20,${a})`; g.translate(dx, dy); g.fill(path); g.restore();
}

// ---------- 手套和实验服袖子 ----------
function drawSleeve(x0, y0, x1, y1, r) {
  const sl = MAT.sleeve, p = capsulePath(x0, y0, x1, y1, r);
  const a = Math.atan2(y1 - y0, x1 - x0), nx = -Math.sin(a), ny = Math.cos(a);
  const mx = (x0 + x1) / 2, my = (y0 + y1) / 2, s = (nx * LX + ny * LY) < 0 ? 1 : -1;
  shade(p, sl, mx - nx * r * s, my - ny * r * s, mx + nx * r * s, my + ny * r * s, { rim: 9 });
  g.save(); g.clip(p); g.strokeStyle = rgba(sl.deep, 0.32); g.lineWidth = 6; g.lineCap = 'round';
  for (const k of [0.35, 0.62]) {   // 布褶
    const cx = lerp(x0, x1, k), cy = lerp(y0, y1, k);
    g.beginPath(); g.moveTo(cx - nx * r * 0.9 + Math.cos(a) * 30, cy - ny * r * 0.9 + Math.sin(a) * 30);
    g.quadraticCurveTo(cx + Math.cos(a) * 60, cy + Math.sin(a) * 60, cx + nx * r * 0.7 + Math.cos(a) * 10, cy + ny * r * 0.7 + Math.sin(a) * 10); g.stroke();
  }
  g.restore();
}
// 指向的手：手腕在原点，食指朝 +x，拇指在 -y 一侧；指尖在 (338, -40)
function drawPointHand(m) {
  drawSleeve(-560, 4, -70, 0, 66);
  const cuff = new Path2D(); cuff.moveTo(-96, -76); cuff.quadraticCurveTo(-40, -64, 14, -52); cuff.lineTo(14, 56); cuff.quadraticCurveTo(-40, 70, -96, 80); cuff.closePath();
  softShadow(cuff, -8, 8, 8, 0.35);
  shade(cuff, m, 0, -76, 0, 80, { rim: 8 });
  const roll = new Path2D(); roll.ellipse(-96, 2, 16, 79, 0, 0, TAU);   // 袖口卷边
  shade(roll, m, -110, -60, -82, 70, { rim: 5 });
  const fist = new Path2D(); fist.roundRect(-6, -60, 176, 132, [44, 56, 60, 48]);
  softShadow(fist, -4, 8, 8, 0.3);
  shade(fist, m, 60, -60, 100, 74, { rim: 10 });
  for (const [a, b, c, d, r] of [[112, 54, 168, 54, 17], [118, 26, 180, 26, 19], [122, -4, 186, -4, 20]]) {   // 蜷着的三根手指
    const p = capsulePath(a, b, c, d, r); softShadow(p, -2, -5, 4, 0.35); shade(p, m, 150, b - r, 156, b + r + 4, { rim: 5 });
  }
  const idx = capsulePath(126, -36, 312, -42, 25);   // 食指
  softShadow(idx, 0, 9, 6, 0.4);
  shade(idx, m, 220, -64, 222, -12, { rim: 6 });
  g.strokeStyle = rgba(m.deep, 0.32); g.lineWidth = 4; g.lineCap = 'round';
  g.beginPath(); g.moveTo(236, -63); g.quadraticCurveTo(242, -42, 238, -20); g.stroke();
  const th = capsulePath(40, -40, 150, -8, 23);   // 拇指
  softShadow(th, -2, 9, 6, 0.42);
  shade(th, m, 96, -64, 100, 14, { rim: 6 });
}
// 握拳：前臂朝上（-y），握着的柄从拳头下面伸出去（+y），柄的轴线是 x = 0
function drawGripHand(m) {
  drawSleeve(6, -720, 0, -196, 70);
  const cuff = new Path2D(); cuff.moveTo(-84, -206); cuff.quadraticCurveTo(-70, -150, -60, -92); cuff.lineTo(62, -92); cuff.quadraticCurveTo(74, -150, 88, -206); cuff.closePath();
  softShadow(cuff, 8, 8, 8, 0.35);
  shade(cuff, m, -84, -150, 88, -150, { rim: 8 });
  const roll = new Path2D(); roll.ellipse(2, -206, 86, 17, 0, 0, TAU);
  shade(roll, m, -60, -222, 60, -190, { rim: 5 });
  const back = new Path2D(); back.roundRect(-74, -110, 136, 168, [52, 52, 40, 56]);
  softShadow(back, 6, 8, 8, 0.3);
  shade(back, m, -74, -90, 70, 40, { rim: 10 });
  for (let k = 0; k < 4; k++) {   // 四根手指横着包住柄
    const y = -62 + k * 36, r = 19 - k * 0.8, p = capsulePath(-8, y, 66 - k * 3, y + 2, r);
    softShadow(p, 4, 7, 5, 0.4); shade(p, m, 30, y - r, 34, y + r + 4, { rim: 5 });
  }
  const th = capsulePath(-66, -84, 16, -60, 21);   // 拇指
  softShadow(th, 4, 8, 6, 0.42);
  shade(th, m, -30, -104, -24, -40, { rim: 6 });
}

// ---------- 修枝剪：枢轴在原点，刃朝 +x；U 片 = 上刃 + 左下把手，D 片 = 下刃 + 左上把手 ----------
function bladeU() {
  const p = new Path2D();
  p.moveTo(-36, -8); p.bezierCurveTo(-10, -52, 70, -66, 170, -58); p.bezierCurveTo(280, -48, 360, -24, 410, 8);
  p.bezierCurveTo(330, 16, 200, 18, 60, 16); p.lineTo(-30, 18); p.closePath(); return p;
}
function bladeD() {
  const p = new Path2D();
  p.moveTo(-36, 10); p.bezierCurveTo(-6, 44, 80, 50, 170, 44); p.bezierCurveTo(260, 36, 330, 18, 372, -10);
  p.bezierCurveTo(330, 6, 220, 12, 80, 12); p.lineTo(-30, 2); p.closePath(); return p;
}
function drawBladePiece(up) {
  const p = up ? bladeU() : bladeD(), s = up ? -1 : 1;
  softShadow(p, 8, 14, 7, 0.38);
  shade(p, MAT.silver, 180, 58 * s, 186, 6 * s, { rim: 5, rimA: 0.75, hiStop: 0.35 });
  g.save(); g.clip(p);   // 刃口斜面

function helix(x0, y0, x1, y1, R, turns, phase, o = {}) {

    const u = i / N, th = u * turns * TAU + phase, cx = x0 + (x1 - x0) * u, cy = y0 + (y1 - y0) * u, s = Math.sin(th), c = Math.cos(th);

  for (const run of [...runs(A, false), ...runs(B, false)]) tube(run, r, dim(MAT.green));

    tube([[mx, my], [b[0], b[1]]], ra, MAT.silver, { cap: 'butt' });
    if ((i / step) % 3 === 1) sphere(mx, my, ra * 1.9, MAT.silver);
  }
  for (const run of [...runs(A, true), ...runs(B, true)]) tube(run, r, MAT.green);
}

// ---------- 背景：炭黑底 + 右侧点彩钴蓝光晕 + 压暗四角（逐像素算一次） ----------
function makeBackground(gx, gy, gr) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'), im = x.createImageData(W, H), d = im.data, r = mulberry32(7);
  const bg = hx(C.bg), co = hx('#3d57a4'), dk = hx('#1d1c1e');
  for (let yy = 0; yy < H; yy++) for (let xx = 0; xx < W; xx++) {
    const i = (yy * W + xx) * 4, dx = (xx - gx) / gr, dy = (yy - gy) / (gr * 0.9), q = Math.sqrt(dx * dx + dy * dy);
    let k = clamp(1 - q); k = k * k * (3 - 2 * k);
    k = clamp(k + (r() - 0.5) * 0.42 * (1 - Math.abs(k - 0.5) * 1.2));   // 点彩：渐变过渡带上加抖动
    const vx = (xx - W / 2) / (W * 0.62), vy = (yy - H / 2) / (H * 0.72), v = clamp(vx * vx + vy * vy - 0.35) * 0.55;
    for (let j = 0; j < 3; j++) { const base = bg[j] + (co[j] - bg[j]) * k * 0.92; d[i + j] = base + (dk[j] - base) * v + (r() - 0.5) * 10; }
    d[i + 3] = 255;
  }

}

  const x = c.getContext('2d'), im = x.createImageData(w, h), r = mulberry32(seed);

  x.putImageData(im, 0, 0); return c;
}

  const lp = P(t, T_INFER - 0.04, 0.4);
  // v1.3：「推断」标注挪到箭头下面——原来在箭头上方，正好在成都、旅行两块飞下来的路上，19.3 秒叠在一起
  if (lp > 0) { bullet((x0 + x1) / 2 - 80, RUNG.y + 104, clamp(lp * 3)); wipeText('推断', (x0 + x1) / 2 - 56, RUNG.y + 104, fH(68), C.white, lp); }
  // 旅行需求：蓝色行李箱弹出来，下面立体字，随后盖上绿色打勾章
  const t0 = T_NEED - 0.08, sa = popA(t, t0, 0.45);
  if (sa > 0) {
    const s = popS(t, t0, 0.5), bob = 5 * Math.sin((t - t0) * 3) * P(t, t0 + 0.5, 0.4);
    sprite(SP.suit, SUIT.x, SUIT.y + bob, 0, s, sa);
    const tp = popS(t, T_NEED, 0.45);
    g.save(); g.globalAlpha *= popA(t, T_NEED, 0.45); g.translate(SUIT.x, 712); g.scale(0.5 + 0.5 * tp, 0.5 + 0.5 * tp);
    text3d('旅行需求', 0, 0, fH(100), '#ffffff', '#dbe7f4', MAT.blue.deep, 12);
    g.restore();
    const cp = P(t, T_NEED + 0.3, 0.35);
    if (cp > 0) {
      const cs = lerp(1.8, 1, outBack(cp));
      sprite(SP.check, SUIT.x + 152, SUIT.y - 118 + bob, 0, cs, clamp(cp * 4));
      for (let k = 0; k < 7; k++) {   // 一圈银色小种子飞出去
        const q = P(t, T_NEED + 0.36, 0.8); if (q <= 0 || q >= 1) continue;
        const ang = -Math.PI / 2 + (k - 3) * 0.48, d = 150 + 140 * outC(q);
        g.save(); g.globalAlpha *= 1 - q; sphere(SUIT.x + Math.cos(ang) * d * 1.3, SUIT.y - 20 + Math.sin(ang) * d, 9, MAT.silver); g.restore();
      }
    }
  }
}

function initScenes() {
  SP.hand = makeSprite(940, 300, 600, 150, 1.25, () => drawPointHand(MAT.glove));
  SP.grip = makeSprite(300, 940, 130, 760, 1.25, () => drawGripHand(MAT.mint));
  SP.icon = makeSprite(280, 280, 130, 130, 1.4, () => drawIcon(200));
  SP.chip = makeSprite(420, 420, 200, 200, 1.4, () => drawChip(CHIP.s));
  SP.panel = makeSprite(WIN.w + 70, WIN.h + 80, 20, 20, 1.3, () => drawPanel(WIN.w, WIN.h, WIN.head, WIN.r, { noDots: true }));
  UBW = tw(TL.example.text, MSG_F) + 72;
  CAM_A = [
    [0, OPEN - 0.12, 860, 462, 1.12, 'sine'],                            // v1.3 开场：慢慢推近 App 图标
    [OPEN + 0.02, OPEN + 0.55, 900, 470, 1.0],                           // v1.3 点开：窗口弹开时拉开（推近再拉开）
    [OPEN + 0.6, M('例句') - 0.32, 900, 480, 1.04, 'sine'],              // v1.3 等着打字：慢推
    [M('例句') - 0.3, M('例句') + 0.25, 790, 600, 1.2],                 // 打字：推近输入框
    [SEND + 0.02, SEND + 0.55, CX, CY, 1.0],                             // 发出后拉远（转场 1→2「镜头拉远」），右边留给标注
    [SEND + 0.6, SH(2).end - 0.05, 1010, 470, 1.06, 'sine'],             // 镜头 2：往标注慢推（v1.3：1.04 → 1.06）
    [SH(3).start, SH(3).start + 0.5, 1182, 470, 0.84],                   // 镜头 3：拉开，窗口和 AI 芯片都在画面里
    [SH(4).start - 0.02, SH(4).start + 0.36, CHIP.x, CHIP.y, 5.5, 'in'],  // 钻进芯片
  ];
  HAND_KEYS = [
    [0.0, 2250, 1080, -2.55], [0.12, 2250, 1080, -2.55],
    [OPEN - 0.16, WCX + 62, WCY + 56, -2.55], [OPEN + 0.16, WCX + 62, WCY + 56, -2.55],   // 点 app 图标
    [OPEN + 0.75, 1338, 772, -2.45], [SEND - 0.36, 1338, 772, -2.45],                       // 在发送键旁边等
    [SEND - 0.1, SENDB.x + 26, SENDB.y + 22, -2.5], [SEND + 0.08, SENDB.x + 26, SENDB.y + 22, -2.5],   // 按发送
    [SEND + 0.34, UB.right + 30, UB.y + 30, -2.75], [T_PROMPT - 0.42, UB.right + 30, UB.y + 30, -2.75],   // 指着「这句话」
    [T_PROMPT + 0.05, 2250, 1000, -2.75],
  ];
  initB();
  initCD();
}
function drawScenes(t) {
  drawSceneA(t);
  drawSceneB(t);
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
  drawDataLayer(t);
  drawBall(t);
  drawLabelsC(t);
  setCam(camT(t));   // v1.3：8 块 Token、镜头 5 的标注、镜头 8 都跟着镜头 4–8 共用的镜头走（慢推、拉远）
  drawTokenLabels(t);
  drawTokens(t);
  drawSceneD(t);
  g.setTransform(1, 0, 0, 1, 0, 0);
  drawMagnifierC(t);
}
function drawIntroIris(t) {   // v1.3 片头「圆形遮罩缩放」：从 App 图标处张开，圈边是银色立体管
  const q = P(t, 0, 0.55); if (q >= 1) return;
  const [ix, iy] = camXY(camA(t), WCX, WCY), R = lerp(150, 2300, inOutC(q));
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#1b1a1c'; g.fill(holePath(ix, iy, R), 'evenodd'); g.restore();
  irisRing(ix, iy, R, 8 + 8 * q);
}

// ====================== 一帧 ======================
let BG, NOISE;
function render(t) {
  g = MAIN;
  // v1.3 修：画布状态（lineCap、lineJoin、虚线、阴影……）会从上一帧带过来，旧版先 seek 20.9 秒再 seek 7.6 秒，杂志框线头、
  // 草叶边和单独 seek 7.6 秒不一样。每帧开头全部清掉，同一个 t 永远画出同一帧（g.reset() 是 Chrome 99 起有的，老浏览器走后面那几行）
  if (typeof g.reset === 'function') g.reset();
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.filter = 'none';
  g.lineCap = 'butt'; g.lineJoin = 'miter'; g.setLineDash([]); g.lineDashOffset = 0; g.shadowColor = 'rgba(0,0,0,0)'; g.shadowBlur = 0; g.imageSmoothingEnabled = true;
  SHAKE = 动效.shake(t, T_STAMP, { amp: 10, d: 0.22 });
  g.drawImage(BG, 0, 0);
  drawBackFX(t);   // v1.3 背景动效
  drawFrame(t);
  g.save(); if (NOSUB) { g.beginPath(); g.rect(0, 0, W, ART.y1); g.clip(); }   // 不画字幕带时（--no-subtitle），画面里的东西裁在字幕带上沿以上
  drawScenes(t);
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
  drawPlants(t);
  g.restore();
  drawIntroIris(t);
  if (!NOSUB) { g.fillStyle = C.band; g.fillRect(0, ART.y1, W, H - ART.y1); }   // 字幕带：--no-subtitle（?nosub=1）时整块不画
  g.strokeStyle = 'rgba(243,244,248,0.5)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(COL.a, ART.y1); g.lineTo(ART.x1, ART.y1); g.stroke();   // 杂志框的下边线
  // 全画面颗粒（2 像素一粒，叠加模式），字幕字在颗粒之上保持干净
  g.globalCompositeOperation = 'overlay'; g.globalAlpha = 0.3; g.imageSmoothingEnabled = false;
  g.drawImage(NOISE, 0, 0, W, H);
  g.imageSmoothingEnabled = true; g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  drawSubtitle(t);
}

window.DURATION = END;
let READY = false;
window.seek = (t) => { if (READY) render(t); };
(async () => {
  const specs = [fH(80), fR(60), fR(40, 400), fU(40, 300), fU(40, 400), fU(64, 600), fL(100, 300), fL(100, 700)];
  try { await Promise.all(specs.map((f) => document.fonts.load(f, '提示词Prompt帮我规划一趟去成都的三日旅行AI助手'))); } catch (e) { /* 字体都是系统字体，加载失败也能画 */ }
  BG = makeBackground(1760, 600, 640);
  NOISE = makeNoise(960, 540, 11, 64);
  initBackFX();
  initScenes();
  READY = true;
  render(0);
  window.ready = true;
})();
</script>
