<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>扁平流程图 · Token 示例页（v1.3）</title>
<!--
  S19 扁平流程科普信息图（参考的是一张扁平流程科普信息图）
  奶油底 + 琥珀黄标题带 + 特粗黑字 + 带尖角的编号圆标 + 渐变弧形箭头 + 带网格的立体圆台 + 彩色小球 + 琥珀色说明框和细黑折线。
  画面只由时间 t 计算：window.seek(t)。内容和时间全部来自同目录的 timeline.js（window.TL）：
  镜头起止用 TL.shots，动作卡在 TL.mark('关键词') 上，例句和切分用 TL.example，数据用 TL.data，字幕用 TL.cueAt(t)。
  整张流程图铺在一条横向的「世界」上：聊天框 → ① 提示词 → ② 分词器 → ③ Token → ④ 翻找 → ⑤ 推断，镜头依次移过去。
  v1.3：背景三层一直在动（钟面秒针、漂浮小几何、箭头上的流动小珠），转场轮换（形状变形、沿流程横移、色块横扫、推近、圆形遮罩），每个镜头慢推或推近再拉开。
  转场和次要动作用到同目录的 动效部件.js（新建作品.mjs 会复制进作品目录）。
-->
<style>
  html, body { margin: 0; padding: 0; background: #fcf9ec; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  #stage canvas { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<script src="timeline.js"></script>
<script src="动效部件.js"></script>
<script>
'use strict';
const W = 1920, H = 1080, TAU = Math.PI * 2;
// 字体：本机装的 MiSans（小米，免费商用）。没有 MiSans 的 Mac 上自动换成系统自带的：
// 特粗（800–900）用兰亭黑-简 Heavy，其余用苹方（Lantinghei SC 只有 Extralight/Demibold/Heavy 三档，不能拿来排正文）
const FONT_HEAVY = '"MiSans", "Lantinghei SC", "PingFang SC", sans-serif';
const FONT_BODY = '"MiSans", "PingFang SC", sans-serif';
const font = (w, s) => `${w} ${s}px ${w >= 800 ? FONT_HEAVY : FONT_BODY}`;
const TL = window.TL;
const NOSUB = /[?&]nosub=1/.test(location.search);   // 渲染时 render.mjs --no-subtitle 会加 ?nosub=1：不画字幕，回剪映统一加
const M = (k) => TL.mark(k), ME = (k) => TL.markEnd(k);
const SH = (k) => TL.shots[k - 1];

// ---------- 配色（取自参考图） ----------
const C = {
  bg: '#fcf9ec', paper: '#fffdf6', amber: '#fbbf2f', amber2: '#f7a30e', amberD: '#e08a06', amberL: '#fde7a0',
  ring: '#efe8d6', shadow: '#efe3c2', ink: '#1a1410', ink2: '#2b241b', mute: '#7d7363', faint: '#b9b09c', text2: '#5f574a',
  red: '#d41928', blue: '#2373ce', orange: '#ee8013', green: '#4f9d34', gold: '#d98e04', pill: '#f5eedb',
};
// 例句切出的 8 个 Token：成都红、旅行蓝（全片固定），其余按 橙 / 绿 / 金 轮流（参考图分子小球的颜色）
const TOK = (() => { const other = [C.orange, C.green, C.gold]; let k = 0;
  return TL.example.tokens.map((t) => ({ t, c: t === '成都' ? C.red : t === '旅行' ? C.blue : other[k++ % 3] })); })();
const NT = TOK.length;
const I_CD = TOK.findIndex((k) => k.t === '成都'), I_LX = TOK.findIndex((k) => k.t === '旅行');

// ---------- 小工具 ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const P = (t, a, d) => clamp((t - a) / d);
const outC = (p) => 1 - Math.pow(1 - p, 3);
const inOutC = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const outBack = (p) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const inQ = (p) => p * p;
const sine = (p) => 0.5 - 0.5 * Math.cos(Math.PI * p);
const qb = (a, c, b, u) => (1 - u) * (1 - u) * a + 2 * (1 - u) * u * c + u * u * b;   // 二次贝塞尔
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, p) { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * p)).join(',')})`; }
function rgba(h, a) { const [r, gg, b] = hex(h); return `rgba(${r},${gg},${b},${a})`; }
const cv = document.getElementById('c');
const g = cv.getContext('2d');
const wCache = new Map();
function tw(s, f) { const k = f + '|' + s; let v = wCache.get(k); if (v === undefined) { g.save(); g.font = f; v = g.measureText(s).width; g.restore(); wCache.set(k, v); } return v; }
function rrect(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function text(s, x, y, f, col, align = 'center', base = 'middle') { g.font = f; g.fillStyle = col; g.textAlign = align; g.textBaseline = base; g.fillText(s, x, y); }
// 弹出：scale 用 outBack，透明度更快到 1
function popS(t, t0, d = 0.35) { return outBack(P(t, t0, d)); }
function popA(t, t0, d = 0.35) { return P(t, t0, d * 0.45); }

// ---------- 通用部件 ----------
// 编号圆标：琥珀圆 + 白色数字 + 朝右的小尖角（参考图 ①②③④）
function badge(x, y, n, s = 1, a = 1) {
  if (a <= 0) return;
  g.save(); g.globalAlpha *= a; g.translate(x, y); g.scale(s, s);
  g.fillStyle = C.amber;
  g.beginPath(); g.moveTo(20, -15); g.lineTo(42, 0); g.lineTo(20, 15); g.closePath(); g.fill();
  g.beginPath(); g.arc(0, 0, 28, 0, TAU); g.fill();
  text(String(n), 0, 2, font(900, 34), '#ffffff');
  g.restore();
}
// 步骤标签：编号圆标 + 粗黑标题 + 灰色说明（说明放下一行或同一行）
function stepLabel(x, y, n, title, desc, t0, t, opts = {}) {
  const a = popA(t, t0) * (opts.fade ?? 1); if (a <= 0) return;
  const s = 0.6 + 0.4 * popS(t, t0);
  g.save(); g.globalAlpha = a;
  badge(x, y, n, s);
  g.translate(x + 62, y);
  text(title, 0, 3, font(900, 52), C.ink, 'left');
  if (desc) {
    if (opts.inline) text(desc, tw(title, font(900, 52)) + 22, 6, font(500, 30), C.mute, 'left');
    else text(desc, 0, 50, font(500, 30), C.mute, 'left');
  }
  g.restore();
}
// 渐变弧形箭头：沿二次曲线，从透明奶黄渐变到琥珀，末端实心三角；p 是画出来的比例
function arrow(x0, y0, cx, cy, x1, y1, p, w = 18) {
  if (p <= 0) return;
  const N = 64, pts = [];
  for (let i = 0; i <= N * p; i++) { const u = i / N; pts.push([qb(x0, cx, x1, u), qb(y0, cy, y1, u)]); }
  const u = p, ex = qb(x0, cx, x1, u), ey = qb(y0, cy, y1, u);
  const dx = 2 * (1 - u) * (cx - x0) + 2 * u * (x1 - cx), dy = 2 * (1 - u) * (cy - y0) + 2 * u * (y1 - cy), L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
  const gr = g.createLinearGradient(x0, y0, ex, ey);
  gr.addColorStop(0, 'rgba(252,236,190,0)'); gr.addColorStop(0.35, '#fbe3a0'); gr.addColorStop(1, C.amber2);
  const hl = w * 2.1;
  g.strokeStyle = gr; g.lineWidth = w; g.lineCap = 'butt'; g.lineJoin = 'round';
  g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.lineTo(ex - ux * hl * 0.6, ey - uy * hl * 0.6); g.stroke();
  g.fillStyle = C.amber2; g.beginPath();
  g.moveTo(ex + ux * hl * 0.55, ey + uy * hl * 0.55);
  g.lineTo(ex - ux * hl * 0.7 - uy * hl * 0.85, ey - uy * hl * 0.7 + ux * hl * 0.85);
  g.lineTo(ex - ux * hl * 0.7 + uy * hl * 0.85, ey - uy * hl * 0.7 - ux * hl * 0.85);
  g.closePath(); g.fill();
}
// 细黑折线（按长度画到 q，画完在端点加一个小圆点）
function connector(pts, q) {
  if (q <= 0) return;
  g.strokeStyle = C.ink2; g.lineWidth = 2.5; g.lineJoin = 'miter';
  let total = 0; for (let i = 1; i < pts.length; i++) total += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  let left = total * q; g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length && left > 0; i++) {
    const sl = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]), k = Math.min(1, left / sl);
    g.lineTo(lerp(pts[i - 1][0], pts[i][0], k), lerp(pts[i - 1][1], pts[i][1], k)); left -= sl;
  }
  g.stroke();
  if (q >= 1) { g.fillStyle = C.ink2; const e = pts[pts.length - 1]; g.beginPath(); g.arc(e[0], e[1], 5, 0, TAU); g.fill(); }
}
// 琥珀色说明框 + 细黑折线（参考图下方的两个说明框）；p 是出现进度 0–1
function callout(x, y, w, h, draw, p, conn) {
  if (p <= 0) return;
  if (conn) connector(conn, outC(P(p, 0.25, 0.75)));
  const s = 0.7 + 0.3 * outBack(clamp(p / 0.6)), a = clamp(p / 0.25);
  g.save(); g.globalAlpha *= a; g.translate(x + w / 2, y + h / 2); g.scale(s, s);
  g.fillStyle = C.shadow; rrect(-w / 2 + 5, -h / 2 + 7, w, h, 12); g.fill();
  g.fillStyle = C.amber; rrect(-w / 2, -h / 2, w, h, 12); g.fill();
  draw(w, h);
  g.restore();
}
// Token 小块（彩色圆角块 + 白色特粗字）
const CH = { size: 56, h: 90, r: 20 };
function chipW(tk) { return tw(tk.t, font(900, CH.size)) + CH.size; }
function chip(tk, x, y, s = 1, a = 1, opts = {}) {
  if (a <= 0 || s <= 0) return;
  const w = chipW(tk), h = CH.h, col = tk.c;
  g.save(); g.globalAlpha *= a; g.translate(x, y); g.scale(s, s);
  g.fillStyle = mix(col, '#000000', 0.22); rrect(-w / 2, -h / 2 + 7, w, h, CH.r); g.fill();
  g.fillStyle = col; rrect(-w / 2, -h / 2, w, h, CH.r); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.16)'; rrect(-w / 2 + 6, -h / 2 + 6, w - 12, h * 0.38, 14); g.fill();
  if (opts.ring) { g.strokeStyle = rgba('#ffffff', opts.ring); g.lineWidth = 6; rrect(-w / 2 - 7, -h / 2 - 7, w + 14, h + 14, CH.r + 6); g.stroke(); }
  text(tk.t, 0, 4, font(900, CH.size), '#ffffff');
  g.restore();
}
// 光面小球（参考图里的分子小球）
function ball(x, y, r, col, a = 1) {
  if (a <= 0) return;
  const gr = g.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
  gr.addColorStop(0, mix(col, '#ffffff', 0.45)); gr.addColorStop(0.55, col); gr.addColorStop(1, mix(col, '#000000', 0.18));
  g.save(); g.globalAlpha *= a; g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); g.restore();
}

// ---------- 各站位置（世界坐标） ----------
const WIN = { x: 240, y: 170, w: 760, h: 620, head: 88, r: 30 };          // 聊天窗口
const WCX = WIN.x + WIN.w / 2, WCY = WIN.y + WIN.h / 2;
const ICON = { s: 170 };                                                   // 开窗前的 app 图标（在窗口中心）
const GREET = { text: '你好，有什么可以帮你？', y: 310, f: font(500, 34) };  // AI 的招呼气泡
const UB = { y: 440, h: 76, f: font(600, 40) };                            // 用户发出的消息气泡
const UBW = tw(TL.example.text, UB.f) + 56, UBX = WIN.x + WIN.w - 28 - UBW;
const INPUT = { x: WIN.x + 28, y: 728, w: WIN.w - 56, h: 72, f: font(600, 40) };
const PTAG = { w: 440, h: 88, y: 568 }; PTAG.x = UBX + UBW / 2 - PTAG.w / 2;   // 「提示词 = Prompt」说明框，在消息正下方
const CHIPAI = { x: 1500, y: 480 };
const PLAT = { x: 1500, y: 380, rx: 420, ry: 78, h: 90 };
const ROW_Y = 770, ROW_GAP = 16;
const ROW = (() => { const ws = TOK.map(chipW); const tot = ws.reduce((a, b) => a + b, 0) + ROW_GAP * (NT - 1); let x = PLAT.x - tot / 2; return ws.map((w) => { const c = x + w / 2; x += w + ROW_GAP; return { x: c, w }; }); })();
const STRIP = { y: 330, h: 84, pad: 30, f: font(900, 48) };
const PANEL = { x: 2500, y: 290, w: 1100, h: 540, head: 78 }; PANEL.cam = PANEL.x + 590;
const BAR = { x: 2810, y: 171, w: 790, h: 88 };
const D = { a: { x: 4230, y: 545 }, b: { x: 4490, y: 545 }, card: { x: 5000, y: 545, w: 420, h: 310 }, cam: 4660, label: { x: 4140, y: 405 } };
// 例句在长条上切成 8 段（按字宽；第一段带左边距，最后一段带右边距）
const SLICES = (() => {
  const f = STRIP.f; let x = 0; const out = TOK.map((k) => { const w = tw(k.t, f); const s = { x0: x, x1: x + w }; x += w; return s; });
  const W0 = x + STRIP.pad * 2;
  out.forEach((s, i) => { s.l = i === 0 ? 0 : STRIP.pad + s.x0; s.r = i === NT - 1 ? W0 : STRIP.pad + s.x1; s.cx = (s.l + s.r) / 2 - W0 / 2; s.w = s.r - s.l; s.tdx = i === 0 ? STRIP.pad / 2 : i === NT - 1 ? -STRIP.pad / 2 : 0; });
  out.total = W0; return out;
})();

// ---------- 关键时刻（全部从 TL 来） ----------
const OPEN = M('打开') - 0.04;                       // 点开 app，聊天窗口弹出
const TYPED = TL.chars.filter((c) => c.cue === TL.shots[0].cues[1]);   // 例句的 14 个字，各有自己的念到时刻
const SENDMSG = ME('例句') + 0.03;                   // 念完例句，按发送
const SEND = M('接收到'), LAND = SEND + 0.78;         // 消息飞向 AI，落到分词器台面上
const CUT = M('拆分'), SPLIT = CUT + 0.22;            // 7 刀 → 分开
const SINK = M('更小的单位');                         // 掉进分词器、从下面出来

// ---------- 镜头（世界坐标 → 画面） ----------
// 每段 [起, 止, x, y, 缩放, 缓动]；画面焦点固定在 (960, 515)。v1.3：每个镜头都在推，镜头 1、2、5、7 推近再拉开
const TYPE0 = M('例句'), TYPE1 = ME('例句');
const CUT56 = SH(6).start, CUT78 = SH(8).start;   // 色块横扫、圆形遮罩的切点
const CAM0 = { x: WCX, y: WCY, z: 1.06 };
const CAM = [
  [0, 0.75, WCX, WCY, 1.14, 'sine'],                                     // 开场：圆洞放大的同时慢推
  [M('聊天框') - 0.06, M('聊天框') + 0.45, WCX, WCY + 20, 1.22],         // 「聊天框」：推近一级（窗口顶刚好贴着标题带）
  [TYPE0 - 0.25, TYPE0 + 0.25, WCX - 150, INPUT.y - 40, 1.55],          // 打字：推近输入框
  [TYPE0 + 0.25, TYPE1, WCX + 90, INPUT.y - 40, 1.6, 'sine'],           // 镜头跟着光标往右走
  [SENDMSG - 0.02, SENDMSG + 0.55, WCX, WCY - 15, 1.12],                // 发出后拉回，看见消息
  [SENDMSG + 0.6, M('提示词') - 0.12, WCX, WCY - 40, 1.22, 'sine'],      // 慢推近消息
  [M('提示词') - 0.12, M('提示词') + 0.4, WCX, WCY - 25, 1.06],           // 拉开看说明框
  [M('提示词') + 0.4, SH(2).end, WCX, WCY - 25, 1.1, 'sine'],
  [SH(3).start, SH(3).start + 0.6, 1090, 470, 1],                       // 镜头 3：沿流程横移，看见 AI
  [SH(3).start + 0.6, SH(3).end, 1110, 470, 1.03, 'sine'],
  [SH(4).start, SH(4).start + 0.64, PLAT.x, 515, 1],                    // 镜头 4：分词器
  [SH(4).start + 0.64, SH(4).end, PLAT.x, 525, 1.06, 'sine'],
  [SH(5).start, SH(5).start + 0.7, PLAT.x, 630, 1.16],                  // 镜头 5：往下、推近一排 Token（圆台顶不出画）
  [M('Token') - 0.3, M('Token') + 0.3, PLAT.x, 650, 1],                 // 「Token」拉开看 ③
  [CUT56, CUT56 + 0.6, PANEL.cam, 515, 1],                             // 镜头 6：色块横扫底下横移到海量数据
  [CUT56 + 0.65, SH(6).end, PANEL.cam, 515, 1.04, 'sine'],
  [SH(7).start, M('成都') - 0.05, PANEL.cam - 40, 525, 1.12],           // 镜头 7：推近看数据亮起
  [M('常常在一起出现') - 0.1, M('常常在一起出现') + 0.45, PANEL.cam + 40, 515, 1],   // 拉开看说明框
  [CUT78, CUT78 + 0.001, D.cam, 515, 1],                                // 镜头 8：圆形遮罩里直接是推断站
  [CUT78 + 0.05, TL.duration, D.cam, 515, 1.06, 'sine'],
];
function camAt(t) {
  let c = { ...CAM0 };
  for (const [t0, t1, x, y, z, e] of CAM) {
    if (t <= t0) break;
    const p = P(t, t0, t1 - t0), q = e === 'sine' ? sine(p) : inOutC(p);
    c = { x: lerp(c.x, x, q), y: lerp(c.y, y, q), z: lerp(c.z, z, q) };
  }
  return c;
}
// 震屏：「拆分」下刀、结论卡打勾砸下（各 0.18 秒，衰减）
const STAMP = M('旅行的需求') + 0.36;
function shakeAt(t) {
  const a = 动效.shake(t, CUT + 0.08, { amp: 8, d: 0.18 }), b = 动效.shake(t, STAMP, { amp: 11, d: 0.2 });
  return { dx: a.dx + b.dx, dy: a.dy + b.dy };
}

// ---------- 数据面板：12 句样例（3 列 × 4 行）+ 上下填充的看不清的数据 ----------
const COLW = 340, COLG = 20, PITCH = 84, PILLH = 64;
const BODY = { x: PANEL.x, y: PANEL.y + PANEL.head, w: PANEL.w, h: PANEL.h - PANEL.head };
const colX = (k) => BODY.x + (BODY.w - (3 * COLW + 2 * COLG)) / 2 + COLW / 2 + k * (COLW + COLG);
const rowY0 = BODY.y + BODY.h / 2;   // 4 行样例的中心
const FILL = ['北京烤鸭怎么做', '如何学好英语', '周末去哪里玩', '上海迪士尼门票', '猫咪不吃饭怎么办', '红烧肉的做法', '西安美食推荐', '手机充电很慢',
  '高铁票怎么改签', '重庆火锅底料', '考研复习计划', '杭州西湖景点', '跑步膝盖疼', '怎样早睡早起', '云南七天行程', '面试自我介绍',
  '家里养什么花', '电脑开不了机', '今天吃什么', '孩子不爱写作业', '咖啡的种类', '春节放假安排', '怎么做蛋糕', '演唱会抢票',
  '世界上最高的山', '牛肉怎么炖烂', '新手学吉他', '护肤的步骤', '厦门鼓浪屿', '租房注意事项', '雨天穿什么', '历史上的今天'];
const fillText = (r, k) => FILL[((r * 7 + k * 11) % FILL.length + FILL.length) % FILL.length];
const PAIRS = TL.data.map((d, i) => ({ ...d, i, col: i % 3, row: Math.floor(i / 3), both: d['成都'] && d['旅行'] }));
const BOTH = PAIRS.filter((d) => d.both);

// ---------- 背景（v1.3，三层一直在动）----------
// 远景：浅灰钟面圆环（视差 0.5，跟参考图的钟面呼应）；秒针一直转、刻度圈慢慢转
const RINGS = [[-260, 470], [PLAT.x, 520], [PANEL.cam, 470], [D.cam, 500]];
function drawRings(t, cam) {
  g.strokeStyle = C.ring; g.lineCap = 'round';
  RINGS.forEach(([sx, sy], i) => {
    const x = (sx - cam.x) * 0.5 + 960, y = (sy - cam.y) * 0.5 + 515;
    if (x < -500 || x > W + 500) return;
    g.strokeStyle = C.ring; g.lineWidth = 4; g.beginPath(); g.arc(x, y, 400, 0, TAU); g.stroke();
    g.lineWidth = 12;
    const rot = t * 0.12 + i * 0.4;
    for (let k = 0; k < 12; k++) {
      const a = k * TAU / 12 - Math.PI / 2 + rot, r0 = 330, r1 = k % 3 === 0 ? 374 : 362;
      g.beginPath(); g.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0); g.lineTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1); g.stroke();
    }
    const hs = t * 0.9 + i * 1.7, hm = t * 0.15 + i * 2.3;   // 秒针、分针
    g.strokeStyle = C.shadow; g.lineWidth = 10;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(hm) * 190, y + Math.sin(hm) * 190); g.stroke();
    g.lineWidth = 6; g.beginPath(); g.moveTo(x - Math.cos(hs) * 40, y - Math.sin(hs) * 40); g.lineTo(x + Math.cos(hs) * 290, y + Math.sin(hs) * 290); g.stroke();
    g.fillStyle = C.shadow; g.beginPath(); g.arc(x, y, 16, 0, TAU); g.fill();
  });
}
// 中景：扁平小几何（视差 0.3），慢慢往左漂、上下浮、转；颜色只用浅琥珀 / 浅橙 / 浅绿 / 钟面灰（避开强调色 A/B 的红蓝）
const BG_COLS = ['#f8e2a6', '#f6d9bd', '#dcead0', '#efe3c2', '#fbe9b8'];
const SHAPES = Array.from({ length: 30 }, (_, i) => {
  const h = (k) => 动效.hash(i * 9.13 + k * 3.71);
  return { x: h(1) * 2300, y: 150 + h(2) * 720, r: 10 + h(3) * 22, kind: Math.floor(h(4) * 5), col: BG_COLS[Math.floor(h(5) * BG_COLS.length)], ph: h(6) * TAU, spin: (h(7) - 0.5) * 1.2, v: 8 + h(8) * 14 };
});
function drawShapes(t, cam) {
  const mod = (v, m) => ((v % m) + m) % m;
  for (const s of SHAPES) {
    const x = mod(s.x - cam.x * 0.3 - s.v * t, 2300) - 190, y = s.y - (cam.y - 515) * 0.3 + 9 * Math.sin(0.9 * t + s.ph);
    if (y > 880 || y < 128) continue;
    g.save(); g.translate(x, y); g.rotate(s.ph + s.spin * t); g.fillStyle = s.col; g.strokeStyle = s.col;
    const r = s.r;
    if (s.kind === 0) { g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill(); }
    else if (s.kind === 1) { g.lineWidth = 7; g.beginPath(); g.arc(0, 0, r, 0, TAU); g.stroke(); }
    else if (s.kind === 2) { rrect(-r, -r, 2 * r, 2 * r, r * 0.35); g.fill(); }
    else if (s.kind === 3) { const a = r * 0.34; g.fillRect(-r, -a, 2 * r, 2 * a); g.fillRect(-a, -r, 2 * a, 2 * r); }
    else { g.beginPath(); g.moveTo(0, -r); g.lineTo(r * 0.9, r * 0.6); g.lineTo(-r * 0.9, r * 0.6); g.closePath(); g.fill(); }
    g.restore();
  }
}
// 流程线上：画完的箭头上有一颗奶白小珠，从尾到头流（每 1.6 秒一颗）
function arrowFlow(x0, y0, cx, cy, x1, y1, t, t0, a = 1) {
  if (t < t0 || a <= 0) return;
  const u = ((t - t0) / 1.6) % 1, k = 0.12 + 0.78 * u;
  const x = qb(x0, cx, x1, k), y = qb(y0, cy, y1, k), al = Math.sin(Math.PI * u) * a;
  g.save(); g.globalAlpha *= al; g.fillStyle = '#fffaf0'; g.beginPath(); g.arc(x, y, 7, 0, TAU); g.fill(); g.restore();
}

// 圆台下方的螺旋光带和小球
function drawSpiral(t) {
  const a = P(t, LAND + 0.1, 0.3); if (a <= 0) return;
  const x0 = PLAT.x, y0 = PLAT.y + PLAT.ry + PLAT.h - 10, y1 = ROW_Y - 56;

  g.save(); g.globalAlpha = a; g.lineCap = 'round';
  const gr = g.createLinearGradient(0, y0, 0, y1); gr.addColorStop(0, 'rgba(249,205,95,0.85)'); gr.addColorStop(1, 'rgba(249,205,95,0.05)');
  const seg = (front) => {
    g.beginPath(); let on = false;
    for (let k = 0; k <= 90; k++) { const [px, py, c] = pt(k / 90, 0); if ((c > 0) === front) { on ? g.lineTo(px, py) : g.moveTo(px, py); on = true; } else on = false; }
  };
  g.strokeStyle = gr; g.lineWidth = 16; seg(false); g.stroke();
  g.lineWidth = 24; seg(true); g.stroke();
  g.strokeStyle = 'rgba(255,250,232,0.9)'; g.lineWidth = 5; seg(true); g.stroke();
  const cols = [C.orange, '#85c05a', '#f3dfae', C.orange, '#85c05a', '#f8c35a', '#f3dfae', '#85c05a'];
  for (let i = 0; i < 8; i++) {
    const u = (t * 0.22 + i / 8) % 1, [px, py] = pt(u, 1.3 + i * 0.4);
    ball(px, py, i % 3 === 2 ? 8 : 11, cols[i], Math.sin(Math.PI * u));

}

// ---------- 例句：消息飞向 AI → 整条落到台面 → 7 刀切成 8 块 → 掉下去落成一排 Token ----------

function subIn(c, t, d) { const k = TL.cues.indexOf(c), prev = k > 0 ? TL.cues[k - 1] : null; return prev && prev.hide >= c.show - 1e-3 ? 1 : P(t, c.show, d); }
function drawSubtitle(t) {
  if (NOSUB) return;
  const c = TL.cueAt(t); if (!c) return;
  const a = subIn(c, t, 0.08), f = font(800, 64), y = 993;
  const str = c.text, x0 = W / 2 - tw(str, f) / 2;
  // 从左到右找关键词（长的优先，例如「旅行的需求」先于「旅行」）
  const segs = []; let j = 0, plain = '';
  while (j < str.length) {
    const m = SUB_HL.find(([w0]) => str.startsWith(w0, j));
    if (m) { if (plain) { segs.push([plain]); plain = ''; } segs.push(m); j += m[0].length; } else { plain += str[j]; j++; }
  }
  if (plain) segs.push([plain]);
  g.save(); g.globalAlpha = a;
  let xx = x0;
  for (const [s, col] of segs) {   // 先画马克笔底
    const ww = tw(s, f);
    if (SUB_HL.some(([w0, c0]) => w0 === s && !c0)) { g.fillStyle = 'rgba(251,191,47,0.85)'; rrect(xx - 6, y + 2, ww + 12, 30, 8); g.fill(); }
    xx += ww;
  }
  xx = x0; g.font = f; g.textBaseline = 'middle'; g.textAlign = 'left';
  for (const [s, col] of segs) { g.fillStyle = col || C.ink; g.fillText(s, xx, y); xx += tw(s, f); }
  g.restore();
}

// ---------- 转场（v1.3，画面坐标；只盖标题带和字幕区之间 y 112–908，字幕区不经过） ----------
const STAGE_Y0 = 112, STAGE_Y1 = 908;
function clipStage() { g.beginPath(); g.rect(0, STAGE_Y0, W, STAGE_Y1 - STAGE_Y0); g.clip(); }
// 圆形遮罩：琥珀盖在外面，中间一个圆洞放大（开场）；或圆里是下一站、圆边一道琥珀环（镜头 7 → 8）
function irisRing(cx, cy, R) {
  g.lineWidth = 16; g.strokeStyle = C.shadow; g.beginPath(); g.arc(cx + 6, cy + 9, R + 8, 0, TAU); g.stroke();
  g.strokeStyle = C.amber2; g.beginPath(); g.arc(cx, cy, R + 8, 0, TAU); g.stroke();
}
function drawOpenIris(t) {
  const p = P(t, 0, 0.62); if (p >= 1) return;
  const R = 1080 * outC(p), cx = 960, cy = 515;
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); clipStage();
  g.fillStyle = C.amber; g.beginPath(); g.rect(0, 0, W, H); if (R > 0) g.arc(cx, cy, R, 0, TAU, true); g.fill('evenodd');
  if (R > 0) irisRing(cx, cy, R);
  g.restore();
}
// 色块横扫（镜头 5 → 6）：琥珀色块从左往右扫进来盖满，底下镜头横移，再从左往右扫走；块上有白色流程箭头。Token 块画在色块上面
function sweepEdges(t) {
  const lead = lerp(-260, W + 260, inOutC(P(t, CUT56 - 0.28, 0.32)));
  const tail = lerp(-260, W + 260, inOutC(P(t, CUT56 + 0.36, 0.34)));
  return { lead, tail, on: t > CUT56 - 0.28 && t < CUT56 + 0.7 };
}
function drawSweep(t) {
  const e = sweepEdges(t); if (!e.on) return;
  const sl = 150;   // 斜边
  const band = (x0, x1, col) => { if (x1 <= x0) return; g.fillStyle = col; g.beginPath(); g.moveTo(x0 + sl, STAGE_Y0); g.lineTo(x1 + sl, STAGE_Y0); g.lineTo(x1 - sl, STAGE_Y1); g.lineTo(x0 - sl, STAGE_Y1); g.closePath(); g.fill(); };
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); clipStage();
  band(e.tail - 60, e.lead + 60, C.shadow);
  band(e.tail, e.lead, C.amber);
  band(e.lead - 46, e.lead, C.amber2);
  band(e.tail, e.tail + 36, C.amberL);
  // 块上的白色流程箭头 »»（跟着往右走）
  g.save(); g.beginPath(); g.moveTo(e.tail + sl, STAGE_Y0); g.lineTo(e.lead - 46 + sl, STAGE_Y0); g.lineTo(e.lead - 46 - sl, STAGE_Y1); g.lineTo(e.tail - sl, STAGE_Y1); g.closePath(); g.clip();
  g.strokeStyle = 'rgba(255,255,255,0.42)'; g.lineWidth = 34; g.lineCap = 'round'; g.lineJoin = 'round';
  const off = ((t - CUT56) * 900) % 360;
  for (let x = -360 + off; x < W + 360; x += 360) for (const y of [330, 690]) { g.beginPath(); g.moveTo(x - 50, y - 90); g.lineTo(x + 40, y); g.lineTo(x - 50, y + 90); g.stroke(); }
  g.restore();
  g.restore();
}

// ---------- 一帧 ----------
function setCam(cam, sh) { g.setTransform(cam.z, 0, 0, cam.z, 960 - cam.x * cam.z + sh.dx, 515 - cam.y * cam.z + sh.dy); }
function drawBack(t, cam) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  drawRings(t, cam);
  drawShapes(t, cam);
}
function drawWorld(t, cam, sh) {
  setCam(cam, sh);
  // 聊天框 → AI
  const a1 = [WIN.x + WIN.w + 16, UB.y, 1200, 390, CHIPAI.x - 132, CHIPAI.y - 10];
  arrow(...a1, outC(P(t, M('AI') + 0.08, 0.42)));
  arrowFlow(...a1, t, M('AI') + 0.55);
  drawAppIcon(t);
  drawGhosts(t);
  drawWindow(t);
  // ② 分词器
  stepLabel(860, 196, 2, '分词器', '把一句话切成更小的单位', M('分词器') - 0.06, t, { fade: 1 - P(t, SH(5).start, 0.3) });
  drawSpiral(t);
  drawPlatform(t);
  drawAIChip(t);
  // ③ 说明框「最小的语言碎片」+ Token
  const cp = P(t, M('最小的语言碎片') - 0.05, 0.55) * (1 - P(t, SH(6).start, 0.3));
  const bx = 1880, by = 590, bw = 360, bh = 84;
  callout(bx, by, bw, bh, () => text('最小的语言碎片', 0, 3, font(800, 40), C.ink), cp,
    [[ROW[NT - 1].x, by + bh], [ROW[NT - 1].x, ROW_Y - CH.h / 2 - 6]]);
  drawTokenLabel(t);
  const a3 = [2200, 760, 2360, 860, 2440, 640];
  arrow(...a3, outC(P(t, SH(6).start + 0.04, 0.5)));     // ③ → ④
  arrowFlow(...a3, t, SH(6).start + 0.6);
  // ④ 海量数据
  stepLabel(2530, 215, 4, '翻找', '', SH(6).start + 0.44, t);
  drawPanel(t, cam);
  drawBar(t);
  drawCooccurCallout(t);
  const a4 = [3950, 690, 4070, 750, 4120, 615];
  arrow(...a4, outC(P(t, SH(8).start + 0.04, 0.45)));   // ④ → ⑤
  arrowFlow(...a4, t, SH(8).start + 0.6);
  // ⑤ 推断
  stepLabel(D.label.x, D.label.y, 5, '推断', '读懂你想要什么', M('推断') - 0.04, t, { inline: true });
  drawInfer(t);
}
function drawTop(t, cam, sh) {   // 消息长条、碎块、Token 永远在最上层
  setCam(cam, sh);
  drawPieces(t);
  drawCuts(t);
}
const IRIS_C = { x: PANEL.x + PANEL.w + 35 + 165, y: 516 };   // 圆形遮罩从说明框「成都 + 旅行」的加号处开
function render(t) {
  动效.resetCtx(g);                    // v1.3：每帧开头把画布状态整套复位（见 SKILL.md 页面约定）
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  const cam = camAt(t), sh = shakeAt(t);
  const ip = P(t, CUT78, 0.55);
  if (ip > 0 && ip < 1) {   // 圆形遮罩：外面是上一站（镜头停在切点前），圆里是推断站
    const old = camAt(CUT78 - 0.001);
    drawBack(t, old); drawWorld(t, old, sh); drawTop(t, old, sh);
    const cx = (IRIS_C.x - old.x) * old.z + 960, cy = (IRIS_C.y - old.y) * old.z + 515, R = 1760 * inOutC(ip);
    g.save(); g.setTransform(1, 0, 0, 1, 0, 0); clipStage(); g.beginPath(); g.arc(cx, cy, R, 0, TAU); g.clip();
    drawBack(t, cam); drawWorld(t, cam, sh); drawTop(t, cam, sh);
    g.restore();
    g.save(); g.setTransform(1, 0, 0, 1, 0, 0); clipStage(); irisRing(cx, cy, R); g.restore();
  } else {
    drawBack(t, cam); drawWorld(t, cam, sh);
    drawSweep(t);
    drawTop(t, cam, sh);
  }
  drawOpenIris(t);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  drawHeader();
  drawSubtitle(t);
}

window.DURATION = TL.duration;
window.seek = (t) => render(t);
render(0);
window.ready = true;
</script>
</body>
