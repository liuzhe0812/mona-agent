<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>手绘笔记 · Token 例子（v1.3）</title>
<!--
  手绘笔记（S22）的 Token 例子：米白纸 + 墨蓝钢笔线稿（斜排线阴影）+ 唯一的橙色点缀；@标签（墨蓝底白字）+ 手写正文 + 波浪占位线 + 末端带圆点的细引线；
  虚线标题框里压「※ … ※」圆头英文和颗粒粗圆中文；左右交错往下排的竖长图版式。
  画面只由时间 t 计算：window.seek(t)。内容和时间全部来自 timeline.js（window.TL，和本页放在同一个文件夹）：
  镜头起止用 TL.shots，动作卡在 TL.mark('关键词') 上，逐字写字用 TL.chars，例句和切分用 TL.example，数据用 TL.data，字幕用 TL.cueAt(t)。
  整片是一张竖长的笔记纸，镜头从标题往下读：A 标题 + 电脑聊天框 → B 机器人 + 剪刀剪纸条 → C 笔记本翻页找数据 → D 推断结论。
  强调色 A = 橙（成都）、B = 墨蓝（旅行），全片固定。
  v1.3 动效：背景两层一直在动（纸页起伏的光影 + 页边铅笔涂鸦，涂鸦跟镜头走 0.4 倍有视差）；写字、描圈时笔尖 / 橙色马克笔跟着写；
  每个镜头慢推；转场 4 种：推近再拉开、镜头往下读、卷角翻到新一页（13.79 秒）、橡皮擦掉（18.99 秒）。--no-subtitle（?nosub=1）时字幕和底部字幕带整块不画。
-->
<style>
  html, body { margin: 0; padding: 0; background: #f6f6ef; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  #stage canvas { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<script src="timeline.js"></script>
<script src="动效部件.js"></script>
<script>
'use strict';
const W = 1920, H = 1080, TAU = Math.PI * 2;
const TL = window.TL;
const NOSUB = /[?&]nosub=1/.test(location.search);   // 不画字幕和字幕带（render.mjs --no-subtitle 会加 ?nosub=1）
const M = (k) => TL.mark(k), ME = (k) => TL.markEnd(k);
const SH = (k) => TL.shots[k - 1];

// ---------- 字体（全部是 macOS 自带字体，没有用户装的字体） ----------
// 手札体-简：手写正文、字幕、@标签；圆体-简 Bold：颗粒粗圆标题、结论章；Arial Rounded MT Bold：圆头英文
const F_HAND = '"Hannotate SC", "HanziPen SC", "PingFang SC", sans-serif';
const F_ROUND = '"Yuanti SC", "Hannotate SC", "PingFang SC", sans-serif';
const F_EN = '"Arial Rounded MT Bold", "Hannotate SC", "PingFang SC", sans-serif';
const hand = (s, w = 700) => `${w} ${s}px ${F_HAND}`;
const round = (s) => `700 ${s}px ${F_ROUND}`;
const en = (s) => `400 ${s}px ${F_EN}`;

// ---------- 配色（取自参考图，见 风格卡.md） ----------
const C = {
  paper: '#f6f6ef', white: '#fcfcf8', ink: '#15192d', gray: '#98999a', gray2: '#b9baba', gray3: '#d4d5d3',
  orange: '#f8711c', orangeD: '#a63d0a', orangeL: '#fde6d2',
};
const COL_CD = C.orange, COL_LX = C.ink;   // 成都 = 橙、旅行 = 墨蓝（全片固定）

// ---------- 小工具 ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const P = (t, a, d) => clamp((t - a) / d);
const outC = (p) => 1 - Math.pow(1 - p, 3);
const inOutC = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const outBack = (p) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const inQ = (p) => p * p;
const sine = (p) => 0.5 - 0.5 * Math.cos(Math.PI * p);
const bump = (p) => Math.sin(Math.PI * clamp(p));
const qb = (a, c, b, u) => (1 - u) * (1 - u) * a + 2 * (1 - u) * u * c + u * u * b;   // 二次贝塞尔
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, p) { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * p)).join(',')})`; }
function rgba(h, a) { const [r, gg, b] = hex(h); return `rgba(${r},${gg},${b},${a})`; }

const cv = document.getElementById('c');
const g = cv.getContext('2d');
const wCache = new Map();
function tw(s, f) { const k = f + '|' + s; let v = wCache.get(k); if (v === undefined) { g.save(); g.font = f; v = g.measureText(s).width; g.restore(); wCache.set(k, v); } return v; }
function text(s, x, y, f, col, align = 'left', base = 'middle') { g.font = f; g.fillStyle = col; g.textAlign = align; g.textBaseline = base; g.fillText(s, x, y); }

// ---------- 手绘线（参考图的钢笔线稿） ----------
// 所有线条在开始时用带种子的随机数生成一次（抖动、弯度、两端出头），之后每帧只按进度描出来，所以同一个 t 永远画出同一帧
let RND = mulberry32(22);
const rr = (a, b) => a + (b - a) * RND();
function seedRnd(s) { RND = mulberry32(s); }
// 一段抖动折线：A→B 细分，法线方向加低频抖动、整体弯一点；over = 两端出头的长度
function wob(x0, y0, x1, y1, o = {}) {
  const amp = o.amp ?? 1.1, over = o.over ?? 0, bow = o.bow ?? 0.006;
  const L = Math.hypot(x1 - x0, y1 - y0) || 1, ux = (x1 - x0) / L, uy = (y1 - y0) / L, nx = -uy, ny = ux;
  const ax = x0 - ux * over * rr(0.3, 1), ay = y0 - uy * over * rr(0.3, 1);
  const bx = x1 + ux * over * rr(0.3, 1), by = y1 + uy * over * rr(0.3, 1);
  const LL = Math.hypot(bx - ax, by - ay), n = Math.max(2, Math.ceil(LL / 24));
  const b = rr(-1, 1) * bow * LL, ph1 = rr(0, TAU), ph2 = rr(0, TAU), f1 = rr(0.8, 1.8), f2 = rr(2.5, 4.5);
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const u = i / n, e = i === 0 || i === n ? 0.3 : 1;
    const off = b * Math.sin(Math.PI * u) + amp * e * (0.7 * Math.sin(u * f1 * TAU + ph1) + 0.3 * Math.sin(u * f2 * TAU + ph2));
    pts.push([lerp(ax, bx, u) + nx * off, lerp(ay, by, u) + ny * off]);
  }
  return pts;
}
// 过一串点的平滑曲线（Catmull-Rom），再加一点手抖
function curvePts(pts, seg = 10, closed = false) {
  const out = [], n = pts.length, get = (i) => (closed ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)]);
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
    for (let k = 0; k < seg; k++) {
      const u = k / seg, u2 = u * u, u3 = u2 * u;
      out.push([0, 1].map((j) => 0.5 * (2 * p1[j] + (-p0[j] + p2[j]) * u + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * u2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * u3)));
    }
  }
  out.push((closed ? get(0) : pts[n - 1]).slice());
  return out;
}
function shake(pts, amp = 0.8) { const p1 = rr(0, TAU), p2 = rr(0, TAU); return pts.map(([x, y], i) => [x + amp * Math.sin(i * 0.37 + p1), y + amp * Math.cos(i * 0.29 + p2)]); }
function rrPts(x, y, w, h, r, step = 9) {   // 圆角矩形的点（从上边左端起顺时针）
  const out = [];
  const seg = (x0, y0, x1, y1) => { const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / step)); for (let i = 0; i < n; i++) out.push([lerp(x0, x1, i / n), lerp(y0, y1, i / n)]); };
  const arc = (cx, cy, a0) => { const n = Math.max(2, Math.ceil(r * 1.6 / step)); for (let i = 0; i < n; i++) { const a = a0 + (Math.PI / 2) * i / n; out.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } };
  seg(x + r, y, x + w - r, y); arc(x + w - r, y + r, -Math.PI / 2);
  seg(x + w, y + r, x + w, y + h - r); arc(x + w - r, y + h - r, 0);
  seg(x + w - r, y + h, x + r, y + h); arc(x + r, y + h - r, Math.PI / 2);
  seg(x, y + h - r, x, y + r); arc(x + r, y + r, Math.PI);
  return out;
}
// 一张「线稿」：按顺序记下每一笔（和填色），draw(p) 按总长度的比例 p 一笔一笔描出来
class Sk {
  constructor(seed) { this.items = []; this.total = 0; this.pen = false; if (seed !== undefined) seedRnd(seed); }
  penOn() { this.pen = true; return this; }   // v1.3：描这张线稿时笔尖跟着走（墨蓝线 = 钢笔，橙线 = 马克笔）；线条多、东一笔西一笔的大线稿别开
  add(pts, o = {}) {
    let len = 0; const cum = [0];
    for (let i = 1; i < pts.length; i++) { len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); cum.push(len); }
    this.items.push({ kind: 'line', pts, cum, len, w: o.w ?? 3.4, col: o.col ?? C.ink, a: o.a ?? 1, at: this.total });
    this.total += len;
    return this;
  }
  fill(pts, col, o = {}) { this.items.push({ kind: 'fill', pts, col, a: o.a ?? 1, at: this.total, fade: o.fade ?? 140 }); return this; }
  dot(x, y, r, col = C.ink) { const pts = []; for (let i = 0; i < 14; i++) { const a = i / 14 * TAU; pts.push([x + Math.cos(a) * r * rr(0.9, 1.1), y + Math.sin(a) * r * rr(0.9, 1.1)]); } return this.fill(pts, col, { fade: 30 }); }
  line(x0, y0, x1, y1, o = {}) { return this.add(wob(x0, y0, x1, y1, o), o); }
  poly(pts, o = {}) { for (let i = 1; i < pts.length; i++) this.line(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1], o); return this; }
  curve(pts, o = {}) { return this.add(shake(curvePts(pts, o.seg ?? 10, o.closed), o.amp ?? 0.7), o); }
  // 手绘框：四条边分开画，转角出头；double 再错开描一遍
  rect(x, y, w, h, o = {}) {
    const oo = { over: 8, ...o };
    this.line(x, y, x + w, y, oo); this.line(x + w, y, x + w, y + h, oo); this.line(x + w, y + h, x, y + h, oo); this.line(x, y + h, x, y, oo);
    if (o.double) { const d = o.double; const o2 = { ...oo, w: (o.w ?? 3.4) * 0.7, over: 5 }; this.line(x + d, y - d * 0.4, x + w - d * 0.6, y + d * 0.3, o2); this.line(x + w + d * 0.5, y + d, x + w - d * 0.3, y + h - d, o2); }
    return this;
  }
  // 手绘圆角框：一笔画完，收笔时多画一小段
  rrect(x, y, w, h, r, o = {}) {
    const pts = rrPts(x, y, w, h, r);
    const k = Math.max(2, Math.floor(pts.length * (o.overlap ?? 0.05)));
    return this.add(shake(pts.concat(pts.slice(0, k).map(([px, py]) => [px + rr(-1.5, 1.5), py + rr(-1, 2)])), o.amp ?? 1.0), o);
  }
  // 手绘椭圆：转 1.05–1.2 圈，半径有起伏（圈重点用）
  ellipse(cx, cy, rx, ry, o = {}) {
    const turns = o.turns ?? 1.08, a0 = o.a0 ?? rr(0, TAU), n = Math.ceil(Math.max(rx, ry) * turns * 0.35) + 24, ph = rr(0, TAU), j = o.j ?? 0.025, sp = o.spiral ?? 0.05;
    const pts = [];
    for (let i = 0; i <= n; i++) { const u = i / n, a = a0 + u * turns * TAU, k = 1 + j * Math.sin(u * 3 * TAU + ph) + sp * (u - 0.5); pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]); }
    return this.add(pts, o);
  }
  // 虚线（标题框那种短划线）
  dash(x0, y0, x1, y1, o = {}) {
    const L = Math.hypot(x1 - x0, y1 - y0), d = o.d ?? 24, gp = o.gp ?? 9; let s = rr(0, 5);
    while (s < L - 4) { const e = Math.min(L, s + d * rr(0.7, 1.3)); this.line(lerp(x0, x1, s / L), lerp(y0, y1, s / L), lerp(x0, x1, e / L), lerp(y0, y1, e / L), { ...o, over: 0, amp: 0.5 }); s = e + gp * rr(0.6, 1.4); }
    return this;
  }
  // 波浪占位线 ~~~~
  squig(x0, y, x1, o = {}) {
    const pts = [], n = Math.max(4, Math.ceil((x1 - x0) / 5)), amp = o.amp ?? 4.5, per = o.per ?? 20, ph = rr(0, TAU);
    for (let i = 0; i <= n; i++) { const x = lerp(x0, x1, i / n); pts.push([x, y + amp * Math.sin((x - x0) / per * TAU + ph) + rr(-0.6, 0.6)]); }
    return this.add(pts, o);
  }
  // 参考图里「~~~~ —— · ——」那种没写出来的字
  filler(x0, y, x1, o = {}) {
    let x = x0; const oo = { w: 2.6, col: C.gray, ...o };
    while (x < x1 - 20) {
      const k = RND(), L = Math.min(x1 - x, rr(40, 130));
      if (k < 0.4) this.squig(x, y, x + L, { ...oo, amp: 3.5, per: 15 });
      else if (k < 0.85) this.line(x, y + rr(-2, 2), x + L, y + rr(-2, 2), { ...oo, amp: 0.8 });
      else { this.dot(x + 6, y + 2, 2.6, oo.col); this.dot(x + 22, y + 2, 2.6, oo.col); }
      x += L + rr(14, 30);
    }
    return this;
  }
  // 斜排线：多边形里画一组平行短线（两端随机缩一点），angle 弧度，gap 间距
  hatch(poly, angle, gap, o = {}) {
    const ca = Math.cos(angle), sa = Math.sin(angle);
    const pv = poly.map(([x, y]) => [x * ca + y * sa, -x * sa + y * ca]);
    const vs = pv.map((p) => p[1]), v0 = Math.min(...vs), v1 = Math.max(...vs);
    for (let v = v0 + gap * rr(0.3, 0.8); v < v1; v += gap * rr(0.8, 1.2)) {
      const xs = [];
      for (let i = 0; i < pv.length; i++) {
        const [ua, va] = pv[i], [ub, vb] = pv[(i + 1) % pv.length];
        if ((va <= v && vb > v) || (vb <= v && va > v)) xs.push(ua + (v - va) / (vb - va) * (ub - ua));
      }
      xs.sort((a, b) => a - b);
      for (let k = 0; k + 1 < xs.length; k += 2) {
        let ua = xs[k], ub = xs[k + 1]; const L = ub - ua; if (L < 5) continue;
        ua += L * rr(0, o.shrink ?? 0.15); ub -= L * rr(0, o.shrink ?? 0.15);
        this.add(wob(ua * ca - v * sa, ua * sa + v * ca, ub * ca - v * sa, ub * sa + v * ca, { amp: 0.4, bow: 0.01 }), { w: o.w ?? 1.8, col: o.col ?? C.ink, a: o.a ?? 0.8 });
      }
    }
    return this;
  }
  // 地面：物体底下几道横向短线
  ground(x0, x1, y, o = {}) {
    let x = x0 + rr(0, 20);
    while (x < x1) { const L = rr(30, 110); this.line(x, y + rr(-3, 3), Math.min(x1, x + L), y + rr(-3, 3), { w: 2.2, col: C.ink, a: 0.75, amp: 0.6, ...o }); x += L + rr(10, 40); }
    return this;
  }
  // 引线：细线 + 末端实心圆点（参考图的说明引线）
  lead(pts, o = {}) { const oo = { w: 2.4, ...o }; this.poly(pts, oo); const e = pts[pts.length - 1]; return this.dot(e[0], e[1], o.r ?? 7, oo.col ?? C.ink); }
  // 按进度画：p = 0–1（按总长度）
  draw(p = 1, t0) {
    if (p <= 0) return;
    const L = p >= 1 ? Infinity : p * this.total;
    for (const it of this.items) {
      if (it.kind !== 'fill' || it.at > L) continue;
      g.save(); g.globalAlpha *= it.a * clamp((L - it.at) / it.fade); g.fillStyle = it.col;
      g.beginPath(); it.pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.fill(); g.restore();
    }
    g.lineCap = 'round'; g.lineJoin = 'round';
    for (const it of this.items) {
      if (it.kind !== 'line' || it.at >= L) continue;
      const rem = L - it.at, pts = it.pts;
      g.save(); g.globalAlpha *= it.a; g.strokeStyle = it.col; g.lineWidth = it.w;
      g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) {
        if (it.cum[i] <= rem) { g.lineTo(pts[i][0], pts[i][1]); continue; }
        const k = (rem - it.cum[i - 1]) / (it.cum[i] - it.cum[i - 1]), px = lerp(pts[i - 1][0], pts[i][0], k), py = lerp(pts[i - 1][1], pts[i][1], k);
        g.lineTo(px, py);
        if (this.pen) penCand(px, py, t0 ?? this._t0 ?? 0, it.col === C.orange ? 'marker' : 'pen');
        break;
      }
      g.stroke(); g.restore();
    }
  }
  // 笔从右上方落下来（开始前 0.14 秒）、描完抬走（0.16 秒）
  at(t, t0, d) {
    this._t0 = t0;
    if (this.pen && this.items.length) {
      const ln = this.items.filter((it) => it.kind === 'line');
      if (ln.length && t < t0 && t > t0 - 0.14) { const a = ln[0]; penCand(a.pts[0][0], a.pts[0][1], t0, a.col === C.orange ? 'marker' : 'pen', 'approach', P(t, t0 - 0.14, 0.14)); }
      else if (ln.length && t >= t0 + d && t < t0 + d + 0.16) { const b = ln[ln.length - 1], e = b.pts[b.pts.length - 1]; penCand(e[0], e[1], t0, b.col === C.orange ? 'marker' : 'pen', 'leave', P(t, t0 + d, 0.16)); }
    }
    this.draw(P(t, t0, d));
  }
}

// ---------- 文字 ----------
// 手写字：每个字在自己的时刻从左往右「写」出来（times[i] 是第 i 个字开始写的时间，dur 是写一个字用的秒数）
// pen：v1.3 笔尖跟着写（默认开；屏幕里「打出来」的字、白字传 false）
function writeText(str, x, y, f, col, t, times, dur = 0.12, align = 'left', pen = true) {
  const chars = [...str], ws = chars.map((ch) => tw(ch, f)), tot = ws.reduce((a, b) => a + b, 0);
  let xx = align === 'center' ? x - tot / 2 : align === 'right' ? x - tot : x;
  g.font = f; g.fillStyle = col; g.textAlign = 'left'; g.textBaseline = 'middle';
  const n = chars.length, t0 = times[0], hs = (ws[0] || 40) * 0.16; if (col === '#ffffff') pen = false;   // 色块上的白字不跟笔
  if (pen && t < t0 && t > t0 - 0.14) penCand(xx, y, t0, 'pen', 'approach', P(t, t0 - 0.14, 0.14));
  for (let i = 0; i < n; i++) {
    const p = P(t, times[i], dur);
    if (p <= 0) { if (pen && i > 0) penCand(xx, y + hs, t0, 'pen', 'hover'); break; }
    if (p >= 1) g.fillText(chars[i], xx, y);
    else {
      g.save(); g.beginPath(); g.rect(xx - 6, y - ws[i] * 1.3, (ws[i] + 12) * p, ws[i] * 2.6); g.clip(); g.fillText(chars[i], xx, y); g.restore();
      if (pen) penCand(xx - 6 + (ws[i] + 12) * p, y + hs * Math.sin(p * TAU * 1.5 + 1), t0, 'pen');
    }
    xx += ws[i];

  for (const s of segs) { g.fillStyle = s.box ? '#ffffff' : C.ink; g.fillText(s.s, x + (s.box ? PB : 0), y + 2); x += s.w; }
  g.restore();
}

// ---------- 一帧 ----------
// 每帧先把画布状态全部复位：画面只由 t 决定，和之前 seek 过哪一帧无关
function resetCtx() {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.filter = 'none';
  g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = 1; g.miterLimit = 10; g.setLineDash([]);
  g.font = hand(40); g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillStyle = C.ink; g.strokeStyle = C.ink;
  g.shadowBlur = 0; g.shadowColor = 'rgba(0,0,0,0)'; g.shadowOffsetX = 0; g.shadowOffsetY = 0; g.imageSmoothingEnabled = true;
  PEN = null; PEN_OFF = false;
}
// 层次（从下往上）：纸色 + 纸纹 → 页边铅笔涂鸦（远景，0.4 倍视差）→ 场景 → 翻页 / 橡皮擦 → 浮在最上面的 Token → 纸页起伏的光影 → 笔 → 字幕带和字幕
function render(t) {
  resetCtx();
  g.fillStyle = C.paper; g.fillRect(0, 0, W, H);
  const cam = camAt(t), v = view(cam), sk = shakeAt(t);
  setCam(cam, sk.dx, sk.dy);
  g.fillStyle = PAPER; g.fillRect(v.x0 - 20, v.y0 - 20, v.x1 - v.x0 + 40, v.y1 - v.y0 + 40);
  drawDoodles(t);
  setCam(cam, sk.dx, sk.dy);
  drawA(t, v); drawB(t, v); drawC(t, v); drawD(t, v); drawScissors(t, v);
  if (pageCurl(t, CURL6.t0, CURL6.d, cam)) PEN_OFF = true;
  if (eraseWipe(t, ERASE8.t0, ERASE8.d, cam) && t < TJ8) PEN_OFF = true;
  setCam(cam, sk.dx, sk.dy);
  drawTop(t, v);
  drawLight(t);
  drawPenTool(t);
  if (!NOSUB) { drawSubBand(); drawSubtitle(t); }   // --no-subtitle：字幕和字幕带整块不画
}

window.DURATION = TL.duration;
window.seek = (t) => render(t);
render(0);
window.ready = true;
</script>
