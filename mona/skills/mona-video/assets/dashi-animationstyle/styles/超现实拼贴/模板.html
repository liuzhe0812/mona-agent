<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>超现实拼贴 · 通用模板</title>
<!--
  超现实拼贴（S44）的通用模板：能吃任何口播的 timeline.js（和本页放在同一个文件夹，由 pipeline/生成timeline.mjs 生成）。
  米灰纸海报上的超现实概念拼贴：特粗高反差衬线大标题（一个字桃橙渐变、压橙色干笔刷）、手写批注 + 手绘箭头、撕边纸条和纸胶带，背后太阳、青条、方格纸。
  文件分两块：「底座：换内容时不用改」（字体、配色、小工具、质感缓存、笔刷、标题、拍上动作、批注、纸胶带、罗盘、背包小人、骨牌、放大镜、剪刀、石头人头、镜头、背景纸片、页眉、字幕）
  和「场景：按新分镜重写」。场景区现在是通用骨架（每个镜头一张海报：大标题 + 撕边纸条关键词）；这套要先想一个超现实比喻再画，见 风格卡.md「换内容时怎么改」。
  强调色 A = 红 #a02503、B = 蓝 #3aa6c0。满屏颗粒，出片用 --format jpeg（新建作品.mjs 已写进 作品.json）。
  v1.3 默认动效（开关 FX_DEFAULT，在脚本开头）：背景四层一直轻轻动（纸面光影、太阳、青条和方格纸、远处小纸屑）；
  每个镜头交界自动轮换转场（撕海报 → 纸条斜扫 → 钻进去，FX_PLAN 可逐个指定或关掉）；每个镜头慢推。
  场景入口在 paint(t) 里（「← 场景入口」那行）：换成自己的场景后，默认转场照样按 TL.shots 自动加在每个镜头交界。
-->
<style>
  html, body { margin: 0; padding: 0; background: #e9e5d9; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  #stage canvas { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<script src="timeline.js"></script>
<script src="动效部件.js"></script>
<script>

  x.putImageData(id, 0, 0); return c; })();
const grainPat = g.createPattern(GRAIN, 'repeat');
// 纸底：米灰 + 两层斑驳 + 颗粒 + 纤维 + 很轻的暗角
const PAPER = (() => {
  const c = mk(W, H), x = c.getContext('2d'), id = x.createImageData(W, H), d = id.data, r = mulberry32(5);
  const grid = (S) => { const gx = Math.ceil(W / S) + 2, gy = Math.ceil(H / S) + 2, a = new Float32Array(gx * gy); for (let i = 0; i < a.length; i++) a[i] = r() - 0.5; return { a, gx, S }; };

  for (let y = 0; y < H; y++) for (let xx = 0; xx < W; xx++) {
    const i = (y * W + xx) * 4, vx = xx / W - 0.5, vy = y / H - 0.5;
    const m = smp(G1, xx, y) * 10 + smp(G2, xx, y) * 4 - 16 * (vx * vx * 0.7 + vy * vy * 0.5);
    d[i] = 233 + m; d[i + 1] = 229 + m; d[i + 2] = 217 + m * 0.9; d[i + 3] = 255;
  }
  x.putImageData(id, 0, 0);
  x.lineCap = 'round';
  for (let k = 0; k < 1100; k++) { const px = r() * W, py = r() * H, a = r() * TAU, L = 4 + r() * 16;

function makePiece(kind, w, h, base, light, dark, seed) {

const TEAL = makePiece('rect', 230, 470, '#43a9ad', '#55b8bb', '#2f9196', 22);
// 撕边方格纸：米白底、蓝绿格线、铅笔乱涂
const GRAPH = (() => {

// 石头人头（AI）：侧脸朝右、头顶切开。世界坐标；切口中心 (400,360)

    paste(t, it.t0, it.x, it.y, () => {
      g.save(); g.translate(it.x, it.y + sw.dy); g.rotate(it.rot + sw.r);
      const pts = tornRect(it.wd, SLH, it.seed, { edge: 1.2, endL: 4, endR: 4 });
      g.fillStyle = 'rgba(40,32,18,0.22)'; poly(pts, 5, 7); g.fill();
      g.fillStyle = it.col; poly(pts); g.fill();
      text(it.w, 0, 4, SLF, it.ink, 'center');
      g.restore();
      tape(it.x - it.wd / 2 + 18, it.y - SLH / 2 + 4 + sw.dy, 70, 22, -0.5, 0.9);
    }, 0.28);
  }
  handText(`#${i + 1}`, 1560, 760, 56, P(t, s.start + 0.5, 0.4), { col: C.orange });
  g.restore();
}

// ---------- 一帧 ----------
// ---------- 动效入口（v1.2）：转场、次要动作写在这两个函数里，调 动效部件.js（用法见那个文件开头、knowledge/动效和画面变化.md 第八节）；空着画面不变 ----------
function fxBefore(t) { }   // 画场景之前、镜头已设好：推移（动效.push + 动效.shift）、慢推、震屏、整体抖
function fxAfter(t) { }    // 场景画完、页眉字幕之前，已是屏幕坐标：故障、擦除、翻页、纸片盖屏、粒子、泛光
// ---------- v1.3 默认转场（FX_DEFAULT 为 true 时，按 CUT_KIND 加在每个镜头交界；「钻进去」的猛推在 camFx 里） ----------
// 撕海报：上一镜头最后一帧（paint 画进离屏画布）沿中间一条撕边撕成两半，各自抬起、转着往左右飞出，露出下一镜头。0.45 秒
const TEAR_EDGE = (() => { const r = mulberry32(71), pts = []; for (let i = 0; i <= 30; i++) { const u = i / 30; pts.push([lerp(990, 930, u) + (r() - 0.5) * 22 + 16 * Math.sin(u * 11), lerp(-60, 1140, u)]); } return pts; })();
function tearHalf(side) { g.beginPath(); g.moveTo(side < 0 ? -80 : W + 80, -60); for (const [x, y] of TEAR_EDGE) g.lineTo(x, y); g.lineTo(side < 0 ? -80 : W + 80, 1140); g.closePath(); }
function tearCut(t, c) {
  const p = P(t, c, 0.45); if (p <= 0 || p >= 1) return;
  const keep = g; g = LG; g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.clearRect(0, 0, W, H); paint(c - 0.001); g = keep;
  for (const side of [-1, 1]) {
    const q = P(p, side < 0 ? 0 : 0.08, 0.92), lift = outC(P(q, 0, 0.3)), fly = inQ(P(q, 0.08, 0.92)), px = side < 0 ? 900 : 1020;
    g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
    g.translate(px + side * (1300 * fly + 14 * lift), 540 + 150 * fly); g.rotate(side * (0.05 * lift + 0.32 * fly)); g.scale(1 + 0.04 * lift, 1 + 0.04 * lift); g.translate(-px, -540);
    g.save(); g.translate(side * 10 + 16 * lift, 20 + 30 * lift); g.fillStyle = `rgba(40,30,12,${0.3 * lift})`; tearHalf(side); g.fill(); g.restore();
    g.save(); tearHalf(side); g.clip(); g.drawImage(LAYER, 0, 0); g.restore();
    g.strokeStyle = '#fbf8ef'; g.lineWidth = 7; g.lineJoin = 'round'; g.beginPath(); TEAR_EDGE.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.stroke();
    g.restore();
  }
}
// 纸条斜扫：4 条撕边长纸条斜着（约 -19 度）从下往上交错扫进来盖满，盖满那一刻换镜头，再扫出去。切点前 0.32 秒到切点后 0.4 秒
function sweepCut(t, c) {
  if (t < c - 0.34 || t > c + 0.5) return;
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.translate(960, 540); g.rotate(-0.33);
  for (let k = 0; k < SWEEP.length; k++) {
    const o = SWEEP.length - 1 - k, pin = outC(P(t, c - 0.32 + 0.05 * o, 0.3 - 0.05 * o)), pout = inQ(P(t, c + 0.02 + 0.035 * o, 0.28)); if (pin <= 0 || pout >= 1) continue;
    const dir = k % 2 ? -1 : 1, u = dir * (-(1 - pin) * 3500 + pout * 3500), v = (k - 1.5) * 410, S = SWEEP[k];
    g.save(); g.translate(u + 12, v + 16); g.fillStyle = 'rgba(40,30,12,0.26)'; poly(S.pts); g.fill(); g.restore();
    g.drawImage(S.c, u - S.w / 2, v - S.h / 2);
  }
  g.restore();
}
// 钻进去：镜头猛推（camFx）到最深时盖一层纸色，切点那一刻整屏是纸，换镜头后从里面拉出来
function diveCut(t, c) {
  const a = 1 - Math.abs(t - c) / 0.12; if (a <= 0) return;
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = a; g.fillStyle = C.paper; g.fillRect(0, 0, W, H); g.restore();
}
function fxDefault(t) {
  CUTS.forEach((c, i) => { const k = CUT_KIND[i];
    if (k === '撕海报') tearCut(t, c); else if (k === '纸条斜扫') sweepCut(t, c); else if (k === '钻进去') diveCut(t, c); });
}
// 画一帧里除默认转场、页眉、字幕以外的全部（撕海报要用它把上一镜头最后一帧画进离屏画布，所以场景只写在这里）
function paint(t) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.letterSpacing = '0px';
  g.drawImage(PAPER, 0, 0);
  const cam = camAt(t);
  drawBackPieces(t, cam);               // 太阳、青色长条、方格纸（FX_DEFAULT 时还有纸面光影、小纸屑，都轻轻动）
  setCam(cam); fxBefore(t); for (const sc of SECS) drawPoster(sc, t);   // ← 场景入口（v1.1 提醒）：写了自己的场景，就把 drawPoster 这句换成自己的绘制函数，骨架的 SECS / drawPoster 删掉
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); fxAfter(t); g.restore();   // 动效入口（v1.2）
}
function render(t) {
  g = MAIN;
  动效.resetCtx(g);                    // v1.3：每帧开头把画布状态整套复位（见 SKILL.md 页面约定）
  paint(t);
  if (FX_DEFAULT) fxDefault(t);         // v1.3 默认转场：撕海报、纸条斜扫、钻进去轮流
  drawHeader();
  drawSubtitle(t);
}

window.DURATION = TL.duration;
window.seek = (t) => render(t);
render(0);
window.ready = true;
</script>
