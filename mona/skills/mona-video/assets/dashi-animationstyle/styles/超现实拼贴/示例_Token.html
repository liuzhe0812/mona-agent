<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>超现实拼贴 · Token 示例页（v1.3）</title>
<!--
  超现实概念拼贴（S44）的 Token 示例页，v1.3 按「动效和画面变化」重做得更丰富（风格本身不变）。
  米灰纸底 + 特粗高反差衬线大标题（一个字母填桃橙渐变）+ 橙色干笔刷 + 宽字距小标签 + 手写批注和手绘箭头
  + 剪贴纸片（芥末黄太阳、青色长条、撕边方格纸）+ 开顶的石头人头像 + 彩色多米诺骨牌（白点、长投影）+ 背包小人。
  故事：海报一块块拍上 → 聊天卡片拍到海报上 → 这句话印在撕边纸条上 → 撕掉左半张海报，石头人头（AI）升起，纸条飞进去
  → 镜头钻进头顶开口，剪刀（分词器）把纸条剪成 8 块，翻成 8 张多米诺骨牌（Token）→ 几条长纸条斜扫过去，镜头回到全景，
  头顶喷出一大堆纸条（海量数据），放大镜翻找 → 成都、旅行贴上红蓝胶带 → 太阳被拿起来砸下、纸条震飞
  → 两张骨牌升起、并排落地 → 推断出「旅行需求」。
  v1.3 加的变化：背景四层一直在动（纸面光影、太阳、青条和方格纸、远处小纸屑）；转场 4 种（撕海报、钻进人头、纸条斜扫、
  大物件砸下 + 震屏）；每个镜头慢推或推近再拉开；手写批注和箭头约 3 秒一条；页眉带、字幕带不放部件、不走运动路线。
  画面只由时间 t 计算：window.seek(t)。内容和时间全部来自 timeline.js（window.TL）：
  镜头起止用 TL.shots，动作卡在 TL.mark('关键词') 上，例句和切分用 TL.example，数据用 TL.data，字幕用 TL.cueAt(t)，逐字打出用 TL.chars。
  转场和震屏用 动效部件.js（window.动效，新建作品.mjs 会复制到页面旁边）。
-->
<style>
  html, body { margin: 0; padding: 0; background: #e9e5d9; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  #stage canvas { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<script src="timeline.js"></script>
<script src="动效部件.js"></script>
<script>
'use strict';
const W = 1920, H = 1080, TAU = Math.PI * 2;
const TL = window.TL;
const NOSUB = /[?&]nosub=1/.test(location.search);   // 不画字幕：render.mjs --no-subtitle 会在地址后加 ?nosub=1
const M = (k) => TL.mark(k), ME = (k) => TL.markEnd(k);
const SH = (k) => TL.shots[k - 1];

// ---------- 字体（每种都写了 macOS 自带的替代） ----------
// 大标题、字幕、骨牌、纸条例句：特粗衬线。英文落在 Hoefler Text Black（macOS 自带）；中文落在思源宋体 Heavy（用户装的，开源），
// 没有思源宋体的 Mac 落到宋体-简 Black（macOS 自带）。
const F_HEAD = '"Hoefler Text", "Source Han Serif SC", "Songti SC", serif';
const F_SLIP = '"Source Han Serif SC", "Songti SC", serif';                     // 数据纸条：思源宋体 Bold → 宋体-简 Bold
const F_LABEL = '"Montserrat", "Avenir Next", "PingFang SC", sans-serif';       // 宽字距小标签：Montserrat（用户装的）→ Avenir Next；中文苹方

const fHead = (s) => `900 ${s}px ${F_HEAD}`;
const fSlip = (s) => `700 ${s}px ${F_SLIP}`;
const fLabel = (s, w = 500) => `${w} ${s}px ${F_LABEL}`;
const fHand = (s) => `700 ${s}px ${F_HAND}`;
const fUI = (s, w = 500) => `${w} ${s}px ${F_UI}`;

// ---------- 配色（取自参考图） ----------
const C = {
  paper: '#e9e5d9', card: '#f6f3ea', slip: '#f4f0e5', strip: '#f8f5ec', sub: '#f7f3e9',
  ink: '#0b1615', ink2: '#1e2523', grey: '#4f5550', mute: '#8c8c82', head: '#1f2624',
  orange: '#f75e18', brush: '#ef7e40', peachA: '#f2784a', peachB: '#f9cdae',
  mustard: '#f2ab11', teal: '#43a9ad', path: '#d6ccb8',
  red: '#a02503', blue: '#3aa6c0',          // 成都 = 参考图红骨牌、旅行 = 参考图蓝骨牌（全片固定）
};
// 例句切出的 8 张骨牌：成都红、旅行蓝固定，其余 6 张用参考图骨牌的其他颜色（不用青绿，免得和旅行的蓝混）
const OTHER = [
  { c: '#f0a91c', ink: '#1d2321', pip: '#fbf6e9' },   // 芥末黄
  { c: '#7d9a58', ink: '#ffffff', pip: '#f4f1e6' },   // 橄榄绿
  { c: '#e3901e', ink: '#1d2321', pip: '#fbf6e9' },   // 橙
  { c: '#2b2e2a', ink: '#f3eee2', pip: '#f3eee2' },   // 炭黑（石头色）
  { c: '#efe9da', ink: '#1d2321', pip: '#1d2321' },   // 象牙白
  { c: '#2f6b48', ink: '#ffffff', pip: '#f4f1e6' },   // 墨绿
];
const PIPS = [2, 4, 1, 3, 5, 2, 3, 6];
const TOK = (() => { let k = 0; return TL.example.tokens.map((t, i) => {
  const s = t === '成都' ? { c: C.red, ink: '#ffffff', pip: '#f6efe4' } : t === '旅行' ? { c: C.blue, ink: '#0b1615', pip: '#f6fbfb' } : OTHER[k++ % OTHER.length];
  return { t, i, ...s, pips: PIPS[i % PIPS.length] }; }); })();
const NT = TOK.length;
const I_CD = TOK.findIndex((k) => k.t === '成都'), I_LX = TOK.findIndex((k) => k.t === '旅行');

// ---------- 小工具 ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const P = (t, a, d) => clamp((t - a) / d);
const outC = (p) => 1 - Math.pow(1 - p, 3);
const inOutC = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const outBack = (p, k = 1.70158) => { const c3 = k + 1; return 1 + c3 * Math.pow(p - 1, 3) + k * Math.pow(p - 1, 2); };
const inQ = (p) => p * p;
const inC = (p) => p * p * p;
const sine = (p) => 0.5 - 0.5 * Math.cos(Math.PI * p);
const qb = (a, c, b, u) => (1 - u) * (1 - u) * a + 2 * (1 - u) * u * c + u * u * b;   // 二次贝塞尔
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, p) { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * p)).join(',')})`; }
function rgba(h, a) { const [r, gg, b] = hex(h); return `rgba(${r},${gg},${b},${a})`; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; }
const cv = document.getElementById('c');
const MAIN = cv.getContext('2d');
let g = MAIN;                         // 撕海报时会临时换成离屏画布（把要撕走的那半张画进去），画完换回来
const wCache = new Map();
function tw(s, f) { const k = f + '|' + s; let v = wCache.get(k); if (v === undefined) { g.save(); g.font = f; g.letterSpacing = '0px'; v = g.measureText(s).width; g.restore(); wCache.set(k, v); } return v; }
function text(s, x, y, f, col, align = 'center', base = 'middle') { g.font = f; g.fillStyle = col; g.textAlign = align; g.textBaseline = base; g.fillText(s, x, y); }
// 宽字距小字（左对齐）
function spaced(s, x, y, f, col, sp) { g.save(); g.font = f; g.letterSpacing = sp + 'px'; g.fillStyle = col; g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillText(s, x, y); g.restore(); }
function spacedW(s, f, sp) { return tw(s, f) + sp * s.length; }
function poly(pts, dx = 0, dy = 0) { g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x + dx, y + dy) : g.moveTo(x + dx, y + dy))); g.closePath(); }
// 撕边纸片的轮廓：上下边轻微起伏，左右两端锯齿（ends 为 0 的一端是直边）
function tornRect(w, h, seed, o = {}) {
  const r = mulberry32(seed), e = o.edge ?? 1.2, el = o.endL ?? 7, er = o.endR ?? 7, pts = [];
  const nx = Math.max(3, Math.round(w / 60)), ny = Math.max(3, Math.round(h / 9));
  for (let i = 0; i <= nx; i++) pts.push([-w / 2 + w * i / nx, -h / 2 + (r() - 0.5) * 2 * e]);
  for (let i = 1; i < ny; i++) pts.push([w / 2 + (r() - 0.5) * 2 * er, -h / 2 + h * i / ny]);
  for (let i = nx; i >= 0; i--) pts.push([-w / 2 + w * i / nx, h / 2 + (r() - 0.5) * 2 * e]);
  for (let i = ny - 1; i >= 1; i--) pts.push([-w / 2 + (r() - 0.5) * 2 * el, -h / 2 + h * i / ny]);
  return pts;
}

// ---------- 质感：全部只生成一次，缓存到离屏 canvas ----------
// 细颗粒（黑白随机点，透明度很低），给纸、卡片、骨牌叠一层
const GRAIN = (() => { const n = 256, c = mk(n, n), x = c.getContext('2d'), id = x.createImageData(n, n), d = id.data, r = mulberry32(11);
  for (let by = 0; by < n; by += 3) for (let bx = 0; bx < n; bx += 3) { const v = r() < 0.5 ? 0 : 255, al = Math.floor(r() * r() * 0.38 * 255);   // 3×3 一块：颗粒感还在，逐帧截图压缩快得多
    for (let y = by; y < Math.min(n, by + 3); y++) for (let x2 = bx; x2 < Math.min(n, bx + 3); x2++) { const i = y * n + x2; d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v; d[i * 4 + 3] = al; } }
  x.putImageData(id, 0, 0); return c; })();
const grainPat = g.createPattern(GRAIN, 'repeat');
// 纸底：米灰 + 两层斑驳 + 颗粒 + 纤维 + 很轻的暗角
const PAPER = (() => {
  const c = mk(W, H), x = c.getContext('2d'), id = x.createImageData(W, H), d = id.data, r = mulberry32(5);
  const grid = (S) => { const gx = Math.ceil(W / S) + 2, gy = Math.ceil(H / S) + 2, a = new Float32Array(gx * gy); for (let i = 0; i < a.length; i++) a[i] = r() - 0.5; return { a, gx, S }; };
  const smp = ({ a, gx, S }, px, py) => { const fx = px / S, fy = py / S, ix = fx | 0, iy = fy | 0, ux = fx - ix, uy = fy - iy, sx = ux * ux * (3 - 2 * ux), sy = uy * uy * (3 - 2 * uy);
    const p = a[iy * gx + ix], q = a[iy * gx + ix + 1], s = a[(iy + 1) * gx + ix], u = a[(iy + 1) * gx + ix + 1]; return p + (q - p) * sx + (s - p) * sy + (p - q - s + u) * sx * sy; };
  const G1 = grid(90), G2 = grid(22);   // 不加逐像素噪点：H.264 下看不出来，还会让逐帧 PNG 截图变大变慢
  for (let y = 0; y < H; y++) for (let xx = 0; xx < W; xx++) {
    const i = (y * W + xx) * 4, vx = xx / W - 0.5, vy = y / H - 0.5;
    const m = smp(G1, xx, y) * 10 + smp(G2, xx, y) * 4 - 16 * (vx * vx * 0.7 + vy * vy * 0.5);
    d[i] = 233 + m; d[i + 1] = 229 + m; d[i + 2] = 217 + m * 0.9; d[i + 3] = 255;
  }
  x.putImageData(id, 0, 0);
  x.lineCap = 'round';
  for (let k = 0; k < 1100; k++) { const px = r() * W, py = r() * H, a = r() * TAU, L = 4 + r() * 16;
    x.strokeStyle = r() < 0.5 ? 'rgba(255,255,255,0.12)' : 'rgba(120,105,80,0.07)'; x.lineWidth = 0.6 + r();
    x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + Math.cos(a) * L / 2 + (r() - 0.5) * 4, py + Math.sin(a) * L / 2 + (r() - 0.5) * 4, px + Math.cos(a) * L, py + Math.sin(a) * L); x.stroke(); }
  return c;
})();
// 拼贴纸片：芥末黄太阳（圆）、青色长条（矩形）。2 倍分辨率，边缘稍不规则，带水彩斑驳和颗粒
function makePiece(kind, w, h, base, light, dark, seed) {
  const s = 2, pad = 8, c = mk((w + pad * 2) * s, (h + pad * 2) * s), x = c.getContext('2d'), r = mulberry32(seed);
  x.scale(s, s); x.translate(pad + w / 2, pad + h / 2);
  x.beginPath();
  if (kind === 'circle') { const R = w / 2; for (let i = 0; i <= 200; i++) { const a = i / 200 * TAU, rr = R + Math.sin(a * 6 + seed) * 0.9 + (r() - 0.5) * 1.4; i ? x.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : x.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); } }
  else tornRect(w, h, seed, { edge: 1.3, endL: 1.3, endR: 1.3 }).forEach(([px, py], i) => (i ? x.lineTo(px, py) : x.moveTo(px, py)));
  x.closePath(); x.save(); x.clip();
  const gr = x.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2); gr.addColorStop(0, light); gr.addColorStop(0.5, base); gr.addColorStop(1, dark);
  x.fillStyle = gr; x.fillRect(-w / 2 - 2, -h / 2 - 2, w + 4, h + 4);
  for (let k = 0; k < 90; k++) { const bx = (r() - 0.5) * w, by = (r() - 0.5) * h, br = 8 + r() * Math.min(w, h) * 0.3, l = r() < 0.5;
    const bg = x.createRadialGradient(bx, by, 0, bx, by, br); bg.addColorStop(0, rgba(l ? light : dark, 0.22)); bg.addColorStop(1, rgba(l ? light : dark, 0)); x.fillStyle = bg; x.fillRect(bx - br, by - br, br * 2, br * 2); }
  x.globalAlpha = 0.7; x.fillStyle = x.createPattern(GRAIN, 'repeat'); x.fillRect(-w / 2 - 2, -h / 2 - 2, w + 4, h + 4);
  x.restore();
  return { c, w, h, pad };
}
const SUN = makePiece('circle', 500, 500, '#f2ab11', '#f8c445', '#e39608', 21);
const TEAL = makePiece('rect', 230, 470, '#43a9ad', '#55b8bb', '#2f9196', 22);
// 撕边方格纸：米白底、蓝绿格线、铅笔乱涂
const GRAPH = (() => {
  const w = 440, h = 240, s = 2, pad = 10, c = mk((w + pad * 2) * s, (h + pad * 2) * s), x = c.getContext('2d'), r = mulberry32(23);
  x.scale(s, s); x.translate(pad + w / 2, pad + h / 2);
  const pts = tornRect(w, h, 24, { edge: 3, endL: 6, endR: 9 });
  x.beginPath(); pts.forEach(([px, py], i) => (i ? x.lineTo(px, py) : x.moveTo(px, py))); x.closePath();
  x.fillStyle = '#ece8dc'; x.fill(); x.save(); x.clip();
  x.strokeStyle = 'rgba(58,160,182,0.5)'; x.lineWidth = 1.1;
  for (let gx = -w / 2 + 6; gx < w / 2; gx += 21) { x.beginPath(); x.moveTo(gx, -h / 2); x.lineTo(gx + 2, h / 2); x.stroke(); }
  for (let gy = -h / 2 + 8; gy < h / 2; gy += 21) { x.beginPath(); x.moveTo(-w / 2, gy); x.lineTo(w / 2, gy + 1.5); x.stroke(); }
  x.strokeStyle = 'rgba(62,78,84,0.75)'; x.lineWidth = 1.5; x.lineCap = 'round'; x.beginPath();
  for (let i = 0; i <= 260; i++) { const u = i / 260, a = u * TAU * 5.2, R = 46 + 14 * Math.sin(u * 9);
    const px = -40 + u * 120 + Math.cos(a) * R * 1.25 + (r() - 0.5) * 2, py = 6 + Math.sin(a) * R * 0.42 - u * 20 + (r() - 0.5) * 2; i ? x.lineTo(px, py) : x.moveTo(px, py); }
  x.stroke();
  x.globalAlpha = 0.6; x.fillStyle = x.createPattern(GRAIN, 'repeat'); x.fillRect(-w / 2, -h / 2, w, h);
  x.restore();
  return { c, w, h, pad, pts };
})();
// 橙色干笔刷：中间实、两头细、带浅色和深色的丝、后半段有飞白
function makeBrush(seed) {
  const w = 1000, h = 70, c = mk(w, h), x = c.getContext('2d'), r = mulberry32(seed), top = [], bot = [];
  for (let i = 0; i <= 60; i++) { const u = i / 60, taper = Math.min(1, u / 0.05, (1 - u) / 0.12), th = 34 * (0.3 + 0.7 * Math.pow(taper, 0.6));
    const cy = h / 2 + Math.sin(u * 5 + seed) * 3 + (u - 0.5) * 5; top.push([u * w, cy - th / 2 + (r() - 0.5) * 2.5]); bot.push([u * w, cy + th / 2 + (r() - 0.5) * 2.5]); }
  x.fillStyle = 'rgba(239,126,64,0.92)'; x.beginPath(); top.forEach(([a, b], i) => (i ? x.lineTo(a, b) : x.moveTo(a, b))); bot.reverse().forEach(([a, b]) => x.lineTo(a, b)); x.closePath(); x.fill();
  x.lineCap = 'round';
  for (let k = 0; k < 130; k++) { const y0 = h / 2 + (r() - 0.5) * 30, x0 = r() * w * 0.15, x1 = w - r() * w * 0.2;
    x.strokeStyle = r() < 0.55 ? `rgba(247,165,110,${0.2 + r() * 0.35})` : `rgba(222,96,40,${0.15 + r() * 0.3})`; x.lineWidth = 0.6 + r() * 2.2;
    x.beginPath(); x.moveTo(x0, y0); x.bezierCurveTo(x0 + (x1 - x0) * 0.3, y0 + (r() - 0.5) * 4, x0 + (x1 - x0) * 0.7, y0 + (r() - 0.5) * 4, x1, y0 + (r() - 0.5) * 5); x.stroke(); }
  x.globalCompositeOperation = 'destination-out';
  for (let k = 0; k < 45; k++) { const y0 = h / 2 + (r() - 0.5) * 28, x0 = w * (0.5 + r() * 0.5), L = 40 + r() * 220;
    x.strokeStyle = `rgba(0,0,0,${0.3 + r() * 0.5})`; x.lineWidth = 0.6 + r() * 1.6; x.beginPath(); x.moveTo(x0, y0); x.lineTo(Math.min(w, x0 + L), y0 + (r() - 0.5) * 3); x.stroke(); }
  return c;
}
const BRUSH = [makeBrush(3), makeBrush(8), makeBrush(13)];
// 石头人头（AI）：侧脸朝右、头顶切开。世界坐标；切口中心 (400,360)
const HEAD = { ox: 400, oy: 360, rx: 260, ry: 78, rxo: 276, ryo: 88 };
function headPath(c) {
  const { ox, oy, rxo, ryo } = HEAD;
  c.beginPath(); c.moveTo(ox - rxo, oy);
  c.ellipse(ox, oy, rxo, ryo, 0, Math.PI, 2 * Math.PI);            // 切口外沿（上半圈）
  c.bezierCurveTo(688, 392, 698, 440, 696, 478);                   // 额头
  c.bezierCurveTo(700, 492, 708, 500, 706, 512);                   // 眉骨
  c.bezierCurveTo(703, 526, 698, 538, 700, 548);                   // 眼窝
  c.bezierCurveTo(712, 575, 738, 606, 744, 628);                   // 鼻梁 → 鼻尖
  c.bezierCurveTo(748, 640, 728, 652, 714, 652);                   // 鼻底
  c.bezierCurveTo(708, 656, 708, 664, 710, 672);                   // 人中
  c.bezierCurveTo(714, 676, 722, 682, 720, 688);                   // 上唇
  c.bezierCurveTo(716, 694, 706, 697, 702, 700);                   // 嘴
  c.bezierCurveTo(710, 704, 716, 710, 714, 718);                   // 下唇
  c.bezierCurveTo(710, 728, 700, 732, 700, 740);
  c.bezierCurveTo(704, 748, 716, 760, 712, 772);                   // 下巴
  c.bezierCurveTo(704, 790, 678, 800, 650, 800);
  c.bezierCurveTo(622, 800, 600, 804, 590, 812);                   // 下颌 → 喉
  c.bezierCurveTo(578, 840, 570, 880, 568, 900);                   // 脖子前面

  g.font = SUBF; g.textAlign = 'left'; g.textBaseline = 'middle';
  for (const sg of S.segs) { g.fillStyle = sg.col || C.ink; g.fillText(sg.s, x0 + tw(c.text.slice(0, sg.j), SUBF), 4); }
  g.restore();
}

// ---------- 一帧 ----------
function render(t) {
  g = MAIN;
  动效.resetCtx(g);                    // v1.3：每帧开头把画布状态整套复位（见 SKILL.md 页面约定）
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.letterSpacing = '0px';
  SHK = shakeAt(t);
  g.drawImage(PAPER, 0, 0);
  const cam = camAt(t);
  drawAmbient(t, cam);                  // v1.3：纸面光影、远处小纸屑
  drawBackPieces(t, cam);               // 太阳、青色长条、方格纸（都轻轻动）
  setCam(cam); drawCover(t); drawDeck(t); if (t < TEAR) drawPromptTitle(t);
  drawHead(t, cam);                     // 石头人头 + 头里的石阶和骨牌
  setCam(cam); drawCard(t); drawPromptArrow(t);
  setCam(cam); drawSlips(t); drawDataNotes(t);
  toDive(cam); drawStrip(t); drawScissors(t); drawDiveNotes(t);
  setCam(cam); drawPair(t); drawConclusion(t);
  if (sunOnTop(t)) drawSun(t, cam);     // 太阳被拿起、砸下的那一小段在最上层
  drawTear(t, cam);                     // 撕海报
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
  drawSweep(t);                         // 纸条斜扫
  drawHeader();
  drawSubtitle(t);
}

window.DURATION = TL.duration;
window.seek = (t) => render(t);
render(0);
window.ready = true;
</script>
