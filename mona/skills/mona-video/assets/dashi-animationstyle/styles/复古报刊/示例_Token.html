<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>复古报刊 · Token 示例页（v1.3）</title>
<!--
  S06 复古报刊科普信息图（参考图：复古报刊科普信息图_水母知识.jpg，一份周日报纸的科普专版）
  白报纸 + 灰色衬线刊名 + 藏蓝长宋大标题 + 分栏正文（宋体小标题、黑体正文、两端对齐）+ 带引线的图解标注
  + 整块深蓝「海水」插图区（白字说明、白色引线）+ 浅紫蓝圆形图解 + 白色弧形箭头 + 底部双线页脚。
  整版是一张竖长的报纸，镜头从报头一路往下「潜」：
    报头和「聊天框图解」→ 名词解释「提示词 Prompt」→ 海面下的 AI → 分词器落刀 → 8 块 Token
    → 海量数据（分类广告式的文字格，深蓝海水 = 「海量」）→ 圆形图解里推断出「旅行需求」，盖章。
  v1.3：背景一直在动（白报纸上的稀疏纤维和光斑，海里的光柱、波纹、远处气泡，都有视差）；镜头交界用 5 种转场轮换
    （栏框伸缩、往下潜、翻报纸、推近再拉开、版面推移），每个镜头慢推；变化清单见作品目录的 变化清单.md。
  画面只由时间 t 计算：window.seek(t)。内容和时间全部来自 timeline.js（window.TL，和本页放在同一个文件夹）：
  镜头起止用 TL.shots，动作卡在 TL.mark('关键词') 上，例句和切分用 TL.example，数据用 TL.data，字幕用 TL.cueAt(t)。
  字体全部是 macOS 自带：宋体-简（Songti SC）、Times New Roman、Helvetica Neue + 苹方（PingFang SC）。
-->
<style>
  html, body { margin: 0; padding: 0; background: #fdfdfb; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  #stage canvas { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<script src="timeline.js"></script>
<script src="动效部件.js"></script>
<script>
'use strict';
const W = 1920, H = 1080, TAU = Math.PI * 2;
const TL = window.TL;
const M = (k) => TL.mark(k), ME = (k) => TL.markEnd(k);
const SH = (k) => TL.shots[k - 1];
const NOSUB = /[?&]nosub=1/.test(location.search);   // 渲染时 render.mjs --no-subtitle 会在地址后加 ?nosub=1：不画字幕，回剪映统一加

// ---------- 字体：全部是 macOS 自带（换台 Mac 也有） ----------
// 宋体-简：大标题（Black，压窄成长宋）、导语、栏目小标题、Token 块、结论；Times New Roman：AI、TOKEN、Prompt；
// 正文、标注、字幕：西文 Helvetica Neue，中文苹方（参考图正文是 Helvetica）
const SONG = '"Songti SC", "STSong", serif';
const TIMES = '"Times New Roman", "Times", serif';
const SANS = '"Helvetica Neue", "PingFang SC", sans-serif';
const fSong = (w, s) => `${w} ${s}px ${SONG}`;
const fTimes = (w, s, it) => `${it ? 'italic ' : ''}${w} ${s}px ${TIMES}`;
const fSans = (w, s) => `${w} ${s}px ${SANS}`;

// ---------- 配色（取自参考图，pipeline/取色.mjs） ----------
const C = {
  paper: '#fdfdfb', ink: '#1a1a1a', ink2: '#2e2e2e', gray: '#737574', rule: '#ceced0', shadow: '#e4e4e2',
  head: '#1d3d8a',                                   // 大标题藏蓝（JELLYFISH）
  sea: '#1b4282', seaTop: '#21508f', seaDeep: '#172f5c',   // 海水
  peri: '#5e74a5', peri2: '#8096c1', lav: '#a4b1ce', pale: '#d3e2f7',
  waveL: '#9fb0d8', waveM: '#4f66a3', waveHi: '#c6d3ee',  // 海面三道
  sand: '#e7d3b5', sand2: '#d3ab7d',
  red: '#bb3633', blue: '#1d3d8a',                    // 成都、旅行（全片固定）：参考图自己的红和大标题的藏蓝
  tokA: '#cfd6ee', tokB: '#ead8bb',                   // 其余 6 块：浅紫蓝（水母伞盖）、沙色（海底沙）
};
// 例句切出的 8 个 Token：成都红、旅行蓝（全片固定），其余 6 块浅紫蓝 / 沙色轮流，藏蓝字
const TOK = (() => { const other = [C.tokA, C.tokB]; let k = 0;
  return TL.example.tokens.map((t) => t === '成都' ? { t, c: C.red, tc: '#ffffff' } : t === '旅行' ? { t, c: C.blue, tc: '#ffffff' } : { t, c: other[k++ % 2], tc: C.head }); })();
const NT = TOK.length;
const I_CD = TOK.findIndex((k) => k.t === '成都'), I_LX = TOK.findIndex((k) => k.t === '旅行');

// ---------- 小工具 ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const P = (t, a, d) => clamp((t - a) / d);
const outC = (p) => 1 - Math.pow(1 - p, 3);
const inOutC = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const outBack = (p) => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const inQ = (p) => p * p;
const sine = (p) => 0.5 - 0.5 * Math.cos(Math.PI * p);
const qb = (a, c, b, u) => (1 - u) * (1 - u) * a + 2 * (1 - u) * u * c + u * u * b;   // 二次贝塞尔
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, p) { const A = hex(a), B = hex(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * p).toString(16).padStart(2, '0')).join(''); }
function rgba(h, a) { const [r, gg, b] = hex(h); return `rgba(${r},${gg},${b},${a})`; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const cv = document.getElementById('c');
const main = cv.getContext('2d');
let g = main;                       // 当前画布（预渲染报纸上半版时临时换成离屏画布）
const wCache = new Map();
function tw(s, f) { const k = f + '|' + s; let v = wCache.get(k); if (v === undefined) { main.save(); main.font = f; v = main.measureText(s).width; main.restore(); wCache.set(k, v); } return v; }
function rrect(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function text(s, x, y, f, col, align = 'center', base = 'middle', sx = 1) {
  g.font = f; g.fillStyle = col; g.textAlign = align; g.textBaseline = base;
  if (sx === 1) g.fillText(s, x, y);
  else { g.save(); g.translate(x, y); g.scale(sx, 1); g.fillText(s, 0, 0); g.restore(); }
}
function textLS(s, x, y, f, col, ls, align = 'left', base = 'middle') { g.save(); g.letterSpacing = ls + 'px'; text(s, x, y, f, col, align, base); g.restore(); }
// 细引线：按长度画到 q，画完在端点加小圆点（参考图图解的引线）
function leader(pts, q, col, lw = 2, dot = 4.5) {
  if (q <= 0) return;
  g.strokeStyle = col; g.lineWidth = lw; g.lineJoin = 'miter'; g.lineCap = 'butt';
  let total = 0; for (let i = 1; i < pts.length; i++) total += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  let left = total * q; g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length && left > 0; i++) {
    const sl = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]), k = Math.min(1, left / sl);
    g.lineTo(lerp(pts[i - 1][0], pts[i][0], k), lerp(pts[i - 1][1], pts[i][1], k)); left -= sl;
  }
  g.stroke();
  if (q >= 1 && dot) { g.fillStyle = col; const e = pts[pts.length - 1]; g.beginPath(); g.arc(e[0], e[1], dot, 0, TAU); g.fill(); }
}
// 圆角矩形描边按周长画出来（p 0–1）
function strokeReveal(x, y, w, h, r, p) {
  if (p <= 0) return;
  const L = 2 * (w + h) - (8 - 2 * Math.PI) * r;
  g.setLineDash([L * p, L + 10]); rrect(x, y, w, h, r); g.stroke(); g.setLineDash([]);
}
// 白色弧形箭头（参考图生命周期圆里的白箭头）：n 段，每段占 span 比例
function ringArrows(cx, cy, R, n, rot, w, col, span = 0.62) {
  g.strokeStyle = col; g.fillStyle = col; g.lineWidth = w; g.lineCap = 'butt';
  const hl = w * 2.3, da = hl * 0.55 / R;
  for (let k = 0; k < n; k++) {
    const a0 = rot + k * TAU / n, a1 = a0 + TAU / n * span;
    g.beginPath(); g.arc(cx, cy, R, a0, a1 - da); g.stroke();
    const ex = cx + R * Math.cos(a1), ey = cy + R * Math.sin(a1), tx = -Math.sin(a1), ty = Math.cos(a1), nx = Math.cos(a1), ny = Math.sin(a1);
    g.beginPath(); g.moveTo(ex + tx * hl * 0.45, ey + ty * hl * 0.45);
    g.lineTo(ex - tx * hl * 0.6 + nx * hl * 0.62, ey - ty * hl * 0.6 + ny * hl * 0.62);
    g.lineTo(ex - tx * hl * 0.6 - nx * hl * 0.62, ey - ty * hl * 0.6 - ny * hl * 0.62); g.closePath(); g.fill();
  }
}
// 白色粗弧线箭头（沿二次曲线，画到 p）
function curveArrow(x0, y0, cx, cy, x1, y1, p, w, col) {
  if (p <= 0) return;
  const N = 40, u1 = p, pts = [];
  for (let i = 0; i <= N; i++) { const u = u1 * i / N; pts.push([qb(x0, cx, x1, u), qb(y0, cy, y1, u)]); }
  const ex = pts[N][0], ey = pts[N][1];
  const dx = 2 * (1 - u1) * (cx - x0) + 2 * u1 * (x1 - cx), dy = 2 * (1 - u1) * (cy - y0) + 2 * u1 * (y1 - cy), L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, hl = w * 2.3;
  g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'butt'; g.lineJoin = 'round';
  g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.lineTo(ex - ux * hl * 0.5, ey - uy * hl * 0.5); g.stroke();
  g.fillStyle = col; g.beginPath(); g.moveTo(ex + ux * hl * 0.5, ey + uy * hl * 0.5);
  g.lineTo(ex - ux * hl * 0.6 - uy * hl * 0.62, ey - uy * hl * 0.6 + ux * hl * 0.62);
  g.lineTo(ex - ux * hl * 0.6 + uy * hl * 0.62, ey - uy * hl * 0.6 - ux * hl * 0.62); g.closePath(); g.fill();
}

// ---------- 正文排版：逐字折行（西文单词不拆、行首不放标点）+ 两端对齐 ----------
const NO_START = '，。、；：！？）」』”…';
function units(str) { return str.match(/[A-Za-z0-9]+|./gu) || []; }
function wrapLines(str, f, maxW) {
  const lines = []; let cur = [];
  for (const u of units(str)) {
    const next = [...cur, u];
    if (tw(next.join(''), f) > maxW && cur.length) {
      if (NO_START.includes(u[0])) { cur.push(u); lines.push(cur); cur = []; continue; }
      lines.push(cur); cur = u.trim() ? [u] : [];
    } else cur = next;
  }
  if (cur.length) lines.push(cur);
  return lines;
}
function para(str, x, y, w, f, lh, col) {   // y 是第一行基线；返回最后一行基线
  const lines = wrapLines(str, f, w);
  g.font = f; g.fillStyle = col; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  lines.forEach((ls, li) => {
    const ws = ls.map((u) => tw(u, f)), sum = ws.reduce((a, b) => a + b, 0);
    const gap = li === lines.length - 1 || ls.length < 2 ? 0 : (w - sum) / (ls.length - 1);
    let xx = x; ls.forEach((u, k) => { g.fillText(u, xx, y + li * lh); xx += ws[k] + gap; });
  });
  return y + (lines.length - 1) * lh;
}
// 参考图海水里的白字说明：粗体开头 + 常规正文（左对齐，不两端对齐）
function leadPara(lead, body, x, y, w, size, lh, col, a = 1) {
  if (a <= 0) return;
  g.save(); g.globalAlpha *= a;
  const fb = fSans(700, size), fr = fSans(400, size);
  const lines = wrapLines(lead + ' ' + body, fr, w);
  let consumed = 0;
  lines.forEach((ls, li) => {
    let xx = x;
    for (const u of ls) {
      const bold = consumed < lead.length;
      const f = bold ? fb : fr;
      text(u, xx, y + li * lh, f, col, 'left', 'alphabetic');
      xx += tw(u, f) + (bold ? 0.6 : 0); consumed += u.length;
    }
  });
  g.restore();
}

// ---------- 版面（世界坐标：整版报纸宽 1920，竖着往下排） ----------
const FOCUS_Y = 455;                              // 镜头焦点在画面 (960, 455)：字幕带以上区域的中线
const TOP_H = 1132;                               // 海面以上（白纸部分）
const SEA = { x0: 56, x1: 1864, y0: 1132, y1: 4120 };
const ICON = { x: 960, y: 676, s: 150 };          // 开窗前的 app 图标
const WIN = { x: 600, y: 466, w: 720, h: 420, head: 66, r: 18 };   // 聊天窗口
const INP = { x: WIN.x + 22, y: WIN.y + WIN.h - 50, w: WIN.w - 44 - 84, h: 64, f: fSans(500, 40) };
const SNDB = { x: WIN.x + WIN.w - 22 - 34, y: WIN.y + WIN.h - 50, s: 66 };
const GREET = { text: '你好！今天想聊点什么？', x: WIN.x + 26, y: WIN.y + 128, f: fSans(400, 30) };
const UB = { y: WIN.y + 244, h: 74, f: fSans(500, 38) };          // 用户发出的消息气泡
const DEF = { x: 1506, y: 754, w: 372, h: 296, bar: 46 };          // 名词解释卡（放在右栏下方的空白处）
const AIC = { x: 960, y: 1322, r: 148 };                           // 海面下的 AI 圆盘
const STRIP = { y: 1690, h: 86, pad: 30, f: fSong(900, 54) };      // 例句纸条
const DEV = { y: 1548, w: 940, h: 74, blade: 54 };                 // 分词器（带 7 片刀的横梁）
const CHIP = { f: fSong(900, 54), h: 90, pad: 24, gap: 22 };       // Token 块
const ROW_Y = 1836;
const QY = 2340, QS = 0.72;                                        // 镜头 6–7：Token 排在数据上方
const GRID = { x0: 452, x1: 1852, cy: 2726, pitch: 96, top: 2410, bot: 3104 };   // 海量数据：3 栏分类广告格
const GCW = (GRID.x1 - GRID.x0) / 3;
const gcx = (k) => GRID.x0 + GCW * (k + 0.5);
const CELL_F = fSans(500, 48);
const CIR = { x: 960, y: 3565, r: 400 };                           // 推断：浅紫蓝圆形图解（离数据格远一点，镜头 7 里看不见）
const D_CD = { x: 848, y: CIR.y - 250 }, D_LX = { x: 1072, y: CIR.y - 250 };
const CARD = { x: 960, y: CIR.y + 50, w: 600, h: 192 };

let UBW, UBX, SLICES, ROW;
function layout() {
  UBW = tw(TL.example.text, UB.f) + 48; UBX = WIN.x + WIN.w - 26 - UBW;
  FR = { x: UBX - 14, y: UB.y - UB.h / 2 - 14, w: UBW + 28, h: UB.h + 28 };
  for (let k = 0; k <= 120; k++) { const tt = SEND + (ARRIVE - SEND) * k / 120, [x, y] = tripPose(tt); if (y >= SEA.y0 + 33) { SPLASH = { t: tt, x }; break; } }
  // 例句在纸条上切成 8 段（按字宽；第一段带左边距，最后一段带右边距）
  SLICES = (() => {
    let x = 0; const out = TOK.map((k) => { const w = tw(k.t, STRIP.f); const s = { x0: x, x1: x + w }; x += w; return s; });
    const W0 = x + STRIP.pad * 2;
    out.forEach((s, i) => { s.l = i === 0 ? 0 : STRIP.pad + s.x0; s.r = i === NT - 1 ? W0 : STRIP.pad + s.x1; s.cx = (s.l + s.r) / 2 - W0 / 2; s.w = s.r - s.l; s.tx = STRIP.pad + (s.x0 + s.x1) / 2 - W0 / 2; });
    out.total = W0; return out;
  })();
  ROW = (() => { const ws = TOK.map((k) => tw(k.t, CHIP.f) + CHIP.pad * 2); const tot = ws.reduce((a, b) => a + b, 0) + CHIP.gap * (NT - 1); let x = 960 - tot / 2; return ws.map((w) => { const c = x + w / 2; x += w + CHIP.gap; return { x: c, w }; }); })();
}
function queryPos(i) {   // 查找行里第 i 块的位置（缩小到 QS）
  const ws = ROW.map((r) => r.w * QS), gap = 12, tot = ws.reduce((a, b) => a + b, 0) + gap * (NT - 1);
  let x = 960 - tot / 2; for (let k = 0; k < i; k++) x += ws[k] + gap;
  return { x: x + ws[i] / 2, y: QY };
}

// ---------- 关键时刻（全部从 TL 来） ----------
const OPEN = M('打开') - 0.04;                       // 点开 app，聊天窗口展开
const LBL = M('聊天框') - 0.04;                      // 图解标注
const TYPED = TL.chars.filter((c) => c.cue === TL.shots[0].cues[1]);   // 例句的 14 个字，各有自己的念到时刻
const SENDMSG = ME('例句') + 0.03;                   // 念完例句，按发送
const THIS = M('这句话') - 0.04;
const DEF_T = M('提示词') - 0.08, PROMPT_T = M('Prompt') - 0.05;
const AI_T = M('AI') - 0.06;
const SEND = M('接收到') - 0.02, ARRIVE = SEND + 0.66;   // 消息沿引线沉进 AI
const STRIP_T0 = SH(4).start - 0.02;                 // 纸条从 AI 下面出来
const DEV_T = M('分词器') - 0.1;
const CUT = M('拆分'), SPLIT = CUT + 0.06;            // 落刀 → 分开
const DROP = M('更小的单位');                         // 落成一排
const SHARD = M('最小的语言碎片') - 0.06;
const TOKEN_T = M('Token') - 0.05;
const DIVE = SH(6).start;                             // 潜到海量数据
const SEA_T = M('海量数据') - 0.06;
const CD_T = M('成都') - 0.04, LX_T = M('旅行') - 0.04, TWO_T = M('这两个Token');
const CO_T = M('常常在一起出现');
const INF = SH(8).start, INFER_T = M('推断') - 0.04, NEED_T = M('旅行的需求') - 0.06;

// ---------- v1.3 转场时刻（7 个镜头交界，5 种轮换；见 变化清单.md） ----------
const FRAME_T = SH(2).start;                          // 1 → 2 栏框伸缩：藏蓝双线框从画面四边收拢到消息上
const CLIP0 = THIS + 0.62, CLIP1 = DEF_T - 0.5;        // 剪刀沿裁切线剪一圈（「我们每天听到的最多的」）
const LIFT = CLIP1 + 0.04;                            // 剪下来的剪报抬起
const TURN = { c: SH(4).start, d: 0.6 };              // 3 → 4 翻报纸：盖满那一刻换到内页
const PUSHIN = DROP + 0.05;                           // 4 → 5 推近这一排，说到 Token 再拉开
const FRAME2_T = SH(7).start;                         // 6 → 7 栏框伸缩：白色分栏框收拢到 12 条真数据上
const SLIDE = { c: SH(8).start, d: 0.5 };             // 7 → 8 版面推移：整版左移露出下一版
const STAMP_LBL = CO_T + 0.3, STAMP_END = M('旅行的需求') + 0.3;   // 两次「盖章」：左栏「常常一起出现」、结论卡圆章（落下时震屏）

// ---------- 镜头：世界坐标 → 画面；每段 [起, 止, x, y, 缩放, 缓动]；起止相差 0.001 的是盖住时的硬切 ----------
const CAM0 = { x: 960, y: 462, z: 1.08 };
const CAM = [

  g.lineWidth = 2.5; g.beginPath(); g.arc(0, 0, 47, 0, TAU); g.stroke();
  g.lineWidth = 12; g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath(); g.moveTo(-24, 2); g.lineTo(-7, 20); g.lineTo(26, -18); g.stroke();
  g.restore();
}
function drawCircle(t, vy0, vy1) {
  const { x, y, r } = CIR;
  if (vy1 < y - r - 60 || vy0 > y + r + 60) return;
  const gr = g.createRadialGradient(x - 120, y - 170, 40, x, y, r); gr.addColorStop(0, '#7186b8'); gr.addColorStop(1, '#566b9d');
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  // 圆底的沙地（参考图圆形图底部的沙）
  g.save(); g.beginPath(); g.arc(x, y, r, 0, TAU); g.clip();
  g.fillStyle = C.sand; g.beginPath(); g.moveTo(x - r, y + r);
  for (let xx = x - r; xx <= x + r; xx += 20) g.lineTo(xx, y + 262 + 14 * Math.sin(xx * 0.012) + 8 * Math.sin(xx * 0.031 + 1));
  g.lineTo(x + r, y + r); g.closePath(); g.fill();
  const rnd = mulberry32(77); g.fillStyle = 'rgba(150,110,60,0.45)';
  for (let i = 0; i < 160; i++) { const sx = x - r + rnd() * 2 * r, sy = y + 282 + rnd() * 120; g.beginPath(); g.arc(sx, sy, 1 + rnd() * 2.2, 0, TAU); g.fill(); }
  g.strokeStyle = 'rgba(255,255,255,0.4)'; g.lineWidth = 2;   // v1.3：沙地上冒起的小气泡（次要动作）
  for (let k = 0; k < 9; k++) {
    const h = fmod(t * (34 + 7 * (k % 3)) + k * 61, 430), bx = x - 280 + k * 70 + 10 * Math.sin(1.6 * t + k), by = y + 268 - h;
    g.globalAlpha = clamp(h / 60) * clamp((430 - h) / 120); g.beginPath(); g.arc(bx, by, 4 + (k % 4) * 1.6, 0, TAU); g.stroke();
  }
  g.globalAlpha = 1;
  g.restore();
  // 内圈慢慢转的白色弧形箭头
  ringArrows(x, y, r - 34, 3, 0.35 + t * 0.22, 11, 'rgba(255,255,255,0.88)', 0.42);
  // 左右两段白字说明（参考图海里的说明块）
  const na = P(t, INF + 0.4, 0.4);
  leadPara('推断', '同一类词总是一起出现，AI 就能顺着这条线索，猜出你真正想要什么。', 110, y - 160, 330, 28, 42, '#ffffff', na);
  leadPara('下一步', '猜出需求以后，AI 才开始组织回答，一个字一个字地写给你。', 1480, y - 160, 330, 28, 42, '#ffffff', na);
}
function drawInfer(t) {
  // 成都 + 旅行 之间的「+」
  const pa = P(t, INF + 0.55, 0.2);
  if (pa > 0) { g.save(); g.globalAlpha = pa; text('+', 960, D_CD.y + 2, fSong(900, 64), '#ffffff'); g.restore(); }
  // 「推断」：白色弧形箭头往下伸 + 白字
  const ap = outC(P(t, INFER_T, 0.42));
  curveArrow(960, D_CD.y + 64, 900, (D_CD.y + CARD.y) / 2 - 10, 960, CARD.y - CARD.h / 2 - 22, ap, 13, '#ffffff');
  const la = P(t, INFER_T + 0.06, 0.2);
  if (la > 0) { g.save(); g.globalAlpha = la; g.translate(1004, (D_CD.y + CARD.y) / 2 - 40); g.scale(0.9 + 0.1 * outBack(P(t, INFER_T + 0.06, 0.3)), 0.9 + 0.1 * outBack(P(t, INFER_T + 0.06, 0.3))); text('推断', 0, 0, fSans(700, 54), '#ffffff', 'left'); g.restore(); }
  // 结论卡：白纸 + 藏蓝双线框，从左往右「印」出来；随后盖章
  const cp = P(t, NEED_T, 0.32); if (cp <= 0) return;
  const { x, y, w, h } = CARD;
  g.save(); g.beginPath(); g.rect(x - w / 2 - 6, y - h / 2 - 6, (w + 30) * outC(cp), h + 30); g.clip();
  g.fillStyle = 'rgba(8,18,48,0.4)'; g.fillRect(x - w / 2 + 7, y - h / 2 + 10, w, h);
  g.fillStyle = C.paper; g.fillRect(x - w / 2, y - h / 2, w, h);
  g.strokeStyle = C.head; g.lineWidth = 3; g.strokeRect(x - w / 2 + 8, y - h / 2 + 8, w - 16, h - 16);
  g.lineWidth = 1.2; g.strokeRect(x - w / 2 + 15, y - h / 2 + 15, w - 30, h - 30);
  suitcase(x - w / 2 + 120, y + 8, 1.0);
  text('旅行需求', x + 70, y + 6, fSong(900, 100), C.head, 'center', 'middle', 0.92);
  g.restore();
  stamp(x + w / 2 - 22, y - h / 2 + 4, P(t, M('旅行的需求') + 0.3, 0.16));
}

// ---------- v1.3 转场：翻报纸、版面推移的版缝、推移时跳过去的两块 ----------
const TURNCV = document.createElement('canvas');   // 翻过来的那张报纸（背面也印着字），只画一次
function buildTurn() {
  const w = W + 700, X = 420; TURNCV.width = w; TURNCV.height = H;   // 切点盖满时纸的左边在画面外约 390 像素，版面从 X 起排
  const x = TURNCV.getContext('2d'), r = mulberry32(57);
  x.fillStyle = C.paper; x.fillRect(0, 0, w, H);
  x.font = fSong(400, 30); x.fillStyle = C.gray; x.textBaseline = 'middle'; x.fillText('AI 万象', X, 42);
  x.font = fSans(400, 19); x.fillStyle = C.ink2; x.textAlign = 'right'; x.fillText('第 3 版', X + 1760, 44); x.textAlign = 'left';
  x.fillStyle = C.ink; x.fillRect(X, 70, 1760, 3); x.fillRect(X, 77, 1760, 1.2);
  x.fillStyle = C.head; x.fillRect(X, 108, 820, 78);
  x.font = fSong(900, 50); x.fillStyle = '#ffffff'; x.fillText('一句话的几道工序', X + 32, 149);
  const gr = x.createLinearGradient(0, 230, 0, 640); gr.addColorStop(0, C.seaTop); gr.addColorStop(1, C.seaDeep);
  x.fillStyle = gr; x.fillRect(X + 1120, 230, 640, 410);
  x.fillStyle = C.waveL; x.fillRect(X + 1120, 230, 640, 10);
  x.strokeStyle = 'rgba(255,255,255,0.85)'; x.lineWidth = 5; x.beginPath(); x.arc(X + 1440, 450, 90, 0, TAU); x.stroke();
  for (let c = 0; c < 5; c++) {
    const cx = X + c * 360;
    if (c) { x.fillStyle = C.rule; x.fillRect(cx - 18, 220, 1.5, H - 280); }
    for (let y = 238; y < H - 70; y += 26) {
      if (c >= 3 && y < 670) continue;
      if (r() < 0.08) { y += 18; x.fillStyle = '#9da0a8'; x.fillRect(cx, y, 140 + r() * 120, 12); y += 10; continue; }
      x.fillStyle = '#c9cacf'; x.fillRect(cx, y, (r() < 0.15 ? 120 + r() * 160 : 320), 8);
    }
  }
}
function drawTurn(t) {   // 3 → 4 翻报纸：一整张报纸从右往左翻过去，切点时盖满（动效部件.js pageTurn 的几何，纸上印着字）
  const d = TURN.d, p = P(t, TURN.c - d / 2, d); if (p <= 0 || p >= 1) return;
  const s = inOutC(p), L = W + 220 - s * (2 * W + 900), R = L + W + 440;
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
  const sh = g.createLinearGradient(L - 120, 0, L - 50, 0); sh.addColorStop(0, 'rgba(10,20,50,0)'); sh.addColorStop(1, 'rgba(10,20,50,0.3)');
  g.fillStyle = sh; g.fillRect(L - 120, 0, 70, H);
  g.beginPath(); g.moveTo(L - 160, 0); g.lineTo(R - 160, 0); g.lineTo(R + 60, H); g.lineTo(L + 60, H); g.closePath();
  g.save(); g.clip(); g.drawImage(TURNCV, L - 160, 0);
  const fold = g.createLinearGradient(L - 50, 0, L + 120, 0);
  fold.addColorStop(0, 'rgba(10,20,50,0.2)'); fold.addColorStop(0.3, 'rgba(255,255,255,0.4)'); fold.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = fold; g.fillRect(L - 160, 0, 320, H);
  g.restore(); g.restore();
}
function drawGutter(x, w) {   // 两版之间的白色版缝：纸色 + 两边的折痕阴影
  if (x > W || x + w < 0) return;
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = C.paper; g.fillRect(x, 0, w, H);
  const a = g.createLinearGradient(x, 0, x + 26, 0); a.addColorStop(0, 'rgba(10,20,50,0.28)'); a.addColorStop(1, 'rgba(10,20,50,0)');
  g.fillStyle = a; g.fillRect(x, 0, 26, H);
  const b = g.createLinearGradient(x + w - 26, 0, x + w, 0); b.addColorStop(0, 'rgba(10,20,50,0)'); b.addColorStop(1, 'rgba(10,20,50,0.2)');
  g.fillStyle = b; g.fillRect(x + w - 26, 0, 26, H);
  g.fillStyle = C.rule; g.fillRect(x + w / 2 - 1, 0, 2, H);
  g.restore();
}
function drawHop(t, u, camA, oxA, camB, oxB) {   // 「成都」「旅行」从旧版的查询行跳到新版圆形图解的上部（屏幕坐标，不跟着版走，不会被推出画面）
  for (const i of [I_CD, I_LX]) {
    const q = queryPos(i), tg = i === I_CD ? D_CD : D_LX, [ax, ay] = w2s(camA, q.x, q.y), [bx, by] = w2s(camB, tg.x, tg.y);
    const x = lerp(ax + oxA, bx + oxB, u), y = lerp(ay, by, u) + 90 * Math.sin(Math.PI * u);
    const s = lerp(QS * camA.z, camB.z, u) * (1 + 0.12 * Math.sin(Math.PI * u));
    g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.translate(x, y); g.rotate((i === I_CD ? -1 : 1) * 0.1 * Math.sin(Math.PI * u));
    drawChip(i, { x: 0, y: 0, w: ROW[i].w, h: CHIP.h, colP: 1, txo: 0, s, a: 1 });
    g.restore();
  }
}

// ---------- 画面固定层：页眉（进海以后出现）、页脚字幕带 ----------
function drawRunningHead(t) {
  const p = outC(P(t, SH(4).start + 0.05, 0.35)); if (p <= 0) return;
  g.save(); g.translate(0, -62 * (1 - p));
  g.fillStyle = C.paper; g.fillRect(0, 0, W, 60);
  text('AI 万象', 64, 29, fSong(400, 28), C.gray, 'left');
  text('AI 怎样读懂你', 960, 29, fSong(900, 26), C.head);
  text('2026 年 10 月 7 日　星期三　第 3 版', 1856, 30, fSans(400, 19), C.ink2, 'right');
  g.fillStyle = C.ink; g.fillRect(56, 53, W - 112, 2); g.fillRect(56, 57, W - 112, 1);
  g.restore();
}
// 字幕关键词：成都红、旅行蓝（和画面一致）；其余关键词藏蓝字 + 下划线（报纸的加重）
const SUB_KW = ['旅行的需求', '常常在一起出现', '提示词', 'Prompt', '分词器', 'Token', '海量数据'];
// 字幕换条不「眨」（v1.1 模板起就这样，v1.3 示例页也改了）：紧接着上一条就直接换字，只有第一条、或和上一条中间有空档时才淡入
function subIn(c, t, d) { const k = TL.cues.indexOf(c), prev = k > 0 ? TL.cues[k - 1] : null; return prev && prev.hide >= c.show - 1e-3 ? 1 : P(t, c.show, d); }
function drawSubtitle(t) {
  if (NOSUB) return;
  g.fillStyle = C.paper; g.fillRect(0, 910, W, 170);
  g.fillStyle = C.ink; g.fillRect(56, 913, W - 112, 2); g.fillRect(56, 918, W - 112, 1);
  const c = TL.cueAt(t); if (!c) return;
  const a = subIn(c, t, 0.08), f = fSans(600, 64), y = 1000, str = c.text, x0 = 960 - tw(str, f) / 2;
  const st = new Array(str.length).fill('');   // ''：普通；'kw'：关键词；颜色值：成都 / 旅行
  for (const k of SUB_KW) { let j = str.indexOf(k); while (j >= 0) { for (let q = j; q < j + k.length; q++) st[q] = 'kw'; j = str.indexOf(k, j + k.length); } }
  for (const [k, cc] of [['成都', C.red], ['旅行', C.blue]]) { let j = str.indexOf(k); while (j >= 0) { for (let q = j; q < j + k.length; q++) st[q] = cc; j = str.indexOf(k, j + k.length); } }
  g.save(); g.globalAlpha = a;
  let j = 0;
  while (j < str.length) {
    let e = j + 1; while (e < str.length && st[e] === st[j]) e++;
    const s = str.slice(j, e), xx = x0 + tw(str.slice(0, j), f), ww = tw(s, f), k = st[j];
    if (k === 'kw') { g.fillStyle = C.tokA; g.fillRect(xx - 4, y + 4, ww + 8, 32); text(s, xx, y, f, C.ink, 'left'); }
    else if (k) { g.fillStyle = k; rrect(xx - 7, y - 40, ww + 14, 80, 6); g.fill(); text(s, xx, y, f, '#ffffff', 'left'); }
    else text(s, xx, y, f, C.ink, 'left');
    j = e;
  }
  g.restore();
}

// ---------- 一帧 ----------
// 一个「版」：给定镜头，把背景层和世界里的东西画出来；ox 是这一版在屏幕上的横向偏移（版面推移时两版并排）
let HOP = false;   // 版面推移时「成都」「旅行」两块不在世界里画，改在屏幕坐标里从旧版跳到新版（drawHop）
function shakeAt(t) {   // 两次盖章落下时震一下（动效部件.js 的 shake）
  const a = 动效.shake(t, STAMP_LBL + 0.12, { amp: 9, d: 0.22 }), b = 动效.shake(t, STAMP_END + 0.16, { amp: 12, d: 0.24 });
  return { dx: a.dx + b.dx, dy: a.dy + b.dy };
}
function w2s(cam, x, y) { return [960 + (x - cam.x) * cam.z, FOCUS_Y + (y - cam.y) * cam.z]; }
function drawView(t, cam, ox) {
  const z = cam.z, sk = shakeAt(t);
  const vx0 = cam.x - 960 / z, vx1 = cam.x + 960 / z, vy0 = cam.y - FOCUS_Y / z, vy1 = cam.y + (H - FOCUS_Y) / z;
  g.setTransform(1, 0, 0, 1, ox + sk.dx, sk.dy); g.globalAlpha = 1;
  drawPaperBg(t, cam);
  g.setTransform(z, 0, 0, z, ox + sk.dx + 960 - cam.x * z, sk.dy + FOCUS_Y - cam.y * z);
  // 报纸上半版（预渲染图，只取看得见的那块）
  if (vy0 < TOP_H) {
    drawPageImg(t, vx0, vx1, vy0, vy1);
    const dim = 0.86 * P(t, M('例句') - 0.45, 0.4);
    if (dim > 0) { g.fillStyle = rgba(C.paper, dim); g.fillRect(-200, 0, 618, TOP_H); g.fillRect(1502, 0, 618, TOP_H); }
    drawIcon(t); drawPointer(t); drawWindow(t); drawLabels(t); drawDef(t);
  }
  drawSea(t, vy0, vy1);
  drawSeaFx(t, vy0, vy1, cam);
  if (vy1 > SEA.y0 && vy0 < 2300) { drawNotes(t); drawAIDisc(t); }
  drawGrid(t, vy0, vy1);
  drawDataLabels(t);
  drawCircle(t, vy0, vy1);
  drawTrip(t);
  drawDevice(t);
  drawChips(t);
  drawBlades(t);
  drawShardLabel(t);
  drawTokenLabel(t);
  magnifier(t);
  drawInfer(t);
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
}
function resetCtx(x) {   // 每帧开头把画布状态全部复位：上一帧留下的线头、拐角、虚线（例如 curveArrow 的圆拐角）会让同一个 t 画出不同的帧
  if (x.reset) x.reset();
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over'; x.filter = 'none';
  x.lineWidth = 1; x.lineJoin = 'miter'; x.lineCap = 'butt'; x.miterLimit = 10; x.setLineDash([]); x.lineDashOffset = 0;
  x.textAlign = 'start'; x.textBaseline = 'alphabetic'; x.letterSpacing = '0px'; x.shadowBlur = 0; x.shadowColor = 'rgba(0,0,0,0)';
}
function render(t) {
  g = main;
  resetCtx(g);
  g.fillStyle = C.paper; g.fillRect(0, 0, W, H);
  const h = SLIDE.d / 2;
  if (t <= SLIDE.c - h || t >= SLIDE.c + h) drawView(t, camAt(t), 0);
  else {   // 版面推移：旧版（停在切点前一刻）往左推走，新版（切点后一刻）从右边跟进来，中间是白色版缝
    const u = inOutC(P(t, SLIDE.c - h, SLIDE.d)), GUT = 90, off = (W + GUT) * u;
    const tA = Math.min(t, SLIDE.c - 0.001), tB = Math.max(t, SLIDE.c), camA = camAt(tA), camB = camAt(Math.max(t, SLIDE.c + 0.003));
    HOP = true;
    g.save(); g.beginPath(); g.rect(0, 0, Math.max(0, W - off), H); g.clip(); drawView(tA, camA, -off); g.restore();
    const bx = W + GUT - off;
    if (bx < W) { g.save(); g.beginPath(); g.rect(bx, 0, W - bx, H); g.clip(); g.fillStyle = C.paper; g.fillRect(bx, 0, W - bx, H); drawView(tB, camB, bx); g.restore(); }
    HOP = false;
    drawGutter(W - off, GUT);
    drawHop(t, u, camA, -off, camB, bx);
  }
  drawFrameIn(t);
  drawRunningHead(t);
  drawTurn(t);
  drawSubtitle(t);
}

let inited = false;
function init() {
  if (inited) return; inited = true;
  layout(); buildPage(); buildBg(); buildTurn();
}
window.DURATION = TL.duration;
window.seek = (t) => { init(); render(t); };
window.ready = false;
const FONTS = [fSong(900, 54), fSong(400, 36), fSong(300, 96), fTimes(700, 150), fTimes(400, 100, true), fSans(400, 22), fSans(500, 42), fSans(600, 64), fSans(700, 52)];
Promise.all(FONTS.map((f) => document.fonts.load(f, '中文AI Token'))).catch(() => {}).then(() => { init(); render(0); window.ready = true; });
</script>
