<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
    <defs>
        <linearGradient id="coverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0A1628" />
            <stop offset="50%" style="stop-color:#0F2847" />
            <stop offset="100%" style="stop-color:#1A5276" />
        </linearGradient>
        <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#00D4FF" />
            <stop offset="100%" style="stop-color:#7B2FFF" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- 背景渐变 -->
    <rect width="1280" height="720" fill="url(#coverGradient)" />

    <!-- 科技网格背景 -->
    <g stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.04">
        <line x1="0" y1="0" x2="0" y2="720"/><line x1="64" y1="0" x2="64" y2="720"/>
        <line x1="128" y1="0" x2="128" y2="720"/><line x1="192" y1="0" x2="192" y2="720"/>
        <line x1="256" y1="0" x2="256" y2="720"/><line x1="320" y1="0" x2="320" y2="720"/>
        <line x1="384" y1="0" x2="384" y2="720"/><line x1="448" y1="0" x2="448" y2="720"/>
        <line x1="512" y1="0" x2="512" y2="720"/><line x1="576" y1="0" x2="576" y2="720"/>
        <line x1="640" y1="0" x2="640" y2="720"/><line x1="704" y1="0" x2="704" y2="720"/>
        <line x1="768" y1="0" x2="768" y2="720"/><line x1="832" y1="0" x2="832" y2="720"/>
        <line x1="896" y1="0" x2="896" y2="720"/><line x1="960" y1="0" x2="960" y2="720"/>
        <line x1="1024" y1="0" x2="1024" y2="720"/><line x1="1088" y1="0" x2="1088" y2="720"/>
        <line x1="1152" y1="0" x2="1152" y2="720"/><line x1="1216" y1="0" x2="1216" y2="720"/>
        <line x1="0" y1="0" x2="1280" y2="0"/><line x1="0" y1="60" x2="1280" y2="60"/>
        <line x1="0" y1="120" x2="1280" y2="120"/><line x1="0" y1="180" x2="1280" y2="180"/>
        <line x1="0" y1="240" x2="1280" y2="240"/><line x1="0" y1="300" x2="1280" y2="300"/>
        <line x1="0" y1="360" x2="1280" y2="360"/><line x1="0" y1="420" x2="1280" y2="420"/>
        <line x1="0" y1="480" x2="1280" y2="480"/><line x1="0" y1="540" x2="1280" y2="540"/>
        <line x1="0" y1="600" x2="1280" y2="600"/><line x1="0" y1="660" x2="1280" y2="660"/>
    </g>

    <!-- 装饰圆形 -->
    <circle cx="1100" cy="150" r="200" fill="none" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.15" />
    <circle cx="1100" cy="150" r="150" fill="none" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.1" />
    <circle cx="1100" cy="150" r="100" fill="none" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.08" />
    <circle cx="180" cy="600" r="120" fill="none" stroke="#7B2FFF" stroke-width="1" stroke-opacity="0.12" />
    <circle cx="180" cy="600" r="80" fill="none" stroke="#7B2FFF" stroke-width="1" stroke-opacity="0.08" />

    <!-- 装饰斜线 -->
    <line x1="0" y1="200" x2="300" y2="350" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.12" />
    <line x1="0" y1="250" x2="250" y2="400" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.12" />
    <line x1="980" y1="720" x2="1280" y2="520" stroke="#7B2FFF" stroke-width="1" stroke-opacity="0.12" />
    <line x1="1030" y1="720" x2="1280" y2="570" stroke="#7B2FFF" stroke-width="1" stroke-opacity="0.12" />

    <!-- 主标题 -->
    <text x="640" y="260" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="56" font-weight="bold"
        fill="#FFFFFF" text-anchor="middle" filter="url(#glow)">
        Vibe Coding
    </text>

    <!-- 副标题 -->
    <text x="640" y="320" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="28" fill="#00D4FF"
        text-anchor="middle">
        AI 驱动的开发新范式
    </text>

    <!-- 英文标题 -->
    <text x="640" y="365" font-family="system-ui, sans-serif" font-size="20" fill="#94A3B8" text-anchor="middle">
        The Future of AI-Assisted Software Development
    </text>

    <!-- 装饰线 -->
    <rect x="540" y="390" width="200" height="3" rx="1.5" fill="url(#accentGradient)" />

    <!-- 引言卡片 -->
    <rect x="240" y="440" width="800" height="100" rx="12" fill="#FFFFFF" fill-opacity="0.06" />
    <rect x="240" y="440" width="4" height="100" rx="2" fill="#00D4FF" />

    <text x="270" y="480" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#E5E7EB"
        font-style="italic">
        "用自然语言描述想法，AI 即时生成可运行的代码"
    </text>
    <text x="270" y="515" font-family="system-ui, sans-serif" font-size="14" fill="#94A3B8">
        —— Vibe Coding 的核心理念
    </text>

    <!-- 关键词标签 -->
    <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#CBD5E1">
        <rect x="420" y="570" width="80" height="28" rx="14" fill="#00D4FF" fill-opacity="0.15" />
        <text x="460" y="589" text-anchor="middle" fill="#00D4FF">AI 编程</text>

        <rect x="520" y="570" width="80" height="28" rx="14" fill="#7B2FFF" fill-opacity="0.15" />
        <text x="560" y="589" text-anchor="middle" fill="#B388FF">自然语言</text>

        <rect x="620" y="570" width="80" height="28" rx="14" fill="#00D4FF" fill-opacity="0.15" />
        <text x="660" y="589" text-anchor="middle" fill="#00D4FF">零门槛</text>

        <rect x="720" y="570" width="100" height="28" rx="14" fill="#7B2FFF" fill-opacity="0.15" />
        <text x="770" y="589" text-anchor="middle" fill="#B388FF">即时构建</text>
    </g>

    <!-- 页码 -->
    <text x="1220" y="685" font-family="system-ui, sans-serif" font-size="14" fill="#64748B" text-anchor="end">01</text>
</svg>
