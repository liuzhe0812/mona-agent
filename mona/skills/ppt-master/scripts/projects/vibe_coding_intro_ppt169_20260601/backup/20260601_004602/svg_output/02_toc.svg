<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
    <defs>
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0A1628" />
            <stop offset="100%" style="stop-color:#0F2847" />
        </linearGradient>
        <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#00D4FF" />
            <stop offset="100%" style="stop-color:#7B2FFF" />
        </linearGradient>
    </defs>

    <!-- 背景 -->
    <rect width="1280" height="720" fill="url(#bgGradient)" />

    <!-- 科技网格 -->
    <g stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.03">
        <line x1="0" y1="0" x2="0" y2="720"/><line x1="64" y1="0" x2="64" y2="720"/>
        <line x1="128" y1="0" x2="128" y2="720"/><line x1="192" y1="0" x2="192" y2="720"/>
        <line x1="256" y1="0" x2="256" y2="720"/><line x1="320" y1="0" x2="320" y2="720"/>
        <line x1="384" y1="0" x2="384" y2="720"/><line x1="448" y1="0" x2="448" y2="720"/>
        <line x1="512" y1="0" x2="512" y2="720"/><line x1="576" y1="0" x2="576" y2="720"/>
        <line x1="640" y1="0" x2="640" y2="720"/><line x1="704" y1="0" x2="704" y2="720"/>
        <line x1="768" y1="0" x2="768" y2="720"/><line x1="832" y1="0" x2="832" y2="720"/>
        <line x1="896" y1="0" x2="896" y2="720"/><line x1="960" y1="0" x2="960" y2="720"/>
        <line x1="1024" y1="0" x2="1024" y2="720"/><line x1="1088" y1="0" x2="1088" y2="720"/>
        <line x1="1152" y1="0" x2="1152" y2="720"/><line x1="1216" y1="0" x2="1216" y2="720"/>
        <line x1="0" y1="0" x2="1280" y2="0"/><line x1="0" y1="60" x2="1280" y2="60"/>
        <line x1="0" y1="120" x2="1280" y2="120"/><line x1="0" y1="180" x2="1280" y2="180"/>
        <line x1="0" y1="240" x2="1280" y2="240"/><line x1="0" y1="300" x2="1280" y2="300"/>
        <line x1="0" y1="360" x2="1280" y2="360"/><line x1="0" y1="420" x2="1280" y2="420"/>
        <line x1="0" y1="480" x2="1280" y2="480"/><line x1="0" y1="540" x2="1280" y2="540"/>
        <line x1="0" y1="600" x2="1280" y2="600"/><line x1="0" y1="660" x2="1280" y2="660"/>
    </g>

    <!-- 左侧装饰条 -->
    <rect x="0" y="0" width="8" height="720" fill="url(#accentGradient)" />

    <!-- 标题区域 -->
    <text x="60" y="75" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="bold"
        fill="#FFFFFF">
        目录
    </text>
    <text x="60" y="105" font-family="system-ui, sans-serif" font-size="16" fill="#64748B">
        CONTENTS
    </text>

    <!-- 分隔线 -->
    <line x1="60" y1="125" x2="500" y2="125" stroke="#1E3A5F" stroke-width="2" />

    <!-- 目录项 -->
    <!-- 01 -->
    <g transform="translate(100, 180)">
        <rect x="0" y="0" width="520" height="90" rx="12" fill="#FFFFFF" fill-opacity="0.04" />
        <rect x="0" y="0" width="4" height="90" rx="2" fill="#00D4FF" />
        <text x="40" y="40" font-family="system-ui, sans-serif" font-size="42" font-weight="bold" fill="#00D4FF" fill-opacity="0.3">01</text>
        <text x="100" y="38" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">什么是 Vibe Coding？</text>
        <text x="100" y="65" font-family="system-ui, sans-serif" font-size="14" fill="#94A3B8">Definition &amp; Core Concept</text>
    </g>

    <!-- 02 -->
    <g transform="translate(660, 180)">
        <rect x="0" y="0" width="520" height="90" rx="12" fill="#FFFFFF" fill-opacity="0.04" />
        <rect x="0" y="0" width="4" height="90" rx="2" fill="#7B2FFF" />
        <text x="40" y="40" font-family="system-ui, sans-serif" font-size="42" font-weight="bold" fill="#7B2FFF" fill-opacity="0.3">02</text>
        <text x="100" y="38" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">核心工具与平台</text>
        <text x="100" y="65" font-family="system-ui, sans-serif" font-size="14" fill="#94A3B8">Key Tools &amp; Platforms</text>
    </g>

    <!-- 03 -->
    <g transform="translate(100, 300)">
        <rect x="0" y="0" width="520" height="90" rx="12" fill="#FFFFFF" fill-opacity="0.04" />
        <rect x="0" y="0" width="4" height="90" rx="2" fill="#00D4FF" />
        <text x="40" y="40" font-family="system-ui, sans-serif" font-size="42" font-weight="bold" fill="#00D4FF" fill-opacity="0.3">03</text>
        <text x="100" y="38" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">工作流程与实践</text>
        <text x="100" y="65" font-family="system-ui, sans-serif" font-size="14" fill="#94A3B8">Workflow &amp; Practice</text>
    </g>

    <!-- 04 -->
    <g transform="translate(660, 300)">
        <rect x="0" y="0" width="520" height="90" rx="12" fill="#FFFFFF" fill-opacity="0.04" />
        <rect x="0" y="0" width="4" height="90" rx="2" fill="#7B2FFF" />
        <text x="40" y="40" font-family="system-ui, sans-serif" font-size="42" font-weight="bold" fill="#7B2FFF" fill-opacity="0.3">04</text>
        <text x="100" y="38" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">优势、挑战与未来</text>
        <text x="100" y="65" font-family="system-ui, sans-serif" font-size="14" fill="#94A3B8">Benefits, Challenges &amp; Future</text>
    </g>

    <!-- 装饰元素 -->
    <circle cx="1100" cy="600" r="80" fill="none" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.08" />
    <circle cx="1100" cy="600" r="50" fill="none" stroke="#7B2FFF" stroke-width="1" stroke-opacity="0.08" />

    <!-- 页码 -->
    <text x="1220" y="685" font-family="system-ui, sans-serif" font-size="14" fill="#64748B" text-anchor="end">02</text>
</svg>
