<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
    <defs>
        <linearGradient id="endGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0A1628" />
            <stop offset="50%" style="stop-color:#0F2847" />
            <stop offset="100%" style="stop-color:#1A5276" />
        </linearGradient>
        <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#00D4FF" />
            <stop offset="100%" style="stop-color:#7B2FFF" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- 背景渐变 -->
    <rect width="1280" height="720" fill="url(#endGradient)" />

    <!-- 科技网格 -->
    <g stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.03">
        <line x1="0" y1="0" x2="0" y2="720"/><line x1="64" y1="0" x2="64" y2="720"/>
        <line x1="128" y1="0" x2="128" y2="720"/><line x1="192" y1="0" x2="192" y2="720"/>
        <line x1="256" y1="0" x2="256" y2="720"/><line x1="320" y1="0" x2="320" y2="720"/>
        <line x1="384" y1="0" x2="384" y2="720"/><line x1="448" y1="0" x2="448" y2="720"/>
        <line x1="512" y1="0" x2="512" y2="720"/><line x1="576" y1="0" x2="576" y2="720"/>
        <line x1="640" y1="0" x2="640" y2="720"/><line x1="704" y1="0" x2="704" y2="720"/>
        <line x1="768" y1="0" x2="768" y2="720"/><line x1="832" y1="0" x2="832" y2="720"/>
        <line x1="896" y1="0" x2="896" y2="720"/><line x1="960" y1="0" x2="960" y2="720"/>
        <line x1="1024" y1="0" x2="1024" y2="720"/><line x1="1088" y1="0" x2="1088" y2="720"/>
        <line x1="1152" y1="0" x2="1152" y2="720"/><line x1="1216" y1="0" x2="1216" y2="720"/>
        <line x1="0" y1="0" x2="1280" y2="0"/><line x1="0" y1="60" x2="1280" y2="60"/>
        <line x1="0" y1="120" x2="1280" y2="120"/><line x1="0" y1="180" x2="1280" y2="180"/>
        <line x1="0" y1="240" x2="1280" y2="240"/><line x1="0" y1="300" x2="1280" y2="300"/>
        <line x1="0" y1="360" x2="1280" y2="360"/><line x1="0" y1="420" x2="1280" y2="420"/>
        <line x1="0" y1="480" x2="1280" y2="480"/><line x1="0" y1="540" x2="1280" y2="540"/>
        <line x1="0" y1="600" x2="1280" y2="600"/><line x1="0" y1="660" x2="1280" y2="660"/>
    </g>

    <!-- 装饰网络图 - 中心点 -->
    <circle cx="640" cy="360" r="8" fill="#00D4FF" fill-opacity="0.3" />

    <!-- 外围节点 -->
    <circle cx="350" cy="200" r="5" fill="#00D4FF" fill-opacity="0.2" />
    <circle cx="450" cy="150" r="4" fill="#7B2FFF" fill-opacity="0.2" />
    <circle cx="550" cy="180" r="5" fill="#00D4FF" fill-opacity="0.2" />
    <circle cx="730" cy="160" r="4" fill="#7B2FFF" fill-opacity="0.2" />
    <circle cx="830" cy="200" r="5" fill="#00D4FF" fill-opacity="0.2" />
    <circle cx="920" cy="250" r="4" fill="#7B2FFF" fill-opacity="0.2" />

    <circle cx="280" cy="350" r="4" fill="#00D4FF" fill-opacity="0.2" />
    <circle cx="320" cy="480" r="5" fill="#7B2FFF" fill-opacity="0.2" />
    <circle cx="450" cy="540" r="4" fill="#00D4FF" fill-opacity="0.2" />
    <circle cx="580" cy="580" r="5" fill="#7B2FFF" fill-opacity="0.2" />
    <circle cx="700" cy="560" r="4" fill="#00D4FF" fill-opacity="0.2" />
    <circle cx="830" cy="520" r="5" fill="#7B2FFF" fill-opacity="0.2" />
    <circle cx="950" cy="450" r="4" fill="#00D4FF" fill-opacity="0.2" />
    <circle cx="1000" cy="350" r="5" fill="#7B2FFF" fill-opacity="0.2" />

    <!-- 连接线 - 从中心辐射 -->
    <line x1="640" y1="360" x2="350" y2="200" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.15" />
    <line x1="640" y1="360" x2="450" y2="150" stroke="#7B2FFF" stroke-width="1" stroke-opacity="0.15" />
    <line x1="640" y1="360" x2="550" y2="180" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.15" />
    <line x1="640" y1="360" x2="730" y2="160" stroke="#7B2FFF" stroke-width="1" stroke-opacity="0.15" />
    <line x1="640" y1="360" x2="830" y2="200" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.15" />
    <line x1="640" y1="360" x2="920" y2="250" stroke="#7B2FFF" stroke-width="1" stroke-opacity="0.15" />

    <line x1="640" y1="360" x2="280" y2="350" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.15" />
    <line x1="640" y1="360" x2="320" y2="480" stroke="#7B2FFF" stroke-width="1" stroke-opacity="0.15" />
    <line x1="640" y1="360" x2="450" y2="540" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.15" />
    <line x1="640" y1="360" x2="580" y2="580" stroke="#7B2FFF" stroke-width="1" stroke-opacity="0.15" />
    <line x1="640" y1="360" x2="700" y2="560" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.15" />
    <line x1="640" y1="360" x2="830" y2="520" stroke="#7B2FFF" stroke-width="1" stroke-opacity="0.15" />
    <line x1="640" y1="360" x2="950" y2="450" stroke="#00D4FF" stroke-width="1" stroke-opacity="0.15" />
    <line x1="640" y1="360" x2="1000" y2="350" stroke="#7B2FFF" stroke-width="1" stroke-opacity="0.15" />

    <!-- 连接线 - 外围连接 -->
    <line x1="350" y1="200" x2="450" y2="150" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.08" />
    <line x1="450" y1="150" x2="550" y2="180" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.08" />
    <line x1="730" y1="160" x2="830" y2="200" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.08" />
    <line x1="320" y1="480" x2="450" y2="540" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.08" />
    <line x1="580" y1="580" x2="700" y2="560" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.08" />
    <line x1="830" y1="520" x2="950" y2="450" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.08" />

    <!-- 主标题 -->
    <text x="640" y="240" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="56" font-weight="bold"
        fill="#FFFFFF" text-anchor="middle" filter="url(#glow)">
        感谢观看
    </text>

    <!-- 副标题 -->
    <text x="640" y="295" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="26" fill="#00D4FF"
        text-anchor="middle">
        拥抱 AI 驱动的开发新时代
    </text>

    <!-- 英文标题 -->
    <text x="640" y="335" font-family="system-ui, sans-serif" font-size="18" fill="#94A3B8" text-anchor="middle">
        Thank You — Embrace the Future of AI-Assisted Development
    </text>

    <!-- 装饰线 -->
    <rect x="490" y="365" width="300" height="4" rx="2" fill="url(#accentGradient)" />

    <!-- 感谢语 -->
    <text x="640" y="430" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#E5E7EB"
        text-anchor="middle">
        "未来不属于 AI，而属于会用 AI 的人"
    </text>

    <!-- 信息卡片 -->
    <rect x="440" y="470" width="400" height="100" rx="12" fill="#FFFFFF" fill-opacity="0.06" />
    <rect x="440" y="470" width="4" height="100" rx="2" fill="#00D4FF" />

    <text x="640" y="510" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#E5E7EB"
        text-anchor="middle">
        Vibe Coding — 让每个人都能构建软件
    </text>
    <text x="640" y="540" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#94A3B8"
        text-anchor="middle">
        From Idea to Product in Minutes, Not Months
    </text>

    <!-- 底部版权 -->
    <text x="640" y="680" font-family="system-ui, sans-serif" font-size="12" fill="#64748B" text-anchor="middle">
        © 2025 Vibe Coding Introduction
    </text>
</svg>
